<style>
/* Layout: a tumor-board packet. One reading column; summary first, then the evidence, case by case.
   Charts use the validated categorical slots (colour follows the model), one blue ramp for coverage,
   and reserved status colours that always travel with an icon and a word. */
:root {
  --bg: #f4f6f5; --surface: #fcfcfb; --raised: #ffffff; --ink: #111614; --ink-2: #4a5350; --muted: #7c8582;
  --hair: #dde2e0; --axis: #c3c8c6; --accent: #0e6b70; --accent-ink: #ffffff; --wash: #e8eeec;
  --m1: #2a78d6; --m2: #eb6834; --m3: #1baf7a; --m4: #eda100; --m5: #e87ba4;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #7a5300; --crit: #d03b3b; --crit-ink: #a52626;
  --none: #9aa19e; --good-bg: #e3f3e3; --warn-bg: #fdf1d6; --crit-bg: #fbe5e5; --none-bg: #eceeed;
  --q0: #e4e8e6; --q1: #b7d3f6; --q2: #6da7ec; --q3: #2a78d6; --q4: #184f95;
  --qt0: #111614; --qt1: #111614; --qt2: #111614; --qt3: #ffffff; --qt4: #ffffff; --install: #aab1ae;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1110; --surface: #161a19; --raised: #1b201e; --ink: #edf1ef; --ink-2: #b6bfbb; --muted: #87908c;
    --hair: #29302d; --axis: #3a423f; --accent: #5cc3c6; --accent-ink: #062627; --wash: #1f2624;
    --m1: #3987e5; --m2: #d95926; --m3: #199e70; --m4: #c98500; --m5: #d55181;
    --good: #0ca30c; --good-ink: #43c443; --warn: #fab219; --warn-ink: #f5c255; --crit: #e05a5a; --crit-ink: #f08a8a;
    --none: #6d7471; --good-bg: #13291a; --warn-bg: #2d2511; --crit-bg: #331a1a; --none-bg: #202523;
    --q0: #222826; --q1: #13335a; --q2: #1c5cab; --q3: #3987e5; --q4: #9ec5f4;
    --qt0: #edf1ef; --qt1: #edf1ef; --qt2: #ffffff; --qt3: #0e1110; --qt4: #0e1110; --install: #4e5653;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1110; --surface: #161a19; --raised: #1b201e; --ink: #edf1ef; --ink-2: #b6bfbb; --muted: #87908c;
  --hair: #29302d; --axis: #3a423f; --accent: #5cc3c6; --accent-ink: #062627; --wash: #1f2624;
  --m1: #3987e5; --m2: #d95926; --m3: #199e70; --m4: #c98500; --m5: #d55181;
  --good: #0ca30c; --good-ink: #43c443; --warn: #fab219; --warn-ink: #f5c255; --crit: #e05a5a; --crit-ink: #f08a8a;
  --none: #6d7471; --good-bg: #13291a; --warn-bg: #2d2511; --crit-bg: #331a1a; --none-bg: #202523;
  --q0: #222826; --q1: #13335a; --q2: #1c5cab; --q3: #3987e5; --q4: #9ec5f4;
  --qt0: #edf1ef; --qt1: #edf1ef; --qt2: #ffffff; --qt3: #0e1110; --qt4: #0e1110; --install: #4e5653;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 44px; }
section, section > * { min-width: 0; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(30px, 4.4vw, 44px); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 26px; font-weight: 700; }
h3 { font-size: 19px; font-weight: 700; }
h4 { font-size: 15px; font-weight: 700; }
p { margin: 0; max-width: 72ch; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, summary:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
section { display: grid; gap: 18px; scroll-margin-top: 72px; }
.lede { display: grid; gap: 6px; }
.lede p { color: var(--ink-2); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--hair);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
.bar nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.bar nav a { text-decoration: none; color: var(--ink-2); }
.bar nav a:hover { color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); align-items: center; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

/* header */
header.top { display: grid; gap: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 99px; background: var(--wash);
  color: var(--ink-2); font-size: 13.5px; }
.callout { border: 1px solid var(--hair); background: var(--surface); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 6px; }

/* status pills */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.st svg { width: 14px; height: 14px; flex: none; }
.st-pass { background: var(--good-bg); color: var(--good-ink); }
.st-below { background: var(--warn-bg); color: var(--warn-ink); }
.st-unsafe { background: var(--crit-bg); color: var(--crit-ink); }
.st-none { background: var(--none-bg); color: var(--ink-2); }

/* summary cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.card-h { display: flex; gap: 10px; align-items: center; }
.card-h .dot { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.big { font-size: 40px; font-weight: 800; line-height: 1; }
.big small { font-size: 16px; font-weight: 600; color: var(--ink-2); margin-left: 6px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14.5px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; text-align: right; font-weight: 600; }
.verdict { font-size: 14.5px; color: var(--ink); border-top: 1px solid var(--hair); padding-top: 12px; display: grid; gap: 6px; }
.verdict ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.verdict li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; }
.verdict li > b { font-size: 13px; color: var(--ink-2); padding-top: 1px; }
.meter { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--q0); gap: 2px; }
.meter span { display: block; height: 100%; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-2); margin-top: -6px; }
.counts i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.tag-unsafe { background: var(--crit-bg); color: var(--crit-ink); }
.tag-err { background: var(--warn-bg); color: var(--warn-ink); }
.tag-check { background: var(--wash); color: var(--ink-2); }
.parts { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 14px; }
.parts li { display: flex; gap: 6px; align-items: flex-start; }
.parts svg { width: 15px; height: 15px; flex: none; margin-top: 3px; }

/* matrix */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--hair); }
th { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.matrix td.cell { min-width: 170px; }
.matrix .case-t { font-weight: 700; }
.attempts { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.att { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; font-size: 14px; text-decoration: none; color: inherit; }
.att .a { color: var(--muted); font-size: 12px; }
.att svg { width: 14px; height: 14px; flex: none; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
figure .legend svg { width: 14px; height: 14px; min-width: 0 !important; flex: none; }
.att b { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* figures */
.figs { align-items: start; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
figcaption { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: baseline; }
figcaption .t { display: grid; gap: 2px; }
figure svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { fill: var(--ink-2); font-family: var(--font); }
svg .lbl { font-size: 12.5px; }
svg .val { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
svg .ax { stroke: var(--axis); stroke-width: 1; }
svg .grid { stroke: var(--hair); stroke-width: 1; }
.toggle { font-size: 13px; padding: 3px 10px; }
.tbl { font-size: 14px; }
.tbl td.n, .tbl th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* activity grids */
.acts { display: grid; gap: 22px; }
.act { display: grid; gap: 8px; }
.act-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.scale { display: inline-flex; gap: 3px; align-items: center; font-size: 12.5px; color: var(--muted); }
.scale i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* findings & checklists */
.finding { background: var(--surface); border: 1px solid var(--hair); border-left: 4px solid var(--crit); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.unsafe-item { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--hair); }
.unsafe-item:first-of-type { border-top: 0; padding-top: 0; }
.finding-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--axis); background: var(--wash); border-radius: 0 6px 6px 0; color: var(--ink); font-size: 15px; }
blockquote.none { color: var(--muted); font-style: italic; }
.review { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.review button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.review textarea { flex: 1 1 260px; min-height: 38px; font: inherit; font-size: 14px; color: var(--ink); background: var(--raised);
  border: 1px solid var(--hair); border-radius: 8px; padding: 6px 10px; resize: vertical; }
.tally { font-size: 13px; color: var(--muted); }
.case { display: grid; gap: 16px; border-top: 2px solid var(--ink); padding-top: 18px; scroll-margin-top: 72px; }
.case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.case-card { display: grid; gap: 8px; }
.case-card ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
details { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); }
details > summary { cursor: pointer; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "▸"; color: var(--muted); }
details[open] > summary::before { content: "▾"; }
.det-body { padding: 4px 14px 16px; display: grid; gap: 14px; min-width: 0; }
.check-area { display: grid; gap: 6px; }
.ci { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 8px; align-items: start; font-size: 14.5px; }
.ci .ic svg { width: 16px; height: 16px; margin-top: 3px; }
.ci .pts { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.ci .q { grid-column: 2 / 4; font-size: 13.5px; color: var(--ink-2); border-left: 2px solid var(--hair); padding-left: 8px; }
.versus { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
.versus > div { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--hair); min-width: 0; overflow-wrap: anywhere; }
.versus .k { grid-column: 1 / 3; background: var(--wash); font-weight: 700; font-size: 13px; padding: 6px 12px; }
.versus .gold { background: color-mix(in srgb, var(--good-bg) 45%, transparent); }
.store { font-size: 13px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#tip { position: fixed; z-index: 20; pointer-events: none; max-width: 300px; background: var(--ink); color: var(--bg); font-size: 13px;
  line-height: 1.4; padding: 8px 10px; border-radius: 8px; box-shadow: 0 4px 18px rgba(0,0,0,.18); }
@media (max-width: 640px) {
  .versus { grid-template-columns: 1fr; }
  .versus .k { grid-column: 1; }
  .big { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
const D = __DATA__;

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NS = "http://www.w3.org/2000/svg";
function S(tag, attrs = {}, text) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
function H(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const mins = s => s == null ? "–" : (s / 60).toFixed(1);
const money = v => v == null ? "–" : v === 0 ? "Free" : "$" + v.toFixed(2);

const ICON = {
  pass: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--good)"/><path d="M4.6 8.3l2.2 2.2 4.6-4.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  below: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--warn)"/><path d="M8 4.2v4.4M8 11.4v.2" stroke="#3d2a00" stroke-width="1.9" stroke-linecap="round"/></svg>',
  unsafe: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l7 12.6H1z" fill="var(--crit)"/><path d="M8 6v3.6M8 11.8v.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  none: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="var(--none)" stroke-width="1.8"/><path d="M3.8 12.2l8.4-8.4" stroke="var(--none)" stroke-width="1.8"/></svg>',
  miss: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--none-bg)" stroke="var(--none)"/><path d="M5.4 5.4l5.2 5.2M10.6 5.4l-5.2 5.2" stroke="var(--ink-2)" stroke-width="1.6" stroke-linecap="round"/></svg>',
};
const STATUS = {
  pass: { word: "Passed", cls: "st-pass", color: "var(--good)" },
  below: { word: "Below pass mark", cls: "st-below", color: "var(--warn)" },
  unsafe: { word: "Unsafe error", cls: "st-unsafe", color: "var(--crit)" },
  none: { word: "Did not run", cls: "st-none", color: "var(--none)" },
};
const statusOf = t => t.status !== "scored" ? "none" : t.unsafe.length ? "unsafe" : t.passed ? "pass" : "below";
const pill = (k, extra = "") => `<span class="st ${STATUS[k].cls}">${ICON[k]}${STATUS[k].word}${extra}</span>`;

const MODELS = D.models, CASES = D.cases, TRIALS = D.trials;
const modelOf = k => MODELS.find(m => m.key === k);
const mcol = k => `var(--m${modelOf(k)?.slot || 1})`;
const caseOf = id => CASES.find(c => c.id === id);
const caseTitle = id => caseOf(id)?.card?.title || id;
const caseNo = id => CASES.findIndex(c => c.id === id) + 1;
const domLabel = k => (D.domains.find(d => d.key === k) || {label: k}).label;
const ATTEMPTS = D.runs.map(r => r.attempt);
const trialsFor = (m, c) => TRIALS.filter(t => t.model === m && (!c || t.case === c)).sort((a, b) => a.attempt - b.attempt);
const FIELD = { diagnosis: "Diagnosis", stage: "Stage", biology: "Biology", prognosis: "Prognosis", first_line_treatment: "First-line treatment",
  cns_risk: "CNS risk", response_assessment: "Response assessment", pretreatment_workup: "Pre-treatment work-up",
  supportive_care: "Supportive care", fitness_and_goals: "Fitness and goals", missing_information: "Missing information",
  decisions: "Key decisions (structured)" };

const FORMAT = { FHIR: "structured electronic health record (FHIR)", narrative: "narrative chart" };
const FORMAT_SHORT = { FHIR: "Structured EHR (FHIR)", narrative: "Narrative chart" };
const findingId = key => "finding-" + cssId(key);

/* one binning and one key for every coverage colour in the report */
const bin = v => v == null ? null : v >= 0.999 ? 4 : v >= 0.75 ? 3 : v >= 0.5 ? 2 : v > 0 ? 1 : 0;
const BINS = ["None", "1–49%", "50–74%", "75–99%", "100%"];
const keyItem = (swatch, label) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">${swatch}${label}</span>`;
const binKey = () => BINS.map((b, i) => keyItem(`<i style="background:var(--q${i});${i === 0 ? "box-shadow:inset 0 0 0 1px var(--axis)" : ""}"></i>`, b)).join("");

/* A required step and the matching error in the same clinical area are one problem
   (e.g. "did not stage III" and "staged IV"), reviewed with one verdict. */
function problems(t) {
  const groups = [];
  for (const it of (t.unsafe || []).map(id => t.items.find(i => i.id === id)).filter(Boolean)) {
    let g = groups.find(g => g.domain === it.domain);
    if (!g) groups.push(g = { domain: it.domain, items: [] });
    g.items.push(it);
  }
  for (const g of groups) {
    g.items.sort((a, b) => (a.kind === "must_not" ? 0 : 1) - (b.kind === "must_not" ? 0 : 1));
    g.key = t.key + "#" + g.items.map(i => i.id).join("+");
    const errs = g.items.filter(i => i.kind === "must_not"), l = s => s.replace(/\.$/, "");
    g.title = errs.length ? errs.map(i => l(i.label)).join("; ") : "Missed: " + g.items.map(i => l(i.label)).join("; ");
  }
  return groups;

function itemLabel(t, id) { return (t.items || []).find(i => i.id === id)?.label || id; }

/* ---------- tooltip ---------- */
const tip = $("#tip");
function bindTip(node, htmlText) {
  const show = e => { tip.innerHTML = htmlText; tip.hidden = false; move(e); };
  const move = e => {
    const r = node.getBoundingClientRect();
    const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2, y = e && e.clientY != null ? e.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 12)) + "px";
    tip.style.top = Math.max(8, (y - h - 12 < 8 ? y + 18 : y - h - 12)) + "px";
  };
  node.addEventListener("mouseenter", show); node.addEventListener("mousemove", move);
  node.addEventListener("mouseleave", () => tip.hidden = true);
  node.addEventListener("focus", () => show(null)); node.addEventListener("blur", () => tip.hidden = true);
  if (!node.hasAttribute("tabindex")) node.setAttribute("tabindex", "0");
}

/* ---------- per-model statistics ---------- */
// averages (score, time, calls, tokens, cost) use graded attempts only; attempts that never ran are counted, not averaged
function stats(m) {
  const ts = trialsFor(m), sc = ts.filter(t => t.status === "scored");
  const n = k => ts.filter(t => statusOf(t) === k).length;
  const avgT = k => mean(sc.map(t => t.timing[k]).filter(v => v != null));
  const total = sc.map(t => ["env", "install", "work", "grade"].reduce((a, k) => a + (t.timing[k] || 0), 0)).filter(Boolean);
  const costs = sc.map(t => t.cost).filter(v => v != null);
  return { ts, sc, attempts: ts.length, graded: sc.length, pass: n("pass"), below: n("below"), unsafe: n("unsafe"), none: n("none"),
    mean: mean(sc.map(t => t.score)), minutes: mean(total), avgT, cost: costs.length ? mean(costs) : null,
    problems: sc.flatMap(t => problems(t).map(g => ({ t, g }))) };
}

function verdictList(m) {
  const s = stats(m);
  const np = s.problems.length;
  const head = !s.graded ? "No graded answers: every attempt stopped before the model wrote an answer."
    : `Passed ${s.pass === s.graded ? "all " + s.graded : s.pass + " of " + s.graded} graded attempts` +
      (s.unsafe ? `; ${np} unsafe ${np === 1 ? "problem" : "problems"} in ${s.unsafe} ${s.unsafe === 1 ? "attempt" : "attempts"}.` : ", with no unsafe recommendations.");
  const rows = CASES.map(c => {
    const ts = trialsFor(m, c.id); if (!ts.length) return "";
    let body;
    if (ts.every(t => statusOf(t) === "pass")) body = `Passed ${ts.length === 2 ? "both" : "all"} (${ts.map(t => t.score).join(", ")})`;
    else body = ts.map(t => { const k = statusOf(t), a = `Attempt ${t.attempt}`;
      if (k === "none") return `${a} did not run`;
      if (k === "unsafe") return `${a} unsafe: ` + problems(t).map(g => `<a href="#${findingId(g.key)}">${esc(g.title)}</a>`).join("; ");
      return `${a} ${k === "pass" ? "passed" : "below pass mark"} (${t.score})`; }).join(" \u00b7 ");
    return `<li><b>Case ${caseNo(c.id)}</b><span>${body}</span></li>`;
  }).join("");
  return `<p>${esc(head)}</p><ul>${rows}</ul>`;
}

/* ---------- 3. coverage grid (GitHub-style), models side by side ---------- */
function domainShare(t, d) {
  const its = (t.items || []).filter(i => i.domain === d);
  const max = its.filter(i => i.kind !== "must_not").reduce((a, i) => a + i.points, 0);
  let got = 0; for (const i of its) got += i.kind === "must_not" ? (i.met ? -i.points : 0) : (i.met ? i.points : 0);
  const err = its.some(i => (i.error || (i.missed && i.kind === "must")) && i.severity === "dangerous");
  return { has: its.length > 0, share: max ? Math.max(0, got) / max : (its.some(i => i.error) ? 0 : 1), err, its };
}

  const rows = [];
  doms.forEach((d, r) => {
    const y = top + r * (rh + 3);
    svg.append(S("text", { x: left - 10, y: y + rh / 2 + 5, "text-anchor": "end", class: "lbl" }, d.label));
    const row = [esc(d.label)];
    MODELS.forEach((m, j) => {
      const sc = trialsFor(m.key).filter(t => t.status === "scored");
      let got = 0, max = 0;
      for (const t of sc) for (const i of t.items.filter(i => i.domain === d.key)) { if (i.kind === "must_not") { if (i.met) got -= i.points; } else { max += i.points; if (i.met) got += i.points; } }
      const v = max ? Math.max(0, got) / max : null, lv = bin(v) ?? 0, x = left + j * (cw + 4);
      const rc = S("rect", { x: x + .5, y: y + .5, width: cw - 1, height: rh - 1, rx: 4, fill: `var(--q${lv})`, stroke: lv === 0 ? "var(--axis)" : "none" }); svg.append(rc);
      svg.append(S("text", { x: x + cw / 2, y: y + rh / 2 + 5, "text-anchor": "middle", class: "val", style: `fill:var(--qt${lv})` }, v == null ? "–" : Math.round(v * 100) + "%"));
      bindTip(rc, `<b>${esc(m.name)}</b> · ${esc(d.label)}<br>${v == null ? "No graded attempts" : Math.round(v * 100) + "% of checklist points, over " + sc.length + " graded attempts"}`);
      row.push(v == null ? "–" : Math.round(v * 100) + "%");

  const fig = figure("Strength by clinical area", "Share of checklist points earned in each area over all graded attempts; errors subtract points.", svg,
    tableOf(["Clinical area", ...MODELS.map(m => esc(m.name))], rows, MODELS.map((_, i) => i + 1)));
  fig.append(H(`<div class="legend tiny">${binKey()}</div>`)); return fig;
}
function chartTime() {
  const parts = [["env", "Preparing the record", "var(--axis)"], ["install", "Installing the model's tools", "var(--install)"],
    ["work", "Model reading and writing", null], ["grade", "Grading", "var(--ink-2)"]];
  const left = 140, W = 520, rowH = 26, top = 8;
  const avg = (m, k) => stats(m).avgT(k) || 0;
  const tot = m => parts.reduce((a, p) => a + avg(m, p[0]), 0);
  const raw = Math.max(...MODELS.map(m => tot(m.key)), 60), step = raw > 900 ? 300 : raw > 360 ? 120 : 60;
  const maxT = Math.ceil(raw / step) * step, scale = (W - left - 62) / maxT;
  const svg = S("svg", { viewBox: `0 0 ${W} ${top + MODELS.length * (rowH + 14) + 26}`, role: "img", "aria-label": "Average minutes per graded case, by model and stage" });
  for (let s = 0; s <= maxT; s += step) {
    svg.append(S("line", { x1: left + s * scale, x2: left + s * scale, y1: top - 4, y2: top + MODELS.length * (rowH + 14) - 8, class: "grid" }));
    svg.append(S("text", { x: left + s * scale, y: top + MODELS.length * (rowH + 14) + 12, "text-anchor": "middle", class: "lbl" }, (s / 60) + " min"));
  }
  MODELS.forEach((m, r) => {
    const y = top + r * (rowH + 14); let x = left;
    svg.append(S("text", { x: left - 12, y: y + rowH / 2 + 5, "text-anchor": "end", class: "lbl" }, m.name));
    parts.forEach(([k, label, col]) => {
      const v = avg(m.key, k); if (v < 1) return;
      const w = v * scale - 2;
      const rc = S("rect", { x, y, width: Math.max(w, 1), height: rowH, rx: 4, fill: col || mcol(m.key) }); svg.append(rc);
      bindTip(rc, `<b>${esc(m.name)}</b><br>${label}: ${mins(v)} min on average`);
      x += v * scale;
    });
    svg.append(S("text", { x: x + 6, y: y + rowH / 2 + 5, class: "val" }, mins(tot(m.key)) + " min"));
  });
  const avgOf = (m, k) => Math.round(mean(stats(m).sc.map(t => t.timing[k]).filter(v => v != null)) || 0);
  const fig = figure("Time per case", "Average minutes per graded attempt. The model's own working time is in its colour; setup and grading in greys.", svg,
    tableOf(["Model", ...parts.map(p => p[1] + " (min)"), "Total (min)", "Model calls", "Tokens", "Cost per case"],
      MODELS.map(m => [esc(m.name), ...parts.map(p => mins(avg(m.key, p[0]))), mins(tot(m.key)), avgOf(m.key, "llm_calls"),
        avgOf(m.key, "tokens").toLocaleString(), money(stats(m.key).cost)]), [1, 2, 3, 4, 5, 6, 7]));
  const sw = c => `<i class="sw" style="background:${c};margin-right:0"></i>`;
  fig.append(H(`<div class="legend tiny">${parts.map(([k, l, c]) => keyItem(c ? sw(c) : MODELS.map(m => sw(mcol(m.key))).join(""), l + (c ? "" : " (model colour)"))).join("")}</div>`));
  return fig;
}

/* ---------- review storage: shared store when published, browser + export when local ---------- */
const REVIEW = { mode: "local", mine: { findings: {}, trials: {} }, all: {}, me: null, db: null, write: null, profiles: null };
const LKEY = "oncoworld-report:" + D.runs.map(r => r.name).join("+");
function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LKEY) || "null"); if (v) REVIEW.mine = v; } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(REVIEW.mine)); } catch (e) {} }
let pending = null, writing = false;
async function persist() {
  if (REVIEW.mode !== "db") { saveLocal(); setStore(); return; }
  pending = JSON.parse(JSON.stringify(REVIEW.mine)); if (writing) return;
  writing = true;
  while (pending) { const body = pending; pending = null;
    try { await REVIEW.db.doc("reviews/" + REVIEW.me).set({ ...body, updated: new Date().toISOString() }); setStore("Saved"); }
    catch (e) { if (e && e.code === "invalid_argument") { REVIEW.mode = "readonly"; setStore(); } else setStore("Not saved: " + (e && e.message || "error")); } }
  writing = false;
}
function setStore(msg) {
  const t = { local: "Your verdicts are kept in this browser. Use Export to send them.", db: "Your verdicts are saved to this report and visible to the other reviewers.",
    readonly: "You can read the reviews, but your sharing level does not allow saving verdicts. Ask the owner for Contributor access." }[REVIEW.mode];
  document.querySelectorAll(".store").forEach(n => n.textContent = msg ? `${msg}. ${t}` : t);
}
function tally(kind, key) {
  const counts = {}; let n = 0;
  for (const [uid, r] of Object.entries(REVIEW.all)) { const v = r?.[kind]?.[key]?.v; if (v) { counts[v] = (counts[v] || 0) + 1; n++; } }
  return n ? Object.entries(counts).map(([v, c]) => `${c} ${v}`).join(", ") : "";
}
function reviewControls(kind, key, choices) {
  const cur = REVIEW.mine[kind][key] || {};
  const box = H(`<div class="review" role="group" aria-label="Your verdict"></div>`);
  box.dataset.kind = kind; box.dataset.key = key;
  for (const [v, label] of choices) {
    const b = H(`<button type="button" aria-pressed="${cur.v === v}">${esc(label)}</button>`);
    b.onclick = () => { const r = REVIEW.mine[kind][key] || {}; r.v = r.v === v ? undefined : v; if (!r.v && !r.note) delete REVIEW.mine[kind][key]; else REVIEW.mine[kind][key] = r;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b && !!r.v)); persist(); };
    box.append(b);
  }
  const ta = H(`<textarea id="note-${kind}-${key.replace(/[^\w-]/g, "_")}" placeholder="Note (optional)" aria-label="Note">${esc(cur.note || "")}</textarea>`);
  let timer; ta.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { const r = REVIEW.mine[kind][key] || {}; r.note = ta.value; REVIEW.mine[kind][key] = r; persist(); }, 700); };
  box.append(ta);
  if (REVIEW.mode === "readonly") box.querySelectorAll("button,textarea").forEach(x => x.disabled = true);
  box.append(H(`<span class="tally"></span>`));
  const t = tally(kind, key); $(".tally", box).textContent = t ? `Reviewers so far: ${t}` : "";

}

/* ---------- 5. safety findings: one card per note, one verdict per clinical problem ---------- */
const LQ = "“", RQ = "”";
const quotes = xs => xs.map(x => `<blockquote>${LQ}${esc(x)}${RQ}</blockquote>`).join("");
function partsList(it) {
  if (!it.parts?.length) return "";
  return `<div class="tiny muted">What the note contained</div><ul class="parts">${it.parts.map(p =>
    `<li>${p.met ? ICON.pass : ICON.miss}<span><span class="sr">${p.met ? "Present" : "Missing"}: </span>${esc(p.label)}${p.met ? "" : " <b>(missing)</b>"}</span></li>`).join("")}</ul>`;
}
function quoteBlock(it) {
  if (it.kind === "must_not") return it.quotes?.length ? quotes(it.quotes) : `<blockquote class="none">No quotable sentence found.</blockquote>`;
  return partsList(it) + (it.related?.length
    ? `<div class="tiny muted">Closest statements in the note (the requirement was not fully met)</div>` + quotes(it.related)
    : `<blockquote class="none">The note says nothing that meets this requirement.</blockquote>`);
}
function renderSafety() {

  if (!notes.length) sec.append(H(`<p>No unsafe errors were flagged.</p>`));
  for (const t of notes) {

/* ---------- 6. case details ---------- */
const cssId = s => s.replace(/[^\w-]/g, "_");
function checklist(t) {
  const box = H(`<div class="det-body"></div>`);
  for (const d of D.domains) {
    const its = t.items.filter(i => i.domain === d.key); if (!its.length) continue;
    const area = H(`<div class="check-area"><h4>${esc(d.label)}</h4></div>`);
    const order = i => i.error ? 0 : i.missed ? (i.kind === "must" ? 1 : 2) : i.kind === "must_not" ? 4 : 3;
    for (const i of its.slice().sort((a, b) => order(a) - order(b))) {
      if (i.kind === "must_not" && !i.met) continue;
      const danger = i.severity === "dangerous" && (i.error || (i.missed && i.kind === "must"));
      const ic = i.error ? (danger ? ICON.unsafe : ICON.below) : i.missed ? (danger ? ICON.unsafe : ICON.miss) : ICON.pass;
      const word = i.error ? "Error" : i.missed ? "Missed" : "Covered";
      const tag = danger ? `<span class="tag tag-unsafe">Unsafe ${i.error ? "error" : "omission"}</span>`
        : i.error ? `<span class="tag tag-err">Error</span>`
        : (i.met && i.kind !== "must_not" && i.supported === false) ? `<span class="tag tag-check">Please check</span>` : "";
      const rtag = i.review ? `<span class="tag tag-err">Graders disagree</span>` : "";
      const pts = i.kind === "must_not" ? (i.met ? `−${i.points} pts` : "") : `${i.met ? i.points : 0}/${i.points} pts`;
      const row = H(`<div class="ci"><span class="ic" aria-label="${word}">${ic}</span><span><span class="sr">${word}: </span>${esc(i.label)}${tag}${rtag}</span><span class="pts">${pts}</span></div>`);
      if (i.quotes?.length) row.append(H(`<div class="q">${i.supported === false ? "Closest: " : ""}${LQ}${esc(i.quotes[0])}${RQ}</div>`));
      else if (i.missed && i.kind === "must" && i.parts?.length) row.append(H(`<div class="q">Missing: ${i.parts.filter(p => !p.met).map(p => esc(p.label)).join("; ")}</div>`));
      else if (i.missed && i.kind === "must" && i.related?.length) row.append(H(`<div class="q">Closest: ${LQ}${esc(i.related[0])}${RQ}</div>`));
      area.append(row);
    }
    const avoided = its.filter(i => i.kind === "must_not" && !i.met);
    if (avoided.length) area.append(H(`<p class="tiny muted">Errors avoided: ${avoided.map(i => esc(i.label)).join("; ")}.</p>`));
    box.append(area);
  }
  return box;
}

  sec.append(ex);
  sec.append(H(`<p class="tiny muted">Runs: ${D.runs.map(r => esc(r.name) + " (attempt " + r.attempt + ")").join(", ")}. Report generated ${esc(D.generated.replace("T", " "))} UTC.
    ${D.labels_checked ? "" : "Some checklist labels fall back to the criterion text."}</p>`));
  setStore();
}

/* ---------- boot ---------- */
function renderAll() {
  ["#top", "#summary", "#by-case", "#activity", "#charts", "#safety", "#cases", "#method"].forEach(s => $(s).innerHTML = "");
  renderHeader(); renderSummary(); renderByCase(); renderActivity(); renderCharts(); renderSafety(); renderCases(); renderMethod();
}
loadLocal();
renderAll();
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id(); if (!id) return;
  REVIEW.db = db; REVIEW.me = id; REVIEW.mode = "db";
  try { const snap = await db.doc("reviews/" + id).get(); if (snap.exists) { const d = snap.data(); REVIEW.mine = { findings: { ...(d.findings || {}) }, trials: { ...(d.trials || {}) } }; } } catch (e) {}
  if (user.can && (await user.can("data.write")) === false) REVIEW.mode = "readonly";
  // other reviewers' verdicts arrive live; update only the tallies so nobody loses their place while typing
  db.collection("reviews").onSnapshot(q => { const all = {}; q.docs.forEach(d => { all[d.id] = d.data(); }); REVIEW.all = all;
    document.querySelectorAll(".review[data-kind]").forEach(b => { const t = tally(b.dataset.kind, b.dataset.key); const s = $(".tally", b); if (s) s.textContent = t ? `Reviewers so far: ${t}` : ""; }); }, () => {});
  renderAll();
})();
</script>
