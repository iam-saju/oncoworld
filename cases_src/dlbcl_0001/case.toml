# Imaging, pathology and notes: rendered verbatim into the narrative chart and as
# DiagnosticReport.presentedForm / DocumentReference in FHIR.
[[documents]]
id = "referral"
date = "2026-08-20"
kind = "referral_note"
title = "Primary care referral to hematology-oncology"
author = "Synthetic Primary Care Physician"
text = """
Reason for referral: enlarging neck nodes and abnormal CT, suspected lymphoma.

Mr. Sample is a 62-year-old civil engineer with hypothyroidism, GERD and hyperlipidemia. About three
months of progressively enlarging, painless left-sided neck lumps, evening fevers to 38.5 C several
times a week, drenching night sweats requiring a change of sheets, and about 7 kg unintentional weight
loss over three months (86 -> 79 kg). Taking acetaminophen for the fevers. No antibiotic-responsive
infection identified; chest X-ray clear, urinalysis and blood cultures negative (August 2026).

CT neck, chest, abdomen and pelvis with IV contrast 2026-08-18 (outside facility): enlarged left
cervical nodes up to 3.2 cm; enlarged mediastinal (right paratracheal and subcarinal) nodes up to
2.6 cm; a large confluent retroperitoneal nodal mass, approximately 10.8 cm in greatest dimension;
spleen 14.2 cm with several hypodense lesions. Kidneys, adrenals and liver unremarkable.
Impression: lymphoma favored.

TSH 2.1 on levothyroxine in June. Please see soon.
"""

[[documents]]
id = "consult"
date = "2026-09-02"
kind = "consult_note"
title = "Hematology-oncology new patient consultation"
author = "Synthetic Hematologist-Oncologist"
text = """
HPI: 62M referred for cervical lymphadenopathy and a retroperitoneal mass. Symptoms as per referral.
Still working full-time from home, but tires by mid-afternoon and has stopped his weekend hiking;
fully independent in all self-care. Mild early satiety and a dull left-flank ache. No headache,
visual change, confusion, focal weakness, back pain, or bladder/bowel change. No numbness or tingling
in the hands or feet. No testicular swelling. No cough, dyspnea, or dysphagia. No pruritus.

PMH: hypothyroidism (2012), GERD (2018; EGD 2019 mild esophagitis), hyperlipidemia (2016).
Appendectomy age 19. No prior cancer, chemotherapy or radiation. No known heart, lung, kidney or
liver disease. No diabetes.
Medications: see medication list.
Allergies: no known drug allergies.
Social: civil engineer; married, lives with his wife; two adult children. Never smoker. Alcohol 2-3
glasses of wine per week. No injection drug use. Lives 20 minutes from the cancer center.
Family history: mother with breast cancer at 70; no family history of lymphoma.

Exam: T 38.1 C, HR 94, BP 132/80, RR 14, SpO2 98% RA. Weight 79 kg, height 178 cm (BSA 1.98 m2).
Well-appearing, mildly pale. Left cervical (levels III-IV) matted lymph nodes, largest about 3 cm,
firm, non-tender. No right cervical, supraclavicular, axillary or inguinal lymphadenopathy. Oropharynx
clear, tonsils not enlarged. Chest clear. Heart regular, no murmur. Abdomen: soft, vague fullness in
the left mid-abdomen; spleen tip palpable 2 cm below the costal margin; no hepatomegaly. Testes normal
without masses. No edema. Neuro: alert and oriented, cranial nerves intact, strength 5/5 throughout,
sensation intact, reflexes symmetric.

ECOG performance status 1.

Plan today: CBC, CMP, LDH, uric acid, beta-2 microglobulin, hepatitis B, hepatitis C and HIV
serologies; FDG PET-CT; echocardiogram; excisional biopsy of a left cervical lymph node (surgery
consulted); bone marrow biopsy. Return after results.
"""

[[documents]]
id = "pet"
date = "2026-09-05"
kind = "pet_ct_report"
title = "FDG PET-CT, skull base to mid-thigh"
author = "Synthetic Nuclear Medicine Physician"
text = """
CLINICAL INDICATION: Cervical and retroperitoneal lymphadenopathy, suspected lymphoma. Initial staging.

TECHNIQUE: 11.4 mCi 18F-FDG IV; uptake time 60 minutes; serum glucose at injection 98 mg/dL.
Low-dose non-contrast CT for attenuation correction and localization. Mediastinal blood pool SUVmax
2.0; liver SUVmax 2.6.

FINDINGS:
Head and neck: physiologic brain uptake (PET is insensitive for intracranial disease). Multiple
FDG-avid left cervical lymph nodes (levels III-IV), largest 3.1 x 2.4 cm, SUVmax 18.7. No FDG-avid
right cervical or supraclavicular nodes. Waldeyer ring, salivary glands and thyroid: physiologic.
Chest: FDG-avid right paratracheal node 2.6 cm (SUVmax 15.2) and subcarinal node 2.2 cm (SUVmax
13.9). No FDG-avid hilar or axillary nodes. Lungs clear without FDG-avid nodules. No pleural or
pericardial effusion.
Abdomen and pelvis:
- Confluent retroperitoneal (left para-aortic and aortocaval) nodal mass, 11.0 x 8.1 cm in axial
  dimension, SUVmax 22.4, displacing the left renal vein without obstruction. No hydronephrosis.
- Spleen enlarged at 14.2 cm with at least four FDG-avid hypodense lesions, largest 2.4 cm,
  SUVmax 16.3.
- Liver normal in size without focal FDG uptake.
- Kidneys and adrenal glands without focal FDG uptake or mass.
- No FDG-avid mesenteric, iliac or inguinal nodes. No ascites.
- Stomach and bowel: physiologic uptake only.
Musculoskeletal: diffuse mildly increased marrow uptake, less than liver, without focal osseous or
marrow lesions. No lytic or sclerotic lesions.
Testes: no abnormal uptake.

IMPRESSION:
1. FDG-avid lymphadenopathy above the diaphragm (left cervical, mediastinal) and below the diaphragm
   (retroperitoneal mass, 11.0 cm), consistent with lymphoma. Tissue confirmation pending.
2. Splenomegaly with multiple FDG-avid splenic lesions, consistent with splenic involvement.
3. No FDG-avid disease in the liver, kidneys, adrenal glands, lungs, bones or marrow (diffuse mild
   marrow uptake is likely reactive), testes, or gastrointestinal tract.
"""

