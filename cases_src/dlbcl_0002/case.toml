[[documents]]
id = "survivorship"
date = "2026-03-10"
kind = "progress_note"
title = "Breast oncology survivorship visit"
author = "Synthetic Breast Medical Oncologist"
text = """
Ms. Sample returns for annual survivorship follow-up, now 9.5 years from diagnosis of left breast
cancer.

Oncology history:
- 2016-01: screen-detected left breast mass, 10 o'clock. Core biopsy: invasive ductal carcinoma,
  grade 2, ER 95%, PR 60%, HER2 1+ (negative).
- 2016-02: left lumpectomy and sentinel lymph node biopsy (2 left axillary sentinel nodes removed).
  pT2 (2.4 cm) pN0 (0/2), margins negative. Stage IIA.
- 2016-03 to 2016-07: adjuvant dose-dense doxorubicin 60 mg/m2 plus cyclophosphamide 600 mg/m2 every
  2 weeks x 4 cycles (cumulative doxorubicin 240 mg/m2), then weekly paclitaxel 80 mg/m2 x 12.
  Pre-chemotherapy echocardiogram 2016-02-15: LVEF 62%. No echocardiogram since.
- 2016-08 to 2016-10: whole-breast radiotherapy to the left breast, 50 Gy in 25 fractions plus a
  10 Gy tumor-bed boost.
- 2016-11 to present: anastrozole 1 mg daily. Extended therapy to 10 years planned, to finish
  November 2026.

Interval history: tolerating anastrozole with mild arthralgias. No breast changes, bone pain, cough,
or headache. Energy good; attends exercise classes three times a week.

Exam: BP 138/84, HR 76. Weight 72.8 kg. Healed left lumpectomy scar with mild radiation
skin changes. No breast masses. No axillary, supraclavicular or cervical lymphadenopathy.
Heart regular, no murmur. Lungs clear. No edema.

Diagnostic bilateral mammogram 2026-03-02: post-lumpectomy changes on the left, stable. BI-RADS 2.

Plan: continue anastrozole to complete 10 years in November 2026. Annual mammogram. DEXA due 2027.
Return in 12 months.
"""

[[documents]]
id = "referral"
date = "2026-08-12"
kind = "referral_note"
title = "Primary care referral: left axillary mass"
author = "Synthetic Primary Care Physician"
text = """
Reason for referral: new left axillary mass in a breast cancer survivor; recurrence vs other.

Ms. Sample is a 59-year-old school librarian with a history of left breast cancer (2016), now on
anastrozole, and hypertension. Noticed a firm, non-tender lump in the left armpit in mid-July.
Over the past 4 weeks she has had evening fevers, which she has been recording at home, soaking
night sweats two to three times a week, and fatigue. Weight down about 2 kg.

Left axillary ultrasound 2026-08-05: several enlarged left axillary lymph nodes, largest 3.4 cm, with
loss of the fatty hilum.

CT chest/abdomen/pelvis with IV contrast 2026-08-07 (outside facility): enlarged left axillary and
mediastinal lymph nodes; mesenteric and para-aortic lymphadenopathy, largest mesenteric conglomerate
7.4 cm; mildly enlarged spleen (12.6 cm) with several hypodense lesions up to 2 cm. Liver, adrenal
glands and kidneys normal. Impression: lymphoma favored; metastatic breast carcinoma not excluded.

Referred to breast surgical oncology for excisional biopsy and to hematology-oncology.
"""

[[documents]]
id = "pathology"
date = "2026-08-28"
kind = "pathology_report"
title = "Surgical pathology: excisional biopsy, left axillary lymph node"
author = "Synthetic Hematopathologist"
amended = "2026-09-08"
text = """
SPECIMEN: Left axillary lymph node, excisional biopsy, collected 2026-08-25. Received fresh; portions
submitted for flow cytometry and cytogenetics.
CLINICAL HISTORY: Left breast carcinoma 2016 (ER-positive, HER2-negative). New left axillary
lymphadenopathy, fevers.

GROSS: Lymph node, 3.6 x 2.8 x 2.0 cm, tan-white fleshy cut surface with focal necrosis.

FINAL DIAGNOSIS: DIFFUSE LARGE B-CELL LYMPHOMA, NOT OTHERWISE SPECIFIED.

MICROSCOPIC: Effacement of nodal architecture by diffuse sheets of large atypical lymphoid cells with
vesicular chromatin and one or more nucleoli; numerous mitoses and focal necrosis. No cohesive
epithelial nests, glands or single-file infiltrating epithelial cells.

IMMUNOHISTOCHEMISTRY (adequate controls):
  CD20              positive (diffuse, strong)
  PAX5              positive
  CD3               negative in tumor cells (scattered background T cells)
  CD5               negative
  CD10              negative
  BCL6              positive
  MUM1/IRF4         positive (approximately 80% of tumor cells)
  BCL2              positive in approximately 70% of tumor cells
  MYC               positive in approximately 45% of tumor cells
  Cyclin D1         negative
  CD30              negative
  Ki-67             approximately 80%
  EBER ISH          negative
  Cytokeratin AE1/AE3   negative in lesional cells
  GATA3             negative in lesional cells

FLOW CYTOMETRY: CD19+, CD20+, CD10-, kappa light-chain restricted large B-cell population (62% of
events).

COMMENT: Non-germinal-center B-cell-like immunophenotype by the Hans algorithm (CD10 negative, BCL6
positive, MUM1 positive). Cytokeratin AE1/AE3 and GATA3 are negative in the lesional cells and there is
no morphologic evidence of metastatic carcinoma. Interphase FISH has been requested on block A2;
results will be reported in an addendum.

ADDENDUM (2026-09-08): FISH, interphase, break-apart probes, 200 nuclei scored.
  MYC (8q24):   no rearrangement detected
  BCL2 (18q21): no rearrangement detected
  BCL6 (3q27):  no rearrangement detected
The final diagnosis is unchanged.
"""

[[documents]]
id = "consult"
date = "2026-09-01"
kind = "consult_note"
title = "Hematology-oncology new patient consultation"
author = "Synthetic Hematologist-Oncologist"
text = """
HPI: 59-year-old woman referred after excisional biopsy of a left axillary node (2026-08-25) showed
diffuse large B-cell lymphoma (FISH pending). She first noticed the left axillary lump in mid-July.
For about 5 weeks she has had evening fevers several times a week; her home log, brought today,
documents temperatures of 37.9 to 38.4 C, maximum 38.4 C on 2026-08-27, without infectious symptoms.
Drenching night sweats requiring a change of nightclothes two to three times a week. Fatigue: still
working her usual hours at the school library and independent in all activities, but has stopped her
exercise classes. Weight 70.5 kg today vs 72.8 kg in March 2026 (about 3% loss). No abdominal pain,
early satiety, bone pain, cough, headache, visual change, focal weakness or confusion.
Cardiovascular: no exertional dyspnea, orthopnea, paroxysmal nocturnal dyspnea, ankle swelling, chest
pain, palpitations or syncope; climbs two flights of stairs without stopping (NYHA class I).

ONCOLOGY HISTORY: Left breast invasive ductal carcinoma 2016, pT2 pN0, stage IIA, ER-positive,
PR-positive, HER2-negative. Lumpectomy and sentinel node biopsy (2016-02); dose-dense AC (doxorubicin
60 mg/m2 and cyclophosphamide 600 mg/m2, 4 cycles; cumulative doxorubicin 240 mg/m2) followed by weekly
paclitaxel x 12 (2016-03 to 2016-07); left whole-breast radiotherapy 50 Gy + 10 Gy boost (2016-08 to
2016-10); anastrozole since 2016-11, now in year 10, planned to stop November 2026. Last mammogram
2026-03 benign.

PMH: hypertension (2018) on amlodipine; osteopenia on calcium/vitamin D. No known coronary disease,
diabetes or arrhythmia. No other cardiac history.
Medications: see medication list.
Allergies: penicillin (hives).
Social: school librarian, married, lives with her husband 20 minutes from the cancer center. Never
smoker. Rare alcohol. Two adult children.
Family history: mother with heart failure in her 70s; father with colon cancer at 74. No known
BRCA testing; criteria were not met in 2016.

Exam: T 37.8 C, HR 84, BP 146/88, RR 14, SpO2 98% RA. Weight 70.5 kg, height 165 cm (BSA 1.79 m2).
Well-appearing. Healing left axillary incision; residual 2 cm firm left axillary node. No cervical,
supraclavicular or inguinal lymphadenopathy. Breasts: healed left lumpectomy scar, no masses
bilaterally. Heart: regular rhythm, no murmur or gallop; JVP not elevated. Lungs clear. Abdomen soft,
non-tender; spleen tip palpable 2 cm below the left costal margin; no hepatomegaly. No peripheral
edema. Neuro: non-focal.

ECOG performance status 1.

Plan today: CBC, CMP, LDH, uric acid, beta-2 microglobulin, viral serologies; FDG PET-CT;
transthoracic echocardiogram (prior doxorubicin and left breast radiotherapy); bone marrow biopsy;
await FISH. Return after results.
"""

[[documents]]
id = "pet"
date = "2026-09-04"
kind = "pet_ct_report"
title = "FDG PET-CT, skull base to mid-thigh"
author = "Synthetic Nuclear Medicine Physician"
text = """
CLINICAL INDICATION: Diffuse large B-cell lymphoma on left axillary node excision (2026-08-25).
History of left breast cancer 2016. Initial staging.

TECHNIQUE: 9.8 mCi 18F-FDG IV; uptake time 60 minutes; serum glucose at injection 94 mg/dL.
Low-dose non-contrast CT for attenuation correction and localization. Mediastinal blood pool SUVmax
1.9; liver SUVmax 2.7. Comparison: outside CT 2026-08-07.

FINDINGS:
Head and neck: physiologic brain uptake (PET is insensitive for intracranial disease). No FDG-avid
cervical or supraclavicular lymph nodes.
Chest:
- Left axillary lymph nodes, largest 2.2 cm, SUVmax 17.8, adjacent to post-excision changes.
- Mediastinal lymph nodes (prevascular and left paratracheal), largest 2.9 cm, SUVmax 15.4.
- Left breast: post-lumpectomy changes without FDG-avid lesion. Right breast normal.
- Mild left anterior lung fibrotic change in the prior radiation field, not FDG-avid. No pulmonary
  nodules. No pleural or pericardial effusion. Physiologic myocardial uptake.
Abdomen and pelvis:
- Mesenteric nodal conglomerate, 7.5 x 5.1 cm, SUVmax 22.3 (largest nodal mass).
- Para-aortic lymph nodes, largest 3.0 cm, SUVmax 16.9.
- Spleen 12.8 cm with multiple FDG-avid nodules, largest 2.1 cm, SUVmax 16.2.
- Liver normal without focal uptake. Adrenal glands and kidneys normal without focal uptake.
- No FDG-avid pelvic or inguinal nodes. No ascites.
Musculoskeletal: no focal osseous or marrow FDG uptake.

IMPRESSION:
1. FDG-avid lymphadenopathy above the diaphragm (left axillary, mediastinal) and below the diaphragm
   (mesenteric, para-aortic), with multiple FDG-avid splenic nodules, consistent with lymphoma.
   Largest nodal mass 7.5 cm (mesenteric).
2. No FDG-avid lesion in the kidneys, adrenal glands, liver, lungs, bone, marrow or breasts.
3. Post-treatment changes of the left breast and left anterior lung without evidence of active disease.
"""

