# Imaging, pathology and notes: rendered verbatim into the narrative chart and as
# DiagnosticReport.presentedForm / DocumentReference in FHIR.
[[documents]]
id = "referral"
date = "2026-08-27"
kind = "referral_note"
title = "Primary care referral to hematology-oncology"
author = "Synthetic Primary Care Physician"
text = """
Reason for referral: rapidly enlarging right neck mass, abnormal neck ultrasound.

Mr. Sample is a 54-year-old accountant with obstructive sleep apnea on CPAP, mild intermittent asthma
and GERD. He noticed a right-sided neck lump about four weeks ago; it has roughly doubled in size since.
A 10-day course of azithromycin (penicillin allergy) for presumed reactive adenitis made no difference.
Over the last two weeks he has had mild difficulty swallowing solid food (meat and bread "stick"), which
he first put down to his reflux. He denies fevers, night sweats or weight loss.

Neck ultrasound 2026-08-25: multiple enlarged, rounded right level II-IV lymph nodes with loss of the
fatty hilum, largest 3.6 cm. Not cystic.

I have ordered contrast CT of the neck and chest. Please see urgently.
"""

[[documents]]
id = "ct"
date = "2026-09-03"
kind = "ct_report"
title = "CT neck and chest with IV contrast"
author = "Synthetic Radiologist"
text = """
CLINICAL INDICATION: Enlarging right neck mass, dysphagia.

TECHNIQUE: Axial CT of the neck and chest after 80 mL IV iodinated contrast; multiplanar reformats.

FINDINGS:
Neck: conglomerate of enlarged right level II, III and IV lymph nodes, largest 3.8 x 3.2 cm (level III),
with mild mass effect on the right lateral pharyngeal wall. Oropharyngeal and laryngeal airway patent.
No left cervical adenopathy. Thyroid normal.
Chest: lobulated soft-tissue mass in the anterior mediastinum measuring 12.0 x 8.6 x 9.8 cm (AP x TR x CC),
mildly heterogeneous, insinuating around the great vessels. The superior vena cava is narrowed by
extrinsic compression to about 50% of its normal caliber over 3 cm; contrast opacifies the SVC and
right atrium normally with no filling defect to suggest thrombus and no prominent chest-wall collaterals.
The trachea is displaced slightly to the left without significant luminal narrowing (narrowest
cross-sectional diameter 15 mm). No hilar or axillary adenopathy. No pericardial or pleural effusion.
Lungs clear. Upper abdomen on included images unremarkable.

IMPRESSION:
1. Large anterior mediastinal mass (12.0 cm) with right cervical lymphadenopathy, most consistent with
   lymphoma.
2. Moderate extrinsic narrowing of the SVC without thrombosis. Airway patent.
"""

[[documents]]
id = "consult"
date = "2026-09-08"
kind = "consult_note"
title = "Hematology-oncology new patient consultation"
author = "Synthetic Hematologist-Oncologist"
text = """
HPI: 54M with a rapidly enlarging right neck mass for about five weeks and a large anterior mediastinal
mass on CT 2026-09-03. Mild dysphagia to solids (no odynophagia; liquids fine). For about ten days he has
noticed mild facial fullness on waking that resolves within an hour of getting up. Mild dyspnea climbing
two flights of stairs; none at rest. No orthopnea, stridor, hoarseness, cough or chest pain. No fevers,
night sweats or weight loss (weight stable at 98 kg). No headache, visual change, confusion, focal
weakness or numbness. No testicular swelling.

PMH: obstructive sleep apnea on CPAP (2019), mild intermittent asthma (albuterol about monthly), GERD,
obesity. PSH: laparoscopic appendectomy (2004). No prior cancer, chemotherapy or radiation. No known
heart disease.
Medications: see medication list.
Allergies: penicillin (urticaria in childhood).
Social: works full time as an accountant. Married, lives with his wife (46) and two children, ages 9 and
12. Never smoker. Alcohol: 2-3 beers per week. Lives 20 minutes from the cancer center.
Family history: mother with breast cancer at 70; no hematologic malignancy.

Exam: T 36.8 C, HR 84, BP 134/82, RR 16, SpO2 97% RA. Weight 98 kg, height 180 cm (BMI 30.2,
BSA 2.18 m2). Firm, fixed, non-tender right cervical nodal mass about 5 cm (levels II-IV). No left
cervical, supraclavicular, axillary or inguinal lymphadenopathy. Mild facial fullness; no plethora, no
distended neck or chest-wall veins, no stridor. Lungs clear. Abdomen soft, no hepatosplenomegaly. Testes
normal without masses. Neuro: alert and oriented, cranial nerves intact, strength 5/5, sensation intact.

ECOG performance status 1: still working, but tires by mid-afternoon and has stopped going to the gym.

Plan today: labs reviewed (LDH, uric acid, serologies); FDG PET-CT; echocardiogram; ENT for excisional
biopsy of a right cervical node (scheduled 2026-09-09). Discussed sleeping with the head of the bed
raised and to call or present to the emergency department for worsening facial swelling, breathlessness,
noisy breathing or trouble swallowing liquids.
"""

[[documents]]
id = "pet"
date = "2026-09-10"
kind = "pet_ct_report"
title = "FDG PET-CT, skull base to mid-thigh"
author = "Synthetic Nuclear Medicine Physician"
text = """
CLINICAL INDICATION: Cervical and anterior mediastinal masses, suspected lymphoma. Initial staging.

TECHNIQUE: 12.4 mCi 18F-FDG IV; uptake time 60 minutes; serum glucose at injection 98 mg/dL.
Low-dose non-contrast CT for attenuation correction and localization. Mediastinal blood pool SUVmax
1.9; liver SUVmax 2.7.

FINDINGS:
Head and neck: physiologic brain uptake (PET is insensitive for intracranial disease). Intensely FDG-avid
right level II-IV cervical lymph nodes, largest 3.9 cm, SUVmax 21.3. Post-biopsy changes in the right
neck. No FDG-avid left cervical or supraclavicular nodes. Waldeyer ring without focal uptake.
Chest: anterior mediastinal mass, 12.0 cm in greatest dimension, SUVmax 27.8, with a few photopenic
(likely necrotic) foci; extrinsic compression of the SVC as on the diagnostic CT. No FDG-avid hilar,
axillary or internal mammary nodes. No pulmonary nodules. No pleural or pericardial effusion and no
abnormal pleural, pericardial or chest-wall uptake.
Abdomen and pelvis: no FDG-avid lymph nodes. Liver, spleen (10.5 cm), kidneys and adrenal glands without
focal uptake. No FDG-avid disease below the diaphragm.
Musculoskeletal: no focal osseous or marrow FDG uptake.
Testes: no abnormal uptake.

IMPRESSION:
1. Intensely FDG-avid right cervical lymphadenopathy and a 12.0 cm FDG-avid anterior mediastinal mass,
   consistent with lymphoma.
2. No FDG-avid disease below the diaphragm. No FDG-avid extranodal organ, osseous or marrow lesions.
"""

[[documents]]
id = "echo"
date = "2026-09-11"
kind = "echo_report"
title = "Transthoracic echocardiogram"
author = "Synthetic Cardiologist"
text = """
Indication: baseline before possible anthracycline-containing chemotherapy; mediastinal mass.
Left ventricle normal in size with normal wall thickness. LVEF 60% (biplane Simpson's).
No regional wall-motion abnormality. Normal diastolic function. Global longitudinal strain -20%.
Right ventricle normal size and function. Valves without significant stenosis or regurgitation.
No pericardial effusion. Anterior mediastinal soft tissue noted adjacent to the right heart border,
without chamber compression.
"""

[[documents]]
id = "pathology"
date = "2026-09-12"
kind = "pathology_report"
title = "Surgical pathology: excisional biopsy, right cervical lymph node"
author = "Synthetic Hematopathologist"
amended = "2026-09-19"
text = """
SPECIMEN: Right cervical lymph node, level III, excisional biopsy (3.6 x 2.9 x 2.2 cm), collected
2026-09-09. Fresh tissue sent for flow cytometry; blocks A1-A4.

FINAL DIAGNOSIS (2026-09-12): DIFFUSE LARGE B-CELL LYMPHOMA, NOT OTHERWISE SPECIFIED. See addendum.

MICROSCOPIC: Effaced nodal architecture with diffuse sheets of medium-to-large atypical lymphoid cells,
round to irregular nuclei, vesicular chromatin and small nucleoli. Numerous mitoses and apoptotic
bodies with a focal starry-sky pattern; geographic necrosis.

IMMUNOHISTOCHEMISTRY (adequate controls):
  CD20       positive (diffuse, strong)
  PAX5       positive
  CD3        negative in tumor cells (scattered background T cells)
  CD5        negative
  CD10       positive (diffuse)
  BCL6       positive
  MUM1/IRF4  negative (<10% of tumor cells)
  BCL2       positive in approximately 90% of tumor cells (strong)
  MYC        positive in approximately 80% of tumor cells
  Cyclin D1  negative
  CD23       negative
  CD30       negative
  TdT        negative
  Ki-67      approximately 95%
  EBER ISH   negative

FLOW CYTOMETRY: CD19+, CD20+, CD10+ monotypic B cells with lambda light-chain restriction, large forward
scatter. CD5 negative. CD34 negative.

COMMENT: Germinal-center B-cell-like immunophenotype by the Hans algorithm. FISH for MYC, BCL2
and BCL6 rearrangements has been requested on block A2; results will be reported in an addendum.

ADDENDUM (2026-09-19): FISH, interphase, block A2, 200 nuclei scored per probe.
MYC break-apart, IGH::MYC dual-fusion, BCL2 break-apart and BCL6 break-apart probes.
  MYC (8q24):   rearrangement detected (break-apart signal in 78% of nuclei; IGH::MYC fusion
                detected, consistent with t(8;14)(q24;q32))
  BCL2 (18q21): rearrangement detected (break-apart signal in 85% of nuclei; IGH::BCL2 fusion
                detected, consistent with t(14;18)(q32;q21))
  BCL6 (3q27):  no rearrangement detected
These FISH results change the classification of this lymphoma. The final diagnosis is amended per the
FISH findings; the treating hematologist was informed by telephone on 2026-09-19.
"""

