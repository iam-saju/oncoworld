  { field = "regimen", matches = 'g[- ]?csf|filgrastim|growth factor|colony[- ]stimulating factor|neulasta|onpro|udenyca|fulphila|ziextenzo|nyvepria|fylnetra|stimufend|rolvedon|eflapegrastim|zarxio|nivestym|granix' },
] } ]

[[items]]
id = "sup_stop_nsaid"
domain = "supportive_care"
kind = "should"
severity = "important"
points = 3
text = "The response stops ibuprofen/NSAIDs (nephrotoxic with rising creatinine; interacts with methotrexate) and offers alternative analgesia."
any = ["(?:stop|discontinue|hold|avoid|cease)[^.]{0,40}(?:ibuprofen|nsaid)", "(?:ibuprofen|nsaids?)[^.]{0,60}(?:stop|discontinu|hold|avoid)"]
# structured: stopping ibuprofen/NSAIDs is an unconditional medication change in orders_now
decision = [ { field = "orders_now", matches = '(?:stop|discontinu\w*|hold|avoid|cease|d/c|no more)[^;]{0,40}(?:ibuprofen|nsaid|advil|motrin)|(?:ibuprofen|nsaids?|advil|motrin)[^;]{0,60}(?:stop|discontinu|hold|avoid|cease|d/c)' } ]

[[items]]
