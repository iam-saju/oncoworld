[[documents]]
id = "referral"
date = "2026-08-18"
kind = "referral_note"
title = "Primary care referral to hematology-oncology"
author = "Synthetic Primary Care Physician"
text = """
Reason for referral: abnormal CT, suspected lymphoma.

Mr. Sample is a 67-year-old retired electrician with T2DM, HTN, gout and BPH. Six weeks of
epigastric/left upper quadrant pain, early satiety, drenching night sweats most nights, and about 8 kg
unintentional weight loss over two months (79 -> 71 kg). Started OTC ibuprofen for the pain.

CT abdomen/pelvis with IV contrast 2026-08-15 (outside facility): large retroperitoneal and mesenteric
soft-tissue mass encasing the aorta and IVC, a right renal cortical mass, a left adrenal mass and a
small hypodense liver lesion. No hydronephrosis. Impression: lymphoma favored; metastatic carcinoma
less likely.

Please see urgently. Labs from this visit attached by the patient portal.
"""

[[documents]]
id = "consult"
date = "2026-09-02"
kind = "consult_note"
title = "Hematology-oncology new patient consultation"
author = "Synthetic Hematologist-Oncologist"
text = """
HPI: 67M referred for retroperitoneal mass. Symptoms as per referral, worse over the last two weeks;
now spends most of the afternoon resting but walks around the house and manages his own self-care.
Taking ibuprofen 400 mg three to four times a day. No headache, visual change, confusion, focal
weakness, numbness or bladder/bowel change. No testicular swelling. No cough or dyspnea.

PMH: T2DM (2014), HTN (2011), gout (2019, two flares, no urate-lowering therapy), hyperlipidemia,
BPH. No prior cancer, no prior chemotherapy or radiation. No known heart disease.
Medications: see medication list.
Allergies: sulfonamide antibiotics (rash).
Social: retired electrician, lives with his wife; daughter lives nearby. Former smoker, 30 pack-years,
quit 2010. Two drinks per week. Lives 45 minutes' drive from the cancer center; wife drives.
Family history: father with prostate cancer at 78.

Exam: T 37.9 C, HR 96, BP 128/76, RR 16, SpO2 97% RA. Weight 71 kg, height 175 cm (BSA 1.86 m2).
Thin, tired-appearing. No palpable cervical, supraclavicular, axillary or inguinal lymphadenopathy.
Abdomen: fullness and tenderness in the epigastrium and left upper quadrant; liver edge 2 cm below the
costal margin; spleen not palpable. Testes normal without masses. Neuro: alert and oriented, cranial
nerves intact, strength 5/5 throughout, no sensory deficit.

ECOG performance status 2.

Plan today: labs incl. LDH, uric acid, viral serologies; FDG PET-CT; echocardiogram; CT-guided core
biopsy of the retroperitoneal mass; bone marrow biopsy. Return after results.
"""

[[documents]]
id = "pet"
date = "2026-09-05"
kind = "pet_ct_report"
title = "FDG PET-CT, skull base to mid-thigh"
author = "Synthetic Nuclear Medicine Physician"
text = """
CLINICAL INDICATION: Retroperitoneal mass, suspected lymphoma. Initial staging.

TECHNIQUE: 10.2 mCi 18F-FDG IV; uptake time 62 minutes; serum glucose at injection 142 mg/dL.
Low-dose non-contrast CT for attenuation correction and localization. Mediastinal blood pool SUVmax
2.1; liver SUVmax 2.9.

FINDINGS:
Head and neck: physiologic brain uptake (PET is insensitive for intracranial disease). No
FDG-avid cervical or supraclavicular lymph nodes.
Chest: no FDG-avid mediastinal, hilar or axillary nodes. 4 mm right upper lobe pulmonary nodule,
below PET resolution, not FDG-avid. No effusion.
Abdomen and pelvis:
- Conglomerate retroperitoneal (para-aortic and aortocaval) and mesenteric nodal mass,
  9.4 x 6.8 cm, SUVmax 24.1, encasing the aorta and IVC without occlusion.
- Right renal cortical lesion, 3.2 cm, SUVmax 19.6.
- Left adrenal mass, 2.6 cm, SUVmax 17.2.
- Hepatic segment VI lesion, 1.8 cm, SUVmax 15.0.
- Spleen normal in size (11 cm) without focal uptake.
- No hydronephrosis. No ascites.
- No FDG-avid pelvic or inguinal nodes.
Musculoskeletal: no focal osseous or marrow FDG uptake.
Testes: no abnormal uptake.

IMPRESSION:
1. Intensely FDG-avid retroperitoneal and mesenteric nodal mass with FDG-avid lesions in the right
   kidney, left adrenal gland and liver, consistent with lymphoma. Tissue confirmation pending.
2. No FDG-avid disease above the diaphragm.
3. Incidental 4 mm right upper lobe nodule, indeterminate given size.
"""

