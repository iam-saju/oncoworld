# HIDDEN. Journey dlbcl_0003, Layer 3 (second line + NGS). DRAFT_NEEDS_ONCOLOGIST.
version = "dlbcl_0003_journey.L3.v0.1"
review_status = "DRAFT_NEEDS_ONCOLOGIST"
passing_score = 0.75

[[items]]
id = "l3_car_t_second_line"
domain = "second_line"
kind = "must"
severity = "dangerous"
points = 30
text = "The response recommends second-line CD19-directed CAR T-cell therapy (axicabtagene ciloleucel or lisocabtagene maraleucel) because of primary refractory/early relapse within 12 months of first-line therapy, with urgent referral to a CAR-T center."
any = ["car[- ]?t", "axicabtagene", "axi[- ]cel", "lisocabtagene", "liso[- ]cel"]

[[items]]
id = "l3_why_early_relapse"
domain = "second_line"
kind = "must"
severity = "important"
points = 15
text = "The response justifies CAR-T by relapse within 12 months of first-line therapy (ZUMA-7/TRANSFORM superiority over salvage chemotherapy plus autologous transplant)."
any = ["12 months", "twelve months", "zuma[- ]?7", "transform", "early relapse", "primary refractory", "refractory"]

[[items]]
id = "l3_cd19_confirmed"
domain = "second_line"
kind = "should"
severity = "minor"
points = 5
text = "The response notes CD19 expression is confirmed (relevant for CD19-directed CAR-T)."
any = ["cd19"]

[[items]]
id = "l3_no_more_drugs"
domain = "bridging"
kind = "must"
severity = "important"
points = 15
text = "The response advises that adding more drugs does not improve outcome; bridging should be the minimum needed to control disease until CAR-T (e.g. steroids, radiotherapy to the bulky site, or a limited regimen)."
any = ["bridg"]

[[items]]
id = "l3_avoid_bendamustine"
domain = "bridging"
kind = "should"
severity = "important"
points = 10
text = "The response avoids bendamustine (or other T-cell-depleting therapy) before leukapheresis because it impairs T-cell collection."
any = ["bendamustine[^.]{0,80}(?:avoid|not|apheresis|t[- ]cell)", "(?:avoid|not)[^.]{0,40}bendamustine"]

[[items]]
id = "l3_ngs_interpretation"
domain = "molecular"
kind = "must"
severity = "important"
points = 15
text = "The response interprets the NGS correctly: EZH2 Y646F, CREBBP and KMT2D mutations are typical GCB-DLBCL alterations; TP53 is wild-type; nothing here replaces CAR-T as standard second-line therapy."
all = ["ezh2", "crebbp|kmt2d|tp53"]

[[items]]
id = "l3_tazemetostat_context"
domain = "molecular"
kind = "should"
severity = "minor"
points = 10
text = "The response notes tazemetostat is approved for EZH2-mutant follicular lymphoma, not DLBCL, so it is not standard here (consider only in a clinical trial or later line)."
any = ["tazemetostat"]

[[items]]
id = "l3_mn_rice_asct_preferred"
domain = "second_line"
kind = "must_not"
severity = "important"
points = 15
text = "The response recommends salvage chemotherapy (R-ICE/R-DHAP/R-GDP) followed by autologous stem-cell transplant as the preferred second-line strategy."
recommend = ["(?:r[- ]?ice|r[- ]?dhap|r[- ]?gdp|salvage chemo\\w*)[^.]{0,80}(?:autologous|asct|transplant)"]

[[items]]
id = "l3_mn_tazemetostat_instead"
domain = "molecular"
kind = "must_not"
severity = "important"
points = 10
text = "The response recommends tazemetostat (or another NGS-driven targeted drug) in place of CAR-T as the second-line plan."

[[items]]
id = "l3_mn_palliative"
domain = "second_line"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response recommends palliative-only care or hospice for this fit patient at first relapse."
recommend = ["palliative[- ](?:only|intent|care alone)|best supportive care|hospice"]
