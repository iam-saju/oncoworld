# OncoWorld v2 longitudinal journey: patient dlbcl_0003 (Robert Sample) followed through five layers.
# Built by scripts/build_journey_v2.py into ONE Harbor multi-step task in two renderings:
#   harbor_cases/dlbcl_0003_journey_v2_fhir          the benchmark (FHIR: base bundle + one FHIR update bundle per later visit)
#   harbor_cases_narrative/dlbcl_0003_journey_v2     diagnostic control (narrative chart files)
#
# Rules (from docs/oncologist-longitudinal-case-form.pdf):
#  - the model sees one layer at a time, never a future layer (each layer's files arrive via steps/<L>/workdir);
#  - each layer opens with what ACTUALLY happened (written here), not the model's previous answer;
#  - each "if..." is a stated fact, so there is one answer;
#  - each layer is scored on its own; a dangerous error in any layer fails the whole case.
# Layer 1 reuses cases_src/dlbcl_0003 (chart, rubric, gold). Layers 2-5 are DRAFTS: review_status DRAFT_NEEDS_ONCOLOGIST.
# MODEL-VISIBLE: [[layers]].questions, [[layers.documents]] and [layers.fhir]. HIDDEN: Lx_rubric.toml, Lx_gold.json.
#
# Documents: name = NN_YYYY-MM-DD_label.txt (NN orders them inside the layer; the interval history is always first).
#   kind = interval_history | progress_note | admission_note | pet_ct_report | mri_report | csf_report | echo_report
#          | pathology_report | ngs_report
# [layers.fhir] holds the same facts as structured FHIR resources (labs with reference ranges, vitals, ECOG, weight,
# medications, administrations, procedures, genomic variants). Every value here must already be stated in that
# layer's documents: the structured data makes the record realistic, it never adds a clinical fact the notes lack.

[meta]
journey_id = "dlbcl_0003_journey"
base_case = "dlbcl_0003"
title = "DLBCL with kidney/adrenal involvement: the patient journey (diagnosis to goals of care)"
review_status = "DRAFT_NEEDS_ONCOLOGIST"
difficulty = "advanced"
consistency_notes = """
- CNS-IPI 6 at diagnosis (Layer 1) must stay in the Layer 4 differential (CNS relapse) even though baseline CSF was negative.
- Type 2 diabetes (Layer 1) matters for steroid dosing/glucose in Layer 4.
- Renal function recovered after cycle 1 (Layer 2 history), so it no longer limits Layer 3 choices.
- Sulfonamide allergy persists (PJP prophylaxis choice after CAR-T).
"""

[[layers]]
id = "L1"
step = "L1-diagnosis"
weight = 20
date = "2026-09-17"
