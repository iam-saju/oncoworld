#
# Rules (from docs/oncologist-longitudinal-case-form.pdf):
#  - the model sees one layer at a time, never a future layer (each layer's files arrive via steps/<L>/workdir);
#  - each layer opens with what ACTUALLY happened (written here), not the model's previous answer;
#  - each "if..." is a stated fact, so there is one answer;
#  - each layer is scored on its own; a dangerous error in any layer fails the whole case.
# Layer 1 reuses cases_src/dlbcl_0003 (chart, rubric, gold). Layers 2-5 are DRAFTS: review_status DRAFT_NEEDS_ONCOLOGIST.
# MODEL-VISIBLE: [[layers]].questions and [[layers.documents]]. HIDDEN: Lx_rubric.toml, Lx_gold.json.

