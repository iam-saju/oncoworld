# HIDDEN. OncoWorld v2 rubric for dlbcl_0005. Copied to tests/rubric_v2.toml; never visible to the model.
# Drafted by engineering from current practice (NCCN B-cell lymphomas; FLYER (Poeschel, Lancet 2019);
# SWOG S1001; POLARIX eligibility; Lugano 2014; CDC/WHO medical eligibility criteria for contraceptive use).
# Every item is PENDING_ONCOLOGIST until signed off in harbor_cases/<task>/review/signoff.md.
#
# Graded by the regex rules on each item (grader of record); `text` states the criterion in clinical terms.
# All regexes run on the lower-cased answer.
#
# Weighting note: the two "real-world" items (pregnancy test, stopping the estrogen-containing pill) together with
# the reason item carry 26 points, so an otherwise perfect answer that misses all three scores 0.74 and fails
# without being flagged dangerous. The 6-cycle overtreatment deduction (16) is sized so that a 6-cycle preferred plan
# that is otherwise perfect also fails, even if it still names the alternatives (100 - 10 FLYER - 16 = 74).
#
# Structured decisions: items with a `decision` list are decided by the answer's "decisions" object when it carries
# the fields each condition needs (grader_v2.eval_decision); otherwise the prose rules decide exactly as before.
# Shared fragments used below (kept identical across items):
#   R-CHOP-based regimen  r[- ]?(?:mini[- ]?)?cho?p|rituximab[^;]{0,60}\b(?:chop|chp|cyclophosphamide)\b|\b(?:chop|chp)\b[^;]{0,80}rituximab
#   FLY4 (4 R-CHOP + 2 R) the regimen string itself spells out 4 x R-CHOP followed (then/+/plus/and) by 2 rituximab-only
#                         doses ("R-CHOP x4 then rituximab x2", "4 cycles of R-CHOP followed by 2 doses of rituximab");
#                         the bare word "flyer" is not evidence, and "then R-CHOP x2" is not rituximab-only
#   six-cycle wording     "6 cycles", "x6", "six courses", "then R-CHOP": decides when cycles is missing or not a number
#   withheld / deferred   omitted, withheld, deferred, postponed, "until", "at progression", "no CHOP": not an order
#   rejected option       "Pola-R-CHP not indicated", "no DA-EPOCH-R", "rather than Pola": a note, not the regimen
#   no unconditional RT   starts with none/no/not/omitted, or the RT entry itself starts with its condition
#                         ("ISRT only if Deauville 4-5", "PET-adapted: ISRT 36 Gy if ...", "reserved for ...");
#                         a condition attached only to a boost ("ISRT 30 Gy, boost if Deauville 4") is not conditional RT
# Dangerous must_not items (mn_overstaged, mn_calls_double_hit) deliberately carry no decision: a structured value
# overrides the prose verdict, so an unparseable or contradicting decisions field ("4", "Advanced", "DLBCL, GCB")
# would erase a dangerous error the prose shows. Restore them once the grader takes structured OR prose for must_not.

version = "dlbcl_0005.v2.0"
review_status = "PENDING_ONCOLOGIST"
passing_score = 0.75

[leak_check]
# Strings that would give the answer away if they appeared anywhere in the model-visible chart.
# (The chart deliberately states "migraine with aura" and "combined oral contraceptive": those are the facts.)
forbidden_in_case = ["stage i", "stage ia", "stage iii", "stage iv", "ipi", "cns-ipi", "flyer", "r-chop", "rchop",
                     "pola-r-chp", "polatuzumab", "isrt", "involved-site", "lugano", "deauville", "bulky",
                     "double-expressor", "double expressor", "double-hit", "double hit", "prophylaxis",
                     "contraindicated", "contraindication", "pregnancy test", "hcg", "thromboembolism", "stroke",
                     "intrauterine", "iud", "fertility preservation", "methotrexate"]

# ---------------- diagnosis
[[items]]
id = "dx_dlbcl_gcb"
domain = "diagnosis"
kind = "must"
severity = "important"
points = 5
text = "The response states the diagnosis is diffuse large B-cell lymphoma (NOS) with a germinal-center B-cell (GCB) phenotype by the Hans algorithm."
all = ["dlbcl|diffuse large b[- ]cell", "\\bgcb\\b|germinal[- ]cent(?:er|re)"]

# ---------------- staging
[[items]]
id = "stage_i"
domain = "staging"
kind = "must"
severity = "important"
points = 7
text = "The response stages the disease as Lugano/Ann Arbor stage I (stage IA acceptable): a single nodal region (right cervical levels II-III)."
any = ["\\bstage\\s*(?:i|1)a?\\b(?!\\s*(?:-|/|to|or)\\s*(?:ii|iv|2|4)\\b)"]
decision = [{ field = "stage", in = ["I"] }]

[[items]]
id = "stage_nonbulky_no_b"
domain = "staging"
kind = "should"
severity = "minor"
points = 2
text = "The response notes the disease is non-bulky (largest node 3.1 cm, below 7.5 cm) and that there are no B symptoms."
all = ["non[- ]?bulky|not bulky|no bulk|<\\s*7\\.5", "(?:no|without|absence of|denies)\\s+b[- ]symptoms|stage\\s*(?:i|1)a\\b|no (?:fevers?|night sweats|weight loss)"]

[[items]]
id = "stage_pet_no_marrow_biopsy"
domain = "staging"
kind = "should"
severity = "minor"
points = 2
text = "The response notes that bone marrow biopsy is unnecessary because PET-CT shows no marrow uptake."
any = ["marrow (?:biopsy|aspirat\\w*|examination)[^.]{0,80}(?:not (?:needed|required|necessary|indicated)|unnecessary|omitted|can be skipped)",
       "(?:pet|fdg)[^.]{0,80}(?:obviat|replac)\\w*[^.]{0,40}marrow"]

[[items]]
id = "mn_overstaged"
domain = "staging"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response overstages the disease as stage III or IV / advanced stage."
# suffixes (IIIA, IV-B, 3S) count; definitions ("stage III means ...") and population statements
# ("standard for advanced-stage disease", "in stage IV patients") do not assert this patient's stage
affirm = ['(?<!\bfor )(?<!\bin )(?:\bstage\s*(?:iii|iv|[34])(?:[- ]?[abesx]{1,2})?\b|advanced[- ]stage)(?!\s+(?:means|denotes|refers|implies|indicates|is defined|requires|would|applies|describes)\b)']

# ---------------- molecular classification
[[items]]
id = "mol_not_de_not_dh"
domain = "molecular_classification"
kind = "must"
severity = "important"
points = 5
text = "The response states the lymphoma is neither double-expressor (MYC 15%, BCL2 30% below thresholds) nor double-hit (FISH negative for MYC, BCL2 and BCL6 rearrangements)."
check = "denies_double_hit"
any = ["not\\s+(?:a\\s+)?double[- ]expressor|neither[^.]{0,40}double[- ]expressor|below[^.]{0,60}threshold|does not meet[^.]{0,60}(?:double[- ]expressor|threshold)|not[^.]{0,30}\\bdel\\b"]

[[items]]
id = "mn_calls_double_hit"
domain = "molecular_classification"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response classifies this lymphoma as double-hit / high-grade B-cell lymphoma with MYC and BCL2 rearrangements."
check = "affirms_double_hit"
# also required: the term is not the object of a test ("FISH sent to evaluate for double-hit status")
affirm = ['(?<!evaluate for )(?<!evaluation for )(?<!evaluating for )(?<!assess for )(?<!assessing for )(?<!test for )(?<!testing for )(?<!screen for )(?<!screening for )(?<!look for )(?<!to exclude )(?<!rule out )(?:double[-_ ]hit|triple[-_ ]hit|hgbl[- ]?(?:dh|th)\b|hgbl[- ]?myc/bcl2|myc and bcl2 rearrangements|myc/bcl2[- ]rearranged|\(dh\)|\bdh\b(?= lymphoma| biology| disease|\s*\())(?!\s+(?:status|testing|work-?up|evaluation|assessment|fish|panel|probes?)\b(?!\s*[:=-]?\s*(?:positive|present|confirmed|yes)\b))']
# no structured decision (see header): prose decides. For a must_not = structured OR prose grader, the decision would be
# diagnosis matches 'double[- ]hit|triple[- ]hit|\b(?:dhl|thl)\b|\bhgb?c?l[- ]?(?:dh|th|myc)|high[- ]grade b[- ]cell lymphoma
# with myc|myc[^,;]{0,20}bcl-?2[^,;]{0,20}rearrang|myc/bcl-?2[- ]rearrang' with a negation guard limited to that target

[[items]]
id = "mn_calls_double_expressor"
domain = "molecular_classification"
kind = "must_not"
severity = "important"
points = 5
text = "The response classifies this lymphoma as double-expressor."
check = "affirms_double_expressor"
# also required: not "short of double-expressor thresholds", not a test request, and not a generic prognostic
# statement about the entity ("double-expressor DLBCL has inferior outcomes") unless tied to this patient
affirm = ['(?:(?<=her )|(?<=his )|(?<=this )|(?<=its ))(?:double[-_ ]expressor|\bdel\b)|(?<!short of )(?<!short of the )(?<!shy of )(?<!evaluate for )(?<!assess for )(?<!test for )(?:double[-_ ]expressor|\bdel\b)(?!\s+(?:status|testing)\b(?!\s*[:=-]?\s*(?:positive|present|confirmed|yes)\b))(?!(?:[- ](?:dlbcl|lymphomas?|disease|cases|tumou?rs|phenotype|biology))?\s+(?:has|have|carries|carry|confers?|portends?|predicts?|is associated|are associated)\s+(?:with\s+)?(?:an?\s+)?(?:inferior|worse|poorer|poor|adverse|higher|lower|shorter|increased)\b)']

# ---------------- prognosis
[[items]]
id = "prog_ipi_low"
domain = "prognosis"
kind = "must"
severity = "important"
points = 6
text = "The response calculates IPI as 0 (low risk): age <=60, normal LDH, ECOG 0, stage I, no extranodal sites."
any = ["\\bipi\\b[^.]{0,40}(?:\\b0\\b|zero|low)", "low[- ]risk\\s+(?:by\\s+)?(?:the\\s+)?ipi"]

[[items]]
id = "prog_cns_ipi_low"
domain = "prognosis"
kind = "should"
severity = "minor"
points = 2
text = "The response calculates CNS-IPI as 0 / low risk."
any = ["cns[- ]ipi[^.]{0,40}(?:\\b0\\b|zero|low)", "low[^.]{0,20}cns[- ]ipi"]

# ---------------- first-line treatment
[[items]]
id = "tx_curative_rchop"
domain = "first_line_treatment"
kind = "must"
severity = "dangerous"
points = 6
text = "The response recommends curative-intent rituximab-containing immunochemotherapy (R-CHOP-based) for this patient."
all = ["r[- ]?chop|rituximab[- ]?chop|rituximab[^.;]{0,20}\\bchop\\b|\\bchop\\b[^.;]{0,20}rituximab", "curative|\\bcure"]
# structured: intent curative and an R-CHOP-based regimen on the order (Pola-R-CHP counted as R-CHOP-based; see review note),
# not written as withheld or deferred ("rituximab weekly (CHOP omitted)", "R-CHOP deferred until progression")
decision = [{ field = 'intent', matches = '^\s*curative' },
            { field = 'regimen', matches = 'r[- ]?(?:mini[- ]?)?cho?p|rituximab[^;]{0,60}\b(?:chop|chp|cyclophosphamide)\b|\b(?:chop|chp)\b[^;]{0,80}rituximab', not_matches = '\b(?:omit|withh|defer|postpon)\w*|\buntil\b|at (?:progression|relapse)|(?:\bno|\bnot|without)\s+(?:r[- ]?)?cho?p|\bchop\b[^;]{0,10}(?:omitted|withheld|deferred|not given)' }]

[[items]]
id = "tx_flyer_4rchop_2r"
domain = "first_line_treatment"
kind = "must"
severity = "important"
points = 10
text = "The response recommends, as the preferred plan, 4 cycles of R-CHOP followed by 2 additional doses of rituximab without radiotherapy (FLYER regimen; age 18-60, IPI 0, non-bulky <7.5 cm). A 4-cycle PET-adapted R-CHOP approach is also accepted."
all = ["r[- ]?chop",
       "flyer|(?:\\b4|four)\\s*(?:cycles?\\s*(?:of\\s*)?|x\\s*|×\\s*)?r[- ]?chop|r[- ]?chop\\s*(?:x|×|for)\\s*(?:4|four)\\b|r[- ]?chop[^.]{0,20}\\b(?:4|four) cycles"]
# structured: R-CHOP (not Pola-R-CHP unless it is named only as a rejected option; not a 6-cycle order; not withheld or
# deferred), 4 cycles (cycles = 6 accepted only when the regimen string spells out FLY4, i.e. 4 R-CHOP + 2 R counted
# together; a missing cycles field counts as not met), and no unconditional radiotherapy (PET-adapted RT is
# conditional, so the S1001 approach passes)
decision = [{ field = 'regimen', matches = 'r[- ]?chop|rituximab[^;]{0,60}\bchop\b|\bchop\b[^;]{0,80}rituximab', not_matches = '(?:\b6|six)\s*(?:cycles?\s*(?:of\s*)?|x\s*|×\s*)?(?:r[- ]?chop|pola)|(?:r[- ]?chop|r[- ]?chp)(?:[- ]?(?:14|21))?\s*(?:x|×|for)\s*(?:6|six)\b|\b(?:omit|withh|defer|postpon)\w*|\buntil\b|at (?:progression|relapse)|(?:\bno|\bnot|without)\s+(?:r[- ]?)?cho?p|\bchop\b[^;]{0,10}(?:omitted|withheld|deferred|not given)' },
            { not = { field = 'regimen', matches = 'pola|polivy', not_matches = '(?:pola|polivy)[^;(),]{0,25}\b(?:not (?:indicated|recommended|chosen|selected|needed|required)|reserved|rejected|declined)\b|(?:\bno|\bnot|without|rather than|instead of|vs\.?|versus|over)\s+(?:pola|polivy)' } },
            { any = [{ field = 'regimen', matches = '(?:r[- ]?chop|rituximab[^;]{0,40}\bchop\b)[^;]{0,30}?(?<!\d)(?:4|four)\b[^;]{0,40}?(?:then|followed by|\+|plus|and)\s*(?:(?:rituximab|\br\b)(?![- ]?cho)[^;]{0,25}?(?<![\d/m])(?:2|two)\b|(?<![\d/m])(?:2|two)\s*(?:x\s*|×\s*)?(?:(?:additional|more|further)\s+)?(?:(?:doses?|cycles?|courses?)\s+(?:of\s+)?)?(?:rituximab|\br\b)(?![- ]?cho))|(?<!\d)(?:4|four)\s*(?:cycles?\s*(?:of\s*)?|x\s*|×\s*)?r[- ]?chop[^;]{0,40}?(?:then|followed by|\+|plus|and)\s*(?:(?:rituximab|\br\b)(?![- ]?cho)[^;]{0,25}?(?<![\d/m])(?:2|two)\b|(?<![\d/m])(?:2|two)\s*(?:x\s*|×\s*)?(?:(?:additional|more|further)\s+)?(?:(?:doses?|cycles?|courses?)\s+(?:of\s+)?)?(?:rituximab|\br\b)(?![- ]?cho))' }, { field = 'regimen', not_matches = '(?:\b6|six)\s*(?:(?:cycles?|courses?)\b|x\s*r|×)|(?:x|×|for)\s*(?:6|six)\b|\b(?:then|plus|\+)\s*r[- ]?chop' }] },
            { any = [{ field = 'cycles', equals = 4, absent_is_false = true }, { all = [{ field = 'cycles', equals = 6, absent_is_false = true }, { field = 'regimen', matches = '(?:r[- ]?chop|rituximab[^;]{0,40}\bchop\b)[^;]{0,30}?(?<!\d)(?:4|four)\b[^;]{0,40}?(?:then|followed by|\+|plus|and)\s*(?:(?:rituximab|\br\b)(?![- ]?cho)[^;]{0,25}?(?<![\d/m])(?:2|two)\b|(?<![\d/m])(?:2|two)\s*(?:x\s*|×\s*)?(?:(?:additional|more|further)\s+)?(?:(?:doses?|cycles?|courses?)\s+(?:of\s+)?)?(?:rituximab|\br\b)(?![- ]?cho))|(?<!\d)(?:4|four)\s*(?:cycles?\s*(?:of\s*)?|x\s*|×\s*)?r[- ]?chop[^;]{0,40}?(?:then|followed by|\+|plus|and)\s*(?:(?:rituximab|\br\b)(?![- ]?cho)[^;]{0,25}?(?<![\d/m])(?:2|two)\b|(?<![\d/m])(?:2|two)\s*(?:x\s*|×\s*)?(?:(?:additional|more|further)\s+)?(?:(?:doses?|cycles?|courses?)\s+(?:of\s+)?)?(?:rituximab|\br\b)(?![- ]?cho))' }] }] },
            { field = 'radiotherapy', matches = '^\s*(?:none|no\b|not\b|n/?a\b|nil\b|omit)|^\s*(?:conditional|(?:pet|response)[- ](?:adapted|guided|directed))?[:;,]?\s*(?:consolidat\w*\s+)?(?:isrt|rt|radiotherapy|radiation|involved[- ]site (?:radiotherapy|rt))?\s*(?:\d+(?:\.\d+)?\s*gy\s*)?(?:only\s+)?(?:if|unless|when|reserved for)\b|^\s*(?:pet|response)[- ](?:adapted|guided|directed)\b' }]

[[items]]
id = "tx_no_rt_goals"
domain = "first_line_treatment"
kind = "should"
severity = "important"
points = 4
text = "The response notes that the chosen plan omits neck radiotherapy, which aligns with her wish to avoid radiation (thyroid and salivary late effects, sister's radiation-induced hypothyroidism)."
all = ["radiation|radiotherapy|\\brt\\b|isrt", "thyroid|saliv|xerostomia|dry mouth|sister|preference|wish"]
any = ["(?:avoid|omit|without|spar|no)\\w*[^.]{0,40}(?:radiation|radiotherapy|\\brt\\b|isrt)",
       "(?:radiation|radiotherapy|\\brt\\b|isrt)[^.]{0,40}(?:avoid|omit|not (?:needed|required|necessary)|unnecessary)"]

[[items]]
id = "tx_alternatives"
domain = "first_line_treatment"
kind = "should"
severity = "minor"
points = 2
text = "The response names R-CHOP x3 followed by involved-site radiotherapy, or a PET-adapted 4-cycle approach (S1001), as an acceptable alternative."
any = ["(?:\\b3|three)\\s*(?:cycles?\\s*(?:of\\s*)?|x\\s*)?r[- ]?chop|r[- ]?chop\\s*(?:x|×)\\s*3\\b|\\bisrt\\b|involved[- ]site",
       "pet[- ]adapted|s1001"]

[[items]]
id = "mn_six_cycles"
domain = "first_line_treatment"
kind = "must_not"
severity = "important"
points = 16
text = "The response recommends 6 cycles of R-CHOP (or of Pola-R-CHP) as the preferred plan for this IPI-0, non-bulky stage I disease (overtreatment)."
# "cycles" or "courses"; R-CHOP-21 / "every 21 days" between regimen and count; a comparator arm
# ("non-inferior to 6 cycles of R-CHOP", "versus six cycles") is evidence, not the plan
recommend = ['(?<!\bas )(?<!\bthan )(?<!inferior to )(?<!superior to )(?<!equivalent to )(?<!similar to )(?<!compared with )(?<!compared to )(?<!versus )(?<!vs )(?<!vs\. )(?:\b(?:6|six)\s*(?:(?:cycles?|courses?)\s*(?:of\s*)?|x\s*|×\s*)?(?:r[- ]?chop|pola)|(?:r[- ]?chop|pola[- ]?r[- ]?chp)(?:[- ]?(?:14|21))?(?:\s+(?:every|q)\s*(?:14|21)\s*(?:days|d))?\s*(?:x|×|for)\s*(?:6|six)\b)']
# structured: an R-CHOP-based or Pola-R-CHP order with cycles >= 6 (or "6 cycles" as text, or six-cycle wording in the
# regimen when cycles is missing), unless the regimen string spells out FLY4 (4 R-CHOP + 2 R) and no six-cycle R-CHOP order
decision = [{ field = 'regimen', matches = 'r[- ]?(?:mini[- ]?)?cho?p|rituximab[^;]{0,60}\b(?:chop|chp|cyclophosphamide)\b|\b(?:chop|chp)\b[^;]{0,80}rituximab|pola|polivy' },
            { any = [{ field = 'regimen', not_matches = '(?:r[- ]?chop|rituximab[^;]{0,40}\bchop\b)[^;]{0,30}?(?<!\d)(?:4|four)\b[^;]{0,40}?(?:then|followed by|\+|plus|and)\s*(?:(?:rituximab|\br\b)(?![- ]?cho)[^;]{0,25}?(?<![\d/m])(?:2|two)\b|(?<![\d/m])(?:2|two)\s*(?:x\s*|×\s*)?(?:(?:additional|more|further)\s+)?(?:(?:doses?|cycles?|courses?)\s+(?:of\s+)?)?(?:rituximab|\br\b)(?![- ]?cho))|(?<!\d)(?:4|four)\s*(?:cycles?\s*(?:of\s*)?|x\s*|×\s*)?r[- ]?chop[^;]{0,40}?(?:then|followed by|\+|plus|and)\s*(?:(?:rituximab|\br\b)(?![- ]?cho)[^;]{0,25}?(?<![\d/m])(?:2|two)\b|(?<![\d/m])(?:2|two)\s*(?:x\s*|×\s*)?(?:(?:additional|more|further)\s+)?(?:(?:doses?|cycles?|courses?)\s+(?:of\s+)?)?(?:rituximab|\br\b)(?![- ]?cho))' }, { field = 'regimen', matches = '(?:\b6|six)\s*(?:cycles?\s*(?:of\s*)?|x\s*|×\s*)?(?:r[- ]?chop|pola)|(?:r[- ]?chop|r[- ]?chp)(?:[- ]?(?:14|21))?\s*(?:x|×|for)\s*(?:6|six)\b' }] },
            { any = [{ field = 'cycles', min = 6 }, { field = 'cycles', matches = '^\s*(?:[6-9]|1\d|six|seven|eight)\b' }, { field = 'regimen', matches = '(?:\b6|six)\s*(?:(?:cycles?|courses?)\b|x\s*r|×)|(?:x|×|for)\s*(?:6|six)\b|\b(?:then|plus|\+)\s*r[- ]?chop' }] }]

[[items]]
id = "mn_pola_preferred"
domain = "first_line_treatment"
kind = "must_not"
severity = "important"
points = 8
text = "The response recommends Pola-R-CHP as the preferred regimen (POLARIX enrolled IPI 2-5 only; not indicated at IPI 0)."
# indication ("is reserved for higher-risk disease") and rejected-option statements are not the plan
recommend = ['(?:pola[- ]?r[- ]?chp|polatuzumab)(?![^.;]{0,50}\b(?:is|are|be|remains?)\s+(?:reserved|kept|limited|restricted)\b)(?![^.;]{0,50}\b(?:rejected|dismissed|decided against|not chosen|not selected)\b)']
decision = [{ field = 'regimen', matches = 'pola|polivy', not_matches = '(?:pola|polivy)[^;(),]{0,25}\b(?:not (?:indicated|recommended|chosen|selected|needed|required)|reserved|rejected|declined)\b|(?:\bno|\bnot|without|rather than|instead of|vs\.?|versus|over)\s+(?:pola|polivy)' }]

[[items]]
id = "mn_da_epoch"
domain = "first_line_treatment"
kind = "must_not"
severity = "important"
points = 5
text = "The response recommends DA-EPOCH-R or another intensified regimen for this patient."
# DA-EPOCH-R or another intensified regimen (R-CHOEP, R-hyper-CVAD, R-CODOX-M/IVAC, R-ACVBP); not when reserved
# for another entity or listed as considered-and-rejected
recommend = ['(?<!reserve )(?<!reserved )(?<!reserving )(?:(?:da|dose[- ]adjusted)[- ]?(?:r[- ]?)?epoch|\br[- ]?choep|(?:\br[- ]?)?\bhyper[- ]?cvad|(?:\br[- ]?)?\bcodox|(?:\br[- ]?)?\bacvbp)(?![^.;]{0,50}\b(?:is|are|be|remains?)\s+(?:reserved|kept|limited|restricted)\b)(?![^.;]{0,50}\b(?:rejected|dismissed|decided against|not chosen|not selected)\b)']
decision = [{ field = 'regimen', matches = 'epoch|choep|hyper[- ]?cvad|codox|acvbp|\bivac\b', not_matches = '(?:epoch|choep|hyper[- ]?cvad|codox|acvbp|ivac)[^;(),]{0,25}\b(?:not (?:indicated|recommended|chosen|selected|needed|required)|reserved|rejected|declined)\b|(?:\bno|\bnot|without|rather than|instead of|vs\.?|versus|over)\s+(?:(?:da|dose[- ]adjusted)[- ]?)?(?:r[- ]?)?(?:epoch|choep|hyper|codox|acvbp)' }]

[[items]]
id = "mn_observation_or_rt_alone"
domain = "first_line_treatment"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response recommends observation / no systemic treatment, or radiotherapy alone, as the plan."
# "RT alone" / "ISRT only" (not "only if/for/after"), holding off systemic therapy; not "RT alone is inadequate"
recommend = ['observation|watch(?:ful)?[- ](?:and[- ])?wait|(?:radiation|radiotherapy|isrt|\brt\b)(?: therapy)? (?:alone|only\b(?!\s+(?:if|for|when|after|in|as|to)\b))(?!\s+(?:is|are|was|would be|remains)\s+(?:inadequate|insufficient|inferior|suboptimal|not)\b)|surveillance alone|no systemic (?:therapy|treatment)|hold(?:ing)? off (?:on )?(?:systemic|chemo)']
# structured: intent = observation, or no systemic regimen ordered (regimen "none"; covers radiotherapy alone)
decision = [{ field = "regimen", not_matches = '(?!)' },
            { any = [{ field = "intent", in = ["observation"] }, { field = "regimen", matches = '^\s*(?:none|no\b|n/?a\b|nil\b|observation|watch|surveillance|radiotherapy|isrt|\brt\b)' }] }]

# ---------------- CNS
[[items]]
id = "cns_low_no_prophylaxis"
domain = "cns_management"
kind = "should"
severity = "important"
points = 4
text = "The response judges CNS-relapse risk as low and states that CNS prophylaxis and CNS staging (MRI brain / lumbar puncture) are not indicated."
all = ["cns|central nervous", "\\blow\\b"]
any = ["prophyla\\w*[^.]{0,40}(?:not|unnecessary)", "(?:no|not|without)[^.]{0,40}prophyla"]

[[items]]
id = "mn_mandates_cns_prophylaxis"
domain = "cns_management"
kind = "must_not"
severity = "important"
points = 4
text = "The response recommends CNS prophylaxis (intrathecal chemotherapy or high-dose methotrexate) for this patient."
recommend = ["(?:cns|intrathecal|methotrexate|hd[- ]?mtx)[^.]{0,30}prophyla\\w*|intrathecal|hd[- ]?mtx|high[- ]dose methotrexate|\\bi\\.?t\\.?\\s+(?:mtx|methotrexate|cytarabine|ara-?c)\\b"]
# no structured decision: orders_now covers only orders before/with cycle 1, so prophylaxis planned later can never
# appear there, and a structured "not met" would override the per-sentence prose rule, which is the stronger detector

# ---------------- response assessment
[[items]]
id = "resp_eot_pet_lugano"
domain = "response_assessment"
kind = "must"
severity = "important"
points = 6
text = "The response plans an end-of-treatment FDG PET-CT read with Lugano criteria / Deauville 5-point scale."
all = ["pet", "deauville|lugano", "end[- ]of[- ](?:treatment|therapy)|after (?:completion|completing)|completion of|\\beot\\b|post[- ]treatment|final pet"]

[[items]]
id = "resp_interim_pet"
domain = "response_assessment"
kind = "should"
severity = "minor"
points = 2
text = "The response plans an interim PET-CT after cycle 4 (before the rituximab-only doses) and says a positive scan (Deauville 4-5) would prompt additional therapy (e.g. RT or biopsy) rather than proceeding as planned."
any = ["interim[^.]{0,80}pet|pet[^.]{0,40}(?:after|following) (?:cycle|c)\\s*(?:4|four)|after (?:4|four) cycles[^.]{0,60}pet"]

# ---------------- pretreatment workup
[[items]]
id = "work_pregnancy_test"
domain = "pretreatment_workup"
kind = "must"
severity = "important"
points = 10
text = "The response requires a pregnancy test (serum or urine hCG) before starting chemotherapy, noting that none is documented in this premenopausal woman."
any = ["pregnan\\w*\\s*test", "\\bhcg\\b", "beta[- ]?hcg"]
# structured: the pregnancy test is an unconditional order now / before cycle 1 (not only "if" something, not "not
# needed", "waived" or "declined"); with a decisions block, a missing orders_now counts as not met
decision = [{ field = 'orders_now', matches = '^(?!\s*(?:no|not|omit|defer|skip|if)\b)(?!.*\b(?:not (?:needed|required|indicated|necessary)|unnecessary|waive\w*|declin\w*|only if|if (?:her |the )?(?:period|menses|lmp)|if (?:late|missed|sexually|symptom)|defer\w*|postpon\w*|\bpending\b|\blater\b|after (?:cycle|c\s*\d|chemo\w*|treatment|therapy|completion)))(?=.*(?:pregnan\w*\s*(?:test|screen)|hcg|\bupt\b|urine preg))', absent_is_false = true }]

[[items]]
id = "work_hbv_reviewed"
domain = "pretreatment_workup"
kind = "should"
severity = "minor"
points = 2
text = "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) so no antiviral prophylaxis is needed before rituximab."
any = ["hbsag|hepatitis b|anti[- ]hbc|\\bhbv\\b"]

[[items]]
id = "work_echo_reviewed"
domain = "pretreatment_workup"
kind = "should"
severity = "minor"
points = 1
text = "The response notes the baseline LVEF of 63% permits anthracycline."
any = ["lvef|ejection fraction|echo"]

# ---------------- supportive care
[[items]]
id = "sup_stop_coc_switch"
domain = "supportive_care"
kind = "must"
severity = "important"
points = 12
text = "The response stops the combined estrogen-containing oral contraceptive and switches to effective non-estrogen contraception (e.g. copper or levonorgestrel IUD, implant, progestin-only method) for the duration of treatment."
all = ["(?:stop|discontinu\\w*|switch\\w*|cease|change|replac\\w*)[^.]{0,80}(?:oral contracepti\\w*|\\bocp\\b|\\bcoc\\b|combined (?:hormonal|pill)|estrogen|ethinyl|the pill)|(?:oral contracepti\\w*|\\bocp\\b|\\bcoc\\b|estrogen|ethinyl|combined pill)[^.]{0,80}(?:stop|discontinu|switch|contraindicat)",
       "\\biud\\b|intrauterine|progestin[- ]only|progestogen[- ]only|non[- ]?estrogen|estrogen[- ]free|copper|implant|etonogestrel|depot|condom|barrier"]
# structured: orders_now both stops the estrogen-containing pill (not "continue", "do not stop", "not contraindicated",
# or "stop after chemotherapy") and starts/arranges a non-estrogen method (not "no IUD", not deferred until after
# treatment, not condoms only for STI protection); with a decisions block, a missing orders_now counts as not met
decision = [{ field = 'orders_now', matches = '^(?!.*(?:\b(?:continu(?:e|ed|es|ing)|keep\w*|remain\w* on|stay\w* on)\b[^;.]{0,30}(?:pill|oral contracepti|\bocp\b|\bcoc\b|combined (?:hormonal|oral|pill|contracepti)|(?<!non)(?<!non[- ])estrogen(?![- ]free)|estradiol|ethinyl|the pill|contraceptive pill|birth control|\bchc\b)|(?:oral contracepti|\bocp\b|\bcoc\b|combined (?:hormonal|oral|pill|contracepti)|(?<!non)(?<!non[- ])estrogen(?![- ]free)|estradiol|ethinyl|the pill|contraceptive pill|birth control|\bchc\b)[^;.]{0,30}\b(?:can|may|should|to) (?:be )?(?:continu|kept|keep)|(?:oral contracepti|\bocp\b|\bcoc\b|combined (?:hormonal|oral|pill|contracepti)|(?<!non)(?<!non[- ])estrogen(?![- ]free)|estradiol|ethinyl|the pill|contraceptive pill|birth control|\bchc\b)\s*[:,-]?\s*continue\b|\b(?:do not|don.t|no need to|not|never)\s+(?:\w+\s+)?(?:stop|discontinu|cease|switch|change)|not contraindicated|no contraindication|(?:stop|discontinu\w*|switch\w*|cease)\b[^;.]{0,40}\b(?:after|once|following|at the end of)\s+(?:chemo\w*|treatment|therapy|completion|the last|remission)|\b(?:sometime|eventually|at some point)\b|\bpending\b|\bif (?:she )?(?:develops|has|gets)\b))(?=.*(?:(?:stop|discontinu|cease|hold|d/c\b|switch|chang|replac)[^\n]*(?:oral contracepti|\bocp\b|\bcoc\b|combined (?:hormonal|oral|pill|contracepti)|estrogen|estradiol|ethinyl|the pill|contraceptive pill|birth control|\bchc\b)|(?:oral contracepti|\bocp\b|\bcoc\b|combined (?:hormonal|oral|pill|contracepti)|estrogen|estradiol|ethinyl|the pill|contraceptive pill|birth control|\bchc\b|combined pill)[^\n]*(?:stop|discontinu|cease|contraindicat)))', absent_is_false = true },
            { field = 'orders_now', matches = '^(?!.*(?:\b(?:no|not|without)\s+(?:\w+\s+)?(?:iud|ius|implant|intrauterine|condoms?)\b|(?:iud|ius|implant|condoms?)[^;.]{0,20}\bnot (?:needed|required|necessary|indicated)|(?:after|once|following|at the end of)\s+(?:chemo\w*|treatment|therapy|completion)[^;.]{0,40}(?:switch|iud|ius|implant|progestin|start|plac|insert)|(?:switch\w*|start\w*|plac\w*|insert\w*)\b[^;.]{0,50}\b(?:after|once|following)\s+(?:chemo\w*|treatment|therapy|completion)|for (?:sti|std)s?\b|\b(?:sometime|eventually|at some point)\b|\bpending\b|\bif (?:she )?(?:develops|has|gets)\b))(?=.*(?:\biud\b|\bius\b|lng[- ]?ius|intrauterine|progestin[- ]only|progestogen[- ]only|\bpop\b|norethindrone|drospirenone|desogestrel|non[- ]?estrogen|estrogen[- ]free|copper|implant|etonogestrel|nexplanon|depo|medroxyprogesterone|mirena|kyleena|liletta|skyla|jaydess|paragard|condom|barrier))', absent_is_false = true }]

[[items]]
id = "sup_coc_reason"
domain = "supportive_care"
kind = "should"
severity = "important"
points = 4
text = "The response gives the reason: estrogen-containing contraception is contraindicated in migraine with aura (ischemic stroke risk) and adds venous thromboembolism risk during chemotherapy/active cancer."
all = ["aura|migraine", "stroke|\\bvte\\b|thrombo|clot"]

[[items]]
id = "sup_fertility_counselling"
domain = "supportive_care"
kind = "should"
severity = "minor"
points = 3
text = "The response offers fertility / ovarian-function counselling (abbreviated R-CHOP has low gonadotoxicity; referral to reproductive medicine offered since she is undecided about further pregnancy)."
any = ["fertilit\\w*", "ovarian (?:function|reserve|suppression)|oocyte|egg (?:freez|bank)|reproductive (?:endocrin|medicine)"]

# ---------------- fitness and goals
[[items]]
id = "fit_goals"
domain = "fitness_and_goals"
kind = "must"
severity = "important"
points = 5
text = "The response judges her fit (ECOG 0, no limiting comorbidity) for curative-intent therapy with a high cure probability, and addresses her goals of continuing to work and avoiding neck radiation."
all = ["ecog\\s*(?:ps\\s*)?(?:of\\s*)?0|\\bfit\\b", "curative|\\bcure", "\\bwork|teach"]
