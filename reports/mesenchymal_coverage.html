ecular entity is not established on the current material. Both the left frontal mass (ICD-10-CM D43.0, neoplasm of uncertain behavior of brain, supratentorial) and the C6 nodule (D43.4, neoplasm of uncertain behavior of spinal cord) are coded verificationStatus provisional, not confirmed. Accordingly, this is not a confirmed diagnosis, no definitive histologic subtype or WHO grade can be assigned, and the relationship of the C6 nodule to the frontal mass remains presumptive. The symptoms may reflect raised intracranial pressure or local mass effect, but no compartment pressure, edema burden, or neurologic examination findings are documented. The principal uncertainty is the tumor entity itself: the available material does not distinguish among several intracranial mesenchymal neoplasms or non-mesenchymal mimics, and management cannot be meaningfully specified until integrated histopathology and molecular testing are complete.", "diagnostic_confirmation_and_staging": "The immediate diagnostic priority is to convert the provisional impression into an integrated diagnosis. Obtain and review the complete biopsy material and synoptic report, including architecture, cytology, mitotic activity, necrosis, atypia, proliferation index, and margin/adequacy assessment, and request formal neuropathology second-opinion review at a center with sarcoma and CNS expertise. Perform a broad immunohistochemical panel and, on the existing tissue, appropriate molecular testing such as methylation profiling and targeted DNA/RNA sequencing or fusion analysis to identify entity-defining alterations; interpret these only in the context of histology and copy-number findings. If the current specimen is insufficient or non-diagnostic, the tumor board and neurosurgery should plan repeat stereotactic or open biopsy versus an initial resection, recognizing that the superficial left frontal location may permit resection that is both diagnostic and potentially cytoreductive; no resection should be framed as definitive oncologic treatment before the entity and grade are known. Staging should complete neuraxis coverage: contrast MRI of the brain and entire spine has been performed, but CSF evaluation by lumbar puncture (cytology, cell count, protein, glucose, and opening pressure) is not documented and should be obtained if imaging confirms it is safe with respect to mass effect and herniation risk. Because the C6 nodule is unconfirmed, CSF cytology and interval spine imaging are needed to characterize leptomeningeal spread. Systemic staging has not been documented; obtain CT of the chest, abdomen, and pelvis (or other body imaging as indicated by the eventual entity) to exclude an extracranial primary or metastatic disease, with FDG-PET considered if it would change staging. Baseline laboratory studies, coagulation studies, pregnancy/fertility considerations as applicable, and documentation of corticosteroid use should be completed. The C6 nodule should not be assumed to be a drop metastasis until corroborated by CSF and/or tissue, and the final stage must remain provisional until the entity, grade, and extent of neuraxis and systemic disease are established.", "immediate_management_plan": "Admit or closely follow the patient with neuro-oncology and neurosurgery involvement, and present the case at a multidisciplinary neuro-oncology tumor board before any disease-directed therapy. Provide symptom control: scheduled and breakthrough analgesia for headache, antiemetics for vomiting, and a short course of dexamethasone at the lowest effective dose if there is symptomatic peritumoral edema or mass effect, with documentation of the dose and duration because steroids can alter subsequent histopathology and clinical status. Do not start routine seizure prophylaxis in the absence of a documented seizure; provide seizure education and precautions. Monitor neurologic status, intracranial pressure signs, and fluid/electrolyte balance; obtain urgent neurosurgical evaluation and imaging if there is clinical deterioration, new focal deficit, or concern for hydrocephalus or herniation. Continue supportive care including venous thromboembolism prophylaxis per institutional protocol, gastrointestinal protection while on steroids, glucose monitoring, and nutrition/mobility support. Complete the diagnostic work-up above, obtain consent for molecular testing and for review of outside pathology, and arrange fertility and psychosocial counseling before any potentially gonadotoxic or definitive therapy. Defer chemotherapy, definitive radiotherapy, and other disease-directed treatment until the integrated diagnosis, WHO grade, extent of disease, and resectability are adequately established; if the tumor proves high-grade or leptomeningeal dissemination is confirmed, the tumor board should then define the appropriate sequence of surgery, radiation, and systemic therapy. Arrange short-interval clinical follow-up and repeat contrast MRI of the brain and spine after the diagnostic and staging work-up is complete, with the interval determined by the multidisciplinary team.", "missing_information": ["Final integrated histopathologic entity and WHO grade, which the current pathology explicitly leaves unestablished", "Complete immunohistochemical profile and proliferation/mitotic index, necrosis, atypia, and margin assessment from the biopsy", "Molecular results including methylation profiling, targeted DNA/RNA sequencing, fusion analysis, and copy-number findings needed to define the entity and any actionable alteration", "Adequacy of the stereotactic biopsy material and whether repeat biopsy or resection is required for diagnosis", "Formal neuropathology second-opinion or sarcoma/CNS expert review status", "CSF cytology, cell count, protein, glucose, and opening pressure for leptomeningeal staging", "Confirmation of whether the C6 pial nodule represents a drop metastasis or a separate process, since it has not been biopsy-confirmed", "Extracranial/systemic staging, including CT chest/abdomen/pelvis or other body imaging, and whether PET is indicated", "Degree of peritumoral edema, mass effect, midline shift, hydrocephalus, and hemorrhage, which are not detailed in the imaging conclusion", "Detailed neurologic examination, seizure history, focal deficits, and signs of raised intracranial pressure", "Neurosurgical assessment of resectability, expected extent of resection, and operative morbidity", "Baseline laboratory values, organ function, coagulation status, and current corticosteroid or other medication exposure", "Fertility goals, psychosocial status, and performance-status trajectory relevant to future treatment planning", "Patient and family understanding of the provisional, non-confirmed nature of the diagnosis and goals of care"]}}, {"key": "mesenchymal_coverage/intracranial_mesenchymal_0001_fh__JzzmxP4", "run": "mesenchymal_coverage", "attempt": 1, "model": "deepseek-v4.1-flash-free", "case": "intracranial_mesenchymal_0001_fhir", "timing": {"env": 4.3, "install": 69.6, "work": 33.9, "grade": 0.6, "llm_calls": 5, "tokens": 11985}, "cost": 0.0, "status": "scored", "score": 72, "passed": false, "unsafe": [], "items": [{"id": "dx_nonspecific_entity", "label": "States that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected", "why": "", "domain": "diagnosis", "kind": "must", "severity": "dangerous", "points": 10, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected.", "quotes": ["Stereotactic biopsy on 2026-10-19 yielded material suggestive of an intracranial mesenchymal tumor with possible spinal drop metastasis, but both the histologic entity and grade remain unestablished;", "the primary mass and th ence for solitary fibrous tumor/hemangiopericytoma is largely retrospective and should not be presented as a universal Category 1 regimen", "why": "", "domain": "treatment", "kind": "should", "severity": "minor", "points": 2, "met": false, "error": false, "missed": true, "review": false, "regex": false, "judge": null, "text": "The response notes that the evidence for solitary fibrous tumor/hemangiopericytoma is largely retrospective and should not be presented as a universal Category 1 regimen.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "tx_surveillance", "label": "Arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate", "why": "", "domain": "surveillance", "kind": "should", "severity": "important", "points": 4, "met": false, "error": false, "missed": true, "review": false, "regex": false, "judge": null, "text": "The response arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate.", "quotes": [], "supported": true, "parts": [], "related": ["34-year-old man with approximately one week of headache and vomiting and ECOG performance status 2, found on MRI to have a well-circumscribed, lobulated, extra-axial/cortically based left frontal mass measuring 4.2 x 3.5 x 3.0 cm, plus an intensely enhancing 5 mm nodule on the posterior pial surface of the cervical cord at C6."]}, {"id": "sup_symptoms", "label": "Provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures", "why": "", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures.", "quotes": ["Admit or closely follow the patient for symptom control and neurologic monitoring: treat headache and vomiting, assess for raised intracranial pressure or hydrocephalus, and initiate seizure precautions/antiepileptic therapy only if clinically indicated.", "34-year-old man with approximately one week of headache and vomiting and ECOG performance status 2, found on MRI to have a well-circumscribed, lobulated, extra-axial/cortically based left frontal mass measuring 4.2 x 3.5 x 3.0 cm, plus an intensely enhancing 5 mm nodule on t"], "supported": true, "parts": [], "related": []}, {"id": "work_mdt", "label": "Refers the patient to a multidisciplinary neuro-oncology/tumor-board review", "why": "", "domain": "multidisciplinary", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["Obtain formal multidisciplinary neuropathology review of the biopsy, with immunohistochemistry sufficient to exclude mimics (including meningioma and other extra-axial/cortically based tumors), evaluate mitotic activity, necrosis, and proliferation in"], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "34-year-old man with approximately one week of headache and vomiting and ECOG performance status 2, found on MRI to have a well-circumscribed, lobulated, extra-axial/cortically based left frontal mass measuring 4.2 x 3.5 x 3.0 cm, plus an intensely enhancing 5 mm nodule on the posterior pial surface of the cervical cord at C6. Stereotactic biopsy on 2026-10-19 yielded material suggestive of an intracranial mesenchymal tumor with possible spinal drop metastasis, but both the histologic entity and grade remain unestablished; the primary mass and the C6 nodule are coded provisional (ICD-10-CM D43.0 and D43.4, neoplasm of uncertain behavior), and the C6 lesion is imaging-suspected only and not biopsy-confirmed. No molecular testing results are present in the record. The leading concern is a potentially disseminated mesenchymal neoplasm of the neuraxis, but a definitive subtype, biologic grade, and even the relationship of the two lesions cannot be asserted from the available data. The immediate priority is therefore diagnostic confirmation and safe, complete staging rather than disease-directed therapy.", "diagnostic_confirmation_and_staging": "Obtain formal multidisciplinary neuropathology review of the biopsy, with immunohistochemistry sufficient to exclude mimics (including meningioma and other extra-axial/cortically based tumors), evaluate mitotic activity, necrosis, and proliferation index for grading, and pursue integrated molecular characterization: genome-wide DNA methylation profiling with classifier match, targeted RNA sequencing for gene fusions, and broad next-generation sequencing for diagnostically and therapeutically relevant alterations (including, where appropriate, copy-number and selected fusion partners). If the stereotactic specimen is nondiagnostic or insufficient, plan a repeat/larger biopsy or resection after neurosurgical review rather than treating empirically. For staging, complete craniospinal imaging is already partly done; obtain dedicated contrast-enhanced MRI of the entire neuraxis if not already adequate, and perform CSF cytology via lumbar puncture if safe and not contraindicated by mass effect or hydrocephalus, to confirm or refute leptomeningeal dissemination. Consider systemic staging (at minimum contrast-enhanced body imaging, with FDG-PET/CT if the entity proves to be a sarcoma with extraneural metastatic potential) and baseline endocrine/neurocognitive assessment as clinically indicated. Establish extent of resection and resectability through neurosurgical evaluation of the left frontal mass and the C6 nodule, recognizing that the C6 lesion is currently unproven and that its management depends on the final diagnosis.", "immediate_management_plan": "Admit or closely follow the patient for symptom control and neurologic monitoring: treat headache and vomiting, assess for raised intracranial pressure or hydrocephalus, and initiate seizure precautions/antiepileptic therapy only if clinically indicated. Use corticosteroids judiciously for symptomatic peritumoral edema while weighing the risk of confounding the subsequent histologic diagnosis, and provide venous thromboembolism prophylaxis and supportive care appropriate to an ECOG 2 patient. Obtain the final integrated pathology and molecular diagnosis and present the case at a multidisciplinary tumor board (neuro-oncology, neurosurgery, neuropathology, neuroradiology, radiation oncology) to define the entity, grade, extent, and resectability. Defer chemotherapy and definitive radiotherapy until the diagnosis is established; the short-horizon plan is diagnostic confirmation, safe staging, symptom control, and multidisciplinary review, with neurosurgical input on the role and timing of resection or debulking. If neurologic deterioration, hydrocephalus, or symptomatic mass effect develops, escalate urgently with neurosurgical and critical care involvement.", "missing_information": ["Final integrated histopathologic diagnosis and WHO grade, including mitotic count, necrosis, and proliferation index", "Molecular results: genome-wide DNA methylation profile/classifier match, RNA fusion studies, and next-generation sequencing with copy-number and therapeutically relevant alterations", "Adequacy and representativeness of the stereotactic biopsy specimen, and whether repeat or open resection is needed for diagnosis", "Immunohistochemical workup excluding mimics such as meningioma and defining lineage markers", "CSF cytology and full craniospinal staging to confirm or exclude leptomeningeal dissemination, including confirmation of the nature of the C6 nodule", "Extent of resection, resectability, and surgical candidacy for the left frontal mass and the C6 lesion", "Systemic staging for extraneural disease, including body imaging and consideration of FDG-PET/CT", "Detailed neurologic examination, intracranial pressure assessment, and hydrocephalus status", "Baseline organ function, corticosteroid exposure, seizure history, and fertility/psychosocial considerations relevant to future therapy", "Patient goals and preferences regarding biopsy, resection, and participation in future clinical trials"]}}, {"key": "mesenchymal_coverage/intracranial_mesenchymal_0001_fh__SRtGmiG", "run": "mesenchymal_coverage", "attempt": 1, "model": "deepseek-v4.1-flash-free", "case": "intracranial_mesenchymal_0001_fhir", "timing": {"env": 3.0, "install": 29.6, "work": 33.5, "grade": 0.6, "llm_calls": 5, "tokens": 24950}, "cost": 0.0, "status": "scored", "score": 74, "passed": false, "unsafe": [], "items": [{"id": "dx_nonspecific_entity", "label": "States that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected", "why": "", "domain": "diagnosis", "kind": "must", "severity": "dangerous", "points": 10, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected.", "quotes": ["the histologic and molecular entity and grade are explicitly not established, and both tumor Conditions remain verificationStatus provisional.", "Stereotactic biopsy is described only as 'suggestive of an intracranial mesenchymal tumor with spinal drop metastasis';"], "supported": true, "parts": [], "related": []}, {"id": "dx_differential_entity", "label": "Names the relevant differential, including solitary fibrous tumor/hemangiopericytoma and a sarcoma such as Ewing sarcoma or rhabdomyosarcoma", "why": "", "domain": "diagnosis", "kind": "should", "severity": "important", "points": 4, "met": false, " upported": true, "parts": [], "related": []}, {"id": "tx_surveillance", "label": "Arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate", "why": "", "domain": "surveillance", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate.", "quotes": ["COG 2) with about one week of headache and vomiting, a 4.2 x 3.5 x 3.0 cm well-circumscribed, lobulated, extra-axial/cortically based left frontal mass, and a 5 mm intensely enhancing posterior pial nodule at C6 that is imaging-suspicious for a spinal drop metastasis.", "neurosurgical assessment should also address whether the C6 nodule requires intervention or only surveillance."], "supported": true, "parts": [], "related": []}, {"id": "sup_symptoms", "label": "Provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures", "why": "", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures.", "quotes": ["34-year-old man (ECOG 2) with about one week of headache and vomiting, a 4.2 x 3.5 x 3.0 cm well-circumscribed, lobulated, extra-axial/cortically based left frontal mass, and a 5 mm intensely enhancing posterior pial nodule at C6 that is imaging-suspicious for a spinal drop m", "Short-horizon priorities are diagnostic clarification, safe staging, symptom control, and tumor-board review;"], "supported": true, "parts": [], "related": []}, {"id": "work_mdt", "label": "Refers the patient to a multidisciplinary neuro-oncology/tumor-board review", "why": "", "domain": "multidisciplinary", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["The C6 nodule should be characterized as presumed leptomeningeal dissemination only after multidisciplinary imaging review and, if clinically appropriate, CSF sampling;"], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "34-year-old man (ECOG 2) with about one week of headache and vomiting, a 4.2 x 3.5 x 3.0 cm well-circumscribed, lobulated, extra-axial/cortically based left frontal mass, and a 5 mm intensely enhancing posterior pial nodule at C6 that is imaging-suspicious for a spinal drop metastasis. Stereotactic biopsy is described only as 'suggestive of an intracranial mesenchymal tumor with spinal drop metastasis'; the histologic and molecular entity and grade are explicitly not established, and both tumor Conditions remain verificationStatus provisional. This is therefore an undiagnosed intracranial mesenchymal neoplasm of uncertain behavior, not a confirmed entity: the differential remains broad (including meningothelial, mesenchymal non-meningothelial, and other extra-axial/CNS tumors) and no subtype, grade, or primary-versus-metastatic status should be assumed. The headache and vomiting may reflect raised intracranial pressure or mass effect, which requires clinical and imaging correlation. The C6 nodule is unbiopsied and could represent CSF dissemination, a separate lesion, or a non-neoplastic finding. Short-horizon priorities are diagnostic clarification, safe staging, symptom control, and tumor-board review; disease-directed therapy is not justified on the current information.", "diagnostic_confirmation_and_staging": "1) Diagnostic confirmation: obtain formal neuropathology review, ideally at a reference/consensus center, of the existing biopsy material with a full immunohistochemical panel and molecular workup, including methylation profiling, targeted RNA/DNA sequencing or fusion analysis, and copy-number analysis, interpreted together with morphology; request explicit reporting of grade-defining features (mitotic activity, necrosis, Ki-67), dural/extra-axial origin, and margin/architecture. If the material is insufficient or nondiagnostic, plan a repeat image-guided biopsy or, preferably, resection of the dominant left frontal lesion both to establish the entity and grade and to achieve cytoreduction if safely feasible. Do not assign a subtype or grade until this is complete. 2) Staging: the contrast-enhanced brain and whole-spine MRI already performed should be formally reviewed for leptomeningeal disease, hydrocephalus, edema, and the relationship of the frontal mass to dura, cortex, and eloquent structures; obtain CSF cytology by lumbar puncture only after imaging confirms it is safe and there is no raised intracranial pressure or herniation risk. Perform systemic staging with CT (or MRI) of chest, abdomen, and pelvis and consider PET-CT to exclude a systemic sarcoma or other primary with CNS metastasis. Obtain baseline laboratory studies and organ-function assessment, and document baseline neurologic and neurocognitive status. The C6 nodule should be characterized as presumed leptomeningeal dissemination only after multidisciplinary imaging review and, if clinically appropriate, CSF sampling; it is not biopsy-confirmed.", "immediate_management_plan": "Admit or closely follow the patient for symptom control and neurologic monitoring. Treat headache with a structured analgesic regimen and vomiting with antiemetics, and give corticosteroids (e.g., dexamethasone) if imaging or examination indicates vasogenic edema or raised intracranial pressure; add seizure precautions and an antiepileptic only if seizures have occurred or are judged clinically indicated. Maintain frequent neuro checks and escalate urgently for worsening headache, vomiting, drowsiness, focal deficit, or signs of herniation. Obtain urgent neurosurgical and multidisciplinary tumor-board review to determine whether the left frontal mass is safely resectable and to plan the timing of surgery versus repeat biopsy, with the explicit goal of definitive tissue diagnosis and, if achievable, safe maximal resection; neurosurgical assessment should also address whether the C6 nodule requires intervention or only surveillance. Provide supportive care, rehabilitation, and VTE prophylaxis appropriate to mobility and surgical status. Do not initiate chemotherapy or definitive radiotherapy for this unspecified tumor; defer all disease-directed treatment until the entity, grade, extent of disease, and resectability are established. Reassess performance status and goals of care with the patient and family, and schedule early follow-up imaging and tumor-board re-review after pathology and molecular results return.", "missing_information": ["Complete histopathology with immunohistochemistry, including markers needed to distinguish meningothelial from mesenchymal non-meningothelial and other extra-axial/CNS tumors", "Molecular characterization: methylation profile/class, targeted DNA and RNA sequencing, gene fusions, copy-number alterations, and any actionable alterations", "Grade-defining features: mitotic count, necrosis, Ki-67 proliferation index, and overall histologic grade", "Adequacy of the stereotactic biopsy material and whether it is representative of the whole lesion", "Precise anatomic origin and dural relationships of the left frontal mass, and its relation to eloquent cortex and major vessels", "Resectability assessment and surgical risk/benefit, including whether safe maximal resection or repeat biopsy is feasible", "CSF cytology and, if indicated, leptomeningeal staging results", "Confirmation of whether the C6 pial nodule is leptomeningeal dissemination, a separate primary, or another process", "Systemic staging results (chest/abdomen/pelvis imaging, possible PET-CT) to exclude an extracranial primary or sarcoma metastasis", "Clinical details of raised intracranial pressure, papilledema, seizure history, focal deficits, and current corticosteroid use", "Baseline organ function, blood counts, coagulation status, and other comorbidities relevant to surgery or future therapy", "Growth rate and prior imaging, if any, to assess tempo of disease", "Patient and family goals of care and preferences regarding surgery and further diagnostics"]}}, {"key": "mesenchymal_coverage/intracranial_mesenchymal_0001_fh__TBpyHWh", "run": "mesenchymal_coverage", "attempt": 1, "model": "claude-haiku-5-5", "case": "intracranial_mesenchymal_0001_fhir", "timing": {"env": 3.2, "install": 0.9, "work": 120.6, "grade": 0.6, "llm_calls": 5, "tokens": 24635}, "cost": 0.019, "status": "scored", "score": 0, "passed": false, "unsafe": ["tx_defer_definitive"], "items": [{"id": "dx_nonspecific_entity", "label": "States that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected", "why": "", "domain": "diagnosis", "kind": "must", "severity": "dangerous", "points": 10, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected.", "quotes": ["entity not established on the current material'.", "The neuropathology conclusion (issued 2026-10-21) is 'suggestive of an intracranial mesenchymal tumor with spinal drop metastasis;"], "supported": true, "parts": [], "related": []}, {"id": "dx_differential_entity", "label": "Names the relevant differential, including solitary fibrous tumor/hemangiopericytoma and a sarcoma such as Ewing sarcoma or rhabdomyosarcoma", "why": "", "domain": " adiotherapy for a high-grade solitary fibrous tumor or after subtotal resection.", "quotes": ["a NAB2::STAT6 result would classify the tumor as a meningeal solitary fibrous tumor/hemangiopericytoma, where surgery and radiotherapy are central and spinal dissemination is recognized;", "Signs of raised intracranial pressure (papilledema, drowsiness, persistent vomiting, worsening headache), a new focal deficit, new cord signs, seizure, or hydrocephalus mean same-day admission and urgent neurosurgical review."], "supported": true, "parts": [], "related": []}, {"id": "tx_no_routine_adjuvant_chemo", "label": "States that routine adjuvant chemotherapy is not the default after complete resection of localized solitary fibrous tumor, and that systemic therapy is reserved for unresectable, metastatic or recurrent disease", "why": "", "domain": "treatment", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states that routine adjuvant chemotherapy is not the default after complete resection of localized solitary fibrous tumor, and that systemic therapy is reserved for unresectable, metastatic or recurrent disease.", "quotes": ["Grade, molecular class, and whether the C6 nodule is metastatic or a separate lesion are all unknown;", "No disease-directed treatment now: no chemotherapy, no targeted therapy, no definitive radiotherapy, and no empiric regimen for an unclassified tumor."], "supported": true, "parts": [], "related": []}, {"id": "tx_evidence_caveat", "label": "Notes that the evidence for solitary fibrous tumor/hemangiopericytoma is largely retrospective and should not be presented as a universal Category 1 regimen", "why": "", "domain": "treatment", "kind": "should", "severity": "minor", "points": 2, "met": false, "error": false, "missed": true, "review": false, "regex": false, "judge": null, "text": "The response notes that the evidence for solitary fibrous tumor/hemangiopericytoma is largely retrospective and should not be presented as a universal Category 1 regimen.", "quotes": [], "supported": true, "parts": [], "related": ["Immunohistochemistry to exclude mimics rather than to force a subtype: STAT6 (nuclear, to screen for NAB2::STAT6 solitary fibrous tumor/hemangiopericytoma);"]}, {"id": "tx_surveillance", "label": "Arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate", "why": "", "domain": "surveillance", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate.", "quotes": ["MRI brain 2026-10-17: well-circumscribed, lobulated, extra-axial/cortically based left frontal mass measuring 4.2 x 3.5 x 3.0 cm.", "Serial neurological examination;"], "supported": true, "parts": [], "related": []}, {"id": "sup_symptoms", "label": "Provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures", "why": "", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures.", "quotes": ["A 34-year-old man (DOB 1992-06-01) with about 1 week of headache and vomiting (recorded 2026-10-16;", "the priorities are safety, symptom control, staging, and diagnosis rather than disease-directed therapy."], "supported": true, "parts": [], "related": []}, {"id": "work_mdt", "label": "Refers the patient to a multidisciplinary neuro-oncology/tumor-board review", "why": "", "domain": "multidisciplinary", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["Pathology review at tumor board: obtain the full synoptic report with histologic description (cellularity, growth pattern, pleomorphism), mitotic count, necrosis, Ki-67 index, a WHO CNS 2021 grade or an explicit statement that grade cannot be assigned"], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "Synthetic educational case (bundle security tag HTEST). A 34-year-old man (DOB 1992-06-01) with about 1 week of headache and vomiting (recorded 2026-10-16; onset approximately 2026-10-09) and ECOG 2 on 2026-10-16. MRI brain 2026-10-17: well-circumscribed, lobulated, extra-axial/cortically based left frontal mass measuring 4.2 x 3.5 x 3.0 cm. MRI spine 2026-10-17: a 5 mm lobulated, intensely and uniformly enhancing posterior pial nodule at C6 with cord of normal caliber, described as imaging-suspected spinal drop metastasis and not biopsied. Image-guided stereotactic needle biopsy of the left frontal mass on 2026-10-19. The neuropathology conclusion (issued 2026-10-21) is 'suggestive of an intracranial mesenchymal tumor with spinal drop metastasis; entity not established on the current material'. Working impression: a provisional, histologically and molecularly unclassified intracranial mesenchymal neoplasm of uncertain behavior (ICD-10 D43.0), with a possible pial spinal lesion of uncertain nature (D43.4). This is not a confirmed diagnosis. Grade, molecular class, and whether the C6 nodule is metastatic or a separate lesion are all unknown; both Condition resources are provisional by design. Discrepancy to reconcile: the pathology conclusion states 'with spinal drop metastasis', but the C6 lesion was not sampled, and the C6 Condition itself states 'not biopsy-confirmed'; the pathology wording should be clarified with the pathologist before it is carried forward as fact. Both Conditions use the mCODE primary-cancer-condition profile, which does not yet capture whether the C6 lesion is secondary to the frontal mass. Prognosis and treatment cannot be framed until classification and grade are known. Until then, treat the tumor as potentially aggressive; the priorities are safety, symptom control, staging, and diagnosis rather than disease-directed therapy.", "diagnostic_confirmation_and_staging": "The diagnosis is not established. Confirmation requires the full neuropathology report and further tissue work-up. (1) Pathology review at tumor board: obtain the full synoptic report with histologic description (cellularity, growth pattern, pleomorphism), mitotic count, necrosis, Ki-67 index, a WHO CNS 2021 grade or an explicit statement that grade cannot be assigned, and an inventory of remaining tissue (FFPE blocks, unstained slides, any frozen or fresh tissue reserved). (2) Immunohistochemistry to exclude mimics rather than to force a subtype: STAT6 (nuclear, to screen for NAB2::STAT6 solitary fibrous tumor/hemangiopericytoma); SMARCB1/INI1 (rhabdoid and some sarcomas); melanocytic markers (SOX10, S100, Melan-A, HMB-45); lymphoid markers (CD45, CD20, CD3); germ cell markers (SALL4, OCT3/4, PLAP); epithelial markers (AE1/AE3, EMA). (3) Molecular: DNA methylation profiling against the CNS tumor classifier; RNA-based fusion sequencing for mesenchymal and sarcoma fusions (NAB2::STAT6, FET-family::CREB fusions, NTRK, MUSTN1, round-cell sarcoma fusions); DNA panel sequencing (including CDKN2A/B, TP53, RB1, BRAF). Confirm whether these were performed, are pending, failed, or were not sent. (4) What would change management: an NTRK fusion would open a targeted-therapy option; a NAB2::STAT6 result would classify the tumor as a meningeal solitary fibrous tumor/hemangiopericytoma, where surgery and radiotherapy are central and spinal dissemination is recognized; a FET-family::CREB fusion would define a different intracranial mesenchymal entity with grade-dependent management; a melanocytic lineage would shift the work-up to melanoma pathways (BRAF testing, immunotherapy); a lymphoid or germ cell lineage would change treatment fundamentally; carcinoma or SMARCB1 loss would redirect the work-up. (5) C6 lesion: establish whether it is metastatic from the frontal mass or a separate lesion. Do not biopsy the cervical pial nodule unless the tumor board judges the risk-benefit favorable, since pial cervical biopsy is high risk; CSF cytology and CSF molecular testing may be an alternative source. (6) Extent of disease: gadolinium MRI of the brain and the complete spine (cervical, thoracic, lumbar, with post-contrast imaging) to assess mass effect, edema, dural attachment, ventricular involvement, leptomeningeal enhancement, and additional lesions. The current spine report describes only the C6 lesion. No post-biopsy imaging to exclude hemorrhage is documented. (7) CSF: opening pressure, cytology, and flow cytometry, performed only after MRI excludes obstructive hydrocephalus and a lumbar block, with timing agreed with neurosurgery (post-resection CSF is an option). (8) Exclude a primary outside the CNS: CT chest, abdomen and pelvis, or whole-body PET-CT; full skin and ophthalmologic examination; testicular examination with ultrasound if abnormal; serum LDH, AFP, and beta-hCG. (9) Genetic counseling only after pathology defines an entity with a possible hereditary association (for example TP53, NF1, RB1).", "immediate_management_plan": "No disease-directed treatment now: no chemotherapy, no targeted therapy, no definitive radiotherapy, and no empiric regimen for an unclassified tumor. The immediate plan is safety, symptom control, staging, and multidisciplinary review. (1) Within 24-48 hours: in-person neurological examination with fundoscopy, cranial nerves, visual fields, motor and sensory testing, gait, cord-level findings, bladder and bowel function, and cognition, with a documented baseline and an updated KPS and ECOG (the last ECOG predates the biopsy and pathology). Ask specifically about seizures and red-flag symptoms. Signs of raised intracranial pressure (papilledema, drowsiness, persistent vomiting, worsening headache), a new focal deficit, new cord signs, seizure, or hydrocephalus mean same-day admission and urgent neurosurgical review. (2) Corticosteroids: if the mass is symptomatic with peritumoral edema, start dexamethasone at the lowest effective dose with gastric protection and glucose monitoring, tapering as tolerated. If lymphoma has not been excluded, discuss with neuropathology first, because steroids can reduce the diagnostic yield of later tissue. (3) Seizures: none documented. Routine prophylactic antiseizure medication is not indicated; treat any seizure promptly, with agent choice made by neurology. (4) Symptom control: antiemetic (check QTc if ondansetron is used), acetaminophen first for headache, avoid sedating drugs that would obscure the neurological examination, and maintain hydration and electrolytes. (5) Imaging: repeat MRI brain with contrast to assess post-biopsy hemorrhage and interval change for procedural planning, and a full-length spine MRI if not already performed. (6) C6 pial nodule: no myelopathy is documented, so no urgent radiotherapy or surgery is indicated on current data. Serial neurological examination; urgent MRI and neurosurgical review for any new deficit. (7) Definitive-surgery decision: neurosurgery and neuro-oncology to decide between open resection (diagnostic tissue and debulking, if judged resectable with acceptable deficit risk) and continued observation with or without repeat sampling. This requires functional mapping (fMRI or tractography) because the relationship to speech and motor cortex is not documented. (8) Radiation oncology: consult for planning awareness only. No radiotherapy before classification, grade, extent, and resectability are established. (9) Clinical trial screening once classification is known. (10) Fertility: offer sperm banking counseling before any gonadotoxic therapy is considered. (11) Supportive care: palliative care referral in parallel with diagnosis for symptom and goals-of-care support; social work; neuropsychology baseline; counseling on driving restriction and fall precautions per local law. (12) Communication: explain to the patient that the diagnosis is provisional and that the next steps are diagnostic. (13) Follow-up: tumor board re-review within 1-2 weeks, or sooner when the pathology addendum or molecular results return and after any procedure. Give written return precautions for headache, vomiting, drowsiness, seizures, weakness, gait or bladder change, and visual loss.", "missing_information": ["Full neuropathology synoptic report: histologic description, mitotic count, necrosis, cellularity, Ki-67, WHO CNS 2021 grade, and the complete immunohistochemistry panel with results. Only a one-sentence conclusion is present.", "Molecular status: whether DNA methylation profiling, RNA fusion sequencing, and DNA panel sequencing were performed, are pending, failed, or were not sent. The reason the entity is 'not established on the current material' is not stated.", "Specimen adequacy: amount of tissue obtained, tissue remaining, whether frozen or fresh tissue was reserved, and any frozen-section result.", "Basis for the pathology phrase 'with spinal drop metastasis', given that the C6 lesion was not biopsied and its Condition is recorded as not biopsy-confirmed.", "Full brain MRI report: enhancement pattern, edema, mass effect, midline shift, ventricular involvement, dural tail, venous sinus relationship, leptomeningeal enhancement, diffusion and perfusion findings, and comparison with prior imaging.", "Full spine MRI report: thoracic and lumbar findings (only the cervical lesion is described), cord signal, cauda equina, and any other pial or subarachnoid lesions.", "Post-biopsy imaging or CT excluding hemorrhag te.", "quotes": ["MRI brain (2026-10-17): well-circumscribed, lobulated, extra-axial/cortically based left frontal mass, 4.2 x 3.5 x 3.0 cm;", "Spinal monitoring: serial neurological checks for myelopathy, sensory level, bladder or bowel change or new weakness;"], "supported": true, "parts": [], "related": []}, {"id": "sup_symptoms", "label": "Provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures", "why": "", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures.", "quotes": ["Symptom control: for headache, acetaminophen first;", "34-year-old man with about 1 week of headache and vomiting (recorded 2026-10-16), ECOG 2 on 2026-10-16."], "supported": true, "parts": [], "related": []}, {"id": "work_mdt", "label": "Refers the patient to a multidisciplinary neuro-oncology/tumor-board review", "why": "", "domain": "multidisciplinary", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["The case is not yet a treatable entity: management is diagnostic, supportive, and disease-directed therapy is deferred pending multidisciplinary review."], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "Synthetic test case (MRN MESENCH-0001; not a real patient). 34-year-old man with about 1 week of headache and vomiting (recorded 2026-10-16), ECOG 2 on 2026-10-16. MRI brain (2026-10-17): well-circumscribed, lobulated, extra-axial/cortically based left frontal mass, 4.2 x 3.5 x 3.0 cm; peritumoral edema, midline shift, hydrocephalus and additional lesions are not described. MRI spine (2026-10-17): 5 mm intensely and uniformly enhancing posterior pial nodule at C6 with normal cord caliber; the thoracic and lumbar levels named in the report title are not described in the conclusion or observations. Stereotactic biopsy of the left frontal mass (2026-10-19); neuropathology (issued 2026-10-21) is suggestive of an intracranial mesenchymal tumor and states that the final histologic and molecular entity is not established on the current material; grade is not reported. Working status: intracranial mesenchymal-type neoplasm of undetermined entity and grade (provisional; ICD-10 D43.0), with a C6 pial lesion suspected but not biopsied as metastasis (provisional; D43.4). The pathology conclusion states 'with spinal drop metastasis', but a biopsy of the brain lesion does not sample the spinal nodule; this wording must be reconciled with neuropathology before metastatic status is used in planning. The differential is broad and unproven: CNS-primary mesenchymal tumors, including solitary fibrous tumor/hemangiopericytoma (extra-axial, intensely enhancing, and known for CSF and spinal spread), meningeal or other CNS sarcomas, and fusion-driven small round blue cell or rhabdomyoblastic sarcomas; plus non-mesenchymal mimics that must be excluded, including melanoma, carcinoma and lymphoma. No single subtype is established and none should be assumed. Symptoms with a 4.2 cm lesion raise concern for raised intracranial pressure, but this is not yet documented. The case is not yet a treatable entity: management is diagnostic, supportive, and disease-directed therapy is deferred pending multidisciplinary review. This is an educational synthetic case, not clinical decision support.", "diagnostic_confirmation_and_staging": "Goal: establish histologic and molecular entity, WHO grade and confirmed extent, using existing tissue first.\n1. Neuropathology re-review by a pathologist with sarcoma and CNS-mesenchymal expertise: document cellularity, mitotic count per 10 HPF, necrosis, vascular pattern, grade and Ki-67; state whether tissue is adequate; resolve the 'spinal drop metastasis' wording against the unsampled C6 nodule.\n2. Immunohistochemistry on existing blocks: lymphoma (CD45/LCA), carcinoma (pan-cytokeratin, EMA), melanoma (SOX10, S100, Melan-A, HMB-45), STAT6, CD34, SMA, desmin, myogenin, MyoD1, CD99, GFAP, OLIG2, SMARCB1/INI1, BRG1; germ-cell markers (AFP, beta-hCG, SALL4, OCT3/4) only if histology suggests germ-cell or choriocarcinomatous differentiation.\n3. Molecular: DNA methylation profiling with CNS tumor classifier if DNA permits; RNA-based sarcoma fusion panel (for example NAB2-STAT6, EWSR1, FUS, CIC, BCOR, FOXO1, MYOD1) or broad DNA plus RNA NGS with fusion calling; CDKN2A/B, MDM2, CDK4 and TP53 status; MMR/MSI and TMB; BRAF, NRAS, KIT, PDGFRA; NTRK1-3, ALK, ROS1 and RET fusions, which are actionable across histologies.\n4. If existing material is insufficient, the board decides between an additional stereotactic core and open resection (which also addresses mass effect). Biopsy of the C6 nodule is high-risk and is not a first-line diagnostic step.\n5. Germline counselling and testing if somatic results or family history suggest a predisposition syndrome (for example Li-Fraumeni/TP53, DICER1, RB1, SMARCB1).\n6. Staging MRI: brain with and without contrast, including DWI, perfusion and spectroscopy, with dural attachment, edema, midline shift, ventricles and leptomeningeal enhancement reported; complete MRI of the entire spine (cervical, thoracic, lumbar) with and without contrast to define drop-metastasis extent.\n7. CSF: lumbar puncture for cytology/flow only after neuroradiology and neurosurgery confirm no obstructive hydrocephalus or other contraindication; CSF results do not replace neuraxis MRI.\n8. Systemic staging: CT chest, abdomen and pelvis with IV contrast (or PET-CT if the centre uses it for sarcoma or melanoma) to look for a systemic primary or extracranial disease; full skin, mucosal and ocular examination for melanoma; testicular examination with ultrasound if clinically indicated.\n9. Post-biopsy imaging to exclude hemorrhage at the biopsy site, and a documented neurosurgical opinion on resectability and approach, including left frontal eloquence (motor and language) and mapping needs.", "immediate_management_plan": "1. No chemotherapy, targeted therapy, immunotherapy or definitive radiotherapy is recommended now. No entity, grade or extent is established, and no treatable molecular target has been identified. Disease-directed therapy stays deferred until the board has a confirmed diagnosis, grade, staging and resectability; no regimen should be chosen for an unspecified mesenchymal tumor.\n2. Tumor board: present at a neuro-oncology review with neurosurgery, neuroradiology, neuropathology, medical oncology and radiation oncology, plus a sarcoma or CNS-tumor expert if available, within days. Request neuropathology re-review and the molecular testing listed above. Record the working diagnosis as provisional in the chart.\n3. Neurological safety: perform and document a full neurological examination (including cord-level signs and visual fields) and an ECOG reassessment now. Use neuro checks with urgent escalation for worsening headache, vomiting, drowsiness, new focal deficit, seizure or papilledema, which suggest raised ICP or herniation risk and call for urgent neurosurgical review and repeat imaging.\n4. Symptom control: for headache, acetaminophen first; avoid NSAIDs until surgical plans are settled. For vomiting, use ondansetron after baseline ECG and electrolytes, and correct dehydration. Corticosteroids: consider low-dose dexamethasone (for example 4 mg twice daily, tapered) only if MRI shows peritumoral edema or symptoms are significant, and only after lymphoma has been excluded on existing tissue (or the board accepts that diagnostic cost), with gastric protection and glucose monitoring. No prophylactic antiseizure medication is indicated while there are no seizures; if a seizure occurs, start levetiracetam and advise no driving in line with local law.\n5. Spinal monitoring: serial neurological checks for myelopathy, sensory level, bladder or bowel change or new weakness; urgent MRI and neurosurgical review if these arise.\n6. Surgery: refer to neurosurgery for resectability and approach. Whether resection is performed for tissue adequacy, mass effect or both is a board decision after full-neuraxis MRI; this plan does not commit to resection or to a surgical extent.\n7. Supportive and functional care: PT/OT and falls precautions (ECOG 2 with headache), nutrition assessment for vomiting, VTE risk assessment, early supportive/palliative oncology referral, social work, driving and work counselling, and fertility counselling before any potentially gonadotoxic therapy is considered.\n8. Communication and follow-up: explain to the patient that the diagnosis is incomplete and provisional, and give written red-flag instructions. Schedule the first board follow-up within one week, or sooner if clinical status changes. Revisit the plan when the pathology re-review, molecular results, full-neuraxis MRI and systemic staging return; a lymphoma, melanoma, carcinoma or actionable-alteration result would redirect the plan.", "missing_information": ["Full neurological examination: motor, sensory, gait, cerebellar, visual fields, cord-level signs, bladder and bowel function, cognition.", "Seizure history; no seizure is documented.", "Brain MRI detail beyond size and location: peritumoral edema, midline shift, hydrocephalus, dural tail or attachment, hemorrhage, additional lesions, leptomeningeal enhancement, diffusion, perfusion and spectroscopy.", "Thoracic and lumbar spine findings: the spine MRI title names these levels, but only the C6 nodule is described.", "Post-biopsy imaging for hemorrhage or other complications, and the number and size of biopsy cores.", "Neuropathology detail: cellulari : ["The differential the pathology and molecular work must resolve includes fusion-defined or other primary intracranial sarcomas and mesenchymal tumors, meningeal tumors such as STAT6-altered solitary fibrous tumor/hemangiopericytoma, meningioma with atypical morphology, and metastatic extracranial sarcoma or carcinoma/melanoma."]}, {"id": "tx_surveillance", "label": "Arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate", "why": "", "domain": "surveillance", "kind": "should", "severity": "important", "points": 4, "met": false, "error": false, "missed": true, "review": false, "regex": false, "judge": null, "text": "The response arranges long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate.", "quotes": [], "supported": true, "parts": [], "related": ["Brain MRI 2026-10-17: well-circumscribed, lobulated, extra-axial/cortically based left frontal mass, 4.2 x 3.5 x 3.0 cm."]}, {"id": "sup_symptoms", "label": "Provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures", "why": "", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures.", "quotes": ["(b) Symptom control: antiemetic (for example ondansetron) for vomiting and analgesia for headache, avoiding opioid escalation.", "Daniel Sample, MRN MESENCH-0001) with about 1 week of headache and vomiting (onset 2026-10-16), ECOG 2 recorded 2026-10-16 (before biopsy)."], "supported": true, "parts": [], "related": []}, {"id": "work_mdt", "label": "Refers the patient to a multidisciplinary neuro-oncology/tumor-board review", "why": "", "domain": "multidisciplinary", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["If tissue is insufficient, the tumor board should decide between repeat biopsy and resection rather than proceeding without a diagnosis."], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "Synthetic 34-year-old man (test data; Daniel Sample, MRN MESENCH-0001) with about 1 week of headache and vomiting (onset 2026-10-16), ECOG 2 recorded 2026-10-16 (before biopsy). Brain MRI 2026-10-17: well-circumscribed, lobulated, extra-axial/cortically based left frontal mass, 4.2 x 3.5 x 3.0 cm. Spine MRI 2026-10-17: 5 mm discrete, lobulated, intensely and uniformly enhancing posterior pial nodule at C6 with normal cord caliber. Image-guided stereotactic biopsy of the left frontal mass 2026-10-19; synoptic pathology issued 2026-10-21 reads 'suggestive of an intracranial mesenchymal tumor with spinal drop metastasis; the final histologic and molecular entity is not established on the current material.' Working problem: intracranial mesenchymal tumor of undetermined entity, grade and behavior (ICD-10-CM D43.0, verificationStatus provisional), with an imaging-suspected C6 pial deposit (D43.4, provisional, not biopsy-confirmed). No histologic grade, mitotic count, immunohistochemistry, methylation or molecular result, or tissue-adequacy statement is present in the bundle, so no treatable entity is established and no chemotherapy or definitive radiotherapy regimen should be chosen. Key discrepancy: the pathology conclusion states 'with spinal drop metastasis', but only the left frontal mass was sampled; the C6 nodule is imaging-suspected only. Also, the spine MRI resource covers cervical, thoracic and lumbar spine, but the conclusion describes only the cervical findings. This is an educational reconstruction, not clinical decision support.", "diagnostic_confirmation_and_staging": "Diagnosis must be settled before any disease-directed decision. The differential the pathology and molecular work must resolve includes fusion-defined or other primary intracranial sarcomas and mesenchymal tumors, meningeal tumors such as STAT6-altered solitary fibrous tumor/hemangiopericytoma, meningioma with atypical morphology, and metastatic extracranial sarcoma or carcinoma/melanoma. None is assigned. (1) Neuropathology: request a signed-out (not preliminary) report with a formal consultation and addendum covering histologic type, cellularity, mitotic count, necrosis, the grading criteria applied, and an immunohistochemical panel chosen from morphology (lineage markers, STAT6, INI1/SMARCB1, H3K27me3, SSTR2, and glial or melanocytic markers as indicated). Confirm the number and size of stereotactic cores and how much tissue or how many blocks remain for molecular work. (2) Molecular: if tissue allows, send for DNA methylation-based classification and a targeted RNA-based fusion panel, with DNA sequencing as indicated. These are the results most likely to define the entity. If tissue is insufficient, the tumor board should decide between repeat biopsy and resection rather than proceeding without a diagnosis. (3) Neuraxis imaging: neuroradiology review of the full-brain MRI with and without contrast for edema, mass effect, hemorrhage, dural tail, other intracranial lesions, and whether the lesion is truly extra-axial or cortical. Obtain a complete spine MRI with contrast with a written report for each of the cervical, thoracic and lumbar segments; this determines whether additional spinal drop lesions exist. (4) Extracranial staging: CT chest, abdomen and pelvis with contrast (or FDG-PET/CT if available) to exclude a primary tumor elsewhere, which would change the diagnosis and management. (5) CSF: no lumbar puncture for cytology until the complete spine MRI is reviewed and neurosurgery/neuroradiology confirm there is no obstruction or spinal contraindication; leptomeningeal status rests on imaging until then. (6) Extent: document as a solitary 4.2 cm left frontal mass with an imaging-suspected C6 pial nodule and unknown extracranial extent. No validated staging system applies to an unclassified intracranial mesenchymal tumor. Results that would change management: a specific sarcoma or meningeal entity, a grade, an extracranial primary, biopsy-proven spinal disease, or resectability.", "immediate_management_plan": "Short-horizon goals: stabilize symptoms, complete diagnosis and staging, and convene multidisciplinary review. No chemotherapy, targeted therapy or definitive radiotherapy is recommended now, because no treatable entity is established. The frontal mass and the C6 nodule should not be irradiated or treated empirically before pathology. Within 24 to 72 hours: (a) Neurologic and functional assessment: full neurologic examination including cranial nerves, motor, sensory, gait, reflexes, and a myelopathy screen with bladder and bowel function; repeat ECOG, since the only recorded value predates biopsy; fundoscopy for papilledema; record seizure history (none documented). Any new deficit requires urgent MRI and neurosurgical review. (b) Symptom control: antiemetic (for example ondansetron) for vomiting and analgesia for headache, avoiding opioid escalation. Start dexamethasone only if MRI shows significant vasogenic edema or symptoms warrant it, at the lowest effective dose with a documented start date, gastric protection and glucose monitoring. Steroids can alter the histologic interpretation of residual tissue, so inform neuropathology before starting. (c) Seizures: no seizures are documented, so routine prophylactic antiseizure medication is not indicated. If a seizure occurs, start a non-enzyme-inducing agent such as levetiracetam, counsel on driving restriction per local law, and reassess. (d) Neurosurgery: formal evaluation of resectability and mass effect of the 4.2 cm left frontal lesion. Resection for debulking, symptom relief or a larger diagnostic sample is a tumor board decision, not a default. The C6 nodule is assessed separately. (e) Baseline labs and planning: CBC with differential, comprehensive metabolic panel with liver and renal function, and coagulation studies before any procedure. Fertility counseling and sperm banking discussion before any gonadotoxic therapy is considered. Genetic counseling if pathology suggests a hereditary syndrome. (f) Coordination: multidisciplinary tumor board with neuropathology, neuroradiology, neurosurgery, radiation oncology, medical oncology and neuro-oncology, plus a sarcoma board if available. Reconvene within about 2 weeks, or when immunohistochemistry and molecular results return, whichever is first. (g) Communication and support: explain to the patient that the diagnosis is not yet established, why treatment is deferred, and what results would change the plan. Involve supportive care and social work early.", "missing_information": ["Signed-out histologic type and grade, mitotic count, necrosis, cellularity, and the grading criteria applied; the synoptic report has no structured result observations.", "Immunohistochemistry panel results; none are recorded in the bundle.", "Molecular results (DNA methylation class, RNA fusion panel, DNA sequencing, tumor mutational burden) or an explicit statement that tissue was insufficient.", "Biopsy tissue adequacy: number and size of cores, residual tissue or blocks, and whether a repeat biopsy or resection is feasible.", "Whether the spinal lesion was sampled; the pathology conclusion says 'with spinal drop metastasis' but only the left frontal mass was biopsied.", "Formal written report for the thoracic and lumbar spine segments of the spine MRI, which was ordered but described only at C6.", "Full brain MRI details: vasogenic edema, midline shift, hydrocephalus, hemorrhage, dural tail, other intracranial lesions, enhancement pattern, and the exact extra-axial versus intra-axial relationship (the conclusion is ambiguous).", "Complete neurologic examination, myelopathy screen, fundoscopy, seizure history, and cognitive status; none documented beyond symptoms.", "Repeat ECOG performance status after biopsy; the only recorded ECOG 2 predates the biopsy.", "Extracranial staging: CT chest, abdomen and pelvis or PET/CT, and any history of prior malignancy, primary-site symptoms, or family cancer history.", "Baseline laboratory values (CBC, metabolic panel, liver and renal function, coagulation); none are in the bundle.", "Neurosurgical resectability assessment, operative risk, and neuroradiology review of the operative anatomy.", "CSF status: no lumbar puncture or cytology has been documented, and the decision depends on complete spine imaging.", "Current corticosteroid use and dose, weight and nutritional status, and any other current medications.", "Patient preferences, psychosocial and social history, access to specialist care, and fertility preferences.", "Radiation oncology and medical oncology opinions, which are needed once the entity is known.", "ICD-10-CM coding mismatch to resolve: the D43 'uncertain behavior' codes are used while the pathology conclusion describes metastasis, which implies malignant behavior; coding should be revised after classification."]}}, {"key": "mesenchymal_coverage/intracranial_mesenchymal_0001_na__75DjX6M", "run": "mesenchymal_coverage", "attempt": 1, "model": "deepseek-v4.1-flash-free", "case": "intracranial_mesenchymal_0001_narrative", "timing": {"env": 4.1, "install": 257.6, "work": 36.0, "grade": 0.6, "llm_calls": 5, "tokens": 5488}, "cost": 0.0, "status": "did_not_run", "reason": "The model's program stopped with an error before writing an answer."}, {"key": "mesenchymal_coverage/intracranial_mesenchymal_0001_na__LMwSVxk", "run": "mesenchymal_coverage", "attempt": 1, "model": "claude-haiku-5-5", "case": "intracranial_mesenchymal_0001_narrative", "timing": {"env": 4.0, ": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["Diagnostic confirmation: (a) neuropathology re-review of the existing stereotactic biopsy at a neuro-oncology reference center, with a full histologic report (cellularity, mitoses per 10 HPF, necrosis, vascular pattern, pleomorphism, growth pattern);"], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "34-year-old man, performance status 2, no comorbidities, presenting with one week of headache and vomiting. MRI shows a well-circumscribed, lobulated, extra-axial/cortically based left frontal mass (4.2 x 3.5 x 3.0 cm) and a separate 5 mm intensely and uniformly enhancing nodule on the posterior pial surface at C6 with normal cord caliber. Stereotactic biopsy is reported as 'suggestive of' an intracranial mesenchymal tumor with spinal drop metastasis. The diagnosis is therefore provisional: the category 'mesenchymal' is established only at the morphologic level, and the specific entity, grade, and molecular class are NOT established in the source. Working assumption for planning only: a CNS mesenchymal neoplasm of uncertain grade with possible neuraxial (CSF) dissemination, treated as high-risk until proven otherwise. The spinal nodule has not been reported as sampled; it is presumed to be the same tumor, which is an assumption that must be confirmed. Differential diagnosis to be resolved by pathology and molecular testing: (1) solitary fibrous tumor/hemangiopericytoma (CNS WHO 2021 grade 2 or 3; NAB2-STAT6 fusion; the most common CNS mesenchymal entity with an extra-axial, intensely enhancing appearance and a propensity for CSF spread); (2) round-cell or Ewing-like sarcoma with CIC-DUX4 or other EWSR1/FUS-non-ETS fusions; (3) other sarcomas such as rhabdomyosarcoma, leiomyosarcoma, or undifferentiated pleomorphic sarcoma; (4) meningioma with sarcomatous or dedifferentiated change; (5) melanoma, which must be excluded because intense enhancement and leptomeningeal spread are typical and it changes management entirely; (6) primary CNS lymphoma and carcinoma metastasis are less likely given the mesenchymal morphology but are not excluded by the report. The management-relevant unknowns are the entity, the grade, whether the lesion is melanocytic, sarcomatous, or meningeal in origin, whether the spinal nodule is the same tumor, and whether the frontal mass is resectable without unacceptable deficit.", "diagnostic_confirmation_and_staging": "Diagnostic confirmation: (a) neuropathology re-review of the existing stereotactic biopsy at a neuro-oncology reference center, with a full histologic report (cellularity, mitoses per 10 HPF, necrosis, vascular pattern, pleomorphism, growth pattern); (b) immunohistochemistry panel including STAT6, CD34, BCL2, EMA, SSTR2, S100, SOX10, HMB45, Melan-A, desmin, myogenin, MyoD1, smooth muscle actin, h-caldesmon, pan-cytokeratin, SMARCB1/INI1, BRG1, CD99, FLI1, NKX2-2, WT1, ERG, TLE1, GFAP, OLIG2, and H3K27me3 as indicated; (c) molecular testing: DNA methylation profiling (the most useful adjunct where IHC is equivocal in CNS mesenchymal tumors), RNA-based fusion sequencing (NAB2-STAT6, CIC-DUX4, EWSR1 and FUS fusions, other round-cell sarcoma fusions), and targeted DNA sequencing including CDKN2A/B, TP53, NF2, PTEN, and TERT promoter, plus BRAF, NRAS, and KIT if melanoma remains possible. If the biopsy material is insufficient for these tests, that is an indication for open resection rather than repeat needle sampling (see plan). Spinal nodule: confirm whether it was sampled; sample only if the result would change management and can be done safely, which is to be decided at the tumor board. Staging: (1) gadolinium-enhanced MRI of the entire neuraxis, meaning brain plus full spine (cervical, thoracic, lumbar, sacral) with thin sections, to define all drop lesions, leptomeningeal enhancement, dural tail, bone or sinus involvement, edema, and hydrocephalus; (2) systemic staging with contrast CT chest, abdomen, and pelvis, or FDG PET/CT, to look for an extracranial primary or metastases, plus skin, lymph node, and testicular examination; (3) CSF cytology only after neurosurgery confirms no obstructive hydrocephalus or raised intracranial pressure and the lumbar approach is considered safe with the known C6 lesion; this is staging information, not an immediate requirement; (4) baseline laboratory tests: CBC, comprehensive metabolic panel, coagulation studies, LDH, type and screen, and HIV and hepatitis serology before any surgery or systemic therapy; (5) functional mapping for the left frontal lesion (fMRI and/or diffusion tractography for language and motor cortex) before any resection.", "immediate_management_plan": "Short-horizon plan only. No chemotherapy or definitive radiotherapy regimen is proposed, because the entity, grade, extent, and resectability are not established and no treatable entity has been identified. Steps: (1) Urgent neurosurgery review within days, given a symptomatic 4 cm mass with headache and vomiting. Decide with neuropathology and neuro-oncology whether open resection is preferred over the existing biopsy, both for mass effect and to obtain adequate tissue for molecular diagnosis; extent of resection is limited by eloquent cortex identified in step (5) of the staging section. (2) Corticosteroids: if peritumoral edema is causing symptoms, use dexamethasone at a standard dose with taper, gastroprotection, and glucose monitoring, per local protocol. Because primary CNS lymphoma remains in the differential and steroids can obscure its histology, check with neuropathology before starting unless symptoms are severe. (3) Symptomatic care: antiemetic (for example ondansetron), electrolyte monitoring, and avoidance of sedatives that confound neurological assessment. (4) Seizures: none are reported, so routine antiseizure prophylaxis is not recommended; if seizures occur, start levetiracetam and involve neurology and neurosurgery. (5) Neurological surveillance: document a baseline examination including visual fields, fundoscopy for papilledema, cranial nerves, motor and sensory function, gait, and a spinal cord level examination for myelopathy. Urgent MRI and neurosurgical review are required for any new deficit, declining consciousness, papilledema, worsening headache or vomiting, or new myelopathy, since these can indicate herniation or cord compression. (6) Spinal lesion: no cord compression is reported, so no spinal intervention is indicated now unless there is neurological deterioration; spinal surgery or radiotherapy is not indicated until the diagnosis is established. (7) Supportive care: functional assessment with physiotherapy and occupational therapy given performance status 2, driving restriction per local law, and social work and psychological support. Discuss fertility preservation (sperm banking) before any therapy that may be gonadotoxic. (8) Multidisciplinary review: present at a neuro-oncology and sarcoma tumor board including neurosurgery, neuropathology, neuroradiology, radiation oncology, and medical oncology, with the patient involved in discussions. Re-review when pathology and molecular results are available, with the timing set by laboratory turnaround. (9) Entity-triggered pathways, not to be started now: SFT/hemangiopericytoma with NAB2-STAT6 fusion leads to the SFT/HPC pathway; sarcoma fusion or rhabdomyosarcoma leads to sarcoma or adolescent-and-young-adult referral; melanoma leads to melanoma evaluation with BRAF/NRAS/KIT results; meningioma leads to the grade-based meningioma pathway; lymphoma leads to hematology referral; carcinoma leads to a primary-site search. Disease-directed options and sequencing should be decided only after these results are available.", "missing_information": ["Final histologic diagnosis under CNS WHO 2021, including grade, with mitotic count per 10 HPF, necrosis, and cellularity.", "Full immunohistochemistry results (including STAT6, CD34, SOX10, S100, desmin, myogenin, INI1, and others) and whether the biopsy material is adequate for further testing.", "Molecular results: DNA methylation class, RNA fusion findings (NAB2-STAT6, CIC-DUX4, EWSR1 or FUS fusions), and targeted DNA sequencing.", "Whether the C6 spinal nodule was sampled or only imaged, and its histology if sampled.", "Full-neuraxis contrast MRI details: thoracic, lumbar, and sacral drop lesions, leptomeningeal enhancement, dural tail, bone or sinus involvement, peritumoral edema, midline shift, and hydrocephalus.", "Systemic staging results (CT or PET), extracranial primary search, and skin, lymph node, and testicular examination findings.", "Detailed neurological examination: focal deficits, seizure history, visual fields, papilledema, language dominance, motor function, and cord-level signs.", "Baseline laboratory values: CBC, metabolic panel, LDH, coagulation studies, HIV and hepatitis serology.", "Resectability assessment: relationship of the frontal mass to eloquent cortex, functional MRI or tractography results, and neurosurgical opinion.", "CSF cytology status, intracranial pressure assessment, and whether a lumbar puncture is considered safe.", "Performance status detail beyond the reported value of 2, social support, patient goals and preferences, and fertility wishes.", "Source status: the handout is a draft pending specialist sign-off and is synthetic and educational. This output is not clinical decision support and must be reviewed by the treating multidisciplinary team."]}}, {"key": "mesenchymal_coverage/intracranial_mesenchymal_0001_na__SzrwQgQ", "run": "mesenchymal_coverage", "attempt": 1, "model": "deepseek-v4.1-flash-free", "case": "intracranial_mesenchymal_0001_narrative", "timing": {"env": 3.3, "install": 202.8, "work": 35.1, "grade": 0.7, "llm_calls": 5, "tokens": 7221}, "cost": 0.0, "status": "did_not_run", "reason" /* A required step and the matching error in the same clinical area are one problem
   (e.g. "did not stage III" and "staged IV"), reviewed with one verdict. */
function problems(t) {
  const groups = [];
  for (const it of (t.unsafe || []).map(id => t.items.find(i => i.id === id)).filter(Boolean)) {
    let g = groups.find(g => g.domain === it.domain);
    if (!g) groups.push(g = { domain: it.domain, items: [] });
    g.items.push(it);
  }
  for (const g of groups) {
    g.items.sort((a, b) => (a.kind === "must_not" ? 0 : 1) - (b.kind === "must_not" ? 0 : 1));
    g.key = t.key + "#" + g.items.map(i => i.id).join("+");
    const errs = g.items.filter(i => i.kind === "must_not"), l = s => s.replace(/\.$/, "");
    g.title = errs.length ? errs.map(i => l(i.label)).join("; ") : "Missed: " + g.items.map(i => l(i.label)).join("; ");

const tip = $("#tip");
function bindTip(node, htmlText) {
  const show = e => { tip.innerHTML = htmlText; tip.hidden = false; move(e); };
  const move = e => {
    const r = node.getBoundingClientRect();
    const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2, y = e && e.clientY != null ? e.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 12)) + "px";
    tip.style.top = Math.max(8, (y - h - 12 < 8 ? y + 18 : y - h - 12)) + "px";
  };
  node.addEventListener("mouseenter", show); node.addEventListener("mousemove", move);
  node.addEventListener("mouseleave", () => tip.hidden = true);

// averages (score, time, calls, tokens, cost) use graded attempts only; attempts that never ran are counted, not averaged
function stats(m) {
  const ts = trialsFor(m), sc = ts.filter(t => t.status === "scored");
  const n = k => ts.filter(t => statusOf(t) === k).length;
  const avgT = k => mean(sc.map(t => t.timing[k]).filter(v => v != null));
  const total = sc.map(t => ["env", "install", "work", "grade"].reduce((a, k) => a + (t.timing[k] || 0), 0)).filter(Boolean);
  const costs = sc.map(t => t.cost).filter(v => v != null);
  return { ts, sc, attempts: ts.length, graded: sc.length, pass: n("pass"), below: n("below"), unsafe: n("unsafe"), none: n("none"),
    mean: mean(sc.map(t => t.score)), minutes: mean(total), avgT, cost: costs.length ? mean(costs) : null,
    problems: sc.flatMap(t => problems(t).map(g => ({ t, g }))) };
}

function verdictList(m) {

      (s.unsafe ? `; ${np} unsafe ${np === 1 ? "problem" : "problems"} in ${s.unsafe} ${s.unsafe === 1 ? "attempt" : "attempts"}.` : ", with no unsafe recommendations.");
  const rows = CASES.map(c => {
    const ts = trialsFor(m, c.id); if (!ts.length) return "";
    let body;
    if (ts.every(t => statusOf(t) === "pass")) body = `Passed ${ts.length === 2 ? "both" : "all"} (${ts.map(t => t.score).join(", ")})`;
    else body = ts.map(t => { const k = statusOf(t), a = `Attempt ${t.attempt}`;

    return `<li><b>Case ${caseNo(c.id)}</b><span>${body}</span></li>`;
  }).join("");
  return `<p>${esc(head)}</p><ul>${rows}</ul>`;
}

/* ---------- 3. coverage grid (GitHub-style), models side by side ---------- */
function domainShare(t, d) {
  const its = (t.items || []).filter(i => i.domain === d);
  const max = its.filter(i => i.kind !== "must_not").reduce((a, i) => a + i.points, 0);
  let got = 0; for (const i of its) got += i.kind === "must_not" ? (i.met ? -i.points : 0) : (i.met ? i.points : 0);
  const err = its.some(i => (i.error || (i.missed && i.kind === "must")) && i.severity === "dangerous");
  return { has: its.length > 0, share: max ? Math.max(0, got) / max : (its.some(i => i.error) ? 0 : 1), err, its };
}
const usedDomains = () => D.domains.filter(d => CASES.some(c => (c.domains || []).includes(d.key)) || TRIALS.some(t => (t.items || []).some(i => i.domain === d.key)));

    ${keyItem(`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="3" fill="url(#hatch)"/></svg>`, "Did not run")}</div>`));

function chartTime() {

/* ---------- review storage: shared store when published, browser + export when local ---------- */
const REVIEW = { mode: "local", mine: { findings: {}, trials: {} }, all: {}, me: null, db: null, write: null, profiles: null };
const LKEY = "oncoworld-report:" + D.runs.map(r => r.name).join("+");
function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LKEY) || "null"); if (v) REVIEW.mine = v; } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(REVIEW.mine)); } catch (e) {} }
let pending = null, writing = false;
async function persist() {
  if (REVIEW.mode !== "db") { saveLocal(); setStore(); return; }
  pending = JSON.parse(JSON.stringify(REVIEW.mine)); if (writing) return;
  writing = true;
  while (pending) { const body = pending; pending = null;
    try { await REVIEW.db.doc("reviews/" + REVIEW.me).set({ ...body, updated: new Date().toISOString() }); setStore("Saved"); }
    catch (e) { if (e && e.code === "invalid_argument") { REVIEW.mode = "readonly"; setStore(); } else setStore("Not saved: " + (e && e.message || "error")); } }
  writing = false;
}
function setStore(msg) {
  const t = { local: "Your verdicts are kept in this browser. Use Export to send them.", db: "Your verdicts are saved to this report and visible to the other reviewers.",
    readonly: "You can read the reviews, but your sharing level does not allow saving verdicts. Ask the owner for Contributor access." }[REVIEW.mode];
  document.querySelectorAll(".store").forEach(n => n.textContent = msg ? `${msg}. ${t}` : t);
}
function tally(kind, key) {
  const counts = {}; let n = 0;
  for (const [uid, r] of Object.entries(REVIEW.all)) { const v = r?.[kind]?.[key]?.v; if (v) { counts[v] = (counts[v] || 0) + 1; n++; } }
  return n ? Object.entries(counts).map(([v, c]) => `${c} ${v}`).join(", ") : "";
}
function reviewControls(kind, key, choices) {
