const D = {"case": "dlbcl_0003", "card": {"title": "Stage IV DLBCL with kidney-adrenal involvement and rising creatinine", "patient": "67M with 6 wk epigastric/LUQ pain, drenching night sweats and 8 kg weight loss; ECOG 2, T2DM on metformin, taking ibuprofen 400 mg QID. PET-CT: 9.4 cm retroperitoneal/mesenteric mass plus FDG-avid R kidney, L adrenal and liver lesions; GCB DLBCL (MYC 20%, BCL2 30%, FISH negative), marrow negative, LDH 1,290, uric acid 10.4, creatinine 1.1 -> 1.5.", "tests": ["Kidney, adrenal and liver lesions are extranodal organ disease, so stage IV, IPI 5/5 and CNS-IPI 6/6.", "MYC 20% / BCL2 30% with negative FISH: neither double-expressor nor double-hit, so no intensified regimen such as DA-EPOCH-R.", "ECOG 2 is disease-related in a patient who wants cure: full-dose Pola-R-CHP (or R-CHOP) x6 after a steroid prephase, not mini-CHOP or palliation.", "Uric acid 10.4, LDH >5x ULN and rising creatinine mean high TLS risk: IV hydration, rasburicase after G6PD check, TLS labs every 6-12 hours for the first 72 hours, stop NSAIDs.", "High CNS risk: MRI brain and LP with CSF cytology/flow now; HD-MTX only as an individualized option once renal function recovers and NSAIDs are stopped."], "correct_plan": "Curative full-dose Pola-R-CHP x6 (R-CHOP acceptable) after a 5-7 day prednisone 100 mg prephase, with admission for TLS prophylaxis (IV fluids, rasburicase after G6PD, TLS labs q6-12h), stopping ibuprofen, pegfilgrastim every cycle and a steroid glucose plan. Baseline MRI brain and LP; HD-MTX prophylaxis individualized and deferred until renal recovery; end-of-treatment PET-CT read by Lugano/Deauville."}, "facts": {"who": "Robert Sample (synthetic), 67-year-old male, ECOG 2", "problems": ["Type 2 diabetes mellitus", "Essential hypertension", "Gout", "Hyperlipidemia", "Benign prostatic hyperplasia"], "medications": ["Metformin 1000 mg tablet, 1 tablet by mouth twice daily", "Lisinopril 20 mg tablet, 1 tablet by mouth daily", "Atorvastatin 40 mg tablet, 1 tablet by mouth nightly", "Tamsulosin 0.4 mg capsule, 1 capsule by mouth nightly", "Ibuprofen 400 mg tablet, 1 tablet by mouth three to four times daily as needed for abdominal pain (patient-reported, started August 2026)"], "allergies": ["Sulfonamide antibiotics: Generalized maculopapular rash (2009)"], "abnormal_labs": [{"test": "Creatinine", "value": "1.5 mg/dL", "ref": "0.7-1.3", "flag": "H", "date": "2026-09-16"}, {"test": "eGFR (CKD-EPI 2021)", "value": "50 mL/min/1.73m2", "ref": ">=60", "flag": "L", "date": "2026-09-16"}, {"test": "Hemoglobin", "value": "9.9 g/dL", "ref": "13.5-17.5", "flag": "L", "date": "2026-09-03"}, {"test": "Platelets", "value": "145 x10^3/uL", "ref": "150-400", "flag": "L", "date": "2026-09-03"}, {"test": "BUN", "value": "28 mg/dL", "ref": "7-20", "flag": "H", "date": "2026-09-03"}, {"test": "Glucose", "value": "168 mg/dL", "ref": "70-99", "flag": "H", "date": "2026-09-03"}, {"test": "Albumin", "value": "3.1 g/dL", "ref": "3.5-5.0", "flag": "L", "date": "2026-09-03"}, {"test": "Alkaline phosphatase", "value": "168 U/L", "ref": "40-129", "flag": "H", "date": "2026-09-03"}, {"test": "Uric acid", "value": "10.4 mg/dL", "ref": "3.4-7.0", "flag": "H", "date": "2026-09-16"}, {"test": "Phosphorus", "value": "4.6 mg/dL", "ref": "2.5-4.5", "flag": "H", "date": "2026-09-16"}, {"test": "LDH", "value": "1,290 U/L", "ref": "135-225", "flag": "H", "date": "2026-09-16"}, {"test": "Beta-2 microglobulin", "value": "4.8 mg/L", "ref": "0.8-2.2", "flag": "H", "date": "2026-09-03"}, {"test": "Hemoglobin A1c", "value": "7.4 %", "ref": "4.0-5.6", "flag": "H", "date": "2026-09-03"}], "pathology": ["IHC CD20: positive", "IHC CD10: positive", "IHC BCL6: positive", "IHC MUM1: negative", "IHC BCL2: 30%", "IHC MYC: 20%", "IHC KI67: 70%", "FISH MYC: no rearrangement", "FISH BCL2: no rearrangement", "FISH BCL6: no rearrangement"], "documents": [{"title": "Primary care referral to hematology-oncology", "date": "2026-08-18", "text": "Reason for referral: abnormal CT, suspected lymphoma.\n\nMr. Sample is a 67-year-old retired electrician with T2DM, HTN, gout and BPH. Six weeks of\nepigastric/left upper quadrant pain, early satiety, drenching night sweats most nights, and about 8 kg\nunintentional weight loss over two months (79 -> 71 kg). Started OTC ibuprofen for the pain.\n\nCT abdomen/pelvis with IV contrast 2026-08-15 (outside facility): large retroperitoneal and mesenteric\nsoft-tissue mass encasing the aorta and IVC, a right renal cortical mass, a left adrenal mass and a\nsmall hypodense liver lesion. No hydronephrosis. Impression: lymphoma favored; metastatic carcinoma\nless likely.\n\nPlease see urgently. Labs from this visit attached by the patient portal."}, {"title": "Hematology-oncology new patient consultation", "date": "2026-09-02", "text": "HPI: 67M referred for retroperitoneal mass. Symptoms as per referral, worse over the last two weeks;\nnow spends most of the afternoon resting but walks around the house and manages his own self-care.\nTaking ibuprofen 400 mg three to four times a day. No headache, visual change, confusion, focal\nweakness, numbness or bladder/bowel change. No testicular swelling. No cough or dyspnea.\n\nPMH: T2DM (2014), HTN (2011), gout (2019, two flares, no urate-lowering therapy), hyperlipidemia,\nBPH. No prior cancer, no prior chemotherapy or radiation. No known heart disease.\nMedications: see medication list.\nAllergies: sulfonamide antibiotics (rash).\nSocial: retired electrician, lives with his wife; daughter lives nearby. Former smoker, 30 pack-years,\nquit 2010. Two drinks per week. Lives 45 minutes' drive from the cancer center; wife drives.\nFamily history: father with prostate cancer at 78.\n\nExam: T 37.9 C, HR 96, BP 128/76, RR 16, SpO2 97% RA. Weight 71 kg, height 175 cm (BSA 1.86 m2).\nThin, tired-appearing. No palpable cervical, supraclavicular, axillary or inguinal lymphadenopathy.\nAbdomen: fullness and tenderness in the epigastrium and left upper quadrant; liver edge 2 cm below the\ncostal margin; spleen not palpable. Testes normal without masses. Neuro: alert and oriented, cranial\nnerves intact, strength 5/5 throughout, no sensory deficit.\n\nECOG performance status 2.\n\nPlan today: labs incl. LDH, uric acid, viral serologies; FDG PET-CT; echocardiogram; CT-guided core\nbiopsy of the retroperitoneal mass; bone marrow biopsy. Return after results."}, {"title": "FDG PET-CT, skull base to mid-thigh", "date": "2026-09-05", "text": "CLINICAL INDICATION: Retroperitoneal mass, suspected lymphoma. Initial staging.\n\nTECHNIQUE: 10.2 mCi 18F-FDG IV; uptake time 62 minutes; serum glucose at injection 142 mg/dL.\nLow-dose non-contrast CT for attenuation correction and localization. Mediastinal blood pool SUVmax\n2.1; liver SUVmax 2.9.\n\nFINDINGS:\nHead and neck: physiologic brain uptake (PET is insensitive for intracranial disease). No\nFDG-avid cervical or supraclavicular lymph nodes.\nChest: no FDG-avid mediastinal, hilar or axillary nodes. 4 mm right upper lobe pulmonary nodule,\nbelow PET resolution, not FDG-avid. No effusion.\nAbdomen and pelvis:\n- Conglomerate retroperitoneal (para-aortic and aortocaval) and mesenteric nodal mass,\n  9.4 x 6.8 cm, SUVmax 24.1, encasing the aorta and IVC without occlusion.\n- Right renal cortical lesion, 3.2 cm, SUVmax 19.6.\n- Left adrenal mass, 2.6 cm, SUVmax 17.2.\n- Hepatic segment VI lesion, 1.8 cm, SUVmax 15.0.\n- Spleen normal in size (11 cm) without focal uptake.\n- No hydronephrosis. No ascites.\n- No FDG-avid pelvic or inguinal nodes.\nMusculoskeletal: no focal osseous or marrow FDG uptake.\nTestes: no abnormal uptake.\n\nIMPRESSION:\n1. Intensely FDG-avid retroperitoneal and mesenteric nodal mass with FDG-avid lesions in the right\n   kidney, left adrenal gland and liver, consistent with lymphoma. Tissue confirmation pending.\n2. No FDG-avid disease above the diaphragm.\n3. Incidental 4 mm right upper lobe nodule, indeterminate given size."}, {"title": "Transthoracic echocardiogram", "date": "2026-09-09", "text": "Indication: baseline before possible anthracycline-containing chemotherapy.\nLeft ventricle normal in size with normal wall thickness. LVEF 60% (biplane Simpson's).\nNo regional wall-motion abnormality. Grade I diastolic dysfunction. Global longitudinal strain -19%.\nValves without significant stenosis or regurgitation. No pericardial effusion."}, {"title": "Surgical pathology: CT-guided core biopsy, retroperitoneal mass", "date": "2026-09-12", "text": "SPECIMEN: Retroperitoneal mass, CT-guided core needle biopsy (four 18-gauge cores), collected\n2026-09-10.\n\nFINAL DIAGNOSIS: DIFFUSE LARGE B-CELL LYMPHOMA, NOT OTHERWISE SPECIFIED.\n\nMICROSCOPIC: Diffuse sheets of large atypical lymphoid cells with vesicular chromatin and prominent\nnucleoli; frequent mitoses and focal necrosis. No starry-sky pattern.\n\nIMMUNOHISTOCHEMISTRY (adequate controls):\n  CD20       positive (diffuse, strong)\n  PAX5       positive\n  CD3        negative in tumor cells (scattered background T cells)\n  CD5        negative\n  CD10       positive (diffuse)\n  BCL6       positive\n  MUM1/IRF4  negative (<10% of tumor cells)\n  BCL2       positive in approximately 30% of tumor cells\n  MYC        positive in approximately 20% of tumor cells\n  Cyclin D1  negative\n  CD30       negative\n  Ki-67      approximately 70%\n  EBER ISH   negative\n\nCOMMENT: Germinal-center B-cell-like immunophenotype by the Hans algorithm. FISH for MYC, BCL2 and\nBCL6 rearrangements has been requested on block A1; results will be reported in an addendum.\n\nADDENDUM (2026-09-16): FISH, interphase, break-apart probes, 200 nuclei scored.\n  MYC (8q24):   no rearrangement detected\n  BCL2 (18q21): no rearrangement detected\n  BCL6 (3q27):  no rearrangement detected\nThe final diagnosis is unchanged."}, {"title": "Bone marrow aspirate and biopsy, right posterior iliac crest", "date": "2026-09-13", "text": "Collected 2026-09-11. Core length 1.8 cm, adequate. Normocellular marrow for age (about 40%) with\ntrilineage hematopoiesis. No lymphoma identified on morphology or CD20/PAX5 immunostains. Flow\ncytometry of the aspirate: no monotypic B-cell population. Iron stores adequate.\nDIAGNOSIS: No involvement by lymphoma."}, {"title": "Hematology-oncology follow-up (results visit, pre-tumor board)", "date": "2026-09-17", "text": "Results reviewed with the patient, his wife and daughter. Biopsy shows DLBCL; FISH addendum received.\nAbdominal pain is worse; he is now taking ibuprofen 400 mg four times daily. Night sweats persist.\nWeight 70.2 kg. Still independent in self-care, resting much of the afternoon. No headache, vomiting,\nconfusion or new neurological symptoms. Urine output normal per patient.\n\nExam: T 37.6 C, HR 92, BP 122/74. Unchanged abdominal tenderness. Neuro exam non-focal.\n\nRepeat labs 2026-09-16 reviewed (see results).\n\nPatient goals: wants treatment aimed at cure. His granddaughter's wedding is in mid-December and he\nvery much wants to attend. Concerned about the 45-minute drive for frequent visits.\n\nCase to be presented at lymphoma tumor board 2026-09-18 for a treatment plan; no treatment started yet."}]}, "plan": [{"field": "Diagnosis", "text": "Diffuse large B-cell lymphoma, NOS, germinal-center B-cell (GCB) phenotype by the Hans algorithm (CD10+, BCL6+, MUM1-). EBER negative; CD5 negative."}, {"field": "Stage", "text": "Lugano (Ann Arbor) stage IV with B symptoms (drenching night sweats, ~10% weight loss): extranodal organ involvement of the right kidney, left adrenal gland and liver in addition to retroperitoneal/mesenteric nodal disease. Bone marrow negative, which does not change stage IV. Largest mass 9.4 cm, just below the 10 cm bulk definition used in Lugano."}, {"field": "Biology", "text": "Not double-expressor: MYC 20% and BCL2 30% by IHC are below the 40%/50% thresholds. Not double-hit: FISH shows no MYC, BCL2 or BCL6 rearrangement, so this is not high-grade B-cell lymphoma with MYC and BCL2 rearrangements. Ki-67 ~70%."}, {"field": "Prognosis", "text": "IPI 5 of 5, high risk: age >60, LDH elevated (1,290 U/L, >5x ULN), ECOG 2, stage IV, and more than one extranodal site (kidney, adrenal, liver). CNS-IPI 6 of 6 (adds kidney/adrenal involvement), high risk of CNS relapse (~10-12% at 2 years)."}, {"field": "First-line treatment", "text": "Curative-intent immunochemotherapy. Recommend Pola-R-CHP for 6 cycles as preferred (IPI >=2, age 18-80, ECOG 2 were POLARIX-eligible); R-CHOP for 6 cycles is an acceptable alternative. Start promptly given rising LDH and creatinine. Give a steroid prephase of prednisone 100 mg daily for 5-7 days before cycle 1 because of age >60, ECOG 2 and high tumor burden; it lowers first-cycle toxicity and often improves performance status. Full doses are appropriate: ECOG 2 is disease-related, so a dose-reduced regimen is not indicated. DA-EPOCH-R is not indicated."}, {"field": "CNS risk", "text": "High CNS-relapse risk because of kidney/adrenal involvement and CNS-IPI 6. Before or with cycle 1: contrast MRI brain and lumbar puncture with CSF cytology and flow cytometry to exclude occult CNS disease. CNS prophylaxis with high-dose methotrexate is an individualized option; recent data question its benefit, which should be discussed with the patient. If chosen, defer it until renal function recovers and NSAIDs are stopped (creatinine 1.5, eGFR 50 with renal involvement makes HD-MTX unsafe now), then give 2 cycles at >=3 g/m2 intercalated or after immunochemotherapy. Intrathecal therapy alone is not adequate prophylaxis for parenchymal relapse."}, {"field": "Response assessment", "text": "FDG PET-CT at the end of treatment (6-8 weeks after the last cycle), read with Lugano 2014 criteria and the Deauville 5-point scale; Deauville 1-3 is a complete metabolic response. An interim PET-CT after cycles 2-4 is optional and should not change therapy unless it shows progression. Biopsy residual Deauville 4-5 uptake if it would change management."}, {"field": "Pre-treatment work-up", "text": "Hepatitis B serology done: HBsAg and anti-HBc nonreactive (anti-HBs reactive from vaccination), so no antiviral prophylaxis is needed before rituximab. HCV and HIV nonreactive. Echo LVEF 60%, so anthracycline is permitted. Outstanding: contrast MRI brain, lumbar puncture with CSF cytology/flow, G6PD level before rasburicase, and urinalysis/urine protein to assess the creatinine rise."}, {"field": "Supportive care", "text": "High tumor lysis syndrome risk (uric acid 10.4, LDH >5x ULN, creatinine rising 1.1 -> 1.5, potassium 5.0, phosphate 4.6). TLS prophylaxis: admit for cycle 1 (or the prephase), with aggressive IV hydration, rasburicase rather than allopurinol given hyperuricemia with renal impairment (check G6PD first), and TLS labs (K, phosphate, calcium, uric acid, creatinine, LDH) every 6-12 hours for 72 hours. Stop ibuprofen and all NSAIDs now (nephrotoxic with rising creatinine; they interact with methotrexate); use acetaminophen plus an opioid for pain. Hold lisinopril during hydration/TLS risk. Primary G-CSF prophylaxis (pegfilgrastim) with every cycle, since age >=65 (an on-body injector avoids an extra 45-minute trip). Prednisone will cause hyperglycemia in this diabetic patient: monitor glucose, use an insulin correction plan, and hold metformin during the AKI and IV hydration. Antiemetics per regimen. PJP prophylaxis is not routinely needed; note the sulfonamide allergy if it is ever considered."}, {"field": "Fitness and goals", "text": "ECOG 2 is disease-related (pain, B symptoms, tumor burden) and expected to improve with the prephase and treatment, so it is not a reason to de-escalate curative therapy; there are no significant cardiac or other comorbidities limiting full-dose therapy. The patient's goal is cure, and full-dose therapy is aligned with it. Six 21-day cycles starting late September would finish around the mid-December wedding; discuss timing so the nadir avoids the event. Arrange transport support for the 45-minute drive."}, {"field": "Missing information", "text": ["Contrast MRI brain and CSF cytology/flow cytometry (CNS staging not yet done)", "G6PD status before rasburicase", "Urinalysis and urine protein to assess the cause of the creatinine rise (renal involvement vs NSAID/ACE inhibitor effect)", "Patient's view on CNS prophylaxis after an informed discussion of uncertain benefit"]}], "domains": [{"key": "diagnosis", "label": "Diagnosis"}, {"key": "staging", "label": "Staging"}, {"key": "molecular_classification", "label": "Molecular classification"}, {"key": "prognosis", "label": "Prognostic scores"}, {"key": "first_line_treatment", "label": "First-line treatment"}, {"key": "cns_management", "label": "CNS risk and prophylaxis"}, {"key": "pretreatment_workup", "label": "Pre-treatment work-up"}, {"key": "supportive_care", "label": "Supportive care"}, {"key": "response_assessment", "label": "Response assessment"}, {"key": "fitness_and_goals", "label": "Fitness and goals of care"}, {"key": "missing_information", "label": "Missing information"}], "items": [{"id": "dx_dlbcl_gcb", "domain": "diagnosis", "kind": "must", "severity": "important", "points": 6, "label": "Diagnoses DLBCL, NOS, germinal-center B-cell (GCB) subtype", "why": "CD10+, BCL6+, MUM1- biopsy defines GCB DLBCL; correct diagnosis anchors regimen choice and prognosis.", "criterion": "The response states the diagnosis is diffuse large B-cell lymphoma (NOS) with a germinal-center B-cell (GCB) phenotype.", "met": 13, "n": 13}, {"id": "stage_iv", "domain": "staging", "kind": "must", "severity": "dangerous", "points": 8, "label": "Stages the disease as Lugano/Ann Arbor stage IV", "why": "Kidney, adrenal and liver organ involvement make this stage IV; it drives IPI, CNS risk and treatment intensity.", "criterion": "The response stages the disease as Lugano/Ann Arbor stage IV.", "met": 13, "n": 13}, {"id": "stage_extranodal_sites", "domain": "staging", "kind": "should", "severity": "minor", "points": 3, "label": "Attributes stage IV to kidney, adrenal and liver involvement", "why": "Naming these extranodal organs shows the stage is earned correctly and flags the kidney/adrenal CNS-risk sites.", "criterion": "The response attributes stage IV to extranodal organ involvement of the kidney, adrenal gland and liver.", "met": 13, "n": 13}, {"id": "stage_b_symptoms", "domain": "staging", "kind": "should", "severity": "minor", "points": 2, "label": "Notes B symptoms (night sweats, weight loss or fevers)", "why": "Drenching sweats and ~10% weight loss confirm stage IVB and active, symptomatic disease needing prompt treatment.", "criterion": "The response notes B symptoms (night sweats and/or weight loss >10% or fevers).", "met": 13, "n": 13}, {"id": "mn_stage_below_iv", "domain": "staging", "kind": "must_not", "severity": "dangerous", "points": 0, "label": "Stages the disease below IV (stage I, II or III)", "why": "Understaging ignores organ involvement, underestimates IPI and CNS risk, and could lead to undertreatment.", "criterion": "The response assigns this patient a stage lower than IV (stage I, II or III).", "met": 0, "n": 13}, {"id": "mol_not_de_not_dh", "domain": "molecular_classification", "kind": "must", "severity": "important", "points": 6, "label": "States not double-expressor (MYC 20%, BCL2 30%) nor double-hit (FISH negative)", "why": "Below-threshold IHC and negative FISH mean standard Pola-R-CHP/R-CHOP applies, not an intensified high-grade approach.", "criterion": "The response states the lymphoma is neither double-expressor (MYC 20%, BCL2 30% below thresholds) nor double-hit (FISH negative for MYC, BCL2 and BCL6 rearrangements).", "met": 13, "n": 13}, {"id": "mn_calls_double_hit", "domain": "molecular_classification", "kind": "must_not", "severity": "dangerous", "points": 0, "label": "Calls this double-hit lymphoma with MYC and BCL2 rearrangements", "why": "FISH is negative; mislabelling as double-hit would push toward unnecessary, more toxic intensified chemotherapy.", "criterion": "The response classifies this lymphoma as double-hit / high-grade B-cell lymphoma with MYC and BCL2 rearrangements.", "met": 0, "n": 13}, {"id": "mn_calls_double_expressor", "domain": "molecular_classification", "kind": "must_not", "severity": "important", "points": 5, "label": "Calls this lymphoma double-expressor", "why": "MYC 20% and BCL2 30% are below thresholds; the label misstates prognosis and may prompt escalation.", "criterion": "The response classifies this lymphoma as double-expressor.", "met": 0, "n": 13}, {"id": "prog_ipi_high", "domain": "prognosis", "kind": "must", "severity": "important", "points": 6, "label": "Calculates IPI 5 (or high-risk IPI 4-5)", "why": "Age >60, high LDH, ECOG 2, stage IV and multiple extranodal sites; supports Pola-R-CHP and close monitoring.", "criterion": "The response calculates IPI as 5 (or explicitly high-risk IPI 4-5): age >60, elevated LDH, ECOG >=2, stage IV, >1 extranodal site.", "met": 13, "n": 13}, {"id": "prog_cns_ipi_high", "domain": "prognosis", "kind": "must", "severity": "important", "points": 6, "label": "Calculates CNS-IPI 6 or high risk, counting kidney/adrenal involvement", "why": "Kidney/adrenal disease plus IPI factors give roughly 10-12% CNS relapse risk, mandating CNS staging and a prophylaxis discussion.", "criterion": "The response calculates CNS-IPI as 6 or high risk (4-6), counting kidney/adrenal involvement.", "met": 13, "n": 13}, {"id": "tx_curative_pola_or_rchop", "domain": "first_line_treatment", "kind": "must", "severity": "dangerous", "points": 8, "label": "Recommends curative full-dose Pola-R-CHP or R-CHOP for 6 cycles", "why": "Fit-for-cure patient with high-risk disease; six full-dose cycles offer the best chance of cure.", "criterion": "The response recommends curative-intent full-dose immunochemotherapy with Pola-R-CHP or R-CHOP for 6 cycles.", "met": 13, "n": 13}, {"id": "tx_pola_preferred", "domain": "first_line_treatment", "kind": "should", "severity": "minor", "points": 3, "label ses the chance of cure.", "criterion": "The response recommends a dose-reduced regimen (e.g. R-mini-CHOP) as the initial plan, despite age 67 and disease-related ECOG 2.", "met": 0, "n": 13}, {"id": "cns_risk_addressed", "domain": "cns_management", "kind": "must", "severity": "dangerous", "points": 4, "label": "Identifies high CNS-relapse risk from kidney/adrenal involvement and CNS-IPI", "why": "Recognising this risk triggers baseline CNS staging and an informed prophylaxis discussion before treatment starts.", "criterion": "The response identifies a high risk of CNS relapse driven by kidney/adrenal involvement and high CNS-IPI.", "met": 13, "n": 13}, {"id": "cns_staging_mri_csf", "domain": "cns_management", "kind": "must", "severity": "important", "points": 5, "label": "Orders contrast MRI brain and LP with CSF cytology and flow", "why": "Occult CNS disease must be excluded now; finding it would change the regimen entirely.", "criterion": "The response recommends baseline CNS evaluation: contrast MRI brain and lumbar puncture with CSF cytology and flow cytometry.", "met": 7, "n": 13}, {"id": "cns_prophylaxis_renal", "domain": "cns_management", "kind": "should", "severity": "important", "points": 4, "label": "Discusses CNS prophylaxis (e.g. HD-MTX) as individualized, tied to renal function/NSAIDs", "why": "Benefit is uncertain, and HD-MTX is unsafe with creatinine 1.5, renal involvement and ongoing ibuprofen.", "criterion": "The response discusses CNS prophylaxis (e.g. high-dose methotrexate) as an individualized option with uncertain benefit and ties its feasibility to renal function / stopping NSAIDs.", "met": 11, "n": 13}, {"id": "mn_hdmtx_now_despite_aki", "domain": "cns_management", "kind": "must_not", "severity": "important", "points": 4, "label": "Schedules HD-MTX now (e.g. with cycle 1) ignoring rising creatinine/NSAIDs", "why": "Methotrexate with falling eGFR, renal lymphoma and NSAIDs risks severe nephrotoxicity and delayed clearance.", "criterion": "The s rasburicase for hyperuricemia with renal impairment, checking G6PD first", "why": "Rasburicase lowers urate rapidly to protect the kidneys; G6PD deficiency risks hemolysis and methemoglobinemia.", "criterion": "The response favors rasburicase (given hyperuricemia with renal impairment) and checks G6PD before giving it.", "met": 10, "n": 13}, {"id": "sup_gcsf", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 4, "label": "Recommends primary G-CSF (e.g. pegfilgrastim) every cycle, given age >=65", "why": "Age >=65 on anthracycline-based therapy carries high febrile neutropenia risk that threatens dose intensity.", "criterion": "The response recommends primary G-CSF prophylaxis (e.g. pegfilgrastim) with each cycle, given age >=65.", "met": 13, "n": 13}, {"id": "sup_stop_nsaid", "domain": "supportive_care", "kind": "should", "severity": "important", "points": 3, "label": "Stops ibuprofen/NSAIDs and offers alternative analgesia", "why": "NSAIDs worsen rising creatinine before TLS-risk chemotherapy and interact with methotrexate; pain still needs control.", "criterion": "The response stops ibuprofen/NSAIDs (nephrotoxic with rising creatinine; interacts with methotrexate) and offers alternative analgesia.", "met": 13, "n": 13}, {"id": "sup_steroid_glucose", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 2, "label": "Plans for steroid hyperglycemia or adjusts metformin for falling eGFR", "why": "Diabetic on metformin facing high-dose prednisone and AKI: risk of hyperglycemia and metformin accumulation.", "criterion": "The response anticipates steroid-induced hyperglycemia in this diabetic patient (glucose monitoring / insulin plan) or adjusts metformin for falling eGFR.", "met": 13, "n": 13}, {"id": "work_hbv_reviewed", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 2, "label": "Confirms HBsAg and anti-HBc nonreactive, so no antiviral prophylaxis needed", "why": "HBV status must be checked before rituximab; here negative serology means no entecavir is required.", "criterion": "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) so no antiviral prophylaxis is needed before rituximab.", "met": 12, "n": 13}, {"id": "work_echo_reviewed", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 1, "label": "Notes baseline LVEF 60% permits anthracycline", "why": "Normal ejection fraction confirms he can safely receive the doxorubicin in Pola-R-CHP or R-CHOP.", "criterion": "The response notes the baseline LVEF of 60% permits anthracycline.", "met": 13, "n": 13}, {"id": "fit_ecog_disease_related", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 4, "label": "Judges ECOG 2 disease-related, not a reason to de-escalate; honours cure goal", "why": "His decline is from lymphoma and should improve with treatment; he explicitly wants curative therapy.", "criterion": "The response judges ECOG 2 as disease-related and not a reason to de-escalate curative therapy, and acknowledges the patient's goal of cure.", "met": 13, "n": 13}], "questions": [{"id": "tls_threshold", "items": ["sup_tls_prophylaxis", "sup_rasburicase_g6pd"], "question": "Uric acid 10.4, LDH more than 5x the upper limit, creatinine rising 1.1 to 1.5. Several notes give IV hydration plus allopurinol, rasburicase only if uric acid stays above 8 (after G6PD), and 'frequent' TLS labs with no interval. Is that adequate TLS prophylaxis?", "context": "Today this is an unsafe-error item. The checklist asks for a uric-acid-lowering drug and labs every 6-12 hours for 72 hours. The two graders split on exactly these notes.", "options": ["Adequate as written", "Needs rasburicase up front", "Needs labs every 6-12 h", "Needs both"]}, {"id": "prephase", "items": ["tx_prephase_steroid"], "question": "Is a prednisone prephase (about 100 mg for 5-7 days) required for this 67-year-old with ECOG 2 and bulky high-risk disease?", "context": "Today it is required but not unsafe (4 points). Missing it was the most common real error: about half of the model notes left it out.", "options": ["Keep: required, not unsafe", "Make it an unsafe error", "Make it recommended only"]}, {"id": "cns_staging", "items": ["cns_staging_mri_csf"], "question": "Many notes order a lumbar puncture (CSF cytology and flow) but no baseline brain MRI, or an MRI only if symptoms appear. Does that meet CNS staging for this CNS-IPI 6 patient?", "context": "Today the item requires both MRI brain and CSF studies.", "options": ["MRI and CSF both required", "CSF alone is acceptable", "Either is acceptable"]}, {"id": "hdmtx_aki", "items": ["mn_hdmtx_now_despite_aki"], "question": "Giving high-dose methotrexate from cycle 1 despite creatinine 1.5, renal involvement and ongoing NSAIDs: how serious an error is that?", "context": "Today it costs 4 points and does not fail the note.", "options": ["Keep as a 4-point error", "Make it an unsafe error (fails the note)"]}, {"id": "stage_range", "items": ["stage_iv", "mn_stage_below_iv"], "question": "A note that writes 'stage III-IV' or 'III/IV' without committing to one stage: does it meet 'stages the disease IV'?", "context": "Today a range does not count as a stage call, so the note fails the unsafe-error stage item.", "options": ["A range does not count (keep)", "A range counts as stage IV"]}, {"id": "pola_vs_rchop", "items": ["tx_curative_pola_or_rchop", "tx_pola_preferred"], "question": "Full-dose R-CHOP x6 is accepted as curative treatment, and Pola-R-CHP earns a small 3-point bonus. Is that the right balance for this IPI 5 patient?", "context": "", "options": ["Agree", "Pola-R-CHP should be required", "No bonus: both equal"]}], "examples": [{"key": "3model_fhir5_r2__XnBr6qg#cns_risk_addressed", "item": "cns_risk_addressed", "model": "Claude Haiku 5.5", "quote": "The renal and adrenal involvement is the most specific CNS-risk feature in this case.", "ai_verdict": tr const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const H = h => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };

/* ---- saved verdicts: shared store when published, this browser when opened as a file ---- */
const R = { mode: "local", mine: { items: {}, questions: {}, examples: {} }, db: null, me: null };
const LKEY = "oncoworld-case-review:" + D.case;
try { const v = JSON.parse(localStorage.getItem(LKEY) || "null"); if (v) R.mine = v; } catch (e) {}
let pending = null, writing = false;
async function save() {
  updateProgress();
  if (R.mode !== "db") { try { localStorage.setItem(LKEY, JSON.stringify(R.mine)); } catch (e) {} setStore(); return; }
  pending = JSON.parse(JSON.stringify(R.mine)); if (writing) return; writing = true;
  while (pending) { const body = pending; pending = null;
    try { await R.db.doc("case_reviews/" + R.me).set({ ...body, case: D.case, rubric_version: D.rubric_version, updated: new Date().toISOString() }); setStore("Saved"); }
    catch (e) { setStore("Not saved: " + (e && e.message || "error")); } }
  writing = false;
}
function setStore(msg) {
  const t = R.mode === "db" ? "Your answers are saved to this page as you go." : "Your answers are kept in this browser.";
  document.querySelectorAll(".store").forEach(n => n.textContent = msg ? `${msg}. ${t}` : t);
}
function decide(kind, key, choices) {
  const cur = R.mine[kind][key] || {};
  const box = H(`<div class="decide" role="group" aria-label="Your decision"></div>`);
  for (const [v, label] of choices) {
    const b = H(`<button type="button" aria-pressed="${cur.v === v}">${esc(label)}</button>`);
    b.onclick = () => { const r = R.mine[kind][key] || {}; r.v = r.v === v ? undefined : v;
      if (!r.v && !r.note) delete R.mine[kind][key]; else R.mine[kind][key] = r;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b && !!r.v)); save(); };
    box.append(b);
  }
  const ta = H(`<textarea placeholder="Note or suggested change (optional)" aria-label="Note">${esc(cur.note || "")}</textarea>`);
  let tm; ta.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { const r = R.mine[kind][key] || {}; r.note = ta.value; R.mine[kind][key] = r; save(); }, 600); };
  box.append(ta);
  return box;
}
const TOTAL = D.items.length + D.questions.length + D.examples.length;
function updateProgress() {
  const n = ["items", "questions", "examples"].reduce((a, k) => a + Object.values(R.mine[k]).filter(r => r && r.v).length, 0);
  $("#done-count").textContent = `${n} of ${TOTAL} decisions`;
  $("#done-bar").style.width = (100 * n / TOTAL) + "%";
}

/* ---- header ---- */
function header() {
  const unsafe = D.items.filter(i => i.severity === "dangerous").length;
  $("#top").append(
    H(`<div class="eyebrow">Oncologist sign-off · ${esc(D.case)} · rubric ${esc(D.rubric_version || "")}</div>`),
    H(`<h1>${esc(D.card.title || D.case)}</h1>`),
    H(`<div class="callout"><h3>What we need from you (about 45 minutes)</h3>
      <ul class="small">
        <li><b>Parts 1 and 2:</b> read the patient and the reference plan. Nothing to decide yet.</li>
        <li><b>Part 3:</b> for each of the ${D.items.length} checklist items, choose <i>Agree</i>, <i>Change</i> or <i>Delete</i>. The ${unsafe} items marked
          <span class="tag t-unsafe">Unsafe error</span> matter most: missing one, or committing one, sets the whole note to 0.</li>
        <li><b>Part 4:</b> ${D.questions.length} specific clinical questions where the checklist needs your call.</li>
        <li><b>Part 5:</b> ${D.examples.length} real sentences from AI-written notes where grading was uncertain: did they meet the item?</li>
      </ul>
      <p class="tiny ink2">This is a synthetic patient. The checklist decides how AI models are scored; your answers become the standard the grader is held to. Pass mark: ${D.pass_mark} of 100.</p>
      <p class="store"></p></div>`));
}

/* ---- 1 patient ---- */
function patient() {
  const f = D.facts, s = $("#patient");
  s.append(H(`<h2><span class="n">1</span>The patient</h2>`));
  s.append(H(`<p>${esc(D.card.patient || "")}</p>`));
  s.append(H(`<div class="grid2">
    <div class="card"><h3>Background</h3><p class="small"><b>${esc(f.who)}</b></p>
      <div class="small"><b>Problems:</b> ${f.problems.map(esc).join("; ")}</div>
      <div class="small"><b>Allergies:</b> ${f.allergies.map(esc).join("; ")}</div></div>
    <div class="card"><h3>Medications</h3><ul class="small">${f.medications.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div></div>`));
  s.append(H(`<div class="card"><h3>Abnormal results (latest)</h3><div style="overflow-x:auto"><table>
    <thead><tr><th>Test</th><th>Result</th><th></th><th>Reference</th><th>Date</th></tr></thead>
    <tbody>${f.abnormal_labs.map(l => `<tr><td>${esc(l.test)}</td><td class="num">${esc(l.value)}</td><td class="flag">${l.flag}</td><td class="num">${esc(l.ref)}</td><td class="num">${esc(l.date)}</td></tr>`).join("")}</tbody></table></div>
    ${f.pathology.length ? `<div class="small"><b>Pathology:</b> ${f.pathology.map(esc).join(" · ")}</div>` : ""}</div>`));
  const docs = H(`<div style="display:grid;gap:6px"><h3>Full chart documents</h3></div>`);
  for (const d of f.documents) docs.append(H(`<details class="doc"><summary>${esc(d.date)} · ${esc(d.title)}</summary><pre>${esc(d.text)}</pre></details>`));
  s.append(docs);
  if ((D.card.tests || []).length) s.append(H(`<div class="card"><h3>What this case is designed to test</h3><ul class="small">${D.card.tests.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`));
}

/* ---- 2 reference plan ---- */
function plan() {
  const s = $("#plan");
  s.append(H(`<h2><span class="n">2</span>The reference plan</h2>`));
  s.append(H(`<p class="small ink2">The answer key models are compared against. If anything here is wrong, say so in the matching checklist item in part 3.</p>`));
  if (D.card.correct_plan) s.append(H(`<div class="callout"><b>In one paragraph</b><p class="small">${esc(D.card.correct_plan)}</p></div>`));
  const p = H(`<div class="plan"></div>`);
  for (const r of D.plan) p.append(H(`<div class="row"><b>${esc(r.field)}</b><div>${Array.isArray(r.text) ? "<ul>" + r.text.map(x => `<li>${esc(x)}</li>`).join("") + "</ul>" : esc(r.text)}</div></div>`));
  s.append(p);
}

/* ---- 3 checklist by clinical area ---- */
function checklist() {
  const s = $("#checklist");
  s.append(H(`<h2><span class="n">3</span>The checklist, by clinical area</h2>`));
  s.append(H(`<p class="small ink2">Each item is one thing a good note must do (<i>required</i> or <i>recommended</i>) or must not do (<i>error</i>).
    "Real notes" shows how many of the AI-written notes we have for this case met it.</p>`));
  for (const dom of D.domains) {
    const its = D.items.filter(i => i.domain === dom.key); if (!its.length) continue;
    const a = H(`<div class="area"><h3>${esc(dom.label)}</h3></div>`);
    for (const i of its) {
      const kind = i.kind === "must" ? "Required" : i.kind === "should" ? "Recommended" : "Error";
      const unsafe = i.severity === "dangerous";
      const pts = i.kind === "must_not" ? (unsafe ? "fails the note" : `−${i.points} pts`) : `${i.points} pts`;
      const rate = i.n ? (i.kind === "must_not" ? `Real notes: committed in ${i.met} of ${i.n}` : `Real notes: met in ${i.met} of ${i.n}`) : "";
      const el = H(`<div class="item${unsafe ? " unsafe" : ""}" id="item-${i.id}">
        <div class="item-h"><h4>${esc(i.label)}</h4><div class="tags"><span class="tag ${i.kind === "must_not" ? "t-err" : "t-req"}">${kind}</span>
          ${unsafe ? `<span class="tag t-unsafe">Unsafe error</span>` : ""}<span class="t-pts">${pts}</span></div></div>
        ${i.why ? `<p class="small">${esc(i.why)}</p>` : ""}
        <div class="crit">Exact checklist wording: ${esc(i.criterion)}</div>
        ${rate ? `<div class="rate">${rate}</div>` : ""}</div>`);
      el.append(decide("items", i.id, [["agree", "Agree"], ["change", "Change"], ["delete", "Delete"]]));
      a.append(el);
    }
    s.append(a);
  }
}

/* ---- 4 open questions ---- */
function questions() {
  const s = $("#questions");
  s.append(H(`<h2><span class="n">4</span>Questions that need your call</h2>`));
  D.questions.forEach((q, n) => {
    const el = H(`<div class="item"><h4>${n + 1}. ${esc(q.question)}</h4>${q.context ? `<p class="small ink2">${esc(q.context)}</p>` : ""}
      <div class="tiny muted">Affects: ${q.items.map(id => `<a href="#item-${id}">${esc((D.items.find(i => i.id === id) || {}).label || id)}</a>`).join(" · ")}</div></div>`);
    el.append(decide("questions", q.id, q.options.map(o => [o, o])));
    s.append(el);
  });
}

/* ---- 5 borderline real examples ---- */
function examples() {
  const s = $("#examples");
  s.append(H(`<h2><span class="n">5</span>Real sentences: did they meet the item?</h2>`));
  s.append(H(`<p class="small ink2">Each sentence is copied from an AI model's note for this patient. Our graders were unsure or disagreed. Your answer settles it and becomes a test the grader must pass from now on.</p>`));
  for (const e of D.examples) {
    const yes = e.kind === "must_not" ? "Error committed" : "Met";
    const no = e.kind === "must_not" ? "No error" : "Not met";
    const el = H(`<div class="item${e.severity === "dangerous" ? " unsafe" : ""}">
      <div class="item-h"><h4>${esc(e.label)}</h4><div class="tags">${e.severity === "dangerous" ? `<span class="tag t-unsafe">Unsafe error item</span>` : ""}<span class="t-pts">${esc(e.model)}</span></div></div>
      <blockquote>“${esc(e.quote)}”</blockquote>
      ${e.ai_note ? `<p class="tiny muted">Why it is borderline: ${esc(e.ai_note)}</p>` : ""}</div>`);
    el.append(decide("examples", e.key, [["met", yes], ["not-met", no], ["unsure", "Unsure"]]));
    s.append(el);
  }
}

function finish() {
  $("#finish").append(H(`<div class="callout"><h3>Done?</h3><p class="small">Your answers save as you go, so you can stop and come back. When you finish, tell the team.
    Every "Change" or "Delete" with a note becomes a rubric edit, every answer in part 5 becomes a permanent test for the grader, and the rubric is marked as signed off.</p><p class="store"></p></div>`));
}

header(); patient(); plan(); checklist(); questions(); examples(); finish(); updateProgress(); setStore();
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id(); if (!id) return;
  R.db = db; R.me = id; R.mode = "db";
  try { const snap = await db.doc("case_reviews/" + id).get(); if (snap.exists) { const d = snap.data();
    R.mine = { items: d.items || {}, questions: d.questions || {}, examples: d.examples || {} };
    ["#checklist", "#questions", "#examples"].forEach(x => $(x).innerHTML = ""); checklist(); questions(); examples(); } } catch (e) {}
  updateProgress(); setStore();
})();
</script>
</body></html>
