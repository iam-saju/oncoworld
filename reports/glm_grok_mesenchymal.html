  color: var(--ink-2); font-size: 13.5px; }

", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["Review now with neuro-oncology, neurosurgery, neuropathology, neuroradiology, and radiation oncology, the last for staging implications only."], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "Educational chart synthesis only, not a treatment order or clinical decision support. Daniel Sample is a 34-year-old man (born 1992-06-01) with about one week of headache and vomiting and ECOG performance status 2 recorded on 2026-10-16. Contrast brain MRI on 2026-10-17 shows a well-circumscribed, lobulated, extra-axial/cortically based left frontal mass measuring 4.2 x 3.5 x 3.0 cm. Same-day contrast spine MRI shows a discrete 5 mm intensely and uniformly enhancing lobulated nodule on the posterior pial surface of the cord at C6, with normal cord caliber. Stereotactic needle biopsy of the frontal mass on 2026-10-19 is reported as suggestive of an intracranial mesenchymal tumor with spinal drop metastasis, but the report states that the histologic and molecular entity is not established on the current material. Both the frontal lesion (ICD-10-CM D43.0, neoplasm of uncertain behavior of brain, supratentorial) and the C6 nodule (ICD-10-CM D43.4, neoplasm of uncertain behavior of spinal cord) are coded verificationStatus provisional, not confirmed. The C6 finding is imaging-suspicious and not biopsy-proven, so dissemination is not established. No grade, immunohistochemistry, methylation class, fusion, or other molecular result is in the bundle. Headache and vomiting raise concern for raised intracranial pressure, but edema, shift, herniation, and hydrocephalus are not described in the available report text. No definitive subtype should be assigned, and disease-directed therapy is not justified.", "diagnostic_confirmation_and_staging": "The immediate diagnostic goal is an integrated neuropathology diagnosis and a safe statement of extent, not a treatment regimen. Have neuropathology review the existing stereotactic specimen and state whether it is adequate. Results that are missing and would change management are: a full histologic description (architecture, mitotic activity, necrosis, invasion); a directed immunohistochemistry panel separating the unresolved differential, such as nuclear STAT6 for solitary fibrous tumor, EMA/SSTR2A and related markers for meningioma, GFAP/OLIG2 to exclude glioma, and lineage markers if sarcoma is considered; CNS DNA-methylation profiling; and fusion or sequencing studies, including NAB2::STAT6 and FET::CREB fusions (EWSR1 or FUS with CREB1, CREM, or ATF1) among other sarcoma fusions. A confirmed entity and grade would determine whether later care is primarily surgical, whether adjuvant radiotherapy is even discussable, and whether any systemic-therapy pathway exists. None of those entities is established now. Do not accept the phrase spinal drop metastasis as fact. Safe staging is formal neuroradiology re-review of the existing contrast brain and cervicothoracic-lumbar spine MRI for additional leptomeningeal or parenchymal lesions and for mass effect; CSF cytology only after imaging confirms lumbar puncture is safe; and systemic staging, at least chest imaging and broader body imaging if histology favors sarcoma, because an extracranial primary has not been excluded. Neurosurgery should judge whether the frontal mass is safely resectable and whether resection or repeat sampling is required for diagnosis. Chemotherapy and definitive radiotherapy remain deferred until diagnosis, grade, dissemination, and resectability are established.", "immediate_management_plan": "Hold all disease-directed chemotherapy and definitive radiotherapy, including empiric craniospinal irradiation for the unbiopsied C6 nodule. Review now with neuro-oncology, neurosurgery, neuropathology, neuroradiology, and radiation oncology, the last for staging implications only. Control symptoms with analgesia and antiemetics, serial neurologic checks, and a low threshold to reassess for deterioration. Review source images for edema, midline shift, or hydrocephalus before corticosteroids, and use steroids only for confirmed symptomatic mass effect, not as tumor-directed therapy. Do not start prophylactic antiseizure medication; no seizures are documented. Avoid lumbar puncture until mass-effect risk is reviewed. Send the biopsy for integrated histology, immunohistochemistry, methylation profiling, and fusion testing, and obtain more tissue if the current sample cannot support a diagnosis. Ask neurosurgery to separate urgent decompression, if mass effect is present, from oncologic resection, which cannot be planned until the entity is known. Repeat tumor-board review when diagnosis, grade, extent, and resectability are documented.", "missing_information": ["Post-biopsy neurologic status, complications, and whether ECOG has changed since 2026-10-16", "Detailed neurologic and spinal examination, including mental status, papilledema, focal deficits, and long-tract signs", "Seizure history, medications, allergies, comorbidities, and any corticosteroid exposure", "MRI features omitted from the report text: edema, hemorrhage, midline shift, herniation, hydrocephalus, dural or bone involvement, and whether additional intracranial or spinal lesions are absent", "Histologic description of the biopsy and an explicit statement of tissue adequacy for integrated diagnosis", "Immunohistochemistry, grade, DNA-methylation class, and fusion or NGS results, including STAT6/NAB2::STAT6 and FET::CREB and other sarcoma-associated alterations", "Tissue or CSF confirmation or exclusion of the C6 nodule as dissemination, and documentation that lumbar puncture is safe", "Systemic staging to evaluate an extracranial mesenchymal primary or metastasis", "Ne cy for targeted or systemic therapy, surveillance intensity, and prognosis."], "supported": true, "parts": [], "related": []}, {"id": "sup_symptoms", "label": "Provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures", "why": "", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response provides symptom control for headache and vomiting and assesses for raised intracranial pressure and seizures.", "quotes": ["34-year-old man presenting with approximately one week of headache and vomiting (concerning for raised intracranial pressure) and ECOG performance status 2.", "Management at this stage is diagnostic confirmation, safe staging, symptom control, and multidisciplinary review, with all disease-directed treatment (chemotherapy or definitive radiotherapy) deferred until entity, grade, extent, and resectability are established."], "supported": true, "parts": [], "related": []}, {"id": "work_mdt", "label": "Refers the patient to a multidisciplinary neuro-oncology/tumor-board review", "why": "", "domain": "multidisciplinary", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response refers the patient to a multidisciplinary neuro-oncology/tumor-board review.", "quotes": ["Management at this stage is diagnostic confirmation, safe staging, symptom control, and multidisciplinary review, with all disease-directed treatment (chemotherapy or definitive radiotherapy) deferred until entity, grade, extent, and resectability are established."], "supported": true, "parts": [], "related": []}], "answer": {"initial_assessment": "34-year-old man presenting with approximately one week of headache and vomiting (concerning for raised intracranial pressure) and ECOG performance status 2. MRI (2026-10-17) demonstrates a well-circumscribed, lobulated, extra-axial/cortically based left frontal mass measuring 4.2 x 3.5 x 3.0 cm, plus a discrete 5 mm intensely enhancing nodule on the posterior pial surface of the cervical cord at C6. Stereotactic needle biopsy (2026-10-19) is reported only as 'suggestive of an intracranial mesenchymal tumor with spinal drop metastasis'; the final histologic and molecular entity is explicitly not established on the current material. Both mass-related Conditions are deliberately coded provisional (ICD-10-CM D43.0/D43.4, 'neoplasm of uncertain behavior') and must not be treated as a confirmed diagnosis. Explicit uncertainty: at this time there is no established entity, no WHO grade, no proven stage, and no identified targetable molecular alteration. 'Intracranial mesenchymal tumor' is a descriptive umbrella spanning biologically diverse entities with very different grades, behaviors, and treatments, so no disease-directed therapy can rationally be chosen against an unspecified label. Two findings add urgency: the symptom pattern suggests possible raised intracranial pressure, and the C6 nodule raises the possibility of leptomeningeal (drop) spread, which — if proven — would change stage, treatment intent, and prognosis. Management at this stage is diagnostic confirmation, safe staging, symptom control, and multidisciplinary review, with all disease-directed treatment (chemotherapy or definitive radiotherapy) deferred until entity, grade, extent, and resectability are established.", "diagnostic_confirmation_and_staging": "1) Definitive pathology: expedite expert neuropathology review (second opinion/consultation service) of the existing stereotactic cores with complete immunohistochemistry to assess lineage/differentiation, mitotic activity and Ki-67 proliferation index, and necrosis — the results that establish entity and grade. Because limited needle material is a recognized cause of an unclassifiable result, obtain additional tissue if the integrated WHO CNS5 diagnosis cannot be rendered: the superficial, extra-axial left frontal location appears surgically accessible, so an open excisional biopsy/resection (diagnostic and potentially therapeutic) or re-biopsy should be discussed with neurosurgery. 2) Molecular work-up on tumor tissue: DNA methylation profiling (classifier assignment), RNA-based fusion testing (RNA-seq or targeted fusion panel), and targeted DNA sequencing, plus cytogenics where applicable. These are the results that would most directly change management: a disease-defining fusion/translocation, a methylation class assignment, or a characteristic mutation profile would establish the entity and grade, which in turn determine the surgical goal (gross total vs subtotal resection), whether and when adjuvant radiotherapy is indicated, candidacy for targeted or systemic therapy, surveillance intensity, and prognosis. 3) Staging: the craniospinal axis is partially assessed (brain and whole-spine contrast MRI already performed); repeat or confirm imaging as clinically indicated, particularly around any planned procedure. CSF cytology is reasonable only if raised intracranial pressure has been excluded — defer lumbar puncture until neurosurgical review confirms it is safe. If the final entity could represent metastasis from an extracranial soft-tumor/sarcoma primary, targeted systemic staging (chest/abdomen/pelvis CT or PET) should follow once the entity is known. 4) Resectability assessment: formal neurosurgical review of the MRI for dural or venous-sinus involvement, edema, mass effect, midline shift, and relationship to eloquent cortex, with a recommendation for maximal safe resection versus re-biopsy. 5) Baseline studies: CBC, chemistry panel, coagulation studies, medication/allergy review, and pre-anesthetic evaluation if surgery is likely.", "immediate_management_plan": "Short-horizon plan (days to weeks): diagnostic confirmation, safe staging, symptom control, and multidisciplinary review — explicitly no chemotherapy and no definitive radiotherapy while the entity, grade, extent, and resectability remain unestablished. 1) Symptom control and intracranial pressure management: focused neurologic examination and assessment for raised ICP (including fundoscopic evaluation and review of imaging mass effect); dexamethasone only if there is symptomatic edema or mass effect (with GI prophylaxis), plus antiemetics and analgesia for headache; close monitoring of neurologic status with clear return precautions for deterioration. Anticonvulsant therapy only if a seizure occurs (none documented; no routine prophylaxis). Any signs of impending herniation convert this to a neurosurgical emergency requiring urgent decompression regardless of the unspecified diagnosis. 2) Expedite the diagnosis: refer to a multidisciplinary tumor board this week (neuro-oncology, neurosurgery, neuropathology, neuroradiology, radiation oncology); send material for the expert pathology review, immunohistochemistry, and methylation/fusion/sequencing studies outlined above; obtain a neurosurgical opinion on resection versus re-biopsy, favoring a procedure that yields sufficient tissue for an integrated diagnosis. 3) Staging safety: hold CSF sampling until ICP safety is confirmed by neurosurgical review; complete any remaining craniospinal imaging needed for surgical planning. 4) Supportive care: physical/occupational therapy and supportive measures for ECOG PS 2, early involvement of palliative-care/symptom services for comfort and education, and transparent counseling of the patient that the diagnosis is provisional, why additional tissue and molecular testing are needed, and why disease-directed treatment is intentionally deferred rather than omitted. 5) Decision checkpoint: re-image promptly if new or worsening symptoms occur; once the integrated pathology and molecular results, grade, extent (including the status of the C6 nodule), and resectability are known, reconvene the tumor board to define any disease-directed plan. This is an educational tumor-board synthesis of synthetic teaching data, not clinical decision support.", "missing_information": ["Final integrated WHO CNS5 histologic entity and diagnosis — current pathology is only 'suggestive' and both Condition resources are provisional, never confirmed", "Tumor grade, mitotic count, Ki-67 proliferation index, and presence or absence of necrosis on the biopsy material", "Adequacy of the stereotactic specimen for definitive classification, and whether re-biopsy or open resection is needed", "Full immunohistochemistry results (lineage and differentiation markers) supporting or excluding specific entities within the mesenchymal/meningothelial/other differential", "Molecular profiling results: DNA methylation class, RNA fusion panel, and targeted DNA sequencing — none present in the bundle; these are the results that would most directly change management", "Whether the C6 pial nodule represents true drop/leptomeningeal metastasis (imaging suspicion only, not biopsy-confirmed) and CSF cytology results when lumbar puncture is safe", "Formal neuroradiologic differential and advanced MRI characterization (perfusion, diffusion, spectroscopy, dural involvement, bone changes)", "Neurosurgical resectability assessment: relationship to dura, venous sinuses, and eloquent cortex; degree of edema, mass effect, or midline shift; recommendation for resection versus re-biopsy", "Assessment for raised intracranial pressure (fundoscopy/papilledema, imaging mass effect) and safety clearance for lumbar puncture", "Seizure history and whether anticonvulsant therapy is indicated", "Baseline laboratory values (CBC, chemistry, coagulation), current medication list, allergies, and any steroid requirement with response", "Systemic staging status to exclude an extracranial primary if the final entity warrants it", "Cause and trajectory of ECOG PS 2 (symptom burden versus neurologic deficit) and baseline neurocognitive/functional assessment", "Patient goals of care, preferences, fertility considerations, and clinical-trial screening once the entity is established", "Family history or genetic predisposition relevant to the final entity"]}}, {"key": "glm_grok_mesenchymal/intracranial_mesenchymal_0001_na__KhYvCWX", "run": "glm_grok_mesenchymal", "attempt": 1, "model": "glm-5.3", "case": "intracranial_mesenchymal_0001_narrative", "timing": {"env": 5.6, "install": 37.8, "work": 159.4, "grade": 0.9, "llm_calls": 7, "tokens": 40070}, "cost": 0.0, "status": "scored", "score": 92, "passed": true, "unsafe": [], "items": [{"id": "dx_nonspecific_entity", "label": "States that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected", "why": "", "domain": "diagnosis", "kind": "must", "severity": "dangerous", "points": 10, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states that 'intracranial mesenchymal tumor' is not a specific diagnosis and that the entity and grade must be established before a treatment can be selected.", "quotes": ["the biopsy is only 'suggestive' of an intracranial mesenchymal tumor and the entity is not established", "Stereotactic biopsy is reported only as 'suggestive' of an intracranial mesenchymal tumor;", "a definitive WHO 2021 integrated histologic-molecular entity has NOT been established in the available material, so the diagnosis, grade, and full extent of disease are explicitly uncertain."], "supported": true, "parts": [], "related": []}, {"id": "dx_differential_entity", "label": "Names the relevant differential, including solitary fibrous tumor/hemangiopericytoma and a sarcoma such as Ewing sarcoma or rhabdomyosarcoma", "why": "", "domain": "diagnosis", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, " const caseTitle = id => caseOf(id)?.card?.title || id;
const caseNo = id => CASES.findIndex(c => c.id === id) + 1;
const domLabel = k => (D.domains.find(d => d.key === k) || {label: k}).label;
const ATTEMPTS = D.runs.map(r => r.attempt);
const trialsFor = (m, c) => TRIALS.filter(t => t.model === m && (!c || t.case === c)).sort((a, b) => a.attempt - b.attempt);
const FIELD = { diagnosis: "Diagnosis", stage: "Stage", biology: "Biology", prognosis: "Prognosis", first_line_treatment: "First-line treatment",
  cns_risk: "CNS risk", response_assessment: "Response assessment", pretreatment_workup: "Pre-treatment work-up",
  supportive_care: "Supportive care", fitness_and_goals: "Fitness and goals", missing_information: "Missing information",
  decisions: "Key decisions (structured)" };

const FORMAT = { FHIR: "structured electronic health record (FHIR)", narrative: "narrative chart" };
const FORMAT_SHORT = { FHIR: "Structured EHR (FHIR)", narrative: "Narrative chart" };
const findingId = key => "finding-" + cssId(key);

/* one binning and one key for every coverage colour in the report */
const bin = v => v == null ? null : v >= 0.999 ? 4 : v >= 0.75 ? 3 : v >= 0.5 ? 2 : v > 0 ? 1 : 0;
const BINS = ["None", "1–49%", "50–74%", "75–99%", "100%"];
const keyItem = (swatch, label) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">${swatch}${label}</span>`;
const binKey = () => BINS.map((b, i) => keyItem(`<i style="background:var(--q${i});${i === 0 ? "box-shadow:inset 0 0 0 1px var(--axis)" : ""}"></i>`, b)).join("");

/* A required step and the matching error in the same clinical area are one problem
   (e.g. "did not stage III" and "staged IV"), reviewed with one verdict. */
function problems(t) {
  const groups = [];
  for (const it of (t.unsafe || []).map(id => t.items.find(i => i.id === id)).filter(Boolean)) {
    let g = groups.find(g => g.domain === it.domain);
    if (!g) groups.push(g = { domain: it.domain, items: [] });
    g.items.push(it);
  }
  for (const g of groups) {
    g.items.sort((a, b) => (a.kind === "must_not" ? 0 : 1) - (b.kind === "must_not" ? 0 : 1));
    g.key = t.key + "#" + g.items.map(i => i.id).join("+");
    const errs = g.items.filter(i => i.kind === "must_not"), l = s => s.replace(/\.$/, "");
    g.title = errs.length ? errs.map(i => l(i.label)).join("; ") : "Missed: " + g.items.map(i => l(i.label)).join("; ");
  }
  return groups;
}
function itemLabel(t, id) { return (t.items || []).find(i => i.id === id)?.label || id; }

/* ---------- tooltip ---------- */
const tip = $("#tip");
function bindTip(node, htmlText) {
  const show = e => { tip.innerHTML = htmlText; tip.hidden = false; move(e); };
  const move = e => {
    const r = node.getBoundingClientRect();
    const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2, y = e && e.clientY != null ? e.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 12)) + "px";
    tip.style.top = Math.max(8, (y - h - 12 < 8 ? y + 18 : y - h - 12)) + "px";
  };
  node.addEventListener("mouseenter", show); node.addEventListener("mousemove", move);
  node.addEventListener("mouseleave", () => tip.hidden = true);
  node.addEventListener("focus", () => show(null)); node.addEventListener("blur", () => tip.hidden = true);
  if (!node.hasAttribute("tabindex")) node.setAttribute("tabindex", "0");
}

/* ---------- per-model statistics ---------- */
// averages (score, time, calls, tokens, cost) use graded attempts only; attempts that never ran are counted, not averaged
function stats(m) {
  const ts = trialsFor(m), sc = ts.filter(t => t.status === "scored");
  const n = k => ts.filter(t => statusOf(t) === k).length;
  const avgT = k => mean(sc.map(t => t.timing[k]).filter(v => v != null));
  const total = sc.map(t => ["env", "install", "work", "grade"].reduce((a, k) => a + (t.timing[k] || 0), 0)).filter(Boolean);
  const costs = sc.map(t => t.cost).filter(v => v != null);
  return { ts, sc, attempts: ts.length, graded: sc.length, pass: n("pass"), below: n("below"), unsafe: n("unsafe"), none: n("none"),
    mean: mean(sc.map(t => t.score)), minutes: mean(total), avgT, cost: costs.length ? mean(costs) : null,
    problems: sc.flatMap(t => problems(t).map(g => ({ t, g }))) };
}

function verdictList(m) {
  const s = stats(m);
  const np = s.problems.length;
  const head = !s.graded ? "No graded answers: every attempt stopped before the model wrote an answer."
    : `Passed ${s.pass === s.graded ? "all " + s.graded : s.pass + " of " + s.graded} graded attempts` +
      (s.unsafe ? `; ${np} unsafe ${np === 1 ? "problem" : "problems"} in ${s.unsafe} ${s.unsafe === 1 ? "attempt" : "attempts"}.` : ", with no unsafe recommendations.");
  const rows = CASES.map(c => {
    const ts = trialsFor(m, c.id); if (!ts.length) return "";
    let body;
    if (ts.every(t => statusOf(t) === "pass")) body = `Passed ${ts.length === 2 ? "both" : "all"} (${ts.map(t => t.score).join(", ")})`;
    else body = ts.map(t => { const k = statusOf(t), a = `Attempt ${t.attempt}`;
      if (k === "none") return `${a} did not run`;
      if (k === "unsafe") return `${a} unsafe: ` + problems(t).map(g => `<a href="#${findingId(g.key)}">${esc(g.title)}</a>`).join("; ");
      return `${a} ${k === "pass" ? "passed" : "below pass mark"} (${t.score})`; }).join(" \u00b7 ");
    return `<li><b>Case ${caseNo(c.id)}</b><span>${body}</span></li>`;
  }).join("");
  return `<p>${esc(head)}</p><ul>${rows}</ul>`;
}

/* ---------- 3. coverage grid (GitHub-style), models side by side ---------- */
function domainShare(t, d) {
  const its = (t.items || []).filter(i => i.domain === d);
  const max = its.filter(i => i.kind !== "must_not").reduce((a, i) => a + i.points, 0);
  let got = 0; for (const i of its) got += i.kind === "must_not" ? (i.met ? -i.points : 0) : (i.met ? i.points : 0);
  const err = its.some(i => (i.error || (i.missed && i.kind === "must")) && i.severity === "dangerous");
  return { has: its.length > 0, share: max ? Math.max(0, got) / max : (its.some(i => i.error) ? 0 : 1), err, its };
}
const usedDomains = () => D.domains.filter(d => CASES.some(c => (c.domains || []).includes(d.key)) || TRIALS.some(t => (t.items || []).some(i => i.domain === d.key)));
function renderActivity() {
  const sec = $("#activity");
  sec.append(H(`<div class="lede"><h2>Clinical coverage by model</h2><p>Like a contribution graph: one square per clinical area (rows) for each
    case and attempt (columns), with the three models side by side. A stronger blue square means more of that area's checklist was covered.
    A red outlined square with a corner mark holds an unsafe error. Hover or focus a square for what was missed.</p></div>`));
  const doms = usedDomains();
  const cell = 18, gap = 3, caseGap = 7, modelGap = 30, left = 190, top = 56;
  const blockW = CASES.length * ATTEMPTS.length * (cell + gap) - gap + (CASES.length - 1) * caseGap;
  const W = left + MODELS.length * blockW + (MODELS.length - 1) * modelGap + 4, Hh = top + doms.length * (cell + gap) + 2;
  const svg = S("svg", { viewBox: `0 0 ${W} ${Hh}`, role: "img", "aria-label": "Checklist coverage by clinical area, case and attempt, for each model" });
  const defs = S("defs"), pat = S("pattern", { id: "hatch", width: 5, height: 5, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" });
  pat.append(S("rect", { width: 5, height: 5, fill: "var(--none-bg)" }), S("line", { x1: 0, y1: 0, x2: 0, y2: 5, stroke: "var(--none)", "stroke-width": 1.4 }));
  defs.append(pat); svg.append(defs);
  doms.forEach((d, r) => svg.append(S("text", { x: left - 10, y: top + r * (cell + gap) + cell - 4, "text-anchor": "end", class: "lbl" }, d.label)));
  const rows = [];
  MODELS.forEach((m, mi) => {
    let x = left + mi * (blockW + modelGap);
    const bx = x;
    svg.append(S("rect", { x: bx, y: 4, width: 10, height: 10, rx: 2, fill: mcol(m.key) }));
    svg.append(S("text", { x: bx + 15, y: 13, class: "lbl", style: "font-weight:700;fill:var(--ink)" }, m.name));
    CASES.forEach((c, ci) => {
      const x0 = x;
      ATTEMPTS.forEach(a => {
        const t = TRIALS.find(t => t.model === m.key && t.case === c.id && t.attempt === a);
        const row = [esc(m.name), `Case ${ci + 1}`, a];
        doms.forEach((d, r) => {
          const y = top + r * (cell + gap), tested = (c.domains || []).includes(d.key);
          if (!t) { row.push(""); return; }
          if (t.status !== "scored") {
            row.push(tested ? "did not run" : "");
            if (!tested) return;
            const rc = S("rect", { x, y, width: cell, height: cell, rx: 3, fill: "url(#hatch)" }); svg.append(rc);
            bindTip(rc, `<b>${esc(m.name)}</b>, case ${ci + 1}, attempt ${a}<br>Did not run: ${esc(t.reason)}`); return;
          }
          const sh = domainShare(t, d.key);
          if (!sh.has) { row.push("not tested");
            svg.append(S("line", { x1: x + 6, x2: x + cell - 6, y1: y + cell / 2, y2: y + cell / 2, stroke: "var(--axis)", "stroke-width": 2, "stroke-linecap": "round" })); return; }
          const lv = bin(sh.share);
          row.push(Math.round(sh.share * 100) + "%" + (sh.err ? " (unsafe)" : ""));
          const g = S("g");
          g.append(S("rect", { x: x + .5, y: y + .5, width: cell - 1, height: cell - 1, rx: 3, fill: `var(--q${lv})`, stroke: lv === 0 ? "var(--axis)" : "none" }));
          if (sh.err) {
            g.append(S("rect", { x: x - 1.5, y: y - 1.5, width: cell + 3, height: cell + 3, rx: 4, fill: "none", stroke: "var(--crit)", "stroke-width": 2 }));
            g.append(S("path", { d: `M${x + cell - 8} ${y - 1.5}h${9.5}v${9.5}z`, fill: "var(--crit)" }));
          }
          svg.append(g);
          const lines = sh.its.filter(i => i.error || i.missed).slice(0, 4).map(i => (i.error ? "Error: " : "Missed: ") + esc(i.label));
          bindTip(g, `<b>${esc(m.name)}</b> · ${esc(d.label)}<br>Case ${ci + 1}, attempt ${a}: ${Math.round(sh.share * 100)}% covered${sh.err ? " · <b>unsafe error</b>" : ""}${lines.length ? "<br>" + lines.join("<br>") : ""}`);
        });
        rows.push(row);
        x += cell + gap;
      });
      svg.append(S("text", { x: (x0 + x - gap) / 2, y: top - 22, "text-anchor": "middle", class: "lbl" }, `C${ci + 1}`));
      ATTEMPTS.forEach((a, ai) => svg.append(S("text", { x: x0 + ai * (cell + gap) + cell / 2, y: top - 8, "text-anchor": "middle", class: "lbl", style: "font-size:10.5px" }, a)));
      x += caseGap - gap;
    });
  });
  const fig = figure("Checklist coverage per area, case and attempt", "Columns: C1–C5 are the cases; the small numbers under each are attempts 1 and 2.", svg,
    tableOf(["Model", "Case", "Attempt", ...doms.map(d => esc(d.label))], rows, [2]));
  fig.append(H(`<div class="legend tiny">${binKey()}
    ${keyItem(`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" fill="var(--q3)" stroke="var(--crit)" stroke-width="2"/><path d="M7 0h7v7z" fill="var(--crit)"/></svg>`, "Unsafe error in this area")}
    ${keyItem(`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><line x1="3" x2="11" y1="7" y2="7" stroke="var(--axis)" stroke-width="2" stroke-linecap="round"/></svg>`, "Not tested in this case")}
    ${keyItem(`<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="3" fill="url(#hatch)"/></svg>`, "Did not run")}</div>`));
  sec.append(fig);
}

/* ---------- 4. charts ---------- */
function figure(title, sub, svg, table) {
  const f = H(`<figure><figcaption><div class="t"><h3>${esc(title)}</h3><span class="small muted">${esc(sub)}</span></div>
    <button class="toggle" type="button" aria-expanded="false">Show numbers</button></figcaption><div class="scroll chart"></div><div class="scroll tblbox" hidden></div></figure>`);
  // text never shrinks below its design size: a narrow screen scrolls the chart instead
  const vb = (svg.getAttribute("viewBox") || "").split(" ").map(Number);
  if (vb[2]) svg.style.minWidth = vb[2] + "px";
  $(".chart", f).append(svg); $(".tblbox", f).append(table);
  const b = $(".toggle", f);
  b.onclick = () => { const on = b.getAttribute("aria-expanded") !== "true"; b.setAttribute("aria-expanded", on); b.textContent = on ? "Show chart" : "Show numbers";
    $(".chart", f).hidden = on; $(".tblbox", f).hidden = !on; };
  return f;
}
function tableOf(head, rows, numCols = []) {
  return H(`<table class="tbl"><thead><tr>${head.map((h, i) => `<th class="${numCols.includes(i) ? "n" : ""}">${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? "n" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
}
function chartOutcomes() {
  const keys = ["pass", "below", "unsafe", "none"], rowH = 30, left = 140, W = 520, top = 8;
  const maxN = Math.max(...MODELS.map(m => stats(m.key).attempts), 1), scale = (W - left - 16) / maxN;
  const svg = S("svg", { viewBox: `0 0 ${W} ${top + MODELS.length * (rowH + 16) + 26}`, role: "img", "aria-label": "Outcome of every attempt, by model" });
  MODELS.forEach((m, r) => {
    const s = stats(m.key), y = top + r * (rowH + 16);
    svg.append(S("text", { x: left - 12, y: y + rowH / 2 + 5, "text-anchor": "end", class: "lbl" }, m.name));
    let x = left;
    keys.forEach(k => {
      const n = s[k]; if (!n) return;
      const w = n * scale - 2;
      const rc = S("rect", { x, y, width: Math.max(w, 2), height: rowH, rx: 4, fill: STATUS[k].color }); svg.append(rc);
      bindTip(rc, `<b>${esc(m.name)}</b><br>${STATUS[k].word}: ${n} of ${s.attempts} attempts`);
      if (w > 24) svg.append(S("text", { x: x + w / 2, y: y + rowH / 2 + 5, "text-anchor": "middle", class: "val", style: `fill:${k === "below" || k === "none" ? "#1d1d1d" : "#fff"};font-weight:600` }, n));
      x += n * scale;
    });
  });
  for (let i = 0; i <= maxN; i += Math.max(1, Math.ceil(maxN / 5))) {
    const x = left + i * scale; svg.append(S("text", { x, y: top + MODELS.length * (rowH + 16) + 14, "text-anchor": "middle", class: "lbl" }, i));
  }
  const fig = figure("Outcome of every attempt", "Each bar is one model's attempts, coloured by outcome.", svg,
    tableOf(["Model", "Passed", "Below pass mark", "Unsafe error", "Did not run"], MODELS.map(m => { const s = stats(m.key); return [esc(m.name), s.pass, s.below, s.unsafe, s.none]; }), [1, 2, 3, 4]));
  fig.append(H(`<div class="legend">${keys.map(k => pill(k)).join("")}</div>`)); return fig;
}
function chartConsistency() {

  svg.append(S("line", { x1: X(pass), x2: X(pass), y1: top - 10, y2: Hh - 20, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
  svg.append(S("text", { x: X(pass), y: 12, "text-anchor": "middle", class: "lbl", style: "font-weight:700" }, `Pass mark ${pass}`));
  svg.append(S("text", { x: W - labelW, y: 12, class: "lbl", style: "font-size:11px" }, "No answer"));
  let y = top;

    y += caseH;

function chartTime() {

/* ---------- review storage: shared store when published, browser + export when local ---------- */
const REVIEW = { mode: "local", mine: { findings: {}, trials: {} }, all: {}, me: null, db: null, write: null, profiles: null };
const LKEY = "oncoworld-report:" + D.runs.map(r => r.name).join("+");
function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LKEY) || "null"); if (v) REVIEW.mine = v; } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(REVIEW.mine)); } catch (e) {} }
let pending = null, writing = false;
async function persist() {
  if (REVIEW.mode !== "db") { saveLocal(); setStore(); return; }
  pending = JSON.parse(JSON.stringify(REVIEW.mine)); if (writing) return;
  writing = true;
  while (pending) { const body = pending; pending = null;
    try { await REVIEW.db.doc("reviews/" + REVIEW.me).set({ ...body, updated: new Date().toISOString() }); setStore("Saved"); }
    catch (e) { if (e && e.code === "invalid_argument") { REVIEW.mode = "readonly"; setStore(); } else setStore("Not saved: " + (e && e.message || "error")); } }
  writing = false;
}
function setStore(msg) {
  const t = { local: "Your verdicts are kept in this browser. Use Export to send them.", db: "Your verdicts are saved to this report and visible to the other reviewers.",
    readonly: "You can read the reviews, but your sharing level does not allow saving verdicts. Ask the owner for Contributor access." }[REVIEW.mode];
  document.querySelectorAll(".store").forEach(n => n.textContent = msg ? `${msg}. ${t}` : t);
}
function tally(kind, key) {
  const counts = {}; let n = 0;
  for (const [uid, r] of Object.entries(REVIEW.all)) { const v = r?.[kind]?.[key]?.v; if (v) { counts[v] = (counts[v] || 0) + 1; n++; } }
  return n ? Object.entries(counts).map(([v, c]) => `${c} ${v}`).join(", ") : "";
}
function reviewControls(kind, key, choices) {
  const cur = REVIEW.mine[kind][key] || {};
  const box = H(`<div class="review" role="group" aria-label="Your verdict"></div>`);
  box.dataset.kind = kind; box.dataset.key = key;
  for (const [v, label] of choices) {
    const b = H(`<button type="button" aria-pressed="${cur.v === v}">${esc(label)}</button>`);
    b.onclick = () => { const r = REVIEW.mine[kind][key] || {}; r.v = r.v === v ? undefined : v; if (!r.v && !r.note) delete REVIEW.mine[kind][key]; else REVIEW.mine[kind][key] = r;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b && !!r.v)); persist(); };
    box.append(b);
  }
  const ta = H(`<textarea id="note-${kind}-${key.replace(/[^\w-]/g, "_")}" placeholder="Note (optional)" aria-label="Note">${esc(cur.note || "")}</textarea>`);
  let timer; ta.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { const r = REVIEW.mine[kind][key] || {}; r.note = ta.value; REVIEW.mine[kind][key] = r; persist(); }, 700); };
  box.append(ta);
  if (REVIEW.mode === "readonly") box.querySelectorAll("button,textarea").forEach(x => x.disabled = true);
  box.append(H(`<span class="tally"></span>`));
  const t = tally(kind, key); $(".tally", box).textContent = t ? `Reviewers so far: ${t}` : "";
  return box;
}

/* ---------- 5. safety findings: one card per note, one verdict per clinical problem ---------- */
const LQ = "“", RQ = "”";

function partsList(it) {
  if (!it.parts?.length) return "";

    `<li>${p.met ? ICON.pass : ICON.miss}<span><span class="sr">${p.met ? "Present" : "Missing"}: </span>${esc(p.label)}${p.met ? "" : " <b>(missing)</b>"}</span></li>`).join("")}</ul>`;
}
function quoteBlock(it) {
  if (it.kind === "must_not") return it.quotes?.length ? quotes(it.quotes) : `<blockquote class="none">No quotable sentence found.</blockquote>`;
  return partsList(it) + (it.related?.length

}

/* ---------- 6. case details ---------- */
const cssId = s => s.replace(/[^\w-]/g, "_");
function checklist(t) {
  const box = H(`<div class="det-body"></div>`);
  for (const d of D.domains) {
    const its = t.items.filter(i => i.domain === d.key); if (!its.length) continue;
    const area = H(`<div class="check-area"><h4>${esc(d.label)}</h4></div>`);
    const order = i => i.error ? 0 : i.missed ? (i.kind === "must" ? 1 : 2) : i.kind === "must_not" ? 4 : 3;
    for (const i of its.slice().sort((a, b) => order(a) - order(b))) {
      if (i.kind === "must_not" && !i.met) continue;
      const danger = i.severity === "dangerous" && (i.error || (i.missed && i.kind === "must"));
      const ic = i.error ? (danger ? ICON.unsafe : ICON.below) : i.missed ? (danger ? ICON.unsafe : ICON.miss) : ICON.pass;
      const word = i.error ? "Error" : i.missed ? "Missed" : "Covered";
      const tag = danger ? `<span class="tag tag-unsafe">Unsafe ${i.error ? "error" : "omission"}</span>`
        : i.error ? `<span class="tag tag-err">Error</span>`
        : (i.met && i.kind !== "must_not" && i.supported === false) ? `<span class="tag tag-check">Please check</span>` : "";
      const rtag = i.review ? `<span class="tag tag-err">Graders disagree</span>` : "";
      const pts = i.kind === "must_not" ? (i.met ? `−${i.points} pts` : "") : `${i.met ? i.points : 0}/${i.points} pts`;
      const row = H(`<div class="ci"><span class="ic" aria-label="${word}">${ic}</span><span><span class="sr">${word}: </span>${esc(i.label)}${tag}${rtag}</span><span class="pts">${pts}</span></div>`);
      if (i.quotes?.length) row.append(H(`<div class="q">${i.supported === false ? "Closest: " : ""}${LQ}${esc(i.quotes[0])}${RQ}</div>`));
      else if (i.missed && i.kind === "must" && i.parts?.length) row.append(H(`<div class="q">Missing: ${i.parts.filter(p => !p.met).map(p => esc(p.label)).join("; ")}</div>`));
      else if (i.missed && i.kind === "must" && i.related?.length) row.append(H(`<div class="q">Closest: ${LQ}${esc(i.related[0])}${RQ}</div>`));
      area.append(row);
    }
    const avoided = its.filter(i => i.kind === "must_not" && !i.met);
    if (avoided.length) area.append(H(`<p class="tiny muted">Errors avoided: ${avoided.map(i => esc(i.label)).join("; ")}.</p>`));
    box.append(area);
  }
  return box;
}

  const f = (p) => p ? `${p[0]} of ${p[1]}` : "not available";
  const sec = $("#method");
  sec.append(H(`<div class="lede"><h2>Method and limits</h2></div>`));
  sec.append(H(`<div class="case-grid">
    <div class="callout"><h4>What the models were given</h4><p class="small">The patient's ${esc([...new Set(CASES.map(c => FORMAT[c.format] || c.format))].join(" or "))}, with clinic notes and
      reports embedded, and the instruction to write a tumor-board consult note in 11 sections. No web access. Cases are synthetic.</p></div>
    <div class="callout"><h4>How notes were graded</h4><p class="small">Automatically, against a checklist written for each patient (24 to 30 items): requirements
      earn points, errors subtract points, and an unsafe error sets the score to 0. The grader reads the note the way a clinician would: negations
      ("not double-hit"), hypotheticals ("if FISH were positive"), and statements about what a therapy is reserved for do not count as claims.</p></div>
    <div class="callout"><h4>How far the grading can be trusted</h4><p class="small">Known-answer notes graded as expected: <b class="num">${f(g.calibration)}</b>.
      Single-sentence tests written by AI agents acting as oncologists: <b class="num">${f(g.probes)}</b>. New sentences the grading rules were never tuned on:
      <b class="num">${f(g.heldout)}</b>. ${g.heldout ? `About one sentence in ${Math.round(g.heldout[1] / Math.max(1, g.heldout[1] - g.heldout[0]))} of unfamiliar wording can still be misread, so please check the safety findings.` : ""}</p></div>
    <div class="callout"><h4>Open questions for the reviewing oncologist</h4><p class="small">The checklists and plain-language labels were written and
      cross-checked by AI agents and are pending your sign-off. Case 3 requires tumor-lysis labs every 6–12 hours for the first 72 hours (high-risk TLS);
      notes that check labs once daily fail that unsafe-error item. Staging items do not accept a range such as "stage III-IV" as a stage.</p></div></div>`));
  const ex = H(`<div class="callout"><h4>Your verdicts</h4><p class="small store"></p><div class="review"></div></div>`);
  const btn = H(`<button type="button">Export my verdicts (JSON)</button>`);
  btn.onclick = () => {
    const blob = new Blob([JSON.stringify({ report: D.runs.map(r => r.name), exported: new Date().toISOString(), ...REVIEW.mine }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "oncologist_review.json"; a.click();
  };
  if (REVIEW.mode === "local" && !window.claude) $(".review", ex).append(btn);  // a published page saves to the shared store instead
  sec.append(ex);
  sec.append(H(`<p class="tiny muted">Runs: ${D.runs.map(r => esc(r.name) + " (attempt " + r.attempt + ")").join(", ")}. Report generated ${esc(D.generated.replace("T", " "))} UTC.
    ${D.labels_checked ? "" : "Some checklist labels fall back to the criterion text."}</p>`));
  setStore();
}

/* ---------- boot ---------- */
function renderAll() {
  ["#top", "#summary", "#by-case", "#activity", "#charts", "#safety", "#cases", "#method"].forEach(s => $(s).innerHTML = "");
  renderHeader(); renderSummary(); renderByCase(); renderActivity(); renderCharts(); renderSafety(); renderCases(); renderMethod();
}
loadLocal();
renderAll();
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id(); if (!id) return;
  REVIEW.db = db; REVIEW.me = id; REVIEW.mode = "db";
  try { const snap = await db.doc("reviews/" + id).get(); if (snap.exists) { const d = snap.data(); REVIEW.mine = { findings: { ...(d.findings || {}) }, trials: { ...(d.trials || {}) } }; } } catch (e) {}
  if (user.can && (await user.can("data.write")) === false) REVIEW.mode = "readonly";
  // other reviewers' verdicts arrive live; update only the tallies so nobody loses their place while typing
  db.collection("reviews").onSnapshot(q => { const all = {}; q.docs.forEach(d => { all[d.id] = d.data(); }); REVIEW.all = all;
    document.querySelectorAll(".review[data-kind]").forEach(b => { const t = tally(b.dataset.kind, b.dataset.key); const s = $(".tally", b); if (s) s.textContent = t ? `Reviewers so far: ${t}` : ""; }); }, () => {});
  renderAll();
})();
</script>
</body></html>
