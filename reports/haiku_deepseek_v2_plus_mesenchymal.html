-21 for 4 cycles, with pegfilgrastim support. No planned radiotherapy. Restage with PET-CT after cycle 4 and omit RT if Deauville 1-3. This is preferred over 6 cycles of R-CHOP or 3 cycles plus involved-site RT because she has favorable limited-stage disease, fits the FLYER population, and strongly wishes to avoid neck radiation. I would add involved-site RT only for biopsy-proven residual disease after chemotherapy. The main uncertainty is whether 4 cycles alone will be sufficient; the end-of-treatment PET will determine whether RT is added. If she had bulky disease, stage II with adverse features, or a higher IPI, I would favor 6 cycles and/or combined-modality therapy.", "cns_risk": "Low. CNS-IPI 0 (age under 60, stage I, ECOG 0, normal LDH, no extranodal sites, no kidney or adrenal involvement). No intrathecal chemotherapy and no high-dose methotrexate prophylaxis. I would reconsider if she had testicular, breast, adrenal, renal, or bone marrow involvement, or a CNS-IPI of 4 or more. Her stable migraine with aura is not an indication for lumbar puncture or brain MRI.", "response_assessment": "End-of-treatment FDG PET-CT with diagnostic CT 6-8 weeks after cycle 4, interpreted by the Deauville scale. No routine interim PET. Deauville 1-3 is complete metabolic response; observe and omit RT. Deauville 4-5 requires biopsy of the residual site; if positive, treat as refractory with salvage chemotherapy (for example R-ICE) and consider autologous transplant, with involved-site RT for limited residual disease; if negative, observe. Follow with history and examination every 3-6 months for 2 years, then annually.", "pretreatment_workup": "Already completed: excisional biopsy with immunohistochemistry, flow cytometry, and FISH; staging PET-CT; CBC, CMP, LDH, beta-2 microglobulin; hepatitis B, hepatitis C, and HIV serologies; baseline echocardiogram with LVEF 63%. Bone marrow biopsy was appropriately omitted because PET-CT shows no marrow uptake. Before cycle 1: serum beta-hCG, repeat CBC/CMP/LDH/uric acid within 7 days, baseline neuropathy examination, dental evaluation, immunization review, fertility-preservation consultation with AMH/FSH/estradiol, and a contraception plan. No lumbar puncture or brain MRI is indicated.", "supportive_care": "Antiemetic prophylaxis with ondansetron 8 mg IV, dexamethasone 12 mg IV, and olanzapine 5 mg PO nightly on days 1-4; I am avoiding aprepitant because of its CYP3A4 interaction with vincristine. Pegfilgrastim 6 mg SC on day 2. Hydration before rituximab and encouragement of oral fluids. Low tumor-lysis risk, so no rasburicase or allopurinol. No hepatitis B antiviral prophylaxis because HBsAg and anti-HBc are negative and anti-HBs is positive. Stop the combined oral contraceptive because of migraine with aura and VTE risk; use progestin-only or barrier contraception. No routine VTE prophylaxis unless she is hospitalized or immobilized. Update inactivated vaccines before chemotherapy and avoid live vaccines. Monitor for vincristine neuropathy and constipation, and reduce or hold vincristine for grade 2 or worse neuropathy. Avoid codeine because of her allergy; use acetaminophen or oxycodone for pain as needed. Take prednisone in the morning and monitor blood glucose. Offer scalp cooling. Provide work accommodations and psychosocial support.", "fitness_and_goals": "ECOG 0, age 45, normal organ function, LVEF 63%, no cardiac disease, and no frailty. She is fit for full-dose R-CHOP. The intent is curative. Her goals are to be cured, avoid neck radiation, preserve fertility, and continue teaching. We discussed the trade-off between 4 cycles of R-CHOP alone (FLYER) and 3 cycles plus involved-site RT; she prefers to avoid RT, and the favorable biology supports 4 cycles alone. A 2-4 week delay for fertility preservation is acceptable for this low-bulk stage I disease; if she develops B symptoms or rapid progression, I would start chemotherapy promptly.", "missing_information": ["Serum beta-hCG pregnancy test result (not in the record); it must be negative before R-CHOP.", "The patient's fertility-preservation decision, ovarian reserve testing (AMH/FSH/estradiol), and reproductive endocrinology assessment.", "Baseline peripheral neuropathy examination (not documented) before vincristine.", "Dental evaluation and any active dental infection before chemotherapy.", "Immunization history (influenza, COVID-19, pneumococcal) and the date of any recent live vaccine.", "Baseline thyroid function (TSH) and thyroid history, relevant to her concern about neck radiation, although no RT is planned.", "Confirmation of any prior anthracycline exposure (none documented) and a complete baseline cardiac risk assessment.", "Contraception plan after stopping the combined oral contraceptive, and whether she has completed childbearing.", "Baseline ovarian function assessment before cyclophosphamide, given her desire to preserve fertility."], "decisions": {"stage": "I", "diagnosis": "Diffuse large B-cell lymphoma, NOS, GCB phenotype, stage I", "intent": "curative", "regimen": "R-CHOP-21", "cycles": 4, "cycle1_dose_percent": 100, "radiotherapy": "none", "orders_now": ["Rituximab 375 mg/m2 IV (645 mg) on day 1 of each 21-day cycle", "Cyclophosphamide 750 mg/m2 IV (1,290 mg) on day 1 of each 21-day cycle", "Doxorubicin 50 mg/m2 IV (86 mg) on day 1 of each 21-day cycle", "Vincristine 1.4 mg/m2 IV (2 mg maximum) on day 1 of each 21-day cycle", "Prednisone 100 mg PO daily on days 1-5 of each 21-day cycle", "Pegfilgrastim 6 mg SC on day 2 of each 21-day cycle", "Premedicate before rituximab with acetaminophen 650 mg PO, diphenhydramine 25-50 mg PO or IV, and famotidine 20 mg IV", "Antiemetic prophylaxis: ondansetron 8 mg IV and dexamethasone 12 mg IV before chemotherapy on day 1; olanzapine 5 mg PO nightly on days 1-4; prochlorperazine 10 mg PO every 6 hours as needed for breakthrough", "Hydrate with 500 mL normal saline IV before rituximab; encourage oral fluids", "Start senna 8.6 mg/docusate 100 mg PO twice daily as needed for constipation", "Stop combined oral contraceptive; use progestin-only or barrier contraception during treatment and for at least 12 months after rituximab", "Serum beta-hCG pregnancy test before cycle 1", "Baseline CBC with differential, CMP, LDH, uric acid, and TSH within 7 days before cycle 1", "Baseline neurologic examination documenting any peripheral neuropathy before vincristine", "Refer urgently to reproductive endocrinology for fertility preservation counseling, AMH/FSH/estradiol, and oocyte or embryo cryopreservation before cycle 1", "Dental evaluation before cycle 1", "Update inactivated vaccines (influenza, COVID-19, pneumococcal) before chemotherapy; avoid live vaccines", "Place central venous access port before cycle 1 for vesicant chemotherapy", "Continue sumatriptan 50 mg PO as needed for migraine; avoid estrogen-containing contraceptives", "Arrange work accommodations and schedule infusions to minimize missed teaching days", "Offer scalp cooling", "Avoid codeine because of her allergy; use acetaminophen or oxycodone for pain as needed", "Refer to social work for psychosocial, work, and financial support"], "conditional_orders": ["if beta-hCG is positive: delay chemotherapy and refer to obstetrics and gynecology for counseling", "if the patient elects oocyte or embryo cryopreservation: coordinate a 2-4 week delay before cycle 1 and start chemotherapy after retrieval", "if fertility preservation is not feasible or she declines: start R-CHOP promptly and offer GnRH agonist (leuprolide 3.75 mg IM monthly or goserelin 3.6 mg SC monthly) during chemotherapy", "if ANC is less than 1.0 x10^9/L or platelets are less than 75 x10^9/L on day 1 of a cycle: delay that cycle and recheck counts", "if febrile neutropenia develops: admit, hold chemotherapy, and start empiric broad-spectrum antibiotics", "if grade 2 or worse vincristine neuropathy develops: hold vincristine until improvement, then resume at a reduced dose", "if LVEF fal /* one binning and one key for every coverage colour in the report */
const bin = v => v == null ? null : v >= 0.999 ? 4 : v >= 0.75 ? 3 : v >= 0.5 ? 2 : v > 0 ? 1 : 0;
const BINS = ["None", "1–49%", "50–74%", "75–99%", "100%"];
const keyItem = (swatch, label) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">${swatch}${label}</span>`;

/* A required step and the matching error in the same clinical area are one problem
   (e.g. "did not stage III" and "staged IV"), reviewed with one verdict. */
function problems(t) {
  const groups = [];
  for (const it of (t.unsafe || []).map(id => t.items.find(i => i.id === id)).filter(Boolean)) {
    let g = groups.find(g => g.domain === it.domain);
    if (!g) groups.push(g = { domain: it.domain, items: [] });
    g.items.push(it);
  }
  for (const g of groups) {
    g.items.sort((a, b) => (a.kind === "must_not" ? 0 : 1) - (b.kind === "must_not" ? 0 : 1));
    g.key = t.key + "#" + g.items.map(i => i.id).join("+");
    const errs = g.items.filter(i => i.kind === "must_not"), l = s => s.replace(/\.$/, "");
    g.title = errs.length ? errs.map(i => l(i.label)).join("; ") : "Missed: " + g.items.map(i => l(i.label)).join("; ");
  }
  return groups;
}
function itemLabel(t, id) { return (t.items || []).find(i => i.id === id)?.label || id; }

/* ---------- tooltip ---------- */
const tip = $("#tip");
function bindTip(node, htmlText) {
  const show = e => { tip.innerHTML = htmlText; tip.hidden = false; move(e); };
  const move = e => {
    const r = node.getBoundingClientRect();
    const x = e && e.clientX != null ? e.clientX : r.left + r.width / 2, y = e && e.clientY != null ? e.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 12)) + "px";
    tip.style.top = Math.max(8, (y - h - 12 < 8 ? y + 18 : y - h - 12)) + "px";
  };
  node.addEventListener("mouseenter", show); node.addEventListener("mousemove", move);
  node.addEventListener("mouseleave", () => tip.hidden = true);
  node.addEventListener("focus", () => show(null)); node.addEventListener("blur", () => tip.hidden = true);
  if (!node.hasAttribute("tabindex")) node.setAttribute("tabindex", "0");
}

/* ---------- per-model statistics ---------- */
// averages (score, time, calls, tokens, cost) use graded attempts only; attempts that never ran are counted, not averaged
function stats(m) {
  const ts = trialsFor(m), sc = ts.filter(t => t.status === "scored");
  const n = k => ts.filter(t => statusOf(t) === k).length;
  const avgT = k => mean(sc.map(t => t.timing[k]).filter(v => v != null));
  const total = sc.map(t => ["env", "install", "work", "grade"].reduce((a, k) => a + (t.timing[k] || 0), 0)).filter(Boolean);
  const costs = sc.map(t => t.cost).filter(v => v != null);
  return { ts, sc, attempts: ts.length, graded: sc.length, pass: n("pass"), below: n("below"), unsafe: n("unsafe"), none: n("none"),
    mean: mean(sc.map(t => t.score)), minutes: mean(total), avgT, cost: costs.length ? mean(costs) : null,
    problems: sc.flatMap(t => problems(t).map(g => ({ t, g }))) };
}

function verdictList(m) {
  const s = stats(m);
  const np = s.problems.length;
  const head = !s.graded ? "No graded answers: every attempt stopped before the model wrote an answer."
    : `Passed ${s.pass === s.graded ? "all " + s.graded : s.pass + " of " + s.graded} graded attempts` +
      (s.unsafe ? `; ${np} unsafe ${np === 1 ? "problem" : "problems"} in ${s.unsafe} ${s.unsafe === 1 ? "attempt" : "attempts"}.` : ", with no unsafe recommendations.");
  const rows = CASES.map(c => {
    const ts = trialsFor(m, c.id); if (!ts.length) return "";
    let body;
    if (ts.every(t => statusOf(t) === "pass")) body = `Passed ${ts.length === 2 ? "both" : "all"} (${ts.map(t => t.score).join(", ")})`;
    else body = ts.map(t => { const k = statusOf(t), a = `Attempt ${t.attempt}`;
      if (k === "none") return `${a} did not run`;
      if (k === "unsafe") return `${a} unsafe: ` + problems(t).map(g => `<a href="#${findingId(g.key)}">${esc(g.title)}</a>`).join("; ");
      return `${a} ${k === "pass" ? "passed" : "below pass mark"} (${t.score})`; }).join(" \u00b7 ");
    return `<li><b>Case ${caseNo(c.id)}</b><span>${body}</span></li>`;
  }).join("");
  return `<p>${esc(head)}</p><ul>${rows}</ul>`;
}

/* ---------- 3. coverage grid (GitHub-style), models side by side ---------- */
function domainShare(t, d) {
  const its = (t.items || []).filter(i => i.domain === d);
  const max = its.filter(i => i.kind !== "must_not").reduce((a, i) => a + i.points, 0);
  let got = 0; for (const i of its) got += i.kind === "must_not" ? (i.met ? -i.points : 0) : (i.met ? i.points : 0);
  const err = its.some(i => (i.error || (i.missed && i.kind === "must")) && i.severity === "dangerous");
  return { has: its.length > 0, share: max ? Math.max(0, got) / max : (its.some(i => i.error) ? 0 : 1), err, its };
}
const usedDomains = () => D.domains.filter(d => CASES.some(c => (c.domains || []).includes(d.key)) || TRIALS.some(t => (t.items || []).some(i => i.domain === d.key)));

function chartTime() {
  const parts = [["env", "Preparing the record", "var(--axis)"], ["install", "Installing the model's tools", "var(--install)"],
    ["work", "Model reading and writing", null], ["grade", "Grading", "var(--ink-2)"]];
  const left = 140, W = 520, rowH = 26, top = 8;
  const avg = (m, k) => stats(m).avgT(k) || 0;
  const tot = m => parts.reduce((a, p) => a + avg(m, p[0]), 0);
  const raw = Math.max(...MODELS.map(m => tot(m.key)), 60), step = raw > 900 ? 300 : raw > 360 ? 120 : 60;
  const maxT = Math.ceil(raw / step) * step, scale = (W - left - 62) / maxT;
  const svg = S("svg", { viewBox: `0 0 ${W} ${top + MODELS.length * (rowH + 14) + 26}`, role: "img", "aria-label": "Average minutes per graded case, by model and stage" });
  for (let s = 0; s <= maxT; s += step) {
    svg.append(S("line", { x1: left + s * scale, x2: left + s * scale, y1: top - 4, y2: top + MODELS.length * (rowH + 14) - 8, class: "grid" }));
    svg.append(S("text", { x: left + s * scale, y: top + MODELS.length * (rowH + 14) + 12, "text-anchor": "middle", class: "lbl" }, (s / 60) + " min"));
  }
  MODELS.forEach((m, r) => {
    const y = top + r * (rowH + 14); let x = left;
    svg.append(S("text", { x: left - 12, y: y + rowH / 2 + 5, "text-anchor": "end", class: "lbl" }, m.name));
    parts.forEach(([k, label, col]) => {
      const v = avg(m.key, k); if (v < 1) return;
      const w = v * scale - 2;
      const rc = S("rect", { x, y, width: Math.max(w, 1), height: rowH, rx: 4, fill: col || mcol(m.key) }); svg.append(rc);
      bindTip(rc, `<b>${esc(m.name)}</b><br>${label}: ${mins(v)} min on average`);
      x += v * scale;
    });
    svg.append(S("text", { x: x + 6, y: y + rowH / 2 + 5, class: "val" }, mins(tot(m.key)) + " min"));
  });
  const avgOf = (m, k) => Math.round(mean(stats(m).sc.map(t => t.timing[k]).filter(v => v != null)) || 0);
  const fig = figure("Time per case", "Average minutes per graded attempt. The model's own working time is in its colour; setup and grading in greys.", svg,
    tableOf(["Model", ...parts.map(p => p[1] + " (min)"), "Total (min)", "Model calls", "Tokens", "Cost per case"],
      MODELS.map(m => [esc(m.name), ...parts.map(p => mins(avg(m.key, p[0]))), mins(tot(m.key)), avgOf(m.key, "llm_calls"),
        avgOf(m.key, "tokens").toLocaleString(), money(stats(m.key).cost)]), [1, 2, 3, 4, 5, 6, 7]));
  const sw = c => `<i class="sw" style="background:${c};margin-right:0"></i>`;
  fig.append(H(`<div class="legend tiny">${parts.map(([k, l, c]) => keyItem(c ? sw(c) : MODELS.map(m => sw(mcol(m.key))).join(""), l + (c ? "" : " (model colour)"))).join("")}</div>`));
  return fig;
}
function renderCharts() {
  const sec = $("#charts");
  sec.append(H(`<div class="lede"><h2>Charts</h2><p>Every chart has a numbers view: use "Show numbers" for the exact values.</p></div>`));
  const g = H(`<div class="figs"></div>`);
  g.append(chartOutcomes(), chartTime(), chartAreas(), chartConsistency());
  sec.append(g);
}

/* ---------- review storage: shared store when published, browser + export when local ---------- */
const REVIEW = { mode: "local", mine: { findings: {}, trials: {} }, all: {}, me: null, db: null, write: null, profiles: null };
const LKEY = "oncoworld-report:" + D.runs.map(r => r.name).join("+");
function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LKEY) || "null"); if (v) REVIEW.mine = v; } catch (e) {} }
function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(REVIEW.mine)); } catch (e) {} }
let pending = null, writing = false;
async function persist() {
  if (REVIEW.mode !== "db") { saveLocal(); setStore(); return; }
  pending = JSON.parse(JSON.stringify(REVIEW.mine)); if (writing) return;
  writing = true;
  while (pending) { const body = pending; pending = null;
    try { await REVIEW.db.doc("reviews/" + REVIEW.me).set({ ...body, updated: new Date().toISOString() }); setStore("Saved"); }
    catch (e) { if (e && e.code === "invalid_argument") { REVIEW.mode = "readonly"; setStore(); } else setStore("Not saved: " + (e && e.message || "error")); } }
  writing = false;
}
function setStore(msg) {
  const t = { local: "Your verdicts are kept in this browser. Use Export to send them.", db: "Your verdicts are saved to this report and visible to the other reviewers.",
    readonly: "You can read the reviews, but your sharing level does not allow saving verdicts. Ask the owner for Contributor access." }[REVIEW.mode];
  document.querySelectorAll(".store").forEach(n => n.textContent = msg ? `${msg}. ${t}` : t);
}
function tally(kind, key) {
  const counts = {}; let n = 0;
  for (const [uid, r] of Object.entries(REVIEW.all)) { const v = r?.[kind]?.[key]?.v; if (v) { counts[v] = (counts[v] || 0) + 1; n++; } }
  return n ? Object.entries(counts).map(([v, c]) => `${c} ${v}`).join(", ") : "";
}
function reviewControls(kind, key, choices) {
  const cur = REVIEW.mine[kind][key] || {};
  const box = H(`<div class="review" role="group" aria-label="Your verdict"></div>`);
  box.dataset.kind = kind; box.dataset.key = key;
  for (const [v, label] of choices) {
    const b = H(`<button type="button" aria-pressed="${cur.v === v}">${esc(label)}</button>`);
    b.onclick = () => { const r = REVIEW.mine[kind][key] || {}; r.v = r.v === v ? undefined : v; if (!r.v && !r.note) delete REVIEW.mine[kind][key]; else REVIEW.mine[kind][key] = r;
      box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b && !!r.v)); persist(); };
    box.append(b);
  }
  const ta = H(`<textarea id="note-${kind}-${key.replace(/[^\w-]/g, "_")}" placeholder="Note (optional)" aria-label="Note">${esc(cur.note || "")}</textarea>`);
  let timer; ta.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { const r = REVIEW.mine[kind][key] || {}; r.note = ta.value; REVIEW.mine[kind][key] = r; persist(); }, 700); };
  box.append(ta);
  if (REVIEW.mode === "readonly") box.querySelectorAll("button,textarea").forEach(x => x.disabled = true);
  box.append(H(`<span class="tally"></span>`));
  const t = tally(kind, key); $(".tally", box).textContent = t ? `Reviewers so far: ${t}` : "";
  return box;
}

/* ---------- 5. safety findings: one card per note, one verdict per clinical problem ---------- */
const LQ = "“", RQ = "”";
const quotes = xs => xs.map(x => `<blockquote>${LQ}${esc(x)}${RQ}</blockquote>`).join("");
function partsList(it) {
  if (!it.parts?.length) return "";
  return `<div class="tiny muted">What the note contained</div><ul class="parts">${it.parts.map(p =>
    `<li>${p.met ? ICON.pass : ICON.miss}<span><span class="sr">${p.met ? "Present" : "Missing"}: </span>${esc(p.label)}${p.met ? "" : " <b>(missing)</b>"}</span></li>`).join("")}</ul>`;
}
function quoteBlock(it) {
  if (it.kind === "must_not") return it.quotes?.length ? quotes(it.quotes) : `<blockquote class="none">No quotable sentence found.</blockquote>`;
  return partsList(it) + (it.related?.length
    ? `<div class="tiny muted">Closest statements in the note (the requirement was not fully met)</div>` + quotes(it.related)
    : `<blockquote class="none">The note says nothing that meets this requirement.</blockquote>`);
}
function renderSafety() {
  const sec = $("#safety"); sec.innerHTML = "";
  const notes = TRIALS.filter(t => t.status === "scored" && t.unsafe.length)
    .sort((a, b) => a.case.localeCompare(b.case) || a.model.localeCompare(b.model) || a.attempt - b.attempt);
  const nProb = notes.reduce((a, t) => a + problems(t).length, 0);
  const notRun = TRIALS.filter(t => t.status !== "scored");
  sec.append(H(`<div class="lede"><h2>Safety findings to review</h2><p>${notes.length} ${notes.length === 1 ? "note was" : "notes were"} failed for
    ${nProb} unsafe ${nProb === 1 ? "problem" : "problems"}. A wrong statement and the correct step it replaced (for example "stages IV" and
    "does not stage III") are shown together as one problem. Each quotes the note; please record whether you agree.</p><p class="store"></p></div>`));
  if (!notes.length) sec.append(H(`<p>No unsafe errors were flagged.</p>`));
  for (const t of notes) {
    const card = H(`<article class="finding"><div class="finding-h">${pill("unsafe")}<span class="sw" style="background:${mcol(t.model)}"></span><b>${esc(modelOf(t.model).name)}</b>
      <span class="muted">Case ${caseNo(t.case)}: ${esc(caseTitle(t.case))} · attempt ${t.attempt}</span></div></article>`);
    for (const g of problems(t)) {
      const blk = H(`<div class="unsafe-item" id="${findingId(g.key)}"><h4>${esc(g.title)}</h4></div>`);
      for (const it of g.items) {
        blk.append(H(`<div style="display:grid;gap:6px"><div class="small"><b>${it.kind === "must_not" ? "Error" : "Missed"}:</b> ${esc(it.label)}</div>
          ${it.why ? `<p class="small ink2">${esc(it.why)}</p>` : ""}${quoteBlock(it)}</div>`));
      }
      blk.append(H(`<p class="tiny muted">Checklist wording: ${g.items.map(i => esc(i.text)).join(" / ")}</p>`));
      blk.append(reviewControls("findings", g.key, [["agree", "Agree: unsafe"], ["disagree", "Disagree: grader is wrong"], ["unsure", "Unsure"]]));
      card.append(blk);
    }
    card.append(H(`<a class="small" href="#trial-${cssId(t.key)}">Open the full note and checklist</a>`));
    sec.append(card);
  }
  // items where the two graders (regex rules and LLM judge) disagreed: provisional until an oncologist decides
  const disputed = TRIALS.filter(t => t.status === "scored").flatMap(t => (t.items || []).filter(i => i.review).map(i => ({ t, i })));
  if (disputed.length) {
    sec.append(H(`<h3>Graders disagree: ${disputed.length} ${disputed.length === 1 ? "item needs" : "items need"} your call</h3>`));
    sec.append(H(`<p class="small ink2">The rule-based grader and the AI judge reached different verdicts. The score counts the stricter
      verdict on unsafe-error items and the judge's verdict otherwise, until you decide.</p>`));
    for (const { t, i } of disputed.sort((a, b) => (a.i.severity === "dangerous" ? 0 : 1) - (b.i.severity === "dangerous" ? 0 : 1))) {
      const blk = H(`<div class="unsafe-item" style="border-left:3px solid var(--warn);padding-left:12px">
        <div class="small"><b>${esc(modelOf(t.model).name)}</b> · Case ${caseNo(t.case)} · attempt ${t.attempt}${i.severity === "dangerous" ? ` <span class="tag tag-unsafe">Unsafe-error item</span>` : ""}</div>
        <h4>${esc(i.label)}</h4>
        <p class="tiny muted">Rules say: ${i.regex ? "met" : "not met"} · Judge says: ${i.judge ? "met" : "not met"} · Checklist wording: ${esc(i.text)}</p>
        ${(i.quotes || []).length ? quotes(i.quotes) : (i.related || []).length ? quotes(i.related) : ""}</div>`);
      blk.append(reviewControls("findings", `${t.key}#review#${i.id}`, [["met", i.kind === "must_not" ? "Error was made" : "Requirement met"], ["not-met", i.kind === "must_not" ? "No error" : "Not met"], ["unsure", "Unsure"]]));
      sec.append(blk);
    }
  }
  if (notRun.length) {
    sec.append(H(`<h3>Attempts that did not run</h3>`));
    const reasons = {}; for (const t of notRun) (reasons[t.reason] ||= []).push(t);
    for (const [r, ts] of Object.entries(reasons))
      sec.append(H(`<div class="callout">${pill("none")}<p class="small"><b>${[...new Set(ts.map(t => modelOf(t.model).name))].join(", ")}</b> · ${ts.length} ${ts.length === 1 ? "attempt" : "attempts"}
        (${ts.map(t => "case " + caseNo(t.case) + ", attempt " + t.attempt).join("; ")})</p><p class="small ink2">${esc(r)}</p></div>`));
  }
  setStore();
}

/* ---------- 6. case details ---------- */
const cssId = s => s.replace(/[^\w-]/g, "_");
function checklist(t) {
  const box = H(`<div class="det-body"></div>`);
  for (const d of D.domains) {
    const its = t.items.filter(i => i.domain === d.key); if (!its.length) continue;
    const area = H(`<div class="check-area"><h4>${esc(d.label)}</h4></div>`);
    const order = i => i.error ? 0 : i.missed ? (i.kind === "must" ? 1 : 2) : i.kind === "must_not" ? 4 : 3;
    for (const i of its.slice().sort((a, b) => order(a) - order(b))) {
      if (i.kind === "must_not" && !i.met) continue;
      const danger = i.severity === "dangerous" && (i.error || (i.missed && i.kind === "must"));
      const ic = i.error ? (danger ? ICON.unsafe : ICON.below) : i.missed ? (danger ? ICON.unsafe : ICON.miss) : ICON.pass;
      const word = i.error ? "Error" : i.missed ? "Missed" : "Covered";
      const tag = danger ? `<span class="tag tag-unsafe">Unsafe ${i.error ? "error" : "omission"}</span>`
        : i.error ? `<span class="tag tag-err">Error</span>`
        : (i.met && i.kind !== "must_not" && i.supported === false) ? `<span class="tag tag-check">Please check</span>` : "";
      const rtag = i.review ? `<span class="tag tag-err">Graders disagree</span>` : "";
      const pts = i.kind === "must_not" ? (i.met ? `−${i.points} pts` : "") : `${i.met ? i.points : 0}/${i.points} pts`;
      const row = H(`<div class="ci"><span class="ic" aria-label="${word}">${ic}</span><span><span class="sr">${word}: </span>${esc(i.label)}${tag}${rtag}</span><span class="pts">${pts}</span></div>`);
      if (i.quotes?.length) row.append(H(`<div class="q">${i.supported === false ? "Closest: " : ""}${LQ}${esc(i.quotes[0])}${RQ}</div>`));
      else if (i.missed && i.kind === "must" && i.parts?.length) row.append(H(`<div class="q">Missing: ${i.parts.filter(p => !p.met).map(p => esc(p.label)).join("; ")}</div>`));
      else if (i.missed && i.kind === "must" && i.related?.length) row.append(H(`<div class="q">Closest: ${LQ}${esc(i.related[0])}${RQ}</div>`));
      area.append(row);
    }
    const avoided = its.filter(i => i.kind === "must_not" && !i.met);
    if (avoided.length) area.append(H(`<p class="tiny muted">Errors avoided: ${avoided.map(i => esc(i.label)).join("; ")}.</p>`));
    box.append(area);
  }
  return box;
}
function versus(t) {
  const gold = caseOf(t.case).gold || {}, a = t.answer || {};
  const keys = [...new Set([...D.fields, ...Object.keys(a), ...Object.keys(gold)])].filter(k => !k.startsWith("_"));
  const fmt = v => Array.isArray(v) ? v.map(x => "• " + esc(typeof x === "object" ? JSON.stringify(x) : x)).join("<br>")
    : (v && typeof v === "object") ? Object.entries(v).map(([k, x]) => `<b>${esc(k)}</b>: ${Array.isArray(x) ? x.map(y => esc(typeof y === "object" ? JSON.stringify(y) : y)).join("; ") : esc(x)}`).join("<br>")
    : esc(v ?? "");
  const g = H(`<div class="versus"><div style="font-weight:700">${esc(modelOf(t.model).name)}'s note</div><div class="gold" style="font-weight:700">Reference note</div></div>`);
  for (const k of keys) { g.append(H(`<div class="k">${esc(FIELD[k] || k)}</div>`), H(`<div>${fmt(a[k])}</div>`), H(`<div class="gold">${fmt(gold[k])}</div>`)); }
  return g;
}
function renderCases() {
  const sec = $("#cases");
  sec.append(H(`<div class="lede"><h2>Case details</h2><p>Each patient's summary, what the case tests, and every model's note with its checklist.</p></div>`));
  CASES.forEach((c, ci) => {
    const card = c.card || {};
    const art = H(`<article class="case" id="case-${c.id}"><div><div class="eyebrow">Case ${ci + 1} · ${esc(FORMAT_SHORT[c.format] || c.format)}</div><h2>${esc(card.title || c.id)}</h2></div>
      <div class="case-grid"><div class="case-card"><h4>Patient</h4><p class="small">${esc(card.patient || "")}</p><h4>Reference plan</h4><p class="small">${esc(card.correct_plan || "")}</p></div>
      <div class="case-card"><h4>What this case tests</h4><ul class="small">${(card.tests || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div></article>`);
    for (const m of MODELS) for (const t of trialsFor(m.key, c.id)) {
      const k = statusOf(t);
      const det = H(`<details id="trial-${cssId(t.key)}"><summary><span class="sw" style="background:${mcol(m.key)}"></span><b>${esc(m.name)}</b><span class="muted">attempt ${t.attempt}</span>
        ${pill(k)}${t.status === "scored" ? `<span class="num">${t.score}/100</span>` : ""}</summary></details>`);
      if (t.status !== "scored") det.append(H(`<div class="det-body"><p class="small">${esc(t.reason)}</p></div>`));
      else {
        const body = H(`<div class="det-body"></div>`);
        body.append(H(`<div><h4>Your overall verdict on this note</h4><p class="store tiny"></p></div>`));
        body.append(reviewControls("trials", t.key, [["acceptable", "Clinically acceptable"], ["not-acceptable", "Not acceptable"], ["unsure", "Unsure"]]));
        body.append(H(`<h4>Checklist</h4>`)); body.append(checklist(t));
        const vs = H(`<details><summary>Show the full note next to the reference note</summary><div class="det-body"></div></details>`);
        vs.addEventListener("toggle", () => { const b = $(".det-body", vs); if (vs.open && !b.childElementCount) b.append(versus(t)); });
        body.append(vs);
        det.append(body);
      }
      art.append(det);
    }
    sec.append(art);
  });
  if (location.hash.startsWith("#trial-")) { const d = document.getElementById(location.hash.slice(1)); if (d) { d.open = true; d.scrollIntoView(); } }
  document.querySelectorAll('a[href^="#trial-"]').forEach(a => a.addEventListener("click", () => { const d = document.getElementById(a.getAttribute("href").slice(1)); if (d) d.open = true; }));
}

/* ---------- 7. method ---------- */
function renderMethod() {
  const g = D.grader || {};
  const f = (p) => p ? `${p[0]} of ${p[1]}` : "not available";
  const sec = $("#method");
  sec.append(H(`<div class="lede"><h2>Method and limits</h2></div>`));
  sec.append(H(`<div class="case-grid">
    <div class="callout"><h4>What the models were given</h4><p class="small">The patient's ${esc([...new Set(CASES.map(c => FORMAT[c.format] || c.format))].join(" or "))}, with clinic notes and
      reports embedded, and the instruction to write a tumor-board consult note in 11 sections. No web access. Cases are synthetic.</p></div>
    <div class="callout"><h4>How notes were graded</h4><p class="small">Automatically, against a checklist written for each patient (24 to 30 items): requirements
      earn points, errors subtract points, and an unsafe error sets the score to 0. The grader reads the note the way a clinician would: negations
      ("not double-hit"), hypotheticals ("if FISH were positive"), and statements about what a therapy is reserved for do not count as claims.</p></div>
    <div class="callout"><h4>How far the grading can be trusted</h4><p class="small">Known-answer notes graded as expected: <b class="num">${f(g.calibration)}</b>.
      Single-sentence tests written by AI agents acting as oncologists: <b class="num">${f(g.probes)}</b>. New sentences the grading rules were never tuned on:
      <b class="num">${f(g.heldout)}</b>. ${g.heldout ? `About one sentence in ${Math.round(g.heldout[1] / Math.max(1, g.heldout[1] - g.heldout[0]))} of unfamiliar wording can still be misread, so please check the safety findings.` : ""}</p></div>
    <div class="callout"><h4>Open questions for the reviewing oncologist</h4><p class="small">The checklists and plain-language labels were written and
      cross-checked by AI agents and are pending your sign-off. Case 3 requires tumor-lysis labs every 6–12 hours for the first 72 hours (high-risk TLS);
      notes that check labs once daily fail that unsafe-error item. Staging items do not accept a range such as "stage III-IV" as a stage.</p></div></div>`));
  const ex = H(`<div class="callout"><h4>Your verdicts</h4><p class="small store"></p><div class="review"></div></div>`);
  const btn = H(`<button type="button">Export my verdicts (JSON)</button>`);
  btn.onclick = () => {
    const blob = new Blob([JSON.stringify({ report: D.runs.map(r => r.name), exported: new Date().toISOString(), ...REVIEW.mine }, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "oncologist_review.json"; a.click();
  };
  if (REVIEW.mode === "local" && !window.claude) $(".review", ex).append(btn);  // a published page saves to the shared store instead
  sec.append(ex);
  sec.append(H(`<p class="tiny muted">Runs: ${D.runs.map(r => esc(r.name) + " (attempt " + r.attempt + ")").join(", ")}. Report generated ${esc(D.generated.replace("T", " "))} UTC.
    ${D.labels_checked ? "" : "Some checklist labels fall back to the criterion text."}</p>`));
  setStore();
}

/* ---------- boot ---------- */
function renderAll() {
  ["#top", "#summary", "#by-case", "#activity", "#charts", "#safety", "#cases", "#method"].forEach(s => $(s).innerHTML = "");
  renderHeader(); renderSummary(); renderByCase(); renderActivity(); renderCharts(); renderSafety(); renderCases(); renderMethod();
}
loadLocal();
renderAll();
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id(); if (!id) return;
  REVIEW.db = db; REVIEW.me = id; REVIEW.mode = "db";
  try { const snap = await db.doc("reviews/" + id).get(); if (snap.exists) { const d = snap.data(); REVIEW.mine = { findings: { ...(d.findings || {}) }, trials: { ...(d.trials || {}) } }; } } catch (e) {}
  if (user.can && (await user.can("data.write")) === false) REVIEW.mode = "readonly";
  // other reviewers' verdicts arrive live; update only the tallies so nobody loses their place while typing
  db.collection("reviews").onSnapshot(q => { const all = {}; q.docs.forEach(d => { all[d.id] = d.data(); }); REVIEW.all = all;
    document.querySelectorAll(".review[data-kind]").forEach(b => { const t = tally(b.dataset.kind, b.dataset.key); const s = $(".tally", b); if (s) s.textContent = t ? `Reviewers so far: ${t}` : ""; }); }, () => {});
  renderAll();
})();
</script>
</body></html>
