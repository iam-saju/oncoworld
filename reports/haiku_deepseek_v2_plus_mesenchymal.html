not double-hit, and does not justify DA-EPOCH-R.", "HBsAg-negative but anti-HBc-positive serology is resolved hepatitis B: rituximab needs entecavir or tenofovir prophylaxis started before the first dose.", "CNS-IPI 3 is intermediate risk with no high-risk sites or neurologic symptoms, so routine CNS prophylaxis, MRI brain and lumbar puncture are not indicated.", "A fit 62-year-old with ECOG 1 who wants cure gets full-dose curative therapy, not dose-reduced or palliative treatment."], "correct_plan": "Six cycles of full-dose Pola-R-CHP (R-CHOP acceptable) with curative intent, with entecavir started before the first rituximab dose and continued at least 12 months after the last, baseline HBV DNA and liver tests, TLS prophylaxis with allopurinol and hydration, and pegfilgrastim considered. No routine CNS prophylaxis; end-of-treatment PET-CT read with Deauville, biopsying residual Deauville 4-5 uptake before changing therapy and considering ISRT to a residual PET-positive bulky site."}, "labels_checked": true, "gold": {"diagnosis": "Diffuse large B-cell lymphoma, NOS, non-germinal-center B-cell (non-GCB) phenotype by the Hans algorithm (CD10-, BCL6+, MUM1+). Hans non-GCB is an immunohistochemical surrogate and is not the same as the molecular activated B-cell (ABC) subtype, which requires gene-expression profiling. CD5 and EBER negative.", "stage": "Lugano (Ann Arbor) stage III with B symptoms (recurrent fevers and drenching night sweats; 7 kg weight loss is about 8% of body weight) and bulky disease (11.0 cm retroperitoneal mass, >=10 cm). Nodal disease above and below the diaphragm (left cervical, mediastinal, retroperitoneal) plus splenic involvement; the spleen is lymphatic tissue, not an extranodal site, so it does not raise the stage. No extranodal organ involvement on PET-CT and the bone marrow is negative.", "biology": "Double-expressor lymphoma by IHC: MYC 50% (>=40%) and BCL2 80% (>=50%). Not double-hit: FISH shows no MYC, BCL2 or BCL6 rearrangement, so this is not high-grade B-cell lymphoma with MYC and BCL2 rearrangements. Double-expressor status is prognostically adverse but does not by itself change first-line therapy. Ki-67 ~85%.", "prognosis": "IPI 3 of 5, high-intermediate risk: age >60 (62), LDH elevated (735 U/L, about 3x ULN) and stage III; ECOG 1 and zero extranodal sites do not score. CNS-IPI 3 of 6, intermediate risk of CNS relapse (about 3-4% at 2 years): the spleen does not count as an extranodal site and there is no kidney or adrenal involvement.", "first_line_treatment": "Curative-intent immunochemotherapy. Recommend Pola-R-CHP (polatuzumab vedotin, rituximab, cyclophosphamide, doxorubicin, prednisone) for 6 cycles every 21 days as the preferred regimen: IPI >=2 matches POLARIX eligibility, and the progression-free survival benefit was most notable in non-GCB/ABC disease. R-CHOP for 6 cycles is an acceptable alternative. Give full doses; he is 62 with ECOG 1 and normal organ function. DA-EPOCH-R is not indicated for double-expressor biology without MYC/BCL2 rearrangements. Start entecavir before the first rituximab dose (see pretreatment workup). Consider consolidative ISRT to the initially bulky retroperitoneal site only if it remains PET-positive at the end of treatment.", "cns_risk": "CNS-IPI 3, intermediate risk; no high-risk extranodal sites (kidney, adrenal, testis, breast, uterus) and no neurologic symptoms. Routine CNS prophylaxis is not indicated (neither high-dose methotrexate nor intrathecal therapy). Routine MRI brain or lumbar puncture is not indicated without neurologic symptoms; image and sample CSF promptly if new neurologic symptoms develop.", "response_assessment": "FDG PET-CT at the end of treatment (6-8 weeks after the last cycle), read with Lugano 2014 criteria and the Deauville 5-point scale; Deauville 1-3 is a complete metabolic response. Interim PET-CT after cycles 2-4 is optional and should not change therapy unless it shows progression. Biopsy residual Deauville 4-5 uptake before changing therapy when it would change management; a residual PET-positive initially bulky site without other disease can be treated with ISRT.", "pretreatment_workup": "Hepatitis B serology shows HBsAg nonreactive, anti-HBc total reactive and anti-HBs reactive: resolved (past) HBV infection, which carries a high risk of HBV reactivation with rituximab and other anti-CD20 antibodies even though HBsAg is negative. Send a quantitative HBV DNA and hepatic panel before cycle 1; if HBV DNA is detectable, manage as chronic HBV with hepatology input. Start entecavir 0.5 mg by mouth daily (tenofovir is an alternative) before the first rituximab dose, and continue it for at least 12 months after the last rituximab dose. Monitor ALT and HBV DNA every 1-3 months during therapy and after entecavir stops. HCV and HIV nonreactive. Echocardiogram LVEF 58%, adequate for anthracycline. PET-CT, bone marrow and FISH are complete.", "supportive_care": "Tumor lysis syndrome risk is at least intermediate (11 cm mass, LDH about 3x ULN, uric acid 6.8-7.1, normal renal function): allopurinol 300 mg daily starting 2-3 days before cycle 1, oral plus IV hydration, and TLS labs (potassium, phosphate, calcium, uric acid, creatinine, LDH) within 24-72 hours of cycle 1; escalate to rasburicase if uric acid rises or creatinine climbs. Primary G-CSF prophylaxis (pegfilgrastim) with each cycle is reasonable. Entecavir antiviral prophylaxis as above. Echocardiogram LVEF 58% permits anthracycline. Antiemetics per regimen. Levothyroxine, omeprazole and atorvastatin can continue. Counsel about alopecia and peripheral neuropathy with polatuzumab.", "fitness_and_goals": "Fit for full-dose curative-intent therapy: ECOG 1, age 62, normal renal and hepatic function, LVEF 58%, and well-controlled comorbidities (hypothyroidism, GERD, hyperlipidemia). His goal is cure and continuing part-time work; full-dose therapy is aligned with that goal. Six 21-day cycles starting late September would finish around January 2027, before his daughter's May wedding. Limit job-site travel during nadirs.", "missing_information": ["Quantitative HBV DNA level (not yet sent; needed at baseline given reactive anti-HBc)"], "decisions": {"stage": "III", "diagnosis": "DLBCL NOS, non-GCB (Hans), double-expressor, not double-hit", "intent": "curative", "regimen": "Pola-R-CHP (polatuzumab vedotin 1.8 mg/kg, rituximab 375 mg/m2, cyclophosphamide 750 mg/m2, doxorubicin 50 mg/m2 IV day 1; prednisone 100 mg PO days 1-5) every 21 days", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "none planned now; ISRT to the initially bulky retroperitoneal site only if PET-positive at end of treatment", "orders_now": ["Quantitative HBV DNA before cycle 1", "Hepatic function panel (ALT, AST, bilirubin, alkaline phosphatase) before cycle 1", "Entecavir 0.5 mg PO daily, start before the first rituximab dose and continue for at least 12 months after the last rituximab dose", "Monitor ALT and HBV DNA every 1-3 months during therapy and after entecavir stops", "Allopurinol 300 mg PO daily starting 2-3 days before cycle 1", "Oral plus IV hydration around cycle 1", "Pola-R-CHP cycle 1 at full dose", "Pegfilgrastim 6 mg SC on day 2 of each cycle", "Antiemetics per regimen", "Continue levothyroxine, omeprazole and atorvastatin", "Counsel about alopecia and peripheral neuropathy"], "conditional_orders": ["if baseline HBV DNA detectable: manage as chronic HBV with hepatology input", "if uric acid rises or creatinine climbs after cycle 1: rasburicase", "if new neurologic symptoms: MRI brain and lumbar puncture with CSF cytology and flow cytometry", "if end-of-treatment PET Deauville 4-5: biopsy residual uptake before changing therapy", "if the initially bulky retroperitoneal site alone remains PET-positive at end of treatment: consolidative ISRT"], "lab_monitoring": [{"tests": "TLS labs: potassium, phosphate, calcium, uric acid, creatinine, LDH", "every_hours": 24, "duration_hours": 72}]}}, "passing": 75, "format": "FHIR", "domains": ["cns_management", "diagnosis", "first_line_treatment", "fitness_and_goals", "missing_information", "molecular_classification", "pretreatment_workup", "prognosis", "response_assessment", "staging", "supportive_care"]}, {"id": "dlbcl_0002", "task": "dlbcl_0002_splenic_stage_iii_cardiac_v2_fhir", "card": {"title": "Stage III DLBCL with prior anthracycline and reduced LVEF", "patient": "59F, breast cancer survivor (2016: dose-dense AC, cumulative doxorubicin 240 mg/m2, left breast RT, on anastrozole), presents with left axillary mass, fevers to 38.4 C, drenching night sweats; ECOG 1, LDH 510. Non-GCB DLBCL (MYC 45%, BCL2 70%, FISH negative for rearrangements), PET nodes above and below the diaphragm plus splenic nodules, marrow negative, and new LVEF 45% (62% in 2016) with GLS -14%.", "tests": ["Spleen is a nodal site under Lugano, so stage is III, not IV, and IPI is 2.", "Double-expressor by IHC but FISH-negative, so not double-hit; no intensification to DA-EPOCH-R.", "Prior doxorubicin 240 mg/m2, left chest RT and LVEF 62% to 45% mean standard full-dose R-CHOP / Pola-R-CHP is not safe as is.", "Treatment must stay curative: anthracycline-free (R-CEOP / R-GCVP) or cardio-protected regimen, with cardio-oncology input and cardioprotective drugs.", "CNS-IPI 2 with no high-risk sites: no routine CNS prophylaxis."], "correct_plan": "Curative-intent R-CEOP x6 (R-GCVP as alternative) after urgent cardio-oncology review, with ACE inhibitor/ARB plus carvedilol replacing amlodipine and serial echo, troponin and NT-proBNP; R-CHOP with liposomal doxorubicin or dexrazoxane only if cardio-oncology judges it safe. No CNS prophylaxis, allopurinol and G-CSF support, and end-of-treatment PET-CT read with Deauville."}, "labels_checked": true, "gold": {"diagnosis": "Diffuse large B-cell lymphoma, NOS, non-germinal-center (non-GCB) phenotype by the Hans algorithm (CD10-, BCL6+, MUM1+). Hans is an immunohistochemical surrogate and is not equivalent to molecular ABC cell-of-origin by gene-expression profiling. EBER negative; CD5 negative. The left axillary node is lymphoma, not recurrent breast carcinoma: cytokeratin AE1/AE3 and GATA3 are negative and there is no epithelial component.", "stage": "Lugano (Ann Arbor) stage III with B symptoms (documented fevers to 38.4 C and drenching night sweats; weight loss ~3%, below 10%): FDG-avid nodes on both sides of the diaphragm (left axillary and mediastinal above; mesenteric and para-aortic below) with splenic involvement. The spleen is lymphatic tissue (a nodal site, not extranodal), so splenic nodules do not make this stage IV; there is no kidney, adrenal, liver, lung, bone, breast or CNS involvement and the bone marrow biopsy is negative. Largest mass 7.5 cm (mesenteric): below the 10 cm Lugano threshold for bulk, although some trials define bulk at 7.5 cm, so the definition varies.", "biology": "Double-expressor lymphoma by IHC (MYC 45%, at or above the 40% threshold; BCL2 70%, above the 50% threshold), which carries a somewhat worse prognosis with standard immunochemotherapy. Not double-hit: FISH shows no MYC, BCL2 or BCL6 rearrangement, so this is not high-grade B-cell lymphoma. Double-expressor status alone does not justify DA-EPOCH-R or other intensified regimens. Ki-67 ~80%.", "prognosis": "IPI 2 of 5 (low-intermediate risk): LDH elevated (510 U/L, ULN 225) and stage III. Age 59 (not >60), ECOG 1 and 0 extranodal sites (the spleen is not counted as an extranodal site) score 0. CNS-IPI 2 of 6 (intermediate risk): LDH and stage only; no kidney/adrenal involvement. Beta-2 microglobulin mildly elevated at 2.9 mg/L.", "first_line_treatment": "Curative intent. The key issue is cardiac: she received cumulative doxorubicin 240 mg/m2 (dose-dense AC-T, 2016) plus left breast radiotherapy, and LVEF has fallen from 62% (2016) to 45% with GLS -14% and mild global hypokinesis, a >10-point decline to <50% consistent with cancer therapy-related cardiac dysfunction (asymptomatic, NYHA I). Standard full-dose doxorubicin (R-CHOP or Pola-R-CHP) should not be given in this setting. Urgent cardio-oncology referral before cycle 1, with guideline-directed cardioprotection: start an ACE inhibitor or ARB (e.g. switch amlodipine to lisinopril or candesartan) plus a beta-blocker (carvedilol), titrated as blood pressure allows. Recommend curative-intent R-CEOP (rituximab, cyclophosphamide, etoposide, vincristine, prednisone; etoposide substituted for doxorubicin) for 6 cycles as an anthracycline-free regimen; R-GCVP (gemcitabine in place of doxorubicin) is an alternative. Tell the patient that anthracycline-free regimens likely have lower efficacy (cure rates) than anthracycline-based therapy, based on retrospective data. An anthracycline-modified option (R-CHOP with liposomal doxorubicin or with dexrazoxane) is acceptable only if cardio-oncology judges the cardiac risk acceptable after evaluation and optimization. Monitor during therapy with serial echocardiography (LVEF and GLS) every 2-3 cycles and at end of treatment, plus high-sensitivity troponin and NT-proBNP at baseline and with each cycle. DA-EPOCH-R is not indicated: double-expressor status alone does not justify intensification, and it also contains doxorubicin.", "cns_risk": "Intermediate CNS-relapse risk (CNS-IPI 2). No high-risk anatomic sites: no kidney, adrenal, testicular or breast involvement (the axillary node is lymphoma and the breasts show no uptake), and she has no neurological symptoms. No routine CNS prophylaxis is recommended (no high-dose methotrexate, no intrathecal therapy). MRI brain and lumbar puncture only if neurological symptoms develop.", "response_assessment": "End-of-treatment FDG PET-CT 6-8 weeks after the last cycle, read with Lugano 2014 criteria and the Deauville 5-point scale (Deauville 1-3 = complete metabolic response). Interim PET-CT after 2-4 cycles is optional and should not change therapy unless it shows progression. Biopsy residual Deauville 4-5 uptake if it would change management. Repeat echocardiogram at end of treatment and during survivorship.", "pretreatment_workup": "Hepatitis B serology done: HBsAg, anti-HBc and anti-HBs nonreactive, so no HBV reactivation risk from rituximab (consider HBV vaccination). HCV and HIV nonreactive. Echo 2026-09-09: LVEF 45%, GLS -14% (2016: LVEF 62%). Before treatment: cardio-oncology evaluation including ECG, high-sensitivity troponin, NT-proBNP and an ischemic evaluation (coronary CT angiography or stress imaging; left chest radiotherapy raises coronary risk) to define the cause of the LVEF decline; consider cardiac MRI. Bone marrow negative. Creatinine and liver tests normal.", "supportive_care": "Tumor lysis risk is low-intermediate (LDH ~2.3x ULN, largest mass 7.5 cm, normal creatinine and uric acid): oral hydration and allopurinol starting before cycle 1, with TLS labs at 24-72 hours. Primary G-CSF (pegfilgrastim) with each cycle is reasonable given the febrile neutropenia risk of R-CEOP/R-GCVP and to avoid dose delays. Anastrozole has no meaningful interaction with lymphoma therapy and can continue to complete year 10, or be held during chemotherapy if breast oncology prefers; coordinate with her breast oncologist. Blood pressure (148/90) is controlled with the ACE inhibitor/ARB plus beta-blocker in place of amlodipine. Antiemetics per regimen. Bone health: osteopenia on an aromatase inhibitor plus steroid pulses, continue calcium/vitamin D.", "fitness_and_goals": "Fit for curative therapy: ECOG 1 (disease-related fatigue and fevers), age 59, normal renal and hepatic function, no heart-failure symptoms (NYHA I). The reduced LVEF changes the regimen, not the curative goal. Her goal is cure and a return to full-time work; explain the trade-off between cardiac safety and the possibly lower efficacy of an anthracycline-free regimen, and decide together with cardio-oncology input. Her worry about her heart (mother with heart failure) is addressed by the cardio-oncology plan and cardioprotection.", "missing_information": ["Cardio-oncology assessment of the LVEF decline, including its cause: ischemic evaluation (coronary CT angiography or stress imaging), ECG, consider cardiac MRI", "Baseline high-sensitivity troponin and NT-proBNP (not yet drawn)", "Breast oncology input on continuing anastrozole during chemotherapy", "Patient's informed preference after discussing an anthracycline-free regimen versus a cardio-protected anthracycline option"], "decisions": {"stage": "III", "diagnosis": "DLBCL NOS, non-GCB (Hans), double-expressor, not double-hit", "intent": "curative", "regimen": "R-CEOP (rituximab, cyclophosphamide, etoposide, vincristine, prednisone)", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "none", "orders_now": ["Urgent cardio-oncology referral before cycle 1: cause of LVEF decline and optimization", "ECG, high-sensitivity troponin and NT-proBNP before cycle 1", "Ischemic evaluation: coronary CT angiography or stress imaging", "Stop amlodipine", "Start lisinopril 2.5 mg PO daily, titrate as blood pressure allows", "Start carvedilol 3.125 mg PO twice daily, titrate as tolerated", "Allopurinol 300 mg PO daily starting 2 days before cycle 1", "Oral hydration 2-3 L/day starting before cycle 1", "Pegfilgrastim 6 mg SC 24-72 hours after each cycle", "Antiemetics per regimen", "Continue anastrozole 1 mg PO daily; coordinate with breast oncology", "Continue calcium carbonate/vitamin D3"], "conditional_orders": ["if cardio-oncology judges the cardiac risk acceptable after evaluation and optimization: R-CHOP with liposomal doxorubicin or with dexrazoxane may replace R-CEOP", "if LVEF falls further or troponin/NT-proBNP rise during therapy: urgent cardio-oncology review before the next cycle", "if neurological symptoms develop: MRI brain and lumbar puncture with cytology and flow cytometry", "if interim PET-CT shows progression: change therapy", "if end-of-treatment PET-CT shows Deauville 4-5 residual uptake: biopsy if it would change management"], "lab_monitoring": [{"tests": "TLS labs: potassium, creatinine, uric acid, phosphate, calcium, LDH", "every_hours": 24, "duration_hours": 72}, {"tests": "high-sensitivity troponin and NT-proBNP", "every_hours": 504, "duration_hours": 3024}]}}, "passing": 75, "format": "FHIR", "domains": ["cns_management", "diagnosis", "first_line_treatment", "fitness_and_goals", "missing_information", "molecular_classification", "pretreatment_workup", "prognosis", "response_assessment", "staging", "supportive_care"]}, {"id": "dlbcl_0003", "task": "dlbcl_0003_renal_adrenal_cns_high_v2_fhir", "card": {"title": "Stage IV DLBCL with kidney-adrenal involvement and rising creatinine", "patient": "67M with 6 wk epigastric/LUQ pain, drenching night sweats and 8 kg weight loss; ECOG 2, T2DM on metformin, taking ibuprofen 400 mg QID. PET-CT: 9.4 cm retroperitoneal/mesenteric mass plus FDG-avid R kidney, L adrenal and liver lesions; GCB DLBCL (MYC 20%, BCL2 30%, FISH negative), marrow negative, LDH 1,290, uric acid 10.4, creatinine 1.1 -> 1.5.", "tests": ["Kidney, adrenal and liver lesions are extranodal organ disease, so stage IV, IPI 5/5 and CNS-IPI 6/6.", "MYC 20% / BCL2 30% with negative FISH: neither double-expressor nor double-hit, so no intensified regimen such as DA-EPOCH-R.", "ECOG 2 is disease-related in a patient who wants cure: full-dose Pola-R-CHP (or R-CHOP) x6 after a steroid prephase, not mini-CHOP or palliation.", "Uric acid 10.4, LDH >5x ULN and rising creatinine mean high TLS risk: IV hydration, rasburicase after G6PD check, TLS labs every 6-12 hours for the first 72 hours, stop NSAIDs.", "High CNS risk: MRI brain and LP with CSF cytology/flow now; HD-MTX only as an individualized option once renal function recovers and NSAIDs are stopped."], "correct_plan": "Curative full-dose Pola-R-CHP x6 (R-CHOP acceptable) after a 5-7 day prednisone 100 mg prephase, with admission for TLS prophylaxis (IV fluids, rasburicase after G6PD, TLS labs q6-12h), stopping ibuprofen, pegfilgrastim every cycle and a steroid glucose plan. Baseline MRI brain and LP; HD-MTX prophylaxis individualized and deferred until renal recovery; end-of-treatment PET-CT read by Lugano/Deauville."}, "labels_checked": true, "gold": {"diagnosis": "Diffuse large B-cell lymphoma, NOS, germinal-center B-cell (GCB) phenotype by the Hans algorithm (CD10+, BCL6+, MUM1-). EBER negative; CD5 negative.", "stage": "Lugano (Ann Arbor) stage IV with B symptoms (drenching night sweats, ~10% weight loss): extranodal organ involvement of the right kidney, left adrenal gland and liver in addition to retroperitoneal/mesenteric nodal disease. Bone marrow negative, which does not change stage IV. Largest mass 9.4 cm, just below the 10 cm bulk definition used in Lugano.", "biology": "Not double-expressor: MYC 20% and BCL2 30% by IHC are below the 40%/50% thresholds. Not double-hit: FISH shows no MYC, BCL2 or BCL6 rearrangement, so this is not high-grade B-cell lymphoma with MYC and BCL2 rearrangements. Ki-67 ~70%.", "prognosis": "IPI 5 of 5, high risk: age >60, LDH elevated (1,290 U/L, >5x ULN), ECOG 2, stage IV, and more than one extranodal site (kidney, adrenal, liver). CNS-IPI 6 of 6 (adds kidney/adrenal involvement), high risk of CNS relapse (~10-12% at 2 years).", "first_line_treatment": "Curative-intent immunochemotherapy. Recommend Pola-R-CHP for 6 cycles as preferred (IPI >=2, age 18-80, ECOG 2 were POLARIX-eligible); R-CHOP for 6 cycles is an acceptable alternative. Start promptly given rising LDH and creatinine. Give a steroid prephase of prednisone 100 mg daily for 5-7 days before cycle 1 because of age >60, ECOG 2 and high tumor burden; it lowers first-cycle toxicity and often improves performance status. Full doses are appropriate: ECOG 2 is disease-related, so a dose-reduced regimen is not indicated. DA-EPOCH-R is not indicated.", "cns_risk": "High CNS-relapse risk because of kidney/adrenal involvement and CNS-IPI 6. Before or with cycle 1: contrast MRI brain and lumbar puncture with CSF cytology and flow cytometry to exclude occult CNS disease. CNS prophylaxis with high-dose methotrexate is an individualized option; recent data question its benefit, which should be discussed with the patient. If chosen, defer it until renal function recovers and NSAIDs are stopped (creatinine 1.5, eGFR 50 with renal involvement makes HD-MTX unsafe now), then give 2 cycles at >=3 g/m2 intercalated or after immunochemotherapy. Intrathecal therapy alone is not adequate prophylaxis for parenchymal relapse.", "response_assessment": "FDG PET-CT at the end of treatment (6-8 weeks after the last cycle), read with Lugano 2014 criteria and the Deauville 5-point scale; Deauville 1-3 is a complete metabolic response. An interim PET-CT after cycles 2-4 is optional and should not change therapy unless it shows progression. Biopsy residual Deauville 4-5 uptake if it would change management.", "pretreatment_workup": "Hepatitis B serology done: HBsAg and anti-HBc nonreactive (anti-HBs reactive from vaccination), so no antiviral prophylaxis is needed before rituximab. HCV and HIV nonreactive. Echo LVEF 60%, so anthracycline is permitted. Outstanding: contrast MRI brain, lumbar puncture with CSF cytology/flow, G6PD level before rasburicase, and urinalysis/urine protein to assess the creatinine rise.", "supportive_care": "High tumor lysis syndrome risk (uric acid 10.4, LDH >5x ULN, creatinine rising 1.1 -> 1.5, potassium 5.0, phosphate 4.6). TLS prophylaxis: admit for cycle 1 (or the prephase), with aggressive IV hydration, rasburicase rather than allopurinol given hyperuricemia with renal impairment (check G6PD first), and TLS labs (K, phosphate, calcium, uric acid, creatinine, LDH) every 6-12 hours for 72 hours. Stop ibuprofen and all NSAIDs now (nephrotoxic with rising creatinine; they interact with methotrexate); use acetaminophen plus an opioid for pain. Hold lisinopril during hydration/TLS risk. Primary G-CSF prophylaxis (pegfilgrastim) with every cycle, since age >=65 (an on-body injector avoids an extra 45-minute trip). Prednisone will cause hyperglycemia in this diabetic patient: monitor glucose, use an insulin correction plan, and hold metformin during the AKI and IV hydration. Antiemetics per regimen. PJP prophylaxis is not routinely needed; note the sulfonamide allergy if it is ever considered.", "fitness_and_goals": "ECOG 2 is disease-related (pain, B symptoms, tumor burden) and expected to improve with the prephase and treatment, so it is not a reason to de-escalate curative therapy; there are no significant cardiac or other comorbidities limiting full-dose therapy. The patient's goal is cure, and full-dose therapy is aligned with it. Six 21-day cycles starting late September would finish around the mid-December wedding; discuss timing so the nadir avoids the event. Arrange transport support for the 45-minute drive.", "missing_information": ["Contrast MRI brain and CSF cytology/flow cytometry (CNS staging not yet done)", "G6PD status before rasburicase", "Urinalysis and urine protein to assess the cause of the creatinine rise (renal involvement vs NSAID/ACE inhibitor effect)", "Patient's view on CNS prophylaxis after an informed discussion of uncertain benefit"], "decisions": {"stage": "IV", "diagnosis": "DLBCL, NOS, GCB type; not double-expressor, not double-hit", "intent": "curative", "regimen": "Pola-R-CHP (polatuzumab vedotin, rituximab, cyclophosphamide, doxorubicin, prednisone) every 21 days", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "none", "orders_now": ["Admit for the prephase and cycle 1 (TLS prophylaxis and monitoring)", "Prednisone 100 mg PO daily for 5-7 days as steroid prephase before cycle 1", "Aggressive IV hydration: 0.9% sodium chloride about 3 L/m2/day, target urine output >100 mL/h", "G6PD level, stat", "Rasburicase 0.2 mg/kg IV once, as soon as the stat G6PD result is normal (rather than allopurinol)", "Stop ibuprofen and all NSAIDs", "Acetaminophen 1 g PO every 8 hours plus oxycodone 5 mg PO every 4 hours as needed for pain", "Hold lisinopril during IV hydration and TLS risk", "Hold metformin during the AKI and IV hydration", "Capillary glucose before meals and at bedtime with insulin correction scale while on prednisone", "Contrast MRI brain", "Lumbar puncture with CSF cytology and flow cytometry", "Urinalysis and urine protein/creatinine ratio", "Pola-R-CHP cycle 1 at full dose after the prephase, then every 21 days for 6 cycles", "Pegfilgrastim 6 mg SC on day 2 of every cycle (on-body injector)", "Antiemetics per regimen", "Social work referral for transport support (45-minute drive)"], "conditional_orders": ["if G6PD deficient: do not give rasburicase; give allopurinol, renally dosed, instead", "if the patient chooses CNS prophylaxis: HD-MTX >=3 g/m2 for 2 cycles, only after renal function recovers and NSAIDs are stopped, intercalated or after immunochemotherapy", "if MRI brain or CSF shows CNS involvement: change to a CNS-directed treatment plan", "if interim PET-CT shows progression: re-biopsy and change therapy", "if end-of-treatment PET-CT shows residual Deauville 4-5 uptake and it would change management: biopsy"], "lab_monitoring": [{"tests": "TLS labs: potassium, phosphate, calcium, uric acid, creatinine, LDH", "every_hours": 6, "duration_hours": 72}, {"tests": "CBC with differential", "every_hours": 24, "duration_hours": 72}]}}, "passing": 75, "format": "FHIR", "domains": ["cns_management", "diagnosis", "first_line_treatment", "fitness_and_goals", "molecular_classification", "pretreatment_workup", "prognosis", "response_assessment", "staging", "supportive_care"]}, {"id": "dlbcl_0004", "task": "dlbcl_0004_double_hit_addendum_v2_fhir", "card": {"title": "Double-hit lymphoma found after R-CHOP was planned", "patient": "54M, ECOG 1, with a rapidly enlarging right cervical mass, dysphagia and morning facial fullness; 12.0 cm anterior mediastinal mass with about 50% SVC narrowing, all disease above the diaphragm, LDH 740 rising to 812, uric acid 7.6 to 7.9, LVEF 60%. Node biopsy was signed out as DLBCL NOS (GCB, MYC 80%/BCL2 90% by IHC, Ki-67 95%), but the 9/19 FISH addendum shows MYC and BCL2 rearrangements after R-CHOP x6 had already been planned to start 9/22.", "tests": ["The late FISH addendum changes the diagnosis to double-hit lymphoma (HGBL with MYC and BCL2 rearrangements), not DLBCL NOS.", "The R-CHOP plan was written before FISH and must be replaced with intensive therapy such as DA-EPOCH-R x6 or a clinical trial.", "Disease is stage II bulky (12 cm mediastinal mass, above the diaphragm only), not stage III or IV.", "IPI and CNS-IPI are only 1, but double-hit biology drives the risk, so brain MRI, lumbar puncture and CNS prophylaxis are still needed.", "Bulky mass, high LDH and rising uric acid need TLS prophylaxis; DA-EPOCH-R needs G-CSF every cycle and its 96-hour infusion goes through the new port."], "correct_plan": "Revise to double-hit lymphoma, cancel the R-CHOP plan and give curative DA-EPOCH-R x6 (or a trial) with G-CSF, TLS prophylaxis, baseline brain MRI and LP, CNS prophylaxis, sperm banking and SVC/airway precautions. Then interim and end-of-treatment PET-CT read with Deauville, with ISRT to the mediastinum decided at multidisciplinary review."}, "labels_checked": true, "gold": {"diagnosis": "High-grade B-cell lymphoma with MYC and BCL2 rearrangements (double-hit lymphoma; WHO-HAEM5 name DLBCL/HGBL-MYC/BCL2), germinal-center B-cell (GCB) phenotype by the Hans algorithm (CD10+, BCL6+, MUM1-). The original 2026-09-12 sign-out of DLBCL, NOS is superseded by the 2026-09-19 FISH addendum (IGH::MYC and IGH::BCL2 fusions; BCL6 not rearranged). CD23-, CD30- and the cervical nodal biopsy site argue against primary mediastinal B-cell lymphoma. The EHR problem list still reads DLBCL and should be updated.", "stage": "Lugano (Ann Arbor) stage II bulky (IIA-X): FDG-avid right cervical nodes and a 12.0 cm anterior mediastinal mass, all above the diaphragm. No B symptoms. No extranodal, splenic, osseous, marrow, testicular or CNS involvement on PET-CT. A 12 cm mass is bulky, so this is managed as advanced-stage disease rather than limited-stage disease.", "biology": "Double-hit: FISH shows MYC rearrangement (IGH::MYC, t(8;14)) and BCL2 rearrangement (IGH::BCL2, t(14;18)); BCL6 is not rearranged, so it is not triple-hit. It is also double-expressor by IHC (MYC 80%, BCL2 90%), but the FISH-defined double-hit status is the key classification and drives treatment. Ki-67 about 95%, starry-sky pattern. GCB cell of origin by Hans.", "prognosis": "IPI 1 (low by score): only LDH is above normal (740 rising to 812 U/L, about 3.6x ULN); age 54, ECOG 1, stage II and no extranodal sites score 0. Age-adjusted IPI 1 and CNS-IPI 1. These scores underestimate the risk: the MYC and BCL2 rearrangements (double-hit biology) dominate prognosis, with poorer outcomes after standard therapy and a higher risk of CNS relapse.", "first_line_treatment": "The 2026-09-14 plan of R-CHOP x6 starting 2026-09-22 was written before the FISH addendum and is outdated: cancel it. Recommend curative-intent DA-EPOCH-R (dose-adjusted etoposide, prednisone, vincristine, cyclophosphamide, doxorubicin, rituximab) for 6 cycles, or enrollment in a clinical trial for MYC/BCL2-rearranged lymphoma if one is available; R-hyper-CVAD/MA or R-CODOX-M/R-IVAC are acceptable intensive alternatives at experienced centers. R-CHOP alone is not preferred for rearrangement-defined double-hit lymphoma. Start promptly (within about 1 week) given rapid growth and SVC compression. Consolidative involved-site radiotherapy (ISRT) to the bulky mediastinal site should be decided at multidisciplinary review, particularly for residual PET-positive disease at the end of treatment.", "cns_risk": "Double-hit biology carries a high risk of CNS involvement and relapse regardless of the CNS-IPI of 1 (no kidney, adrenal or other high-risk extranodal sites). Before cycle 1: contrast-enhanced MRI brain and lumbar puncture with CSF cytology and flow cytometry. CNS prophylaxis should be given: intrathecal methotrexate is commonly given with DA-EPOCH-R per protocol, and systemic high-dose methotrexate (for example 2 cycles at 3 g/m2 or more) is an alternative; renal function is normal (creatinine 0.9), so high-dose methotrexate is feasible if chosen. If MRI or CSF shows CNS disease, the plan changes to a CNS-directed regimen.", "response_assessment": "Interim FDG PET-CT after cycles 2-4 (commonly after cycle 2 or 4 of DA-EPOCH-R) to confirm response; progression should prompt re-biopsy and a change of therapy, otherwise complete all 6 cycles. End-of-treatment FDG PET-CT 6-8 weeks after cycle 6 (and before any radiotherapy), read with Lugano 2014 criteria and the Deauville 5-point scale; Deauville 1-3 is a complete metabolic response. Residual Deauville 4-5 uptake in the mediastinum should be biopsied if it would change management, or treated with ISRT after multidisciplinary review.", "pretreatment_workup": "Hepatitis B serology done: HBsAg and anti-HBc nonreactive (anti-HBs reactive from vaccination), so no HBV antiviral treatment is needed before rituximab; HCV and HIV nonreactive. Echo LVEF 60%, so anthracycline (doxorubicin in DA-EPOCH-R) is permitted. Renal and hepatic function normal. Bone marrow biopsy is not needed because PET-CT shows no marrow uptake. Outstanding before cycle 1: contrast MRI brain, lumbar puncture with CSF cytology and flow cytometry, sperm banking, G6PD level in case rasburicase is needed, and confirmation that the new port is functioning.", "supportive_care": "Tumor lysis syndrome (TLS) risk is intermediate: 12 cm mass, LDH about 3.6x ULN, uric acid 7.6 rising to 7.9 mg/dL, normal creatinine. Start allopurinol 300 mg daily 2-3 days before cycle 1 with oral/IV hydration and TLS labs (potassium, phosphate, calcium, uric acid, creatinine, LDH) every 12-24 hours for the first 72 hours; use rasburicase if uric acid keeps rising or creatinine increases (check G6PD first). G-CSF is mandatory with DA-EPOCH-R: filgrastim from day 6 until neutrophil recovery (or pegfilgrastim on day 6) every cycle, with twice-weekly CBCs to guide dose adjustment. DA-EPOCH-R is a 96-hour continuous infusion of vesicant drugs and needs central venous access: use the left chest port placed 2026-09-18, with an ambulatory infusion pump or inpatient administration. Offer sperm banking before cycle 1. Mediastinal mass with SVC narrowing: monitor closely during cycle 1 (consider an inpatient start), warn him to report worsening facial swelling, dyspnea, orthopnea, stridor or trouble swallowing liquids, and avoid sedation or general anesthesia without anesthetic review. PJP prevention per institutional DA-EPOCH-R practice, antiemetics, and a bowel regimen with vincristine. Continue CPAP for sleep apnea and albuterol as needed.", "fitness_and_goals": "Fit for intensive curative therapy: age 54, ECOG 1, LVEF 60%, normal renal and hepatic function, and no comorbidity that limits treatment (sleep apnea on CPAP, mild intermittent asthma and GERD do not). His goal is cure and he wants the most effective treatment; discuss the inpatient or pump-based infusion schedule, twice-weekly labs and time off work, since he hopes to keep working part time from home.", "missing_information": ["Contrast MRI brain and CSF cytology/flow cytometry results (CNS staging not yet done)", "Whether sperm banking has been offered and the patient's fertility wishes", "G6PD status in case rasburicase is needed", "Clinical trial availability for MYC/BCL2-rearranged lymphoma"], "decisions": {"stage": "II", "diagnosis": "High-grade B-cell lymphoma with MYC and BCL2 rearrangements (double-hit), GCB", "intent": "curative", "regimen": "DA-EPOCH-R", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "Consolidative ISRT to the bulky mediastinal site decided at multidisciplinary review after end-of-treatment PET", "orders_now": ["Cancel the 2026-09-14 R-CHOP x6 order (cycle 1 booked 2026-09-22)", "DA-EPOCH-R cycle 1 at dose level 1 (full dose) via the left chest port, start within about 1 week", "Contrast-enhanced MRI brain before cycle 1", "Lumbar puncture with CSF cytology and flow cytometry before cycle 1", "CNS prophylaxis: intrathecal methotrexate per DA-EPOCH-R protocol", "Allopurinol 300 mg PO daily starting 2-3 days before cycle 1", "Oral/IV hydration starting before cycle 1", "G6PD level", "Filgrastim from day 6 until neutrophil recovery every cycle (or pegfilgrastim on day 6)", "Sperm banking referral before cycle 1", "Confirm port function", "PJP prophylaxis per institutional DA-EPOCH-R practice", "Antiemetics and bowel regimen with vincristine", "Update EHR problem list to HGBL with MYC and BCL2 rearrangements", "Screen for a clinical trial for MYC/BCL2-rearranged lymphoma", "Continue CPAP and albuterol as needed"], "conditional_orders": ["if uric acid keeps rising or creatinine increases (G6PD normal): rasburicase", "if MRI or CSF shows CNS involvement: change to a CNS-directed regimen", "if interim PET-CT shows progression: re-biopsy and change therapy", "if end-of-treatment PET shows residual Deauville 4-5 mediastinal uptake: biopsy if it would change management, or ISRT after multidisciplinary review", "if worsening facial swelling, dyspnea, stridor or dysphagia: urgent evaluation for SVC syndrome / airway compromise"], "lab_monitoring": [{"tests": "TLS labs: potassium, phosphate, calcium, uric acid, creatinine, LDH", "every_hours": 12, "duration_hours": 72}, {"tests": "CBC with differential twice weekly for DA-EPOCH-R dose adjustment", "every_hours": 84, "duration_hours": null}]}}, "passing": 75, "format": "FHIR", "domains": ["cns_management", "diagnosis", "first_line_treatment", "fitness_and_goals", "molecular_classification", "pretreatment_workup", "prognosis", "response_assessment", "staging", "supportive_care"]}, {"id": "dlbcl_0005", "task": "dlbcl_0005_limited_stage_flyer_v2_fhir", "card": {"title": "Stage IA GCB DLBCL in a woman with migraine with aura on estrogen pill", "patient": "45F teacher, ECOG 0, with a painless right neck node; no B symptoms, normal LDH; PET-CT shows FDG-avid right cervical level II-III nodes only (largest 3.1 cm), no extranodal or marrow uptake. Excisional biopsy: DLBCL NOS, GCB by Hans, MYC 15%, BCL2 30%, FISH negative for MYC/BCL2/BCL6; premenopausal on a combined ethinyl estradiol pill despite migraine with aura, no pregnancy test on file, and wants to avoid neck radiation.", "tests": ["A single contiguous neck region with no B symptoms and a 3.1 cm node is non-bulky stage IA, not advanced disease.", "MYC 15% / BCL2 30% and negative FISH mean neither double-expressor nor double-hit, so no intensified regimen.", "IPI 0, age under 60, non-bulky: 4 R-CHOP + 2 rituximab without radiotherapy (FLYER) is preferred; 6 cycles or Pola-R-CHP is overtreatment.", "The combined estrogen pill must be stopped (migraine with aura = stroke risk, plus chemo-related VTE) and replaced with non-estrogen contraception.", "No pregnancy test is documented in this premenopausal woman, so one is required before cycle 1."], "correct_plan": "Curative R-CHOP x4 followed by 2 doses of rituximab without radiotherapy, with interim PET after cycle 4 and end-of-treatment PET (Deauville/Lugano); no CNS prophylaxis. Before cycle 1: pregnancy test, stop the combined pill and switch to an IUD or other non-estrogen method, and offer fertility counselling."}, "labels_checked": true, "gold": {"diagnosis": "Diffuse large B-cell lymphoma, NOS, germinal-center B-cell (GCB) phenotype by the Hans algorithm (CD10+, BCL6+, MUM1-). EBER negative; CD5 negative; no low-grade (follicular) component.", "stage": "Lugano (Ann Arbor) stage IA: a single nodal region (right cervical levels II-III, contiguous), with no B symptoms (denies fevers, night sweats and weight loss). Non-bulky: largest node 3.1 cm, well below the 7.5 cm threshold used in limited-stage trials. No extranodal, splenic or marrow disease on PET-CT. Bone marrow biopsy is not needed because PET-CT shows homogeneous marrow activity without focal uptake.", "biology": "Neither double-expressor nor double-hit. MYC 15% and BCL2 30% by IHC are below the 40%/50% thresholds. FISH shows no MYC, BCL2 or BCL6 rearrangement, so this is not high-grade B-cell lymphoma with MYC and BCL2 rearrangements. Ki-67 ~55%.", "prognosis": "IPI 0 of 5, low risk: age 45 (<=60), LDH normal (190 U/L), ECOG 0, stage I, no extranodal sites. CNS-IPI 0, low risk. Age 18-60, IPI 0 and maximum diameter <7.5 cm meet the FLYER trial eligibility criteria; expected 3-year progression-free survival is about 95%.", "first_line_treatment": "Curative-intent immunochemotherapy. Recommend R-CHOP for 4 cycles followed by 2 additional doses of rituximab, without radiotherapy (FLYER regimen: 4 cycles of R-CHOP plus 2 rituximab was non-inferior to 6 cycles in young patients with IPI 0 and non-bulky disease, with less toxicity). Six cycles of R-CHOP are not needed. Omitting radiotherapy also respects her wish to avoid neck radiation and spares the thyroid and salivary glands, a real concern given her sister's radiation-induced hypothyroidism. Acceptable alternatives: R-CHOP x3 followed by involved-site radiotherapy (ISRT), or a PET-adapted approach after 4 cycles (S1001). Pola-R-CHP is not indicated: POLARIX enrolled IPI 2-5 only. DA-EPOCH-R is not indicated.", "cns_risk": "Low CNS-relapse risk: CNS-IPI 0 and no high-risk extranodal sites (kidney, adrenal, testis, breast, uterus). CNS prophylaxis is not indicated, and no MRI brain or lumbar puncture is required without neurological symptoms.", "response_assessment": "Interim PET-CT after 4 cycles of R-CHOP, before the two rituximab doses: Deauville 1-3 supports completing the plan without radiotherapy; Deauville 4-5 should prompt biopsy or consolidative ISRT rather than proceeding as planned. End-of-treatment FDG PET-CT 6-8 weeks after the last dose, read with Lugano 2014 criteria and the Deauville 5-point scale; Deauville 1-3 is a complete metabolic response. Routine surveillance imaging is not needed after a complete metabolic response.", "pretreatment_workup": "A pregnancy test (serum or urine hCG) is required before cycle 1; none is documented in this premenopausal woman (LMP 2026-08-28, day 21 of her cycle). Hepatitis B serology done: HBsAg and anti-HBc nonreactive (anti-HBs reactive from vaccination), so no antiviral prophylaxis is needed before rituximab. HCV and HIV nonreactive. Echo LVEF 63%, so anthracycline is permitted. Organ function and blood counts normal.", "supportive_care": "Stop the combined oral contraceptive (ethinyl estradiol/levonorgestrel) now: estrogen-containing contraception is contraindicated in migraine with aura because of ischemic stroke risk, and it adds venous thromboembolism risk on top of active lymphoma and chemotherapy. She still needs effective non-estrogen contraception throughout treatment and for at least 12 months after: a levonorgestrel or copper IUD is preferred (a levonorgestrel IUD also limits heavy bleeding during thrombocytopenia), or an etonogestrel implant or progestin-only pill; arrange gynecology referral and use condoms until it is in place. Fertility counselling: 4 cycles of R-CHOP carry low gonadotoxicity at age 45 and most women resume menses, but age-related fertility decline matters; offer referral to reproductive medicine before starting since she is undecided about another pregnancy, without delaying treatment. Tumor lysis risk is low (normal LDH, uric acid and renal function); oral hydration, allopurinol optional. Primary G-CSF is not routinely required at age 45 with no risk factors, but reassess after cycle 1. Antiemetics per regimen; avoid codeine (intolerance). Rituximab infusion-reaction precautions.", "fitness_and_goals": "Fit: ECOG 0 with no limiting comorbidity, so curative-intent therapy is appropriate with a high cure probability. Her goals are cure, continuing to work as a teacher with minimal time off, and avoiding neck radiation; the 4 x R-CHOP + 2 x rituximab plan without radiotherapy matches all three, and schedules can place infusions late in the week so she can keep teaching. Shared decision-making about the radiotherapy-containing alternative documented.", "missing_information": ["Pregnancy test (serum or urine hCG) before cycle 1", "Agreed non-estrogen contraception plan for treatment and the following 12 months", "Patient's fertility preference after counselling (reproductive medicine referral if wanted)"], "decisions": {"stage": "I", "diagnosis": "DLBCL NOS, GCB type (Hans); not double-expressor, not double-hit", "intent": "curative", "regimen": "R-CHOP-21 x 4 cycles, then rituximab 375 mg/m2 x 2 doses (FLYER)", "cycles": 4, "cycle1_dose_percent": 100, "radiotherapy": "none (consolidative ISRT only if interim PET Deauville 4-5)", "orders_now": ["Serum or urine hCG pregnancy test before cycle 1", "Stop combined oral contraceptive (ethinyl estradiol/levonorgestrel) now", "Gynecology referral to place a levonorgestrel or copper IUD (alternatives: etonogestrel implant or progestin-only pill); condoms until it is in place", "Reproductive medicine referral for fertility counselling before cycle 1, offered without delaying treatment", "R-CHOP-21 x 4: rituximab 375 mg/m2 IV, cyclophosphamide 750 mg/m2 IV, doxorubicin 50 mg/m2 IV, vincristine 1.4 mg/m2 IV (max 2 mg) on day 1; prednisone 100 mg PO days 1-5; every 21 days", "Rituximab 375 mg/m2 IV every 21 days x 2 doses after cycle 4", "Oral hydration with cycle 1 (low tumor lysis risk; allopurinol optional)", "Antiemetics per regimen; avoid codeine (intolerance)", "Rituximab infusion-reaction premedication (acetaminophen, diphenhydramine)"], "conditional_orders": ["if interim PET-CT after cycle 4 is Deauville 4-5: biopsy or consolidative ISRT instead of proceeding as planned", "if febrile neutropenia or a treatment delay after cycle 1: add G-CSF to subsequent cycles", "if pregnancy test positive: hold chemotherapy and discuss with obstetrics before starting"], "lab_monitoring": [{"tests": "CBC with differential, CMP, LDH, uric acid", "every_hours": 504, "duration_hours": null}]}}, "passing": 75, "format": "FHIR", "domains": ["cns_management", "diagnosis", "first_line_treatment", "fitness_and_goals", "molecular_classification", "pretreatment_workup", "prognosis", "response_assessment", "staging", "supportive_care"]}, {"id": "intracranial_mesenchymal_0001_narrative", "task": "intracranial_mesenchymal_0001_narrative", "card": {}, "labels_checked": false, "gold": {"initial_assessment": "This is a symptomatic left frontal extra-axial/cortically based intracranial mesenchymal neoplasm with a separate enhancing C6 pial nodule suspicious for spinal drop or leptomeningeal dissemination. The term intracranial mesenchymal tumor is not a specific diagnosis: the entity and WHO grade are not established, so it cannot by itself determine therapy. The differential includes solitary fibrous tumor/hemangiopericytoma and a sarcoma such as Ewing sarcoma, rhabdomyosarcoma, or metastatic sarcoma.", "diagnostic_confirmation_and_staging": "Obtain expert neuropathology review with the complete biopsy material, expanded immunohistochemistry, and broad DNA/RNA sequencing including fusion detection. If solitary fibrous tumor is in the differential, confirm STAT6 and NAB2-STAT6. A molecular result alone is not sufficient to establish the entity or to select targeted therapy; it must be interpreted with the histology and confirmed. Complete contrast-enhanced MRI of the brain and entire spine, characterize the C6 nodule as suspected spinal drop/leptomeningeal disease, and obtain systemic staging (CT chest/abdomen/pelvis or PET-CT) for extracranial disease as clinically appropriate. Do not assign a formal tumor stage or treatment-specific grade from the available wording alone.", "immediate_management_plan": "Do not start disease-directed chemotherapy or targeted therapy on the current information. Defer definitive treatment until the diagnosis, WHO grade, extent, and resectability are established. Refer urgently to a multidisciplinary neuro-oncology tumor board. Neurosurgery should assess maximal safe resection; when feasible, gross-total resection is the goal because surgery provides tissue and local control. Provide symptom control for headache and vomiting, assess for raised intracranial pressure and seizures, and treat those complications. Once the diagnosis and grade are established, a high-grade solitary fibrous tumor or a subtotal resection would warrant postoperative focal radiotherapy to the surgical bed or residual disease. Routine adjuvant chemotherapy is not the default after complete resection of localized disease, and systemic therapy is reserved for unresectable, metastatic, or recurrent disease. The evidence for solitary fibrous tumor/hemangiopericytoma is largely retrospective, so do not present any regimen as a universal Category 1 standard. Arrange long-term serial contrast-enhanced MRI surveillance, with extracranial surveillance as clinically appropriate.", "missing_information": ["Definitive histologic entity and WHO grade", "Expert neuropathology review and complete immunohistochemistry", "Validated DNA/RNA molecular testing with fusion confirmation and STAT6/NAB2-STAT6 if SFT is considered", "Whether the C6 nodule is confirmed malignant drop or leptomeningeal disease", "Complete contrast-enhanced brain and spine MRI", "Extent of resection or resectability assessment", "Systemic staging for extracranial disease", "Steroid, antiseizure, and symptom-management requirements"]}, "passing": 75, "format": "narrative", "domains": ["diagnosis", "molecular", "multidisciplinary", "pathology", "staging", "supportive_care", "surveillance", "treatment"]}], "trials": [{"key": "haiku_deepseek_v2_plus_mesenchymal/dlbcl_0001_bulky_stage_iii_hbv_v__BQ2FVrX", "run": "haiku_deepseek_v2_plus_mesenchymal", "attempt": 1, "model": "deepseek-v4.1-flash-free", "case": "dlbcl_0001", "timing": {"env": 6.7, "install": 536.9, "work": 401.0, "grade": 0.8, "llm_calls": 17, "tokens": 200448}, "cost": 0.0, "status": "scored", "score": 0, "passed": false, "unsafe": ["hbv_prophylaxis", "mn_no_hbv_action"], "items": [{"id": "dx_dlbcl_non_gcb", "label": "Diagnoses DLBCL NOS, non-GCB phenotype by Hans algorithm", "why": "Correct diagnosis and cell-of-origin subtype underpin regimen choice; non-GCB favours Pola-R-CHP for this patient.", "domain": "diagnosis", "kind": "must", "severity": "important", "points": 6, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states the diagnosis is diffuse large B-cell lymphoma (NOS) with a non-germinal-center (non-GCB) phenotype by the Hans algorithm.", "quotes": ["Diffuse large B-cell lymphoma, NOS, non-germinal-center B-cell-like by the Hans algorithm, double-expressor (BCL2 80%, MYC 50% by immunohistochemistry) but FISH-negative for MYC, BCL2, and BCL6 rearrangements, EBER-negative, stage IIIB bulk"], "supported": true, "parts": [], "related": []}, {"id": "dx_hans_not_abc", "label": "Notes Hans non-GCB is not the same as molecular ABC subtype", "why": "IHC is only a surrogate; ABC subtype needs gene-expression profiling, so claims about ABC biology must be qualified.", "domain": "diagnosis", "kind": "should", "severity": "minor", "points": 2, "met": false, "error": false, "missed": true, "review": false, "regex": false, "judge": null, "text": "The response notes that Hans non-GCB is an immunohistochemical surrogate and is not the same as the molecular activated B-cell (ABC) subtype defined by gene-expression profiling.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "stage_iii", "label": "Stages the disease as Lugano/Ann Arbor stage III", "why": "Sets disease extent for prognosis and planning; the spleen is nodal, so he is stage III, not IV.", "domain": "staging", "kind": "must", "severity": "dangerous", "points": 8, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response stages the disease as Lugano/Ann Arbor stage III.", "quotes": ["Ann Arbor stage IIIB bulky: left cervical, mediastinal, and retroperitoneal nodal disease above and below the diaphragm, with multiple FDG-avid splenic lesions; bone marrow biopsy negative;", "IPI is 3 (age over 60, stage III, elevated LDH), which is high-intermediate; NCCN-IPI is 3, or 4 if the LDH exceeds 3 times the upper limit of normal (the assay ULN is not stated)."], "supported": true, "parts": [], "related": []}, {"id": "stage_spleen_nodal", "label": "Bases stage III on nodes both sides of diaphragm plus spleen as nodal", "why": "Spleen is lymphatic tissue under Lugano; treating it as extranodal wrongly upstages him to stage IV.", "domain": "staging", "kind": "should", "severity": "important", "points": 3, "met": false, "error": false, "missed": true, "review": false, "regex": false, "judge": null, "text": "The response bases stage III on nodal disease above and below the diaphragm plus splenic involvement, treating the spleen as lymphatic (nodal) tissue rather than an extranodal site.", "quotes": [], "supported": true, "parts": [], "related": ["{ \"diagnosis\": \"Diffuse large B-cell lymphoma, NOS, non-germinal-center B-cell-like by the Hans algorithm, double-expressor (BCL2 80%, MYC 50% by immunohistochemistry) but FISH-negative for MYC, BCL2, and BCL6 rearrangements, EBER-negative, stage IIIB bulky with splenic involvement.", "Ann Arbor stage IIIB bulky: left cervical, mediastinal, and retroperitoneal nodal disease above and below the diaphragm, with multiple FDG-avid splenic lesions; bone marrow biopsy negative;", "IPI is 3 (age over 60, stage III, elevated LDH), which is high-intermediate; NCCN-IPI is 3, or 4 if the LDH exceeds 3 times the upper limit of normal (the assay ULN is not stated)."]}, {"id": "stage_bulky_b_symptoms", "label": "Notes bulky disease (11 cm retroperitoneal mass) and B symptoms", "why": "Bulk and B symptoms affect TLS risk, radiotherapy consideration for residual bulk, and prognosis.", "domain": "staging", "kind": "should", "severity": "minor", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes bulky disease (11 cm retroperitoneal mass, >=10 cm) and B symptoms (fevers, night sweats).", "quotes": ["cell lymphoma, NOS, non-germinal-center B-cell-like by the Hans algorithm, double-expressor (BCL2 80%, MYC 50% by immunohistochemistry) but FISH-negative for MYC, BCL2, and BCL6 rearrangements, EBER-negative, stage IIIB bulky with splenic involvement.", "The fevers are attributed to lymphoma (B symptoms) after negative blood and urine cultures, a clear chest X-ray, and no antibiotic-responsive infection."], "supported": true, "parts": [], "related": []}, {"id": "mn_stage_iv", "label": "Stages the disease as stage IV", "why": "The spleen is nodal under Lugano; calling this stage IV misstates disease extent and misinforms counselling.", "domain": "staging", "kind": "must_not", "severity": "dangerous", "points": 0, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response assigns stage IV (for example by counting the spleen as an extranodal organ).", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mn_spleen_extranodal_count", "label": "Counts the spleen as extranodal site when scoring IPI/CNS-IPI", "why": "The spleen is lymphatic tissue under Lugano; scoring it as extranodal misapplies IPI and CNS-IPI and can mislead risk counselling.", "domain": "staging", "kind": "must_not", "severity": "important", "points": 3, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response counts the spleen as an extranodal site when scoring IPI or CNS-IPI.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id":
