N (1 point) and stage III (1 point) = 2, intermediate risk (2-3)."], "supported": true, "parts": [], "related": []}, {"id": "cns_no_routine_prophylaxis", "label": "States routine CNS prophylaxis is not indicated", "why": "CNS-IPI 2 with no kidney, adrenal, testicular or breast involvement; avoids unnecessary toxicity.", "domain": "cns_management", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states that routine CNS prophylaxis is not indicated (CNS-IPI 2, no kidney/adrenal, testicular or breast involvement).", "quotes": ["Therefore no CNS-directed prophylaxis (no intrathecal or high-dose methotrexate), and no lumbar puncture or brain MRI now unless symptoms appear."], "supported": true, "parts": [], "related": []}, {"id": "mn_mandates_cns_prophylaxis", "label": "Mandates CNS prophylaxis with high-dose methotrexate or intrathecal therapy", "why": "Not indicated at CNS-IPI 2 without high-risk sites; adds toxicity without proven benefit here.", "domain": "cns_management", "kind": "must_not", "severity": "important", "points": 4, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response mandates CNS prophylaxis (high-dose methotrexate or intrathecal therapy) for this patient.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "tx_cardiac_aware_no_full_dox", "label": "Recognises anthracycline cardiac risk; avoids standard full-dose doxorubicin without addressing heart", "why": "Prior doxorubicin 240 mg/m2, left chest RT and LVEF 62% to 45% mean further full-dose doxorubicin risks heart failure.", "domain": "first_line_treatment", "kind": "must", "severity": "dangerous", "points": 10, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response recognizes anthracycline-related cardiac risk (prior doxorubicin 240 mg/m2, left chest radiotherapy, LVEF fall from 62% to 45%, i.e. cancer therapy-related cardiac dysfunction) and does NOT plan standard full-dose doxorubicin (R-CHOP or Pola-R-CHP) without first addressing cardiac function.", "quotes": ["Reasoning: LVEF has fallen from 62% (2016) to 45% with GLS -14%, after cumulative doxorubicin 240 mg/m2 and left chest-wall and breast radiation, and her blood pressure is uncontrolled.", "I rejected R-CVP and R-COP (weaker, steroid-dependent, and prednisone worsens her hypertension and bone health), liposomal-doxorubicin substitution (lower cardiotoxicity but not validated for this setting and it still counts toward her exposure), and bendamustine-rituximab (no first-line DLBCL data).", "I expect the anthracycline-free regimen I recommend to give a lower cure probability than R-CHOP-type therapy."], "supported": true, "parts": [], "related": []}, {"id": "mn_standard_dox_ignores_heart", "label": "Recommends standard R-CHOP or Pola-R-CHP ignoring reduced LVEF", "why": "Unconditioned full-dose doxorubicin in established cardiac dysfunction risks irreversible heart failure.", "domain": "first_line_treatment", "kind": "must_not", "severity": "dangerous", "points": 0, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends standard R-CHOP or Pola-R-CHP (full-dose doxorubicin) without conditioning it on the reduced LVEF / prior anthracycline exposure (e.g. without cardio-oncology clearance, a cardioprotective modification, or a non-anthracycline alternative).", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "tx_cardio_onc_referral", "label": "Requests urgent cardio-oncology or cardiology evaluation before therapy", "why": "LVEF decline needs specialist assessment to choose a safe regimen and start cardioprotection before cycle 1.", "domain": "first_line_treatment", "kind": "must", "severity": "important", "points": 6, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response requests urgent cardio-oncology (or cardiology) evaluation before starting therapy.", "quotes": ["ECG, hs-troponin and NT-proBNP, and an urgent cardio-oncology review;"], "supported": true, "parts": [], "related": []}, {"id": "tx_cardioprotection", "label": "Starts ACE inhibitor/ARB plus beta-blocker, e.g. replacing amlodipine", "why": "Guideline cardioprotection treats her cardiac dysfunction and controls her blood pressure during chemotherapy.", "domain": "first_line_treatment", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response starts or optimizes guideline-directed cardioprotective therapy: an ACE inhibitor/ARB (or ARNI) plus a beta-blocker (e.g. carvedilol), for example replacing amlodipine.", "quotes": ["Cardioprotection: start ACE inhibitor and beta-blocker now, with cardio-oncology, and aim for BP below 130/80."], "supported": true, "parts": [], "related": []}, {"id": "tx_anthracycline_free_curative", "label": "Recommends curative anthracycline-free or modified regimen, e.g. R-CEOP or R-GCVP", "why": "Keeps cure as the goal while sparing the heart; liposomal doxorubicin or dexrazoxane only with cardio-oncology clearance.", "domain": "first_line_treatment", "kind": "must", "severity": "important", "points": 8, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response recommends a curative-intent anthracycline-free or anthracycline-modified regimen, e.g. R-CEOP (etoposide in place of doxorubicin) or R-GCVP; R-CHOP with liposomal doxorubicin or dexrazoxane is acceptable only if conditioned on cardio-oncology judging it safe.", "quotes": ["I expect the anthracycline-free regimen I recommend to give a lower cure probability than R-CHOP-type therapy. I cannot quantify that from the trial data, and it is the central trade-off in this case.", "I will explain to her that the anthracycline-free plan trades some expected cure probability for avoiding further anthracycline cardiotoxicity, and that the cardiac plan is designed to protect her heart while we treat."], "supported": true, "parts": [], "related": []}, {"id": "tx_lower_efficacy_ack", "label": "Acknowledges anthracycline-free regimens likely have lower efficacy", "why": "She wants cure; the trade-off between cardiac safety and cure rate must be discussed honestly.", "domain": "first_line_treatment", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response acknowledges that anthracycline-free regimens likely have lower efficacy than anthracycline-based therapy.", "quotes": ["I expect the anthracycline-free regimen I recommend to give a lower cure probability than R-CHOP-type therapy."], "supported": true, "parts": [], "related": []}, {"id": "tx_cardiac_monitoring", "label": "Plans serial LVEF/GLS imaging plus troponin and/or BNP monitoring", "why": "Detects further cardiac injury early during therapy in a patient with existing dysfunction.", "domain": "first_line_treatment", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response plans serial cardiac monitoring during therapy: repeat LVEF/GLS imaging plus troponin and/or natriuretic peptide (BNP/NT-proBNP).", "quotes": ["Cardiac: echocardiogram with GLS plus NT-proBNP and hs-troponin after about 3 months of GDMT and again at end of treatment.", "Reasoning: LVEF has fallen from 62% (2016) to 45% with GLS -14%, after cumulative doxorubicin 240 mg/m2 and left chest-wall and breast radiation, and her blood pressure is uncontrolled."], "supported": true, "parts": [], "related": []}, {"id": "mn_non_curative", "label": "Recommends palliative-only treatment, best supportive care or hospice", "why": "She is fit with curable disease; abandoning cure is wrong because the heart changes the regimen, not the goal.", "domain": "first_line_treatment", "kind": "must_not", "severity": "dangerous", "points": 0, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends palliative-only treatment, best supportive care, or hospice as the plan.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "resp_eot_pet_lugano", "label": "Plans end-of-treatment PET-CT read with Lugano/Deauville criteria", "why": "Standard way to confirm complete metabolic response and decide on further management.", "domain": "response_assessment", "kind": "must", "severity": "important", "points": 6, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response plans an end-of-treatment FDG PET-CT read with Lugano criteria / Deauville 5-point scale.", "quotes": ["End-of-treatment PET-CT about 3-4 weeks after cycle 6, per Lugano 2014.", "This is a new lymphoma, not a breast cancer recurrence: AE1/AE3 and GATA3 are negative in the lesional cells, there is no carcinoma morphology, and PET shows no breast uptake.", "Spleen is a nodal site under Lugano 2014, so the FDG-avid splenic nodules count as nodal disease."], "supported": true, "parts": [], "related": []}, {"id": "sup_tls_allopurinol", "label": "Assesses low-intermediate tumor lysis risk; gives allopurinol and hydration cycle 1", "why": "LDH about twice normal with a 7.5 cm mass; simple prevention avoids renal injury.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response assesses tumor lysis risk as low-intermediate (normal creatinine and uric acid, LDH ~2x ULN) and gives allopurinol with hydration for cycle 1.", "quotes": ["Tumor lysis: allopurinol 300 mg daily from 2 days before cycle 1 and oral hydration around cycle 1 day 1;"], "supported": true, "parts": [], "related": []}, {"id": "sup_gcsf", "label": "Recommends or considers primary G-CSF support with each cycle", "why": "Reduces febrile neutropenia and dose delays, preserving curative dose intensity.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response recommends (or reasonably considers) primary G-CSF support with each cycle.", "quotes": ["no routine G-CSF, but give secondary G-CSF after any febrile neutropenia."], "supported": true, "parts": [], "related": []}, {"id": "sup_anastrozole", "label": "Addresses ongoing anastrozole: continue, or hold with breast oncology", "why": "She asked directly; no meaningful interaction, but coordination with breast oncology is needed.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 1, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response addresses the ongoing anastrozole: continuing it is acceptable (no meaningful interaction), or holding it in coordination with breast oncology is also acceptable.", "quotes": ["Bone: osteopenia on an aromatase inhibitor;"], "supported": true, "parts": [], "related": []}, {"id": "work_hbv_reviewed", "label": "Confirms hepatitis B serology (HBsAg, anti-HBc) negative before rituximab", "why": "Excludes rituximab-related hepatitis B reactivation risk before starting therapy.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) before rituximab.", "quotes": ["hepatitis B (HBsAg, anti-HBc and anti-HBs all negative, so no antiviral prophylaxis is needed for rituximab, but she is non-immune to HBV);"], "supported": true, "parts": [], "related": []}, {"id": "fit_curative_ecog1", "label": "Judges her fit for curative therapy (ECOG 1); acknowledges goal of cure", "why": "Normal organ function apart from LVEF; her stated goal is cure and returning to work.", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges the patient fit for curative-intent therapy (ECOG 1, normal organ function apart from the LVEF) and acknowledges her goal of cure.", "quotes": ["age 59 and ECOG 1 score zero), which is low-intermediate.", "I expect the anthracycline-free regimen I recommend to give a lower cure probability than R-CHOP-type therapy."], "supported": true, "parts": [], "related": []}, {"id": "miss_cardiac_workup", "label": "Lists cause of LVEF decline / cardio-oncology work-up as missing", "why": "Prior left chest RT raises coronary risk; ischemic evaluation, cardiac MRI, troponin and NT-proBNP define the cause.", "domain": "missing_information", "kind": "should", "severity": "important", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response lists the cause of the LVEF decline / cardio-oncology work-up as missing (e.g. ischemic evaluation given prior left chest radiotherapy, cardiac MRI, baseline troponin and NT-proBNP).", "quotes": ["\"Repeat ECG, hs-troponin and NT-proBNP, and cardiology assessment of the cause of the LVEF fall (anthracycline vs."], "supported": true, "parts": [], "related": []}], "answer": {"diagnosis": "Diffuse large B-cell lymphoma, NOS, non-GCB (Hans) type, MYC/BCL2 double-expressor, no MYC/BCL2/BCL6 rearrangement (not double-hit), left axillary primary (excisional biopsy 2026-08-25). This is a new lymphoma, not a breast cancer recurrence: AE1/AE3 and GATA3 are negative in the lesional cells, there is no carcinoma morphology, and PET shows no breast uptake.", "stage": "Ann Arbor stage III with B symptoms, i.e. IIIB, with splenic (S) involvement. Spleen is a nodal site under Lugano 2014, so the FDG-avid splenic nodules count as nodal disease. Not stage IV: bone marrow is negative on trephine and PET, liver and adrenals are normal, and the lungs show only non-avid radiation fibrosis in the left field. Largest mass: mesenteric conglomerate 7.5 x 5.1 cm (SUVmax 22.3). If the tumor board counts the splenic nodules as extranodal, this becomes IV; management would not change.", "biology": "Non-GCB by the Hans algorithm: CD10 negative, BCL6 positive, MUM1 positive in about 80% of cells. CD20+, PAX5+, CD3-, CD5-, CD30-, cyclin D1-, EBER-negative. MYC IHC 45% and BCL2 IHC 70%: double-expressor by the usual cutoffs (MYC 40%, BCL2 50%). Break-apart FISH for MYC, BCL2 and BCL6 is negative for all three, so this is not high-grade B-cell lymphoma with rearrangements. Ki-67 about 80%. Flow: kappa-restricted CD19+ CD20+ CD10- B cells. LDH 510 U/L on 2026-09-01 (2.3 x ULN; normal in March 2026). Beta-2 microglobulin 2.9 mg/L (high). Marrow not involved.", "prognosis": "Curable intent. IPI 2 (LDH elevated and stage III; age 59 and ECOG 1 score zero), which is low-intermediate. NCCN-IPI is about 3, also low-intermediate. The biology worsens this: double-expressor, non-GCB, Ki-67 about 80%, LDH 2.3 x ULN, high beta-2 microglobulin, 7.5 cm bulk and B symptoms. With R-CHOP-type therapy in trial-like populations I would expect roughly 60-70% long-term progression-free survival; this is an approximate population estimate, not an individualized number. I expect the anthracycline-free regimen I recommend to give a lower cure probability than R-CHOP-type therapy. I cannot quantify that from the trial data, and it is the central trade-off in this case.", "first_line_treatment": "R-GemOx, six cycles every 21 days, full dose (BSA 1.79 m2): rituximab 375 mg/m2 IV day 1 (about 670 mg); gemcitabine 1000 mg/m2 IV days 1 and 8 (about 1790 mg each); oxaliplatin 100 mg/m2 IV day 1 (about 180 mg). No doxorubicin and no other anthracycline, and no maintenance steroid. Reasoning: LVEF has fallen from 62% (2016) to 45% with GLS -14%, after cumulative doxorubicin 240 mg/m2 and left chest-wall and breast radiation, and her blood pressure is uncontrolled. Every anthracycline-containing curative first-line option (R-CHOP, Pola-R-CHP, DA-EPOCH-R, R-EPOCH) adds roughly 240-300 mg/m2, bringing her to about 480-540 mg/m2 total, so I am excluding them. I rejected R-CVP and R-COP (weaker, steroid-dependent, and prednisone worsens her hypertension and bone health), liposomal-doxorubicin substitution (lower cardiotoxicity but not validated for this setting and it still counts toward her exposure), and bendamustine-rituximab (no first-line DLBCL data). Caveat: no anthracycline-free regimen has been shown to match R-CHOP-type outcomes in DLBCL, R-GemOx is not an NCCN-preferred first-line regimen, and the tumor board should challenge this judgement. I would not reconsider anthracycline re-treatment even if LVEF recovers to 50% or more, because the cumulative exposure and abnormal GLS remain.", "cns_risk": "CNS-IPI: LDH above ULN (1 point) and stage III (1 point) = 2, intermediate risk (2-3). She scores zero for age over 60, ECOG 2 or higher, kidney or adrenal involvement, and more than one extranodal site (the spleen is counted as nodal). Testis, breast and left breast are not involved: no FDG-avid breast lesion on PET, and the 2026-03 mammogram was BI-RADS 2. Therefore no CNS-directed prophylaxis (no intrathecal or high-dose methotrexate), and no lumbar puncture or brain MRI now unless symptoms appear. MYC/BCL2 double-expression adds some CNS risk, which I accept at an intermediate CNS-IPI. I will reassess if restaging shows kidney, adrenal or testicular involvement, or new extranodal sites, and discuss prophylaxis before cycle 2 in that case.", "response_assessment": "Baseline: FDG-PET-CT 2026-09-04 (findings above; the splenic nodules and the 7.5 cm mesenteric mass are the measurable reference sites). Interim PET-CT after cycle 2 (about day 42-50), Deauville 5-point scale: Deauville 1-3 means continue all six cycles; Deauville 4-5 changes the plan (see conditional orders). End-of-treatment PET-CT about 3-4 weeks after cycle 6, per Lugano 2014. Clinical examination, CBC, CMP, LDH and fever/B-symptom review on each cycle day 1. Cardiac: echocardiogram with GLS plus NT-proBNP and hs-troponin after about 3 months of GDMT and again at end of treatment. Repeat marrow only if cytopenias are unexplained or PET suggests marrow involvement. The PET read should specifically comment on the spleen; if it is equivocal, correlate with CT.", "pretreatment_workup": "Already done: CBC, CMP, LDH, uric acid, beta-2 microglobulin; hepatitis B (HBsAg, anti-HBc and anti-HBs all negative, so no antiviral prophylaxis is needed for rituximab, but she is non-immune to HBV); HCV and HIV negative; FDG-PET-CT; bone marrow biopsy and flow; transthoracic echocardiogram; IHC and FISH. Still needed before cycle 1 day 1: (1) current CBC with differential, CMP, magnesium, phosphate, uric acid and LDH, since the last labs are from 2026-09-01; (2) ECG, hs-troponin and NT-proBNP, and an urgent cardio-oncology review; (3) IgG level as a baseline for rituximab; (4) G6PD status before any rasburicase; (5) pregnancy test only if postmenopausal status is not confirmed; (6) documented baseline neuropathy exam for oxaliplatin; (7) port placement; (8) updated weight and BSA; (9) consent discussion that specifically covers the anthracycline-free trade-off. No lumbar puncture and no further CT are needed; PET-CT is sufficient for staging.", "supportive_care": "Cardioprotection: start ACE inhibitor and beta-blocker now, with cardio-oncology, and aim for BP below 130/80. On rituximab infusion days, hold the morning antihypertensives if SBP is below 100 or she is symptomatic. Antiemetics: palonosetron plus dexamethasone on day 1 only (steroid kept to a single day because of hypertension), with prochlorperazine as needed. Tumor lysis: allopurinol 300 mg daily from 2 days before cycle 1 and oral hydration around cycle 1 day 1; rasburicase only if G6PD is normal and uric acid rises. Infection: no PJP prophylaxis needed (no prolonged steroid); no routine G-CSF, but give secondary G-CSF after any febrile neutropenia. Gemcitabine: weekly counts and creatinine on cycle 1 and 2; oxaliplatin: cold-induced paresthesia counseling and neuropathy grading each cycle. Rituximab infusion-reaction precautions per protocol. Anemia: Hb 11.4 g/dL; transfuse below 7 or for symptoms. Bone: osteopenia on an aromatase inhibitor; continue calcium and vitamin D, DEXA due 2027. Fever: she must call the same day for temperature 38.0 C or higher (she already has evening fevers). No NSAIDs (hypertension and cardiac disease); acetaminophen only. Vaccines: inactivated vaccines only, no live vaccines.", "fitness_and_goals": "ECOG 1, independent, still working as a school librarian, NYHA class I, no symptoms of heart failure. Weight 70.1 kg on 2026-09-17, down about 3.7% from 72.8 kg in March; persistent fevers, night sweats and fatigue are ongoing B symptoms. Organ function is adequate for full-dose R-GemOx (eGFR 85, normal bilirubin and transaminases, ANC 4.6, platelets 178). Her limiting organ is the heart: LVEF 45% with abnormal GLS after prior anthracycline and left-sided chest radiation, with uncontrolled hypertension (148/90). Cardio-oncology risk is high, which excludes doxorubicin. Her stated goals are cure and a return to full-time work, and she is worried about her heart, which is understandable given her mother's heart failure. Her husband is her caregiver and drives her to visits. Treatment should start within about 1-2 weeks because of fevers, night sweats, LDH 2.3 x ULN and bulk; cardiology optimization runs in parallel and should delay the start only if LVEF falls further or heart-failure symptoms appear. Anastrozole: continue to the planned completion of 10 years in November 2026, then stop per breast oncology. The lymphoma is not breast cancer and there is no meaningful interaction with R-GemOx. I will explain to her that the anthracycline-free plan trades some expected cure probability for avoiding further anthracycline cardiotoxicity, and that the cardiac plan is designed to protect her heart while we treat.", "missing_information": ["Labs and examination after 2026-09-01 (CBC, CMP, LDH, uric acid); the record ends 2026-09-17 and the tumor board date is later, so current status must be confirmed.", "Repeat ECG, hs-troponin and NT-proBNP, and cardiology assessment of the cause of the LVEF fall (anthracycline vs. radiation vs. hypertension vs. ischemia); whether an ischemic evaluation is needed is for cardiology to decide.", "Estimated heart dose and field details from the 2016 left breast radiotherapy.", "Confirmation that cumulative anthracycline exposure is 240 mg/m2 doxorubicin only, with no epirubicin or other anthracycline.", "IgG level, G6PD status, and menopausal status (pregnancy test if not confirmed postmenopausal).", "Complete current medication list including OTC and herbal products, verified amlodipine dose, and a QTc on the ECG before antiemetic and oxaliplatin use.", "Hepatitis B vaccination history (anti-HBs negative, so she is non-immune).", "Baseline neuropathy examination before oxaliplatin.", "Breast oncology opinion on the anastrozole stop date (November 2026).", "Infectious evaluation of the fevers: no infectious source is documented; if fevers persist without a source, blood cultures and chest imaging are needed.", "Whether the splenic nodules are confirmed as lymphoma by imaging alone or by tissue; this affects the stage label (III vs. IV) but not the treatment choice.", "Documented patient decision after counseling on the anthracycline-free trade-of se recognizes high tumor-lysis risk (uric acid 10.4, LDH >5x ULN, rising creatinine) and orders TLS prophylaxis with IV hydration, a uric-acid-lowering agent and frequent TLS labs (every 6-12 hours for the first 72 hours; daily is not frequent enough at this risk).", "quotes": [], "supported": true, "parts": [{"label": "States the TLS risk is high (or orders TLS prophylaxis)", "met": true}, {"label": "IV hydration", "met": true}, {"label": "Rasburicase, allopurinol or febuxostat", "met": true}, {"label": "TLS labs every few hours (e.g. every 6-12 h), not daily", "met": true}], "related": ["I will give full-dose cycle 1 (100%) with tumor lysis prophylaxis; I am not planning a cytotoxic pre-phase.", "Tumor lysis syndrome prophylaxis is the most urgent issue: he has bulky disease, markedly elevated LDH (1,290 U/L), uric acid 10.4 mg/dL, and eGFR 50. I will admit him for cycle 1, give IV 0.9% sodium chloride at 150-200 mL/h to maintain urine output above 100 mL/h, start allopurinol 200 mg PO daily now, check G6PD, and give rasburicase 0.2 mg/kg (14 mg) IV ", "continue allopurinol 200 mg PO daily (renally adjusted), maintain aggressive hydration, and monitor uric acid and hemolysis."]}, {"id": "sup_rasburicase_g6pd", "label": "Favors rasburicase for hyperuricemia with renal impairment, checking G6PD first", "why": "Rasburicase lowers urate rapidly to protect the kidneys; G6PD deficiency risks hemolysis and methemoglobinemia.", "domain": "supportive_care", "kind": "should", "severity": "important", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response favors rasburicase (given hyperuricemia with renal impairment) and checks G6PD before giving it.", "quotes": ["Remaining before cycle 1: G6PD activity (required before rasburicase), baseline lumbar puncture with CSF cytology and flow cytometry, dental evaluation, vaccination review, formal nutritional and geriatric/frailty assessment, and confirmation of acce"], "supported": true, "parts": [], "related": []}, {"id": "sup_gcsf", "label": "Recommends primary G-CSF (e.g. pegfilgrastim) every cycle, given age >=65", "why": "Age >=65 on anthracycline-based therapy carries high febrile neutropenia risk that threatens dose intensity.", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response recommends primary G-CSF prophylaxis (e.g. pegfilgrastim) with each cycle, given age >=65.", "quotes": ["I will give pegfilgrastim 6 mg subcutaneously on day 2 of each cycle for febrile neutropenia prophylaxis, ondansetron plus dexamethasone for emetogenicity, and pantoprazole for gastrointestinal protection."], "supported": true, "parts": [], "related": []}, {"id": "sup_stop_nsaid", "label": "Stops ibuprofen/NSAIDs and offers alternative analgesia", "why": "NSAIDs worsen rising creatinine before TLS-risk chemotherapy and interact with methotrexate; pain still needs control.", "domain": "supportive_care", "kind": "should", "severity": "important", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response stops ibuprofen/NSAIDs (nephrotoxic with rising creatinine; interacts with methotrexate) and offers alternative analgesia.", "quotes": ["I will avoid NSAIDs: stop ibuprofen and use acetaminophen 650 mg PO every 6 hours as needed (maximum 3 g/day), with oxycodone 5 mg PO every 4-6 hours as needed for severe pain."], "supported": true, "parts": [], "related": []}, {"id": "sup_steroid_glucose", "label": "Plans for steroid hyperglycemia or adjusts metformin for falling eGFR", "why": "Diabetic on metformin facing high-dose prednisone and AKI: risk of hyperglycemia and metformin accumulation.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response anticipates steroid-induced hyperglycemia in this diabetic patient (glucose monitoring / insulin plan) or adjusts metformin for falling eGFR.", "quotes": ["I will monitor glucose closely during prednisone (metformin may need adjustment;", "of Pola-R-CHP every 21 days: polatuzumab vedotin 1.8 mg/kg IV on day 1 (126 mg), rituximab 375 mg/m2 IV on day 1 (700 mg), cyclophosphamide 750 mg/m2 IV on day 1 (1,400 mg), doxorubicin 50 mg/m2 IV on day 1 (93 mg), and prednisone 100 mg PO daily on days 1-5."], "supported": true, "parts": [], "related": []}, {"id": "work_hbv_reviewed", "label": "Confirms HBsAg and anti-HBc nonreactive, so no antiviral prophylaxis needed", "why": "HBV status must be checked before rituximab; here negative serology means no entecavir is required.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) so no antiviral prophylaxis is needed before rituximab.", "quotes": ["platelets 145 x10^3/uL), comprehensive metabolic panel (creatinine 1.5 mg/dL, eGFR 50 mL/min/1.73 m2, uric acid 10.4 mg/dL, LDH 1,290 U/L, albumin 3.1 g/dL, calcium 9.2 mg/dL), beta-2 microglobulin 4.8 mg/L, HbA1c 7.4%, HBV/HCV/HIV serologies, FDG PET-CT, transthoracic echocardiogram (LVEF 60%), CT-guided core biopsy with immunohistochemistry and FISH, and b"], "supported": true, "parts": [], "related": []}, {"id": "work_echo_reviewed", "label": "Notes baseline LVEF 60% permits anthracycline", "why": "Normal ejection fraction confirms he can safely receive the doxorubicin in Pola-R-CHP or R-CHOP.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 1, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes the baseline LVEF of 60% permits anthracycline.", "quotes": ["I chose Pola-R-CHP rather than R-CHOP because he has stage IV disease with IPI 5, the population in which POLARIX showed a progression-free survival advantage, and he has a normal LVEF and no baseline neuropathy."], "supported": true, "parts": [], "related": []}, {"id": "fit_ecog_disease_related", "label": "Judges ECOG 2 disease-related, not a reason to de-escalate; honours cure goal", "why": "His decline is from lymphoma and should improve with treatment; he explicitly wants curative therapy.", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges ECOG 2 as disease-related and not a reason to de-escalate curative therapy, and acknowledges the patient's goal of cure.", "quotes": ["His stated goal is cure, and he wants to attend his granddaughter's wedding in mid-December."], "supported": true, "parts": [], "related": []}], "answer": {"diagnosis": "Diffuse large B-cell lymphoma, not otherwise specified (DLBCL-NOS), germinal-center B-cell-like (GCB) immunophenotype by the Hans algorithm, stage IV Ann Arbor disease with a bulky retroperitoneal/mesenteric nodal mass and extranodal involvement of the liver, right kidney, and left adrenal gland. Bone marrow is uninvolved; FISH is negative for MYC, BCL2, and BCL6 rearrangements (not double-hit); EBER is negative. IPI 5, NCCN-IPI high risk, CNS-IPI 6.", "stage": "Stage IV (Ann Arbor) because of hepatic, renal, and adrenal involvement in addition to the bulky retroperitoneal/mesenteric nodal mass; there is no supradiaphragmatic nodal disease, no bone marrow involvement, and no documented CNS disease. B symptoms are present (drenching night sweats and 8 kg unintentional weight loss); I am assigning stage IV, with the B symptoms noted separately.", "biology": "GCB phenotype (CD10-positive, BCL6-positive, MUM1-negative), BCL2 positive in approximately 30% and MYC in approximately 20% of tumor cells, Ki-67 approximately 70%, EBER negative. FISH shows no MYC, BCL2, or BCL6 rearrangement, so this is neither double-hit nor triple-hit; with BCL2 below 50% and MYC below 40%, it also does not meet the usual double-expressor definition. The high Ki-67 and bulky FDG-avid disease indicate aggressive biology, but the GCB subtype is generally more favorable than ABC DLBCL. TP53 and MYD88/CD79B data are not available and would not change standard first-line therapy.", "prognosis": "Potentially curable but high risk. IPI 5 (age over 60, stage IV, elevated LDH, more than one extranodal site, ECOG 2) and NCCN-IPI high risk; CNS-IPI 6 (age over 60, elevated LDH, ECOG greater than 1, stage IV, more than one extranodal site, and renal/adrenal involvement) predicts a substantial risk of CNS relapse, on the order of 10-15% at 2 years. The GCB subtype and absence of double-hit rearrangements are favorable. I would quote a realistic chance of cure with full-course immunochemotherapy in the range of roughly 50-60%, with the main competing risks being primary refractory disease, CNS relapse, infection, and treatment intolerance. This estimate is uncertain and depends on response and tolerance.", "first_line_treatment": "I am ordering six cycles of Pola-R-CHP every 21 days: polatuzumab vedotin 1.8 mg/kg IV on day 1 (126 mg), rituximab 375 mg/m2 IV on day 1 (700 mg), cyclophosphamide 750 mg/m2 IV on day 1 (1,400 mg), doxorubicin 50 mg/m2 IV on day 1 (93 mg), and prednisone 100 mg PO daily on days 1-5. This is an NCCN category 1 option for patients with IPI 2-5. I chose Pola-R-CHP rather than R-CHOP because he has stage IV disease with IPI 5, the population in which POLARIX showed a progression-free survival advantage, and he has a normal LVEF and no baseline neuropathy. The caveat is that an overall survival benefit has not been established and polatuzumab adds cost; if it is unavailable or not covered, I would give R-CHOP for six cycles. I am not using DA-EPOCH-R because FISH excludes double-hit lymphoma. I will give full-dose cycle 1 (100%) with tumor lysis prophylaxis; I am not planning a cytotoxic pre-phase. No radiotherapy is planned upfront; consolidative radiotherapy would be considered only for a residual PET-avid bulky site after chemotherapy.", "cns_risk": "High. CNS-IPI 6 of 6 (age over 60, elevated LDH, ECOG 2, stage IV, more than one extranodal site, and renal/adrenal involvement). I will perform a baseline lumbar puncture with CSF cytology, flow cytometry, and cell count. If the CSF is negative, I will give intrathecal methotrexate 12.5 mg with cycle 1 (or the first cycle after the result is available) and continue for a total of four doses as CNS prophylaxis; I am not using high-dose intravenous methotrexate because of his eGFR of 50 mL/min/1.73 m2. If the CSF is positive or he develops neurological symptoms, I will change to CNS-directed therapy rather than proceed with Pola-R-CHP. I recognize that the benefit of intrathecal prophylaxis in high-risk DLBCL is debated; I am favoring it because of the very high CNS-IPI and renal/adrenal involvement, and I will discuss this uncertainty with the patient.", "response_assessment": "I will assess response with a PET-CT using Lugano/Deauville criteria at the end of therapy, about 6-8 weeks after cycle 6; I do not routinely order an interim PET outside a clinical trial. A Deauville 1-3 is complete metabolic response and I would observe. Deauville 4-5 indicates residual disease; if the residual uptake is in the original bulky site and biopsy is feasible, I will biopsy, and if confirmed residual disease I would consider consolidative radiotherapy for limited residual disease or second-line salvage therapy for progression. I will also review the 4 mm right upper lobe nodule on the end-of-treatment CT; it is too small to characterize now and is not FDG-avid, so it does not change lymphoma management, but I will arrange follow-up CT per Fleischner criteria (approximately 12 months) if he remains in remission. Bone marrow does not need repeat staging because it was uninvolved.", "pretreatment_workup": "Already completed: history and physical with ECOG 2, CBC with differential (hemoglobin 9.9 g/dL, WBC 9.4 x10^3/uL, ANC 7.1 x10^3/uL, platelets 145 x10^3/uL), comprehensive metabolic panel (creatinine 1.5 mg/dL, eGFR 50 mL/min/1.73 m2, uric acid 10.4 mg/dL, LDH 1,290 U/L, albumin 3.1 g/dL, calcium 9.2 mg/dL), beta-2 microglobulin 4.8 mg/L, HbA1c 7.4%, HBV/HCV/HIV serologies, FDG PET-CT, transthoracic echocardiogram (LVEF 60%), CT-guided core biopsy with immunohistochemistry and FISH, and bone marrow aspirate/biopsy (negative). Remaining before cycle 1: G6PD activity (required before rasburicase), baseline lumbar puncture with CSF cytology and flow cytometry, dental evaluation, vaccination review, formal nutritional and geriatric/frailty assessment, and confirmation of access to polatuzumab. I will repeat CBC, comprehensive metabolic panel, LDH, and uric acid on the day of cycle 1. I do not need a repeat bone marrow, testicular ultrasound, or CNS MRI in the absence of symptoms. The renal, adrenal, and hepatic lesions are presumed lymphoma based on marked FDG avidity; I will not biopsy them before treatment unless they behave discordantly on restaging.", "supportive_care": "Tumor lysis syndrome prophylaxis is the most urgent issue: he has bulky disease, markedly elevated LDH (1,290 U/L), uric acid 10.4 mg/dL, and eGFR 50. I will admit him for cycle 1, give IV 0.9% sodium chloride at 150-200 mL/h to maintain urine output above 100 mL/h, start allopurinol 200 mg PO daily now, check G6PD, and give rasburicase 0.2 mg/kg (14 mg) IV daily if G6PD is normal, continuing until uric acid is below 7.5 mg/dL or for up to 5 days. I will avoid NSAIDs: stop ibuprofen and use acetaminophen 650 mg PO every 6 hours as needed (maximum 3 g/day), with oxycodone 5 mg PO every 4-6 hours as needed for severe pain. Because of his gout history, I will monitor for gout flares; if a flare occurs, I will use an intra-articular glucocorticoid or colchicine 0.6 mg daily with renal dose adjustment rather than an NSAID. I will give pegfilgrastim 6 mg subcutaneously on day 2 of each cycle for febrile neutropenia prophylaxis, ondansetron plus dexamethasone for emetogenicity, and pantoprazole for gastrointestinal protection. I will monitor glucose closely during prednisone (metformin may need adjustment; hold if eGFR falls below 45 or during acute illness) and blood pressure. I will continue lisinopril, atorvastatin, and tamsulosin with monitoring. He is HBsAg-negative, anti-HBc-negative, and anti-HBs-positive, so no hepatitis B antiviral prophylaxis is needed. I will arrange pneumococcal, influenza, COVID-19, and recombinant zoster vaccination before rituximab (no live vaccines), dental evaluation, dietitian and physical therapy, and social work for transportation given the 45-minute drive. I will avoid sulfonamide antibiotics because of his rash; if Pneumocystis prophylaxis is ever needed, I would use atovaquone or pentamidine. I will use senna and docusate for opioid- and ondansetron-related constipation and saline or bicarbonate mouth rinses for oral care. I will use mechanical VTE prophylaxis while inpatient; I am not starting routine ambulatory anticoagulation because of anticipated chemotherapy-induced thrombocytopenia and bleeding risk. I will discuss advance care planning and the timing of his granddaughter's wedding.", "fitness_and_goals": "He is 67 years old, ECOG 2, but independent in self-care and manages his own affairs; his ECOG 2 is largely attributable to lymphoma symptoms (pain, night sweats, and 8 kg weight loss), so I expect it to improve with treatment. He has good social support (he lives with his wife, and his daughter lives nearby). He has type 2 diabetes (HbA1c 7.4%), hypertension, gout, hyperlipidemia, benign prostatic hyperplasia, and a 30-pack-year smoking history, but no cardiac disease and a normal LVEF of 60%. I judge him fit for full-dose, curative-intent immunochemotherapy, with close monitoring for infection, tumor lysis, steroid effects, and renal function. His stated goal is cure, and he wants to attend his granddaughter's wedding in mid-December. I will plan the six 21-day cycles around that date, keeping the wedding outside the expected nadir (days 7-14) if possible; a short treatment delay for the event is acceptable, but I will not omit doses. If he proves frailer than the ECOG score suggests, I would consider a steroid pre-phase or R-mini-CHOP, but that is not my current plan.", "missing_information": ["G6PD activity (needed before rasburicase)", "Baseline CSF cytology and flow cytometry (lumbar puncture not yet done)", "Dental evaluation and oral health status", "Vaccination history (influenza, COVID-19, pneumococcal, zoster)", "Formal geriatric/frailty and nutritional assessment", "Documented coverage/access to polatuzumab vedotin", "Tissue confirmation of the renal, adrenal, and hepatic lesions (currently presumed lymphoma by imaging)", "TP53 and MYD88/CD79B mutation status (not required for first-line therapy)", "The reference laboratory's upper limit of normal for LDH, to fully calculate the NCCN-IPI LDH category", "Patient preference regarding CNS prophylaxis and tolerance of neuropathy risk"], "decisions": {"stage": "IV", "diagnosis": "Diffuse large B-cell lymphoma, NOS, GCB subtype, stage IV", "intent": "curative", "regimen": "Pola-R-CHP (polatuzumab vedotin 1.8 mg/kg IV day 1 plus R-CHOP backbone: rituximab 375 mg/m2 IV day 1, cyclophosphamide 750 mg/m2 IV day 1, doxorubicin 50 mg/m2 IV day 1, prednisone 100 mg PO daily days 1-5); every 21 days", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "none", "orders_now": ["Admit to the inpatient hematology-oncology service for cycle 1 and tumor lysis monitoring.", "Stop ibuprofen 400 mg immediately; start acetaminophen 650 mg PO every 6 hours as needed for pain (maximum 3 g/day) and oxycodone 5 mg PO every 4-6 hours as needed for severe pain.", "Start IV 0.9% sodium chloride at 150-200 mL/h, titrated to maintain urine output above 100 mL/h; strict intake and output and daily weights.", "Check G6PD activity stat.", "Start allopurinol 200 mg PO daily now as a bridge until G6PD result and rasburicase decision.", "Perform baseline lumbar puncture with CSF cytology, flow cytometry, and cell count.", "Place central venous access (port or PICC) before cycle 1.", "Cycle 1 day 1: polatuzumab vedotin 126 mg IV, rituximab 700 mg IV, cyclophosphamide 1,400 mg IV, and doxorubicin 93 mg IV; prednisone 100 mg PO daily on days 1-5.", "Premedicate before rituximab with acetaminophen 650 mg PO and diphenhydramine 25-50 mg IV/PO; monitor for infusion reaction.", "Pegfilgrastim 6 mg subcutaneously on day 2 (at least 24 hours after chemotherapy) of each cycle.", "Ondansetron 16 mg PO/IV on day 1, then 8 mg PO every 8 hours as needed; dexamethasone 12 mg IV on day 1; prochlorperazine 10 mg PO/IV every 6 hours as needed.", "Pantoprazole 40 mg PO daily while on prednisone and for gastrointestinal protection.", "Continue lisinopril 20 mg daily, atorvastatin 40 mg nightly, tamsulosin 0.4 mg nightly, and metformin 1,000 mg twice daily for now.", "Endocrinology/diabetes consultation for steroid-induced hyperglycemia; check capillary glucose before meals and at bedtime during prednisone.", "Repeat CBC with differential, comprehensive metabolic panel, LDH, and uric acid on the day of cycle 1.", "Administer inactivated influenza, COVID-19, pneumococcal, and recombinant zoster vaccines before rituximab; no live vaccines.", "Arrange dental evaluation, dietitian consultation, physical therapy, and social work/transportation support.", "Mechanical VTE prophylaxis while inpatient.", "Discuss goals of care, advance care planning, and treatment schedule around the granddaughter's wedding.", "Palliative care consultation for pain and symptom management, integrated with curative-intent therapy."], "conditional_orders": ["if G6PD activity is normal: give rasburicase 0.2 mg/kg (14 mg) IV daily starting before chemotherapy and continue until uric acid is below 7.5 mg/dL or for up to 5 days, with allopurinol overlap.", "if G6PD activity is deficient: do not give rasburicase; continue allopurinol 200 mg PO daily (renally adjusted), maintain aggressive hydration, and monitor uric acid and hemolysis.", "if uric acid remains above 7.5 mg/dL or rises after 24 hours despite rasburicase: repeat rasburicase and check electrolytes; if oliguria/anuria or refractory hyperkalemia/ hyperphosphatemia develops, obtain urgent nephrology consultation and initiate dialysis as indicated.", "if CSF cytology and flow cytometry are negative: give intrathecal methotrexate 12.5 mg with cycle 1 (or the first cycle after the result is available) and continue for a total of four doses.", "if CSF cytology and flow cytometry are positive or CNS symptoms develop: hold Pola-R-CHP and treat as secondary CNS lymphoma with CNS-directed therapy (high-dose methotrexate-based regimen), with neuro-oncology input.", "if eGFR falls below 30 mL/min/1.73 m2 or creatinine rises more than 2-fold above baseline: hold metformin, adjust cyclophosphamide per renal function, avoid further IV contrast, and obtain nephrology consultation.", "if absolute neutrophil count is below 1.0 x10^3/uL or platelets are below 75 x10^3/uL on a planned treatment day: delay chemotherapy until recovery; if febrile neutropenia occurs, admit and start empiric broad-spectrum antibiotics (avoid sulfonamides).", "if LVEF falls below 50% or symptomatic heart failure develops: hold doxorubicin and switch to a non-anthracycline regimen (for example R-CEOP) after cardiology review.", "if grade 2 or higher peripheral neuropathy develops: hold polatuzumab for one cycle and reintroduce at a reduced dose or switch to R-CHOP; if severe, discontinue polatuzumab.", "if polatuzumab is unavai  metformin facing high-dose prednisone and AKI: risk of hyperglycemia and metformin accumulation.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response anticipates steroid-induced hyperglycemia in this diabetic patient (glucose monitoring / insulin plan) or adjusts metformin for falling eGFR.", "quotes": ["Prednisone 100 mg PO days 1 to 5.", "Omitting vincristine removes a neurotoxic and constipating drug in a diabetic patient with a mesenteric mass and abdominal pain."], "supported": true, "parts": [], "related": []}, {"id": "work_hbv_reviewed", "label": "Confirms HBsAg and anti-HBc nonreactive, so no antiviral prophylaxis needed", "why": "HBV status must be checked before rituximab; here negative serology means no entecavir is required.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) so no antiviral prophylaxis is needed before rituximab.", "quotes": ["Hepatitis B: HBsAg and anti-HBc nonreactive, anti-HBs reactive, so vaccine-immune with no reactivation risk requiring prophylaxis."], "supported": true, "parts": [], "related": []}, {"id": "work_echo_reviewed", "label": "Notes baseline LVEF 60% permits anthracycline", "why": "Normal ejection fraction confirms he can safely receive the doxorubicin in Pola-R-CHP or R-CHOP.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 1, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes the baseline LVEF of 60% permits anthracycline.", "quotes": ["Why full dose: ECOG 2 with independence in self-care, LVEF 60%, bilirubin 0.9, and no renal dose-adjustment threshold reached (Cockcroft-Gault CrCl about 48 mL/min;"], "supported": true, "parts": [], "related": []}, {"id": "fit_ecog_disease_related", "label": "Judges ECOG 2 disease-related, not a reason to de-escalate; honours cure goal", "why": "His decline is from lymphoma and should improve with treatment; he explicitly wants curative therapy.", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges ECOG 2 as disease-related and not a reason to de-escalate curative therapy, and acknowledges the patient's goal of cure.", "quotes": ["His stated goal is cure."], "supported": true, "parts": [], "related": []}], "answer": {"diagnosis": "Diffuse large B-cell lymphoma, NOS, germinal-center B-cell type (Hans). Retroperitoneal core biopsy 2026-09-10. MYC, BCL2 and BCL6 rearrangements not detected by FISH, so not double-hit or triple-hit. Not double-expressor by IHC (MYC 20%, BCL2 30%). Ki-67 about 70%. EBER negative. Bone marrow not involved (2026-09-13). Diagnosis is not in doubt; no re-biopsy is needed.", "stage": "Ann Arbor stage IV-B. Nodal disease: 9.4 x 6.8 cm retroperitoneal, aortocaval and mesenteric mass below the diaphragm. Extranodal disease: right renal cortical lesion, left adrenal lesion, and a hepatic segment VI lesion. The liver lesion is non-contiguous, so it makes the stage IV regardless of the kidney and adrenal. B symptoms: drenching night sweats most nights and 10.1% weight loss over two months (79 to 71 kg; 70.2 kg on 2026-09-16). No supradiaphragmatic FDG-avid disease. Marrow negative by morphology, flow and CD20/PAX5. Testes normal on exam and PET. The hepatic lesion was not biopsied, and the stage rests on it. If it proved non-lymphomatous, the stage would fall to II-E, the IPI would fall to 4, and the plan below would not change.", "biology": "GCB-type DLBCL (CD10+, BCL6+, MUM1-, Hans algorithm). Ki-67 about 70%. MYC and BCL2 rearrangements negative by break-apart FISH on 200 nuclei, so no double-hit or triple-hit. MYC protein in 20% and BCL2 in 30% of cells, so not double-expressor. CD5 and CD30 negative; cyclin D1 negative. Beta-2 microglobulin 4.8 mg/L (high). LDH rising: 1120 U/L on 2026-09-03 and 1290 U/L on 2026-09-16 (reference range not reported, but well above twice the upper limit). Uric acid 10.4 mg/dL and phosphate 4.6 mg/dL on 2026-09-16. Gene-expression or NGS (TP53, MYD88, CD79B) was not done; it would not change the first-line choice. Hepatitis B: HBsAg and anti-HBc nonreactive, anti-HBs reactive, so vaccine-immune with no reactivation risk requiring prophylaxis. HCV and HIV nonreactive.", "prognosis": "High risk. IPI is 5 of 5 (age over 60, stage IV, elevated LDH, ECOG 2, two or more extranodal sites). CNS-IPI is 6 of 6 (see cns_risk). With R-CHOP-type therapy, a patient with this profile has a materially lower chance of cure than a low-IPI patient, and about one in three is expected to relapse. POLARIX showed a 2-year PFS of 76.7% with pola-R-CHP and 70.2% with R-CHP overall, and the benefit was greatest in high-IPI patients. My estimate for this patient is a 2-year PFS roughly in the 60s to 70s percent, with wide uncertainty. Curative intent is appropriate. Progression-free survival is the more useful expectation to discuss with the patient than overall survival.", "first_line_treatment": "Pola-R-CHP every 21 days for 6 cycles, full dose from cycle 1. Day 1: polatuzumab vedotin 1.8 mg/kg IV (about 128 mg at 71 kg; use the day-1 weight), rituximab 375 mg/m2 IV (about 698 mg), cyclophosphamide 750 mg/m2 IV (about 1395 mg), doxorubicin 50 mg/m2 IV (about 93 mg). Prednisone 100 mg PO days 1 to 5. No vincristine. Pegfilgrastim each cycle, and intrathecal methotrexate 12 mg on day 1 of cycles 1 to 6 (CNS prophylaxis, see cns_risk). Why pola-R-CHP rather than R-CHOP: IPI 5 is the group in which pola-R-CHP showed PFS benefit in POLARIX, and NCCN lists it as a preferred first-line option. Omitting vincristine removes a neurotoxic and constipating drug in a diabetic patient with a mesenteric mass and abdominal pain. Why not DA-EPOCH-R or a double-hit approach: FISH is negative for MYC, BCL2 and BCL6, so intensification is not indicated. Why not HD-MTX CNS prophylaxis: eGFR 50 with rising creatinine, ongoing NSAID use, high urate, and a retroperitoneal mass encasing the aorta and IVC. Why full dose: ECOG 2 with independence in self-care, LVEF 60%, bilirubin 0.9, and no renal dose-adjustment threshold reached (Cockcroft-Gault CrCl about 48 mL/min; cyclophosphamide and doxorubicin need no change), with curative intent and growth-factor support. If polatuzumab cannot be authorized and given in time, R-CHOP-21 x6 at the same doses (vincristine 1.4 mg/m2, max 2 mg) plus the same intrathecal and growth-factor plan is the fallback. No upfront radiotherapy.", "cns_risk": "High. CNS-IPI 6 of 6: age over 60 (1), stage IV (1), elevated LDH (1), ECOG 2 (1), more than one extranodal site (kidney, adrenal, liver) (1), and kidney and/or adrenal involvement (1). Testicular involvement is absent (exam and PET). Bone marrow is uninvolved. MYC/BCL2/BCL6 rearrangements are negative. A high CNS-IPI score (4 to 6) carries roughly a 10% or greater risk of CNS relapse without prophylaxis, and NCCN supports CNS prophylaxis in this setting. I am choosing intrathecal methotrexate 12 mg on day 1 of cycles 1 to 6 over high-dose methotrexate 3.5 g/m2 because high-dose methotrexate is not safe here: eGFR 50 with creatinine rising from 1.1 (2025) to 1.5 mg/dL, daily NSAID exposure, high urate with a TLS risk, and retroperitoneal disease encasing the aorta and IVC. Intrathecal prophylaxis is less effective than high-dose methotrexate, and I am not claiming equivalence. Before any intrathecal drug, I need a baseline MRI brain with and without gadolinium (group II agent acceptable at eGFR 50) and a diagnostic lumbar puncture with CSF cytology and flow cytometry (platelets 145, no anticoagulation). If CNS disease is found, the plan changes to CNS-directed therapy and the systemic start is held for re-review.", "response_assessment": "Clinical review each cycle: symptoms, B symptoms, weight, exam, and LDH, uric acid, creatinine, CBC. Interim FDG PET-CT after cycle 2 (before cycle 3), for information only: no escalation or de-escalation outside a trial. End-of-treatment FDG PET-CT 3 to 6 weeks after cycle 6, scored by Deauville 5-point scale under Lugano 2014 criteria. Target lesions: retroperitoneal mass, renal, adrenal and hepatic lesions. Deauville 1 to 3 (complete metabolic response): observation and no routine surveillance imaging. Deauville 4 to 5 with residual mass: biopsy if it would change management; consolidative involved-site radiotherapy to residual mass per tumor board. Progression: biopsy and salvage discussion. The 4 mm right upper lobe nodule (PET-negative, indeterminate by size) will be reassessed on end-of-treatment imaging. The hepatic lesion has not been biopsied; a clinically favorable response will confirm lymphoma, so no pre-treatment liver biopsy is needed.", "pretreatment_workup": "Repeat CBC with differential, CMP, magnesium, phosphate, calcium, uric acid, LDH, PT/INR, aPTT, urinalysis with microscopy, and urine protein-to-creatinine ratio within 72 hours before cycle 1 (the most recent labs are from 2026-09-16). G6PD quantitative level (none in record; needed before rasburicase). Quantitative IgG, IgA and IgM before rituximab. Reticulocyte count, iron studies, ferritin, B12, folate and haptoglobin for the anemia (Hb 9.9 g/dL). Renal ultrasound with bladder to exclude hydronephrosis from retroperitoneal encasement, since creatinine has risen since the outside CT of 2026-08-15 (the CT predates the rise). MRI brain with and without contrast. Diagnostic lumbar puncture with CSF cytology, flow cytometry, protein and glucose. Baseline 12-lead ECG with QTc. Echocardiogram is done (LVEF 60%, GLS -19%, grade I diastolic dysfunction), so anthracycline is acceptable and no repeat echo is needed unless symptoms or LVEF decline. Stool or melena history and hemoglobin trend for GI blood loss after NSAIDs, with EGD if active bleeding or Hb falls (PET did not comment on stomach or bowel uptake, and the epigastric pain has not been explained). Hepatitis, HIV and HBV serologies are already done. Vaccines: inactivated influenza, COVID-19 and pneumococcal if due, given now without delaying cycle 1. Consults: nutrition (albumin 3.1 g/dL, 10% weight loss), social work (transport and lodging for 45-minute travel), pharmacy (rasburicase and polatuzumab access), and geriatric assessment (G8 screen, which I have not seen in the record).", "supportive_care": "Stop ibuprofen and all NSAIDs now, because of renal risk, GI risk with epigastric pain and Hb 9.9, and TLS risk. Pain: acetaminophen 1 g PO every 8 h scheduled (maximum 3 g/day), oxycodone 5 mg PO every 4 h as needed for severe pain (low dose given CKD), and a senna plus polyethylene glycol bowel regimen. Start pantoprazole 40 mg PO daily for NSAID-related epigastric pain and during steroid courses. TLS: high risk (LDH well above twice normal, uric acid 10.4 mg/dL, bulky disease close to 10 cm, Ki-67 70%, eGFR 50). Rasburicase 0.2 mg/kg IV (about 14 mg), given on day -1 only if G6PD is normal. Isotonic IV fluid without potassium, starting 24 hours before cycle 1 and continued for 48 hours after, targeting urine output of 100 mL/h or more, with volume status checked (LVEF 60%, hypertension). No alkalinization. Admit for cycle 1 (day -1 to day 2) for hydration, rasburicase and TLS labs. Gout: uric acid 10.4 mg/dL with untreated gout. Prednisone covers flare prophylaxis during steroid days, and I am not starting urate-lowering therapy during the TLS window; after cycle 1, a long-term urate-lowering agent (allopurinol at renal dose, or febuxostat) will be considered with rheumatology. Antiemetics (moderate emetic risk): palonosetron 0.25 mg IV day 1 and fosaprepitant 150 mg IV day 1; prochlorperazine PO as needed. No dexamethasone, since prednisone is already given and he is diabetic. Hyperglycemia from prednisone: glucose before meals and at bedtime during days 1 to 5, with correctional insulin (target about 140 to 180 mg/dL). Hold lisinopril during cycle 1 hydration and the TLS window (K 5.0, rising creatinine, volume shifts); resume when creatinine is back to baseline. Hold metformin until creatinine is stable and eating normally; continue atorvastatin and tamsulosin (watch for orthostasis with hydration). G-CSF: pegfilgrastim 6 mg SC each cycle by on-body injector applied on day 1 (it delivers about 27 hours later), which avoids a day-4 visit; the risk is raised by age 65 or older, ECOG 2, renal dysfunction, low albumin and anemia. Infection prophylaxis: no routine PJP prophylaxis is needed for this steroid exposure; sulfonamide allergy means TMP-SMX must not be used, and atovaquone would be the choice if PJP prophylaxis is later indicated. No routine antiviral or fluoroquinolone prophylaxis. Anemia: transfuse leukoreduced red cells for Hb below 7 g/dL (or below 8 with cardiac symptoms). VTE: Khorana score 2 (lymphoma site, Hb below 10); no routine pharmacologic prophylaxis, but IVC encasement and reduced mobility warrant vigilance. Nephrotoxins avoided, including IV contrast without clear need, and renal dosing of all drugs. Anthracycline cardiotoxicity monitoring: symptoms, and echo if LVEF concern.", "fitness_and_goals": "ECOG 2 (recorded 2026-09-02). He is independent in self-care, walks around the house and rests most afternoons, which matches ECOG 2 rather than 3. Comorbidities: T2DM (HbA1c 7.4%), hypertension (controlled, BP 122/74), CKD stage 3a with creatinine rising (eGFR 50), untreated gout with uric acid 10.4, BPH, hyperlipidemia, and former smoker (30 pack-years, quit 2010). Cardiac: LVEF 60%, GLS -19%, grade I diastolic dysfunction, no coronary disease in record. He is fit for curative-intent pola-R-CHP with G-CSF support and TLS measures; age 67 and ECOG 2 are within POLARIX eligibility (age 18 to 80, ECOG 0 to 2). His stated goal is cure. He hopes to attend his granddaughter's wedding in mid-December. Timing: if cycle 1 day 1 is around 2026-09-22 (a few days after the board), cycle 2 falls around mid-October, cycle 3 early November, cycle 4 late November, cycle 5 mid-December, and cycle 6 early January. The day 7 to 14 nadir of cycle 4 falls in late November to early December, so the wedding will likely fall in recovery, but cycle 5 day 1 could land right on the wedding date. If it does, delay cycle 5 by up to 7 days; this is acceptable within a 21-day schedule. Travel: pegfilgrastim by on-body injector, local lab draws with results routed to the clinic, a written fever plan for the wife and daughter, and admission only for cycle 1.", "missing_information": ["G6PD quantitative result (none in record; determines whether rasburicase is safe).", "Current date versus chart timeline: the board is documented for 2026-09-18 and the last labs are from 2026-09-16, but today's date is 2026-10-23. If treatment is delayed, all pre-treatment labs must be repeated before cycle 1.", "Exact date of the granddaughter's wedding (mid-December per the progress note) for cycle scheduling.", "Brain MRI and CSF status (no MRI or LP done yet).", "Cause of creatinine rise from 1.1 (2025-07) to 1.5 mg/dL (2026-09-16): obstruction, NSAID effect, tumour effect or contrast. No urinalysis, urine protein or renal ultrasound in record.", "Hepatic lesion not biopsied. PET did not describe stomach or bowel uptake, and the epigastric pain is unexplained.", "No upper GI evaluation; stool or melena history not documented.", "Anemia work-up (iron studies, B12, folate, reticulocytes, haptoglobin) not in record.", "Baseline ECG and QTc not in record.", "Quantitative immunoglobulins not in record.", "Reference range and upper limit of normal for LDH not reported; I used clinical judgment that 1120 to 1290 U/L is well above twice normal.", "Insurance authorization and access for polatuzumab vedotin (not documented); determines whether R-CHOP-21 is the fallback.", "Geriatric assessment (G8) not in record; ECOG 2 is documented but a formal frailty screen would help confirm full-dose planning.", "Advance directive, health care proxy and code status not documented.", "Vaccination status (influenza, COVID-19, pneumococcal) not documented.", "Current weight on the day of treatment for polatuzumab dosing (70.2 kg on 2026-09-16; 71 kg at consult).", "Formal baseline neuropathy grading (vibration and proprioception) for a diabetic patient; the consult records no sensory deficit.", "Management of the 4 mm right upper lobe nodule is not specified; it will be reassessed on end-of-treatment imaging."], "decisions": {"stage": "IV", "diagnosis": "DLBCL NOS, GCB type, not double-hit, IPI 5, CNS-IPI 6", "intent": "curative", "regimen": "Pola-R-CHP: polatuzumab vedotin 1.8 mg/kg IV D1, rituximab 375 mg/m2 IV D1, cyclophosphamide 750 mg/m2 IV D1, doxorubicin 50 mg/m2 IV D1, prednisone 100 mg PO D1-5, every 21 days, plus IT methotrexate 12 mg D1 cycles 1-6", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "none", "orders_now": ["Stop ibuprofen and all NSAIDs now.", "Acetaminophen 1 g PO every 8 h scheduled (max 3 g/day); oxycodone 5 mg PO every 4 h PRN severe pain; senna plus polyethylene glycol bowel regimen.", "Pantoprazole 40 mg PO daily.", "Hold lisinopril 20 mg daily during cycle 1 hydration and the TLS window; hold metformin 1000 mg BID until creatinine is stable and eating normally. Continue atorvastatin 40 mg nightly and tamsulosin 0.4 mg nightly.", "Capillary glucose before meals and at bedtime from day 1 through day 5 of each cycle, with correctional insulin (target about 140 to 180 mg/dL).", "G6PD quantitative level now.", "Pre-treatment labs within 72 h before cycle 1: CBC with differential, CMP, magnesium, phosphate, calcium, uric acid, LDH, PT/INR, aPTT, urinalysis with microscopy, urine protein-to-creatinine ratio, quantitative IgG/IgA/IgM, reticulocyte count, iron studies, ferritin, B12, folate, haptoglobin.", "Renal ultrasound with bladder now, to exclude hydronephrosis.", "MRI brain with and without gadolinium before cycle 1.", "Diagnostic lumbar puncture before cycle 1 with CSF cytology, flow cytometry, protein and glucose.", "Baseline 12-lead ECG with QTc.", "Vaccines (inactivated influenza, COVID-19, pneumococcal) if due, given now without delaying cycle 1.", "Consults: nutrition, social work (transport for 45-minute travel), oncology pharmacy (rasburicase and polatuzumab access), geriatric assessment (G8).", "Insurance authorization for polatuzumab vedotin now; target cycle 1 day 1 around 2026-09-22.", "Admit day -1 to day 2 for cycle 1: IV isotonic fluid without potassium starting 24 h before cycle 1 and continued 48 h after, targeting urine output of 100 mL/h or more; TLS labs as in lab_monitoring; no alkalinization.", "Cycle 1 day 1: polatuzumab vedotin 1.8 mg/kg IV (about 128 mg at 71 kg; use the day-1 weight); rituximab 375 mg/m2 IV (about 698 mg at BSA 1.86, with first-infusion rate step-up per label); cyclophosphamide 750 mg/m2 IV (about 1395 mg); doxorubicin 50 mg/m2 IV (about 93 mg) through a peripheral line with extravasation check; prednisone 100 mg PO days 1 to 5.", "Palonosetron 0.25 mg IV day 1 and fosaprepitant 150 mg IV day 1; prochlorperazine 10 mg PO every 6 h PRN nausea.", "Pegfilgrastim 6 mg SC each cycle by on-body injector applied on day 1 (delivers about 27 h later).", "Intrathecal methotrexate 12 mg on day 1 of cycles 1 to 6, given at the cycle visit after the diagnostic LP has been cleared.", "Cycles 2 to 6 on day 1 every 21 days, subject to the conditional rules below.", "Leukoreduced red cell transfusion only for Hb below 7 g/dL (or below 8 g/dL with cardiac symptoms)."], "conditional_orders": ["if G6PD is normal: give rasburicase 0.2 mg/kg IV (about 14 mg) on day -1; repeat dose if uric acid is still above 7.5 mg/dL at 6 to 8 h or rising.", "if G6PD is deficient or the result is not back before cycle 1 day 1: do not give rasburicase; start allopurinol 100 mg PO daily now (renally appropriate at eGFR about 50) with IV hydration, and check uric acid every 6 h, discussing with pharmacy if it does not fall.", "if polatuzumab vedotin cannot be authorized or supplied within 7 days of the target date: give R-CHOP-21 x6 instead (rituximab 375 mg/m2, cyclophosphamide 750 mg/m2, doxorubicin 50 mg/m2 and prednisone 100 mg PO days 1 to 5, plus vincristine 1.4 mg/m2 IV max 2 mg on day 1, with the same intrathecal and growth-factor plan).", "if the LP shows CSF involvement or MRI shows CNS disease: do not start systemic therapy; refer for CNS-directed treatment and re-review the plan.", "if creatinine rises 0.3 mg/dL or more above 1.5 mg/dL, or urine output is below 100 mL/h despite fluids: nephrology consult, urgent urinary tract evaluation with renal ultrasound or CT urogram, and hold cycle 1 until resolved.", "if renal ultrasound shows hydronephrosis: urgent urology for ureteral stent or nephrostomy before cycle 1, and expedite rather than delay the start beyond about 7 days.", "if K is 6.0 mmol/L or higher, or uric acid rebounds despite rasburicase: treat per TLS protocol, call the oncologist, and consider dialysis for refractory cases.", "if day 1 ANC is below 1.0 x10^9/L or platelets are below 75 x10^9/L: delay the cycle by one week and repeat labs.", "if grade 2 or higher peripheral neuropathy develops (polatuzumab or doxorubicin related): hold polatuzumab and reassess.", "if temperature is 38.0 C or higher at any time: urgent evaluation with CBC and blood cultures, and empiric IV antibiotics within 1 h if neutropenic; no sulfonamide-containing agents (allergy).", "if melena, hematemesis, or Hb falls by 2 g/dL or more: urgent EGD with biopsy of any mucosal lesion.", "if left leg swelling, flank pain, or new edema: lower-extremity Doppler and CT venography; anticoagulate if IVC or iliac thrombosis is confirmed.", "if interim PET after cycle 2 is Deauville 4 to 5: complete the six planned cycles without escalation; biopsy if clinically atypical or if the result is equivocal.", "if end-of-treatment PET is Deauville 4 to 5 with residual mass of 2 cm or more: biopsy if it would change management, and consider involved-site radiotherapy per tumor board.", "if LVEF falls below 50% or by 10 points or more, or heart failure symptoms develop: cardiology review, hold doxorubicin, and consider a non-anthracycline option.", "if the wedding date falls within the day 7 to 14 nadir of a cycle or within 3 days of a cycle day 1: move that cycle start by up to 7 days.", "if the treatment start is delayed beyond about 72 h from the 2026-09-16 labs: repeat all pre-treatment labs before cycle 1.", "if the 4 mm right upper lobe nodule grows on follow-up CT: discuss with thoracic radiology."], "lab_monitoring": [{"tests": "BMP (Na, K, creatinine, BUN), phosphate, calcium, uric acid, LDH, magnesium: every 6 h during the first 24 h from day -1 (TLS window)", "every_hours": 6, "duration_hours": 24}, {"tests": "Same TLS panel: every 12 h after the first 24 h, to 96 h total", "every_hours": 12, "duration_hours": 96}, {"tests": "CBC with differential and CMP (creatinine, K, ALP, bilirubin, glucose): days 8 and 15 of cycle 1 (nadir monitoring; repeat each cycle)", "every_hours": 168, "duration_hours": 336}, {"tests": "CBC with differential, CMP, LDH and uric acid before each cycle day 1 (ANC 1.0 or more and platelets 75 or more to treat)", "every_hours": 504, "duration_hours": 2520}, {"tests": "Point-of-care capillary glucose (before meals and at bedtime) during prednisone days 1 to 5", "every_hours": 6, "duration_hours": 120}, {"tests": "One-time pre-treatment panel within 72 h before cycle 1: CBC, CMP, LDH, uric acid, phosphate, PT/INR, aPTT, G6PD, urinalysis, urine protein-to-creatinine ratio, quantitative IgG/IgA
