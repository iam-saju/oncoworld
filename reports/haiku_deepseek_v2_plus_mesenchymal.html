 patient with obesity and OSA.", "later cycles can be outpatient with a continuous-infusion pump if tolerated."], "supported": true, "parts": [], "related": []}, {"id": "sup_fertility", "label": "Offers sperm banking before chemotherapy", "why": "Intensive alkylator and anthracycline chemotherapy can impair fertility in a 54-year-old man.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response offers sperm banking / fertility preservation before chemotherapy.", "quotes": ["I will arrange fertility counseling and sperm banking, update influenza, pneumococcal, and COVID-19 vaccination, and obtain speech-language pathology and nutrition assessment for dysphagia."], "supported": true, "parts": [], "related": []}, {"id": "sup_svc_airway", "label": "Monitors for SVC syndrome or airway compromise; educates patient", "why": "The mediastinal mass narrows the SVC by about 50% and he already has morning facial fullness.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response addresses the mediastinal mass with SVC narrowing: monitoring for SVC syndrome / airway compromise and patient education.", "quotes": ["the SVC narrowing is extrinsic compression by the nodal mass, not extranodal disease.", "if G6PD is normal I will give rasburicase 0.2 mg/kg IV once before chemotherapy because of the high risk, then monitor uric acid, potassium, phosphate, calcium, and creatinine every 8 hours for 48 hours."], "supported": true, "parts": [], "related": []}, {"id": "work_hbv_reviewed", "label": "Confirms HBsAg and anti-HBc nonreactive before rituximab", "why": "Rituximab can reactivate hepatitis B; negative serology means no antiviral is needed.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) before rituximab.", "quotes": ["Staging is complete: contrast CT of the neck and chest, FDG PET-CT, excisional cervical node biopsy with IHC and FISH, CBC with differential, comprehensive metabolic panel, LDH, uric acid, beta-2 microglobulin, hepatitis B/C and HIV serologies, and baseline echocardiogram (LVEF 60%)."], "supported": true, "parts": [], "related": []}, {"id": "work_echo_reviewed", "label": "Notes baseline LVEF 60% permits anthracycline", "why": "Doxorubicin in the regimen is cardiotoxic; a normal ejection fraction confirms it is safe to give.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 1, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes the baseline LVEF of 60% permits anthracycline.", "quotes": ["e neck and chest, FDG PET-CT, excisional cervical node biopsy with IHC and FISH, CBC with differential, comprehensive metabolic panel, LDH, uric acid, beta-2 microglobulin, hepatitis B/C and HIV serologies, and baseline echocardiogram (LVEF 60%)."], "supported": true, "parts": [], "related": []}, {"id": "fit_intensive", "label": "Judges him fit for intensive curative therapy, matching his goal", "why": "Age 54, ECOG 1, normal heart and organ function, and he wants the best chance of cure.", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges the patient fit for intensive curative therapy (age 54, ECOG 1, LVEF 60%, normal organ function) in line with his goal of cure.", "quotes": ["With intensive DA-EPOCH-R plus CNS prophylaxis, cure is a realistic goal, but I cannot promise it, and the regimen-specific evidence is retrospective.", "R-CHOP alone is not adequate for double-hit lymphoma in a fit 54-year-old."], "supported": true, "parts": [], "related": []}], "answer": {"diagnosis": "High-grade B-cell lymphoma with MYC and BCL2 rearrangements (double-hit lymphoma), germinal-center B-cell-like immunophenotype, involving a right cervical lymph node with bulky anterior mediastinal and right cervical nodal disease. The original diagnosis of DLBCL, NOS was amended after FISH demonstrated t(8;14) with IGH::MYC and t(14;18) with IGH::BCL2; BCL6 is not rearranged, so this is double-hit rather than triple-hit.", "stage": "Stage II bulky (Ann Arbor/Lugano): right cervical levels II-IV and anterior mediastinal nodal disease, all above the diaphragm, with no evidence of extranodal, splenic, bone marrow, or below-diaphragm involvement. There are no B symptoms. The 12.0 cm mediastinal mass meets bulky criteria. I assign stage II rather than IV; the SVC narrowing is extrinsic compression by the nodal mass, not extranodal disease.", "biology": "Double-hit biology: MYC rearrangement with IGH::MYC t(8;14) and BCL2 rearrangement with IGH::BCL2 t(14;18), BCL6 not rearranged, GCB immunophenotype (CD10+, BCL6+, MUM1-negative), BCL2 strong in about 90% of cells, MYC positive in about 80%, Ki-67 about 95%, and EBER negative. The high proliferation and MYC/BCL2 co-expression explain the aggressive behavior and the relative resistance to R-CHOP. There is no evidence of a low-grade component or discordant histology.", "prognosis": "This is a high-risk aggressive lymphoma. Historical double-hit series treated with R-CHOP show inferior progression-free and overall survival compared with standard DLBCL, with substantial risk of primary refractory disease and CNS relapse. Favorable features here are age 54, limited-stage disease, ECOG 1, and a CNS-IPI of 1 (elevated LDH only), but the double-hit biology dominates. With intensive DA-EPOCH-R plus CNS prophylaxis, cure is a realistic goal, but I cannot promise it, and the regimen-specific evidence is retrospective. Interim and end-of-treatment PET will be the best early predictors of outcome.", "first_line_treatment": "I am changing the previously planned R-CHOP to DA-EPOCH-R (dose-adjusted etoposide, prednisone, vincristine, cyclophosphamide, doxorubicin, rituximab) for 6 cycles every 21 days, with cycle 1 at full dose (dose level 1). R-CHOP alone is not adequate for double-hit lymphoma in a fit 54-year-old. I chose DA-EPOCH-R over R-HyperCVAD/MA or R-CODOX-M/IVAC because it is active in double-hit disease, is feasible with the port already in place, and has a more favorable toxicity profile in a patient with obesity and OSA. DA-EPOCH-R is an intensive NCCN-endorsed option; a clinical trial would be preferred if an eligible study were available. I will give cycle 1 as an inpatient because of bulky disease, high tumor-lysis risk, SVC compression, and OSA/airway considerations; later cycles can be outpatient with a continuous-infusion pump if tolerated. I will not add consolidative radiotherapy; I will reserve involved-site radiotherapy for residual PET-positive disease or for airway/SVC palliation. I will not plan upfront autologous transplant; it is reserved for relapse or a clinical trial.", "cns_risk": "The CNS-IPI is 1 (elevated LDH only; age under 60, stage II, ECOG 1, no extranodal sites, no renal or adrenal involvement), which is low risk. However, double-hit lymphoma is an independent high-risk feature and the CNS-IPI underestimates risk in this biology. I will give CNS prophylaxis with intrathecal methotrexate 12 mg on day 1 of each of the 6 cycles, beginning with a diagnostic lumbar puncture and CSF cell count, cytology, and flow cytometry at cycle 1. I considered adding high-dose intravenous methotrexate but will not, because of overlapping toxicity with DA-EPOCH-R and unproven superiority; if the CSF is positive or CNS symptoms develop, I will intensify CNS-directed therapy. The optimal prophylaxis for double-hit disease is uncertain.", "response_assessment": "I will obtain an interim PET-CT after cycle 2 (before cycle 3) and an end-of-treatment PET-CT 6-8 weeks after cycle 6, interpreted by Lugano/Deauville criteria. I will not change therapy on the basis of a single Deauville 4 interim scan without biopsy, because false positives occur; clear progression or Deauville 5 will prompt biopsy and a change to salvage therapy. End-of-treatment Deauville 1-3 will be complete metabolic response and I will observe. End-of-treatment Deauville 4-5 will be biopsied; if residual disease is confirmed, I will proceed to platinum-based salvage and evaluate for CAR-T cell therapy or autologous transplant. I will also reassess symptoms, the neck mass, and LDH at each visit.", "pretreatment_workup": "Staging is complete: contrast CT of the neck and chest, FDG PET-CT, excisional cervical node biopsy with IHC and FISH, CBC with differential, comprehensive metabolic panel, LDH, uric acid, beta-2 microglobulin, hepatitis B/C and HIV serologies, and baseline echocardiogram (LVEF 60%). The port is in place and functional. Before cycle 1 I will obtain a baseline ECG, a diagnostic lumbar puncture with CSF studies at the first intrathecal methotrexate, G6PD status if rasburicase is used, and PT/INR/fibrinogen before lumbar puncture. I will arrange fertility counseling and sperm banking, update influenza, pneumococcal, and COVID-19 vaccination, and obtain speech-language pathology and nutrition assessment for dysphagia. I will not routinely perform a bone marrow biopsy because PET-CT shows no marrow uptake; I would do it only for unexplained cytopenias or suspected discordant histology. No pregnancy test is needed.", "supportive_care": "Tumor lysis: high risk (12 cm bulky mass, LDH 812 U/L, Ki-67 95%, double-hit). I will start allopurinol 300 mg PO daily now, maintain intravenous hydration and urine output, and check G6PD; if G6PD is normal I will give rasburicase 0.2 mg/kg IV once before chemotherapy because of the high risk, then monitor uric acid, potassium, phosphate, calcium, and creatinine every 8 hours for 48 hours. Antiemetics: ondansetron 16 mg IV/PO daily days 1-5 with olanzapine 5 mg PO nightly as needed; the regimen's prednisone provides additional steroid coverage. Growth factor: pegfilgrastim 6 mg SC on day 6, at least 24 hours after chemotherapy. Infection: TMP-SMX DS three times weekly for PJP prophylaxis and acyclovir 400 mg PO twice daily for HSV/VZV prophylaxis during therapy. He is hepatitis B immune (HBsAg negative, anti-HBc negative, anti-HBs positive), so no HBV antiviral prophylaxis is needed. Febrile neutropenia: instruct him to call for fever of 38.0 C or higher; if febrile neutropenia occurs, admit, culture, and start empiric cefepime (a cephalosporin is acceptable despite childhood penicillin urticaria) or meropenem if severe. Transfuse for hemoglobin below 8 g/dL or platelets below 10,000/uL, or below 20,000/uL if bleeding. Continue omeprazole, albuterol, cetirizine, and CPAP. Monitor for vincristine neuropathy and constipation and use a bowel regimen. Repeat echocardiography only if symptoms develop or cumulative anthracycline concerns arise. Update vaccinations before treatment and avoid live vaccines. Discuss fertility preservation before cycle 1. For the mediastinal mass and SVC compression, keep the head of the bed elevated, avoid supine positioning and unnecessary sedation, and monitor for stridor, worsening facial swelling, dyspnea, or headache; escalate urgently if these occur.", "fitness_and_goals": "He is fit for intensive therapy: age 54, ECOG 1, normal renal and hepatic function, LVEF 60%, no known cardiac disease, and a strong desire for cure. He works as an accountant, hopes to continue part-time from home, lives 20 minutes from the cancer center, and has a supportive wife. I will treat with curative intent. The main fitness issues are obesity (BMI 30.2), obstructive sleep apnea on CPAP, and a bulky mediastinal mass with mild SVC compression and dysphagia; these require inpatient monitoring during cycle 1 and airway precautions. If he were unfit or declined intensive therapy, I would use R-CHOP with CNS prophylaxis, but that would be inferior for double-hit lymphoma. I have explained that DA-EPOCH-R is more toxic, requires the port and frequent laboratory checks, and may cause prolonged cytopenias, infection, neuropathy, and infertility; he accepts these risks. Goals are cure, preservation of functional status, and return to full-time work if possible.", "missing_information": ["G6PD status, needed before rasburicase.", "CSF cytology and flow cytometry, not yet performed; planned with the first intrathecal methotrexate.", "Bone marrow biopsy, not performed; PET-CT shows no marrow uptake, so it is not mandatory but would be indicated for unexplained cytopenias or discordant histology.", "Baseline ECG, not documented; I am ordering it.", "Fertility preservation preference and sperm banking, not documented.", "Clinical trial availability and eligibility, not documented.", "PT/INR and fibrinogen before lumbar puncture, not documented.", "Formal swallowing and nutrition assessment, not documented despite dysphagia.", "Expert hematopathology review of the amended FISH diagnosis, not documented."], "decisions": {"stage": "II", "diagnosis": "High-grade B-cell lymphoma with MYC and BCL2 rearrangements (double-hit)", "intent": "curative", "regimen": "DA-EPOCH-R", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "none", "orders_now": ["Admit to inpatient oncology for cycle 1; discontinue the prior R-CHOP plan.", "Start DA-EPOCH-R cycle 1 on the next available day after tumor board (2026-09-23): rituximab 375 mg/m2 IV day 1; etoposide 50 mg/m2/day continuous IV days 1-4; doxorubicin 10 mg/m2/day continuous IV days 1-4; vincristine 0.4 mg/m2/day continuous IV days 1-4 via central line; cyclophosphamide 750 mg/m2 IV day 5; prednisone 60 mg/m2 PO twice daily days 1-5.", "Rituximab premedication: acetaminophen 650 mg PO and diphenhydramine 25 mg IV 30-60 minutes before rituximab; start infusion slowly and escalate per protocol.", "Pegfilgrastim 6 mg SC on day 6, at least 24 hours after chemotherapy.", "Allopurinol 300 mg PO daily starting now and continuing through cycle 1, adjusted for renal function.", "STAT G6PD assay before rasburicase is considered.", "Intravenous 0.9% sodium chloride hydration to maintain urine output above 100 mL/hour; monitor input/output and daily weight.", "Ondansetron 16 mg IV/PO daily days 1-5; olanzapine 5 mg PO nightly days 1-5 as needed for nausea.", "TMP-SMX DS (160/800 mg) PO three times weekly starting with cycle 1 for PJP prophylaxis.", "Acyclovir 400 mg PO twice daily during therapy for HSV/VZV prophylaxis.", "Diagnostic lumbar puncture with CSF cell count, cytology, and flow cytometry at cycle 1, followed by intrathecal methotrexate 12 mg on day 1 of each of the 6 cycles (6 doses total).", "Baseline 12-lead ECG before anthracycline.", "PT/INR and fibrinogen before lumbar puncture.", "Fertility counseling and offer of sperm banking before cycle 1.", "Update influenza, pneumococcal, and COVID-19 vaccinations before treatment; no live vaccines.", "Speech-language pathology and nutrition consultation for dysphagia; high-calorie oral supplements.", "ENT and anesthesia consultation for airway evaluation and OSA precautions before sedation or if airway symptoms develop.", "Continue omeprazole 20 mg PO daily, albuterol HFA 2 puffs every 4-6 hours as needed, cetirizine 10 mg PO daily as needed, and CPAP.", "Confirm port function and use the existing left chest port for all vesicant and continuous infusions.", "Baseline laboratories before cycle 1: CBC with differential, comprehensive metabolic panel, LDH, uric acid, phosphate, calcium, magnesium, and beta-2 microglobulin.", "Screen for an eligible clinical trial in double-hit or high-grade B-cell lymphoma before cycle 1."], "conditional_orders": ["if G6PD is normal: give rasburicase 0.2 mg/kg IV once before chemotherapy because of high tumor-lysis risk (bulky disease, LDH 812 U/L, baseline urate 7.9 mg/dL), then repeat daily until uric acid is below 6 mg/dL, with cold-sample uric acid monitoring.", "if G6PD deficiency is found: do not give rasburicase; continue allopurinol, hydration, and frequent tumor-lysis laboratories.", "if febrile neutropenia occurs (temperature 38.3 C once or 38.0 C sustained for 1 hour): admit, obtain blood cultures, and start empiric cefepime 2 g IV every 8 hours, or meropenem 1 g IV every 8 hours if severe.", "if nadir ANC is below 500/uL or platelets are below 25,000/uL during a cycle: reduce the next DA-EPOCH-R cycle by one dose level (20 percent); if nadir ANC is above 1,500/uL and platelets are above 100,000/uL, increase by one dose level.", "if interim PET-CT after cycle 2 shows Deauville 5 or clear progression: biopsy the dominant site and switch to platinum-based salvage such as R-ICE or R-DHAP, with plan for CAR-T or autologous transplant if chemosensitive.", "if interim PET-CT shows Deauville 4: repeat PET or biopsy before changing therapy; do not switch solely on Deauville 4.", "if end-of-treatment PET-CT shows Deauville 4-5: biopsy; if residual disease is confirmed, proceed to salvage therapy and evaluate for CAR-T or autologous transplant.", "if CSF is positive for lymphoma: intensify CNS-directed therapy with high-dose intravenous methotrexate of at least 3 g/m2 or additional intrathecal therapy and re-evaluate.", "if stridor, severe dyspnea, or airway compromise develops: obtain urgent ENT and anesthesia evaluation and consider emergent mediastinal radiotherapy or intubation; do not delay definitive chemotherapy.", "if severe SVC syndrome develops with altered mental status, hypotension, or worsening airway compromise: arrange urgent radiotherapy and/or vascular intervention and continue chemotherapy as soon as safe.", "if platelet count is below 50,000/uL or INR is above 1.5 before lumbar puncture: defer intrathecal methotrexate, transfuse platelets to above 50,000/uL or correct coagulopathy, then proceed.", "if grade 2 or worse peripheral neuropathy develops: reduce or hold vincristine for the next cycle.", "if LVEF falls by 10 percent or more to below 50 percent or symptomatic heart failure develops: hold doxorubicin and obtain cardiology consultation.", "if the patient declines intensive therapy or performance status declines to ECOG 3 or worse: switch to R-CHOP for 6 cycles with CNS prophylaxis.", "if an eligible clinical trial becomes available: discuss enrollment before starting cycle 1.", "if renal function declines with creatinine clearance below 50 mL/min: adjust allopurinol and chemotherapy doses and avoid nephrotoxins."], "lab_monitoring": [{"tests": "CBC with differential, comprehensive metabolic panel, LDH, uric acid, phosphate, calcium, magnesium, beta-2 microglobulin", "every_hours": null, "duration_hours": null}, {"tests": "CBC with differential, comprehensive metabolic panel, LDH, uric acid, phosphate, calcium, magnesium, potassium", "every_hours": 8, "duration_hours": 48}, {"tests": "CBC with differential, comprehensive metabolic panel, LDH, uric acid, phosphate, calcium, magnesium, potassium", "every_hours": 24, "duration_hours": 168}, {"tests": "CBC with differential and comprehensive metabolic panel", "every_hours": 168, "duration_hours": null}]}}}, {"key": "haiku_deepseek_v2_plus_mesenchymal/dlbcl_0004_double_hit_addendum_v__SQCdNbd", "run": "haiku_deepseek_v2_plus_mesenchymal", "attempt": 1, "model": "claude-haiku-5-5", "case": "dlbcl_0004", "timing": {"env": 4.5, "install": 0.6, "work": 264.9, "grade": 0.8, "llm_calls": 9, "tokens": 56538}, "cost": 0.0411, "status": "scored", "score": 94, "passed": true, "unsafe": [], "items": [{"id": "dx_hgbl_double_hit", "label": "Revises diagnosis to double-hit lymphoma (MYC and BCL2 rearranged)", "why": "The FISH addendum overrides the DLBCL NOS sign-out, and this ich would place him in the low-risk group."], "supported": true, "parts": [], "related": []}, {"id": "tx_intensive_curative", "label": "Recommends DA-EPOCH-R x6 or trial; intensive alternatives acceptable", "why": "Double-hit lymphoma is not adequately treated by R-CHOP; a fit 54-year-old needs intensive curative therapy.", "domain": "first_line_treatment", "kind": "must", "severity": "dangerous", "points": 12, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response recommends curative-intent intensive therapy appropriate for double-hit lymphoma: DA-EPOCH-R x6 (preferred) or a clinical trial; R-hyper-CVAD/MA or R-CODOX-M/R-IVAC are acceptable alternatives.", "quotes": ["DA-EPOCH-R, 6 cycles every 21 days, curative intent: rituximab 375 mg/m2 IV day 1; etoposide 50 mg/m2/day continuous IV infusion days 1-4;", "NCCN lists DA-EPOCH-R as a preferred regimen for double/triple-hit lymphoma; the randomized evidence specific to double-hit disease is limited, so I am weighing the guideline preference against the retrospective data."], "supported": true, "parts": [], "related": []}, {"id": "mn_rchop_preferred", "label": "Recommends R-CHOP alone, or proceeding with the 9/14 plan", "why": "R-CHOP alone is not preferred for rearrangement-defined double-hit lymphoma and risks lower cure rates.", "domain": "first_line_treatment", "kind": "must_not", "severity": "important", "points": 6, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends R-CHOP alone (including proceeding with the 2026-09-14 plan) as the preferred/initial regimen.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mn_non_curative", "label": "Recommends palliative-only care, best supportive care or hospice", "why": "He is fit, his goal is cure, and this lymphoma can be cured with intensive therapy.", "domain": "first_line_treatment", "kind": "must_not", "severit []}, {"id": "work_hbv_reviewed", "label": "Confirms HBsAg and anti-HBc nonreactive before rituximab", "why": "Rituximab can reactivate hepatitis B; negative serology means no antiviral is needed.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) before rituximab.", "quotes": ["HBsAg negative, anti-HBc negative, anti-HBs positive (vaccine immunity;"], "supported": true, "parts": [], "related": []}, {"id": "work_echo_reviewed", "label": "Notes baseline LVEF 60% permits anthracycline", "why": "Doxorubicin in the regimen is cardiotoxic; a normal ejection fraction confirms it is safe to give.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 1, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes the baseline LVEF of 60% permits anthracycline.", "quotes": ["LVEF 60%, GLS -20%."], "supported": true, "parts": [], "related": []}, {"id": "fit_intensive", "label": "Judges him fit for intensive curative therapy, matching his goal", "why": "Age 54, ECOG 1, normal heart and organ function, and he wants the best chance of cure.", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges the patient fit for intensive curative therapy (age 54, ECOG 1, LVEF 60%, normal organ function) in line with his goal of cure.", "quotes": ["In retrospective series, R-CHOP-type therapy cures only a minority of double-hit patients, and intensive regimens do better, but this evidence is small and retrospective.", "Cycle 1 full dose: he is fit (ECOG 1, normal organ function, LVEF 60%), and his TLS risk is managed with prophylaxis, not dose reduction."], "supported": true, "parts": [], "related": []}], "answer": {"diagnosis": "Large B-cell lymphoma, germinal-center B-cell type (Hans), with MYC and BCL2 rearrangements (double-hit; WHO-HAEM5 high-grade B-cell lymphoma with MYC and BCL2 rearrangements), presenting as right cervical nodal disease with a bulky anterior mediastinal mass and extrinsic SVC compression. This supersedes the 2026-09-12 pathology diagnosis of DLBCL NOS, which the 2026-09-19 FISH addendum amended. Double-expressor by IHC (MYC 80%, BCL2 90%); BCL6 not rearranged; Ki-67 about 95%; EBER negative.", "stage": "Ann Arbor stage IIA, bulky (Lugano IIA X). Two nodal regions above the diaphragm (right cervical levels II-IV and anterior mediastinum, 12.0 cm, bulky at 10 cm or more). No B symptoms (afebrile, no night sweats, weight stable at 98 kg). No documented E lesion: the mediastinal mass abuts and narrows the SVC but there is no invasion, thrombus, pleural, pericardial or chest-wall disease. PET-CT shows no disease below the diaphragm, no FDG-avid marrow or extranodal lesion, and spleen 10.5 cm. Bone marrow was not sampled. If marrow is involved, restage as IV; the regimen does not change.", "biology": "GCB phenotype by Hans: CD10+, BCL6+, MUM1/IRF4 negative. CD20+, PAX5+, CD3-, CD5-, CD23-, cyclin D1-, CD30-, TdT-; flow shows monotypic lambda B cells. FISH 2026-09-19: MYC rearranged (78% break-apart; IGH::MYC, t(8;14)); BCL2 rearranged (85% break-apart; IGH::BCL2, t(14;18)); BCL6 not rearranged. This is a double-hit lymphoma, and the MYC and BCL2 IHC pattern also makes it a double-expressor. Ki-67 about 95%, with a starry-sky pattern and necrosis. Labs 2026-09-04 and 2026-09-18: LDH 740 then 812 U/L (flagged high, rising), beta-2-microglobulin 2.6 mg/L (high), uric acid 7.6 then 7.9 mg/dL (high), creatinine 0.9 mg/dL, eGFR 101, LFTs normal, Hb 12.6 g/dL, ANC 5.6, platelets 225, calcium and phosphate normal. HBsAg negative, anti-HBc negative, anti-HBs positive (vaccine immunity; no antiviral prophylaxis needed), HCV and HIV negative. LVEF 60%, GLS -20%. Cell of origin does not change the plan; the MYC/BCL2 double hit does.", "prognosis": "Clinical IPI is 1 (age 54 = 0, LDH high = 1, ECOG 1 = 0, stage II = 0, extranodal sites 0), which would place him in the low-risk group. That overstates his prognosis: the double-hit/double-expressor biology, high Ki-67, bulky mediastinal disease and rising LDH carry a poor outcome. In retrospective series, R-CHOP-type therapy cures only a minority of double-hit patients, and intensive regimens do better, but this evidence is small and retrospective. Favorable factors: age 54, ECOG 1, normal renal and hepatic function, normal LVEF, no B symptoms, and no known CNS disease. I expect a meaningful but far from assured chance of long-term remission with DA-EPOCH-R. Most failures in this biology occur early (first 12 to 24 months) and in the CNS, which is why I plan CNS prophylaxis and close early follow-up.", "first_line_treatment": "DA-EPOCH-R, 6 cycles every 21 days, curative intent: rituximab 375 mg/m2 IV day 1; etoposide 50 mg/m2/day continuous IV infusion days 1-4; doxorubicin 10 mg/m2/day continuous IV infusion days 1-4; vincristine 0.4 mg/m2/day continuous IV infusion days 1-4 (max 2 mg/day); cyclophosphamide 750 mg/m2 IV day 5; prednisone 60 mg/m2 PO twice daily days 1-5. Cycle 1 at full dose (100%); later cycles dose-adjusted by nadir counts and toxicity. Pegfilgrastim day 6 (primary G-CSF prophylaxis). CNS prophylaxis with intrathecal methotrexate if the diagnostic LP is negative. TLS prophylaxis as below. The R-CHOP plan on the 2026-09-21 note is cancelled. R-CHOP is not an adequate regimen for double-hit biology, and the R-CHOP cycle 1 scheduled 2026-09-22 stays on hold. Cycle 1 full dose: he is fit (ECOG 1, normal organ function, LVEF 60%), and his TLS risk is managed with prophylaxis, not dose reduction. The alternatives, R-CODOX-M/R-IVAC or a clinical trial, are reserved for CNS-positive or non-responding disease, or for patients who cannot tolerate DA-EPOCH-R. NCCN lists DA-EPOCH-R as a preferred regimen for double/triple-hit lymphoma; the randomized evidence specific to double-hit disease is limited, so I am weighing the guideline preference against the retrospective data.", "cns_risk": "CNS-IPI score is 1 (low risk): LDH above normal = 1; age 54, ECOG 1, stage II, and no kidney or adrenal involvement on PET/CT all score 0. The score does not capture double-hit biology, and I consider his CNS risk high. I will give CNS prophylaxis: diagnostic LP with CSF cytology and flow before the first intrathecal dose, then intrathecal methotrexate 12 mg (preservative-free) on day 1 of each cycle, cycles 1 to 6, if CSF is negative. I do not need a brain MRI at baseline in the absence of neurologic symptoms; I would obtain MRI brain and spine with contrast if the CSF is positive, if any neurologic symptom appears, or if the CNS team wants it. Neuro exam at each cycle. Intrathecal dosing and any high-dose methotrexate decisions go to neuro-oncology.", "response_assessment": "Clinical review at each cycle: SVC and airway symptoms (facial or arm swelling, orthopnea, stridor, dysphagia to liquids), neck mass, B symptoms, weight, neurologic exam, LDH, uric acid and creatinine. Imaging: PET-CT after cycle 2 (interim, Lugano five-point Deauville) and PET-CT at end of treatment after cycle 6. CT alone only if PET is equivocal or symptoms change. Interim Deauville 1-3: continue DA-EPOCH-R unchanged. Interim Deauville 4-5: review at tumor board, biopsy if feasible, and do not switch automatically to R-CHOP; move to salvage or a trial if progression is confirmed. End of treatment: complete metabolic response (Deauville 1-3) means surveillance; residual mediastinal uptake Deauville 4-5 at the bulky site means consolidative mediastinal RT. Surveillance: clinical review with labs every 3 months for 2 years, imaging for symptoms, and a low threshold to image given the early-relapse pattern. Cardiac: repeat echocardiogram after completion (cumulative doxorubicin 240 mg/m2) or earlier for symptoms. Relapse: salvage per tumor board, trial referral, and consideration of CAR-T or autologous transplant.", "pretreatment_workup": "Before cycle 1, complete the following: (1) G6PD quantitative assay today, required before rasburicase; (2) PT/INR, aPTT, fibrinogen, magnesium, and quantitative IgG/IgA/IgM, none of which are in the record; (3) bone marrow aspirate and biopsy with flow and cytogenetics, which can be done in the same window and should not hold cycle 1 unless positive; (4) diagnostic LP with CSF cytology and flow, after coagulation results and before intrathecal methotrexate; (5) pulmonary function tests with flow-volume loop, because the trachea is narrowed to 15 mm and there is a mediastinal mass; (6) radiation oncology consult with CT simulation for pre-chemotherapy low-dose RT to the mediastinal mass; (7) sperm banking offered before cycle 1; (8) baseline neuropathy exam documented; (9) confirm BSA with pharmacy (DuBois 2.18 m2 as charted; Mosteller 2.21 m2), using actual body weight; (10) port placed 2026-09-18 (left IJ, tip at cavoatrial junction) is adequate for the continuous infusions and vincristine; confirm no thrombosis on the port side given the SVC narrowing. Hepatitis B, HCV and HIV screening are complete. Baseline echo is complete (LVEF 60%).", "supportive_care": "Tumor lysis: high risk (bulk 12 cm, LDH 812, uric acid 7.9, Ki-67 95%, high-grade). Start allopurinol 300 mg PO daily today (eGFR 101). Once G6PD is normal, give rasburicase 0.2 mg/kg IV (about 20 mg) daily for 5 days starting before cycle 1 day 1, because uric acid is already elevated. IV hydration to keep urine output at least 100 mL/h from cycle 1 through day 5, titrated to volume status and SVC congestion (avoid overload). Check BMP, phosphate, calcium, uric acid and LDH every 8 hours for 96 hours. SVC: head of bed elevated, no lying flat, avoid heavy exertion, and nursing monitoring for facial or arm swelling, stridor and dyspnea. PJP prophylaxis: TMP-SMX DS one tablet PO three times weekly, starting before cycle 1 and continued through the course. Febrile neutropenia: empiric cefepime if febrile (childhood penicillin urticaria is a low-risk history, and a cephalosporin is acceptable). Antiemetics per protocol. Rituximab premedication with acetaminophen and diphenhydramine. OSA: CPAP nightly including inpatient, with CPAP at bedside; no sedation for any procedure without anesthesia review. Asthma: albuterol PRN; cetirizine PRN. GERD: continue omeprazole. Glucose monitoring during prednisone. Vaccines: inactivated influenza and COVID-19 only, no live vaccines during therapy. Transfusion: irradiated, leukoreduced products if needed. Psychosocial: social work for work leave paperwork and caregiver support (wife, two children aged 9 and 12); psycho-oncology referral offered.", "fitness_and_goals": "He is fit for intensive therapy: age 54, ECOG 1 (working half days, tires by mid-afternoon), normal renal and hepatic function, LVEF 60%, no prior chemotherapy or radiation. Comorbidities are manageable: moderate OSA on CPAP, mild intermittent asthma, GERD, obesity (BMI 30.2). His goal is cure: he told the team he wants the treatment with the best chance of cure and hopes to keep working part time from home. Family and fertility goals should be confirmed (two children, sperm banking offered). Code status and advance directive are not documented. He understands the plan may change, and the risks to discuss at consent include SVC or airway compromise, tumor lysis, infection, cardiotoxicity from doxorubicin, neuropathy from vincristine, and CNS relapse. I will review these with him and his wife before cycle 1.", "missing_information": ["Bone marrow aspirate and biopsy: not performed, so marrow stage is unknown.", "CSF status: no LP has been done, so CNS involvement is unknown.", "G6PD status: not in record; required before rasburicase.", "Coagulation studies (PT/INR, aPTT, fibrinogen), magnesium, and quantitative immunoglobulins: not in record.", "Formal amended pathology report wording: the FISH addendum says the diagnosis was amended, but the report does not state the new diagnostic term; confirm with hematopathology and record the FISH positivity thresholds used.", "Radiation oncology assessment and any RT plan: none documented.", "Airway assessment beyond CT: no pulmonary function or flow-volume loop; trachea narrowest at 15 mm on CT 2026-09-03.", "Current status after 2026-09-21: the last clinical contact was a telephone call, and the last in-person exam was 2026-09-14. Any new SVC or airway symptoms need reassessment before any treatment. The system date is 2026-10-23; if tomorrow's tumor board is not 2026-09-22, the patient has been untreated for about a month and needs urgent imaging and labs.", "Repeat imaging since CT and PET (2026-09-03 and 2026-09-10): mass size and SVC narrowing may have changed, and the CT simulation for RT will show the current status.", "Code status, advance directive, and fertility wishes beyond sperm banking: not documented.", "BSA discrepancy: chart 2.18 m2 (DuBois) vs Mosteller 2.21 m2; confirm with pharmacy and current weight.", "Penicillin allergy history is childhood urticaria only; no formal allergy evaluation is documented."], "decisions": {"stage": "II", "diagnosis": "DLBCL, GCB type, with MYC and BCL2 rearrangements (double-hit)", "intent": "curative", "regimen": "DA-EPOCH-R: rituximab 375 mg/m2 day 1; etoposide 50 mg/m2/day CI days 1-4; doxorubicin 10 mg/m2/day CI days 1-4; vincristine 0.4 mg/m2/day CI days 1-4 (max 2 mg/day); cyclophosphamide 750 mg/m2 day 5; prednisone 60 mg/m2 PO BID days 1-5; q21 days", "cycles": 6, "cycle1_dose_percent": 100, "radiotherapy": "Low-dose involved-field RT to the anterior mediastinal mass, 4 Gy in 2 fractions, before cycle 1 (if radiation oncology agrees); consolidative mediastinal RT after chemotherapy only if end-of-treatment PET is Deauville 4-5 at the bulky site", "orders_now": ["Cancel R-CHOP order and the cycle 1 scheduled 2026-09-22 (remains on hold).", "Admit for cycle 1 day 1 (96-hour continuous infusion, TLS and SVC monitoring, CPAP).", "G6PD quantitative assay today.", "PT/INR, aPTT, fibrinogen, magnesium, quantitative IgG/IgA/IgM today.", "Allopurinol 300 mg PO daily, start today.", "Radiation oncology consult today with CT simulation; low-dose RT to the mediastinal mass 4 Gy in 2 fractions before cycle 1.", "Bone marrow aspirate and biopsy with flow and cytogenetics before cycle 1.", "Diagnostic lumbar puncture with CSF cytology and flow cytometry after coagulation results are back.", "Pulmonary function tests with flow-volume loop before cycle 1.", "Sperm banking counseling and offer before cycle 1.", "Rituximab 375 mg/m2 IV day 1 (about 820 mg at BSA 2.18 m2), with acetaminophen and diphenhydramine premedication.", "Etoposide 50 mg/m2/day continuous IV infusion days 1-4 (about 110 mg/day).", "Doxorubicin 10 mg/m2/day continuous IV infusion days 1-4 (about 22 mg/day; 40 mg/m2 per cycle).", "Vincristine 0.4 mg/m2/day continuous IV infusion days 1-4 (about 0.9 mg/day; max 2 mg/day), via the port only.", "Cyclophosphamide 750 mg/m2 IV day 5 (about 1,635 mg).", "Prednisone 60 mg/m2 PO twice daily days 1-5 (about 130 mg per dose).", "Pegfilgrastim 6 mg SC day 6.", "TMP-SMX DS one tablet PO three times weekly (PJP prophylaxis), start before cycle 1.", "Antiemetic prophylaxis per institutional protocol for each cycle.", "IV hydration to keep urine output at least 100 mL/h from cycle 1 through day 5, titrated to volume and SVC status.", "SVC precautions: head of bed elevated, no lying flat, avoid heavy exertion; nursing monitoring for facial or arm swelling, stridor and dyspnea.", "Continue CPAP nightly, omeprazole daily, albuterol and cetirizine as needed.", "No antiviral hepatitis B prophylaxis (HBsAg and anti-HBc negative, anti-HBs positive)."], "conditional_orders": ["if G6PD normal: rasburicase 0.2 mg/kg IV (about 20 mg) daily for 5 days, starting before cycle 1 day 1.", "if G6PD deficient: no rasburicase; continue allopurinol and hydration, and consider febuxostat if uric acid stays high.", "if CSF cytology or flow is negative and the platelet count is at least 50: intrathecal methotrexate 12 mg (preservative-free) on day 1 of each cycle, cycles 1 to 6.", "if CSF cytology or flow is positive, or any neurologic symptom appears: MRI brain and spine with contrast, neuro-oncology referral, and change to CNS-directed therapy (high-dose IV methotrexate-based regimen with intrathecal methotrexate) in place of DA-EPOCH-R.", "if bone marrow is involved: restage as stage IV; keep DA-EPOCH-R and keep CNS prophylaxis.", "if radiation oncology declines pre-chemotherapy RT, or RT cannot be delivered within about 7 days: start cycle 1 day 1 without RT, with inpatient monitoring.", "if stridor, orthopnea, dyspnea at rest, hoarseness, inability to swallow liquids, facial or arm swelling, syncope, or any neurologic sign: urgent admission, same-day radiation oncology for RT, anesthesia and ENT airway review; airway planning must not delay RT.", "if flow-volume loop shows intrathoracic obstruction: anesthesia review before any sedation and before cycle 1.", "if fever of 38.0 C or higher during neutropenia: blood cultures and empiric cefepime.", "if cycle 1 nadir is ANC below 0.5 for more than 7 days, febrile neutropenia, or platelets below 25: dose-reduce cycle 2 per the DA-EPOCH-R dose-level algorithm.", "if LVEF falls below 50% or drops 10 points or more, or symptomatic heart failure develops: hold doxorubicin and refer to cardiology.", "if interim PET after cycle 2 is Deauville 4-5: tumor board review, biopsy if feasible, no automatic switch to R-CHOP; salvage or trial if progression is confirmed.", "if end-of-treatment PET is Deauville 4-5 at the bulky mediastinal site: consolidative mediastinal RT (about 30-36 Gy).", "if clinical or radiolo 7, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response stages the disease as Lugano/Ann Arbor stage I (stage IA acceptable): a single nodal region (right cervical levels II-III).", "quotes": ["Ann Arbor stage IA."], "supported": true, "parts": [], "related": []}, {"id": "stage_nonbulky_no_b", "label": "Notes non-bulky disease (3.1 cm, <7.5 cm) and no B symptoms", "why": "Non-bulky disease (<7.5 cm) is a FLYER eligibility criterion; absent B symptoms confirm stage IA rather than IB.", "domain": "staging", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes the disease is non-bulky (largest node 3.1 cm, below 7.5 cm) and that there are no B symptoms.", "quotes": ["Ann Arbor stage IA.", "Deliberate departure from the default: the traditional NCCN-listed approach for stage I non-bulky DLBCL is R-CHOP x3-4 followed by ISRT 30-36 Gy."], "supported": true, "parts": [], "related": []}, {"id": "stage_pet_no_marrow_biopsy", "label": "Omits bone marrow biopsy because PET shows no marrow uptake", "why": "Spares her an invasive procedure; per Lugano, PET-CT without marrow uptake makes routine marrow biopsy unnecessary in DLBCL.", "domain": "staging", "kind": "should", "severity": "minor", "points": 2, "met": false, "error": false, "missed": true, "review": false, "regex": false, "judge": null, "text": "The response notes that bone marrow biopsy is unnecessary because PET-CT shows no marrow uptake.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mn_overstaged", "label": "Stages the disease as stage III/IV or advanced stage", "why": "Overstaging would push her toward 6 cycles of chemotherapy she does not need, adding toxicity.", "domain": "staging", "kind": "must_not", "severity": "dangerous", "points": 0, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response overstages the disease as stage III or IV / advanced stage.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mol_not_de_not_dh", "label": "States neither double-expressor (MYC 15%, BCL2 30%) nor double-hit (FISH negative)", "why": "IHC is below thresholds and FISH is negative, so standard R-CHOP rather than intensified therapy is appropriate.", "domain": "molecular_classification", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response states the lymphoma is neither double-expressor (MYC 15%, BCL2 30% below thresholds) nor double-hit (FISH negative for MYC, BCL2 and BCL6 rearrangements).", "quotes": ["IHC MYC 15% and BCL2 30% are below double-expressor thresholds (MYC 40%, BCL2 50%)."], "supported": true, "parts": [], "related": []}, {"id": "mn_calls_double_hit", "label": "Calls it double-hit / high-grade lymphoma with MYC and BCL2 rearrangements", "why": "FISH is negative; this label would lead to intensive regimens such as DA-EPOCH-R with major unnecessary toxicity.", "domain": "molecular_classification", "kind": "must_not", "severity": "dangerous", "points": 0, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response classifies this lymphoma as double-hit / high-grade B-cell lymphoma with MYC and BCL2 rearrangements.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mn_calls_double_expressor", "label": "Calls the lymphoma double-expressor", "why": "MYC 15% and BCL2 30% are below thresholds; the label wrongly implies higher risk and may change treatment.", "domain": "molecular_classification", "kind": "must_not", "severity": "important", "points": 5, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response classifies this lymphoma as double-expressor.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "prog_ipi_low", "label": "Calculates IPI 0 (low risk) from age, LDH, ECOG, stage, extranodal", "why": "IPI 0 is a core eligibility criterion for abbreviated 4-cycle therapy and predicts high cure rates.", "domain": "prognosis", "kind": "must", "severity": "important", "points": 6, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response calculates IPI as 0 (low risk): age <=60, normal LDH, ECOG 0, stage I, no extranodal sites.", "quotes": ["IPI 0: age 45, ECOG 0, LDH 190 U/L (no reference range was supplied;"], "supported": true, "parts": [], "related": []}, {"id": "prog_cns_ipi_low", "label": "Calculates CNS-IPI as 0 / low risk", "why": "Low CNS-IPI justifies omitting CNS staging and prophylaxis in this patient.", "domain": "prognosis", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response calculates CNS-IPI as 0 / low risk.", "quotes": ["CNS-IPI score 0 (age 45, stage I, normal LDH, ECOG 0, no kidney or adrenal involvement, no marrow involvement)."], "supported": true, "parts": [], "related": []}, {"id": "tx_curative_rchop", "label": "Recommends curative-intent rituximab-containing, R-CHOP-based immunochemotherapy", "why": "She has highly curable localized DLBCL; anything less than curative immunochemotherapy risks losing that cure.", "domain": "first_line_treatment", "kind": "must", "severity": "dangerous", "points": 6, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response recommends curative-intent rituximab-containing immunochemotherapy (R-CHOP-based) for this patient.", "quotes": ["Expect cure in the large majority with full-dose R-CHOP;", "Biology is favorable and does not change the choice of R-CHOP."], "supported": true, "parts": [], "related": []}, {"id": "tx_flyer_4rchop_2r", "label": "Prefers 4 R-CHOP plus 2 rituximab without radiotherapy (FLYER); 4-cycle PET-adapted accepted", "why": "Age under 60, IPI 0 and non-bulky disease: 4 cycles cure as well as 6 with less toxicity.", "domain": "first_line_treatment", "kind": "must", "severity": "important", "points": 10, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response recommends, as the preferred plan, 4 cycles of R-CHOP followed by 2 additional doses of rituximab without radiotherapy (FLYER regimen; age 18-60, IPI 0, non-bulky <7.5 cm). A 4-cycle PET-adapted R-CHOP approach is also accepted.", "quotes": ["R-CHOP-21 for 4 cycles at full dose (100%), one cycle every 21 days: rituximab 375 mg/m2 IV day 1, cyclophosphamide 750 mg/m2 IV day 1, doxorubicin 50 mg/m2 IV day 1, vincristine 1.4 mg/m2 IV day 1 capped at 2 mg, prednisone 100 mg PO days 1-", "Biology is favorable and does not change the choice of R-CHOP."], "supported": true, "parts": [], "related": []}, {"id": "tx_no_rt_goals", "label": "Notes plan omits neck radiotherapy, matching her wish to avoid it", "why": "She fears thyroid and salivary late effects after her sister's radiation-induced hypothyroidism; the plan respects that.", "domain": "first_line_treatment", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes that the chosen plan omits neck radiotherapy, which aligns with her wish to avoid radiation (thyroid and salivary late effects, sister's radiation-induced hypothyroidism).", "quotes": ["hypothyroidism if neck RT is given.", "No up-front radiotherapy;", "Neck radiation: avoided up front;"], "supported": true, "parts": [], "related": []}, {"id": "tx_alternatives", "label": "Names R-CHOP x3 plus ISRT or PET-adapted 4-cycle (S1001) alternative", "why": "Gives her evidence-based options for shared decision-making, though the ISRT option conflicts with her wish to avoid neck radiation.", "domain": "first_line_treatment", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response names R-CHOP x3 followed by involved-site radiotherapy, or a PET-adapted 4-cycle approach (S1001), as an acceptable alternative.", "quotes": ["the 21-day schedule is the one used in the PET-directed trial evidence for omitting radiotherapy (IELSG-37, which randomized PET-negative patients after 3-4 cycles of R-CHOP-21 to ISRT or no RT);"], "supported": true, "parts": [], "related": []}, {"id": "mn_six_cycles", "label": "Recommends 6 cycles of R-CHOP or Pola-R-CHP as preferred plan", "why": "Overtreatment for IPI-0 non-bulky stage I disease: more cardiotoxicity, neuropathy, infections and time off work, no cure gain.", "domain": "first_line_treatment", "kind": "must_not", "severity": "important", "points": 16, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends 6 cycles of R-CHOP (or of Pola-R-CHP) as the preferred plan for this IPI-0, non-bulky stage I disease (overtreatment).", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mn_pola_preferred", "label": "Recommends Pola-R-CHP as the preferred regimen", "why": "POLARIX enrolled only IPI 2-5; no evidence of benefit at IPI 0, with added neuropathy and cost.", "domain": "first_line_treatment", "kind": "must_not", "severity": "important", "points": 8, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends Pola-R-CHP as the preferred regimen (POLARIX enrolled IPI 2-5 only; not indicated at IPI 0).", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mn_da_epoch", "label": "Recommends DA-EPOCH-R or another intensified regimen", "why": "No high-risk biology or stage; intensification adds inpatient infusions and toxicity without benefit.", "domain": "first_line_treatment", "kind": "must_not", "severity": "important", "points": 5, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends DA-EPOCH-R or another intensified regimen for this patient.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "mn_observation_or_rt_alone", "label": "Recommends observation, no systemic treatment, or radiotherapy alone", "why": "Untreated or RT-only DLBCL forfeits a roughly 95% chance of cure and risks systemic relapse.", "domain": "first_line_treatment", "kind": "must_not", "severity": "dangerous", "points": 0, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends observation / no systemic treatment, or radiotherapy alone, as the plan.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "cns_low_no_prophylaxis", "label": "Judges CNS risk low; no CNS prophylaxis, MRI brain or LP needed", "why": "CNS-IPI 0 and no high-risk sites; avoids needless invasive tests and toxic prophylaxis.", "domain": "cns_management", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges CNS-relapse risk as low and states that CNS prophylaxis and CNS staging (MRI brain / lumbar puncture) are not indicated.", "quotes": ["CNS relapse risk is well under 1-2%, so no CNS-directed prophylaxis is indicated (no intrathecal methotrexate, no high-dose methotrexate).", "NCCN-IPI low.", "Low."], "supported": true, "parts": [], "related": []}, {"id": "mn_mandates_cns_prophylaxis", "label": "Recommends intrathecal or high-dose methotrexate CNS prophylaxis", "why": "Not indicated at CNS-IPI 0; exposes her to neurotoxicity, renal toxicity and treatment delays for no benefit.", "domain": "cns_management", "kind": "must_not", "severity": "important", "points": 4, "met": false, "error": false, "missed": false, "review": false, "regex": false, "judge": null, "text": "The response recommends CNS prophylaxis (intrathecal chemotherapy or high-dose methotrexate) for this patient.", "quotes": [], "supported": true, "parts": [], "related": []}, {"id": "resp_eot_pet_lugano", "label": "Plans end-of-treatment PET-CT read by Lugano/Deauville criteria", "why": "Confirms complete metabolic response, which decides whether she needs further therapy or can go to follow-up.", "domain": "response_assessment", "kind": "must", "severity": "important", "points": 6, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response plans an end-of-treatment FDG PET-CT read with Lugano criteria / Deauville 5-point scale.", "quotes": ["PET-guided decision at end of treatment (see response_assessment).", "Interval PET-CT about 2-3 weeks after cycle 2 (before cycle 3), scored by Deauville 5-point scale per Lugano 2014, compared with baseline (right level IIA node 3.1 cm, SUVmax 14.2;", "PET-CT (2026-09-03) shows no spleen, liver, bone or marrow involvement and no contralateral, supraclavicular, mediastinal or abdominopelvic nodes."], "supported": true, "parts": [], "related": []}, {"id": "resp_interim_pet", "label": "Plans interim PET after cycle 4; Deauville 4-5 prompts RT or biopsy", "why": "The plan omits radiotherapy, so a positive interim scan must trigger additional treatment rather than proceeding.", "domain": "response_assessment", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response plans an interim PET-CT after cycle 4 (before the rituximab-only doses) and says a positive scan (Deauville 4-5) would prompt additional therapy (e.g. RT or biopsy) rather than proceeding as planned.", "quotes": ["End-of-treatment PET-CT about 3-4 weeks after cycle 4 is the decision point for radiotherapy."], "supported": true, "parts": [], "related": []}, {"id": "work_pregnancy_test", "label": "Requires a pregnancy test (hCG) before chemotherapy; none documented", "why": "Premenopausal woman with no documented test; R-CHOP during unrecognised pregnancy can cause fetal harm.", "domain": "pretreatment_workup", "kind": "must", "severity": "important", "points": 10, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response requires a pregnancy test (serum or urine hCG) before starting chemotherapy, noting that none is documented in this premenopausal woman.", "quotes": ["Still needed before cycle 1: serum beta-hCG (must be negative within 72 h before cycle 1;", "the record has no pregnancy test);"], "supported": true, "parts": [], "related": []}, {"id": "work_hbv_reviewed", "label": "Confirms HBsAg and anti-HBc nonreactive; no antiviral prophylaxis needed", "why": "Hepatitis B serology must be checked before rituximab; here it is negative, so no entecavir needed.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 2, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response confirms hepatitis B serology was checked (HBsAg and anti-HBc nonreactive) so no antiviral prophylaxis is needed before rituximab.", "quotes": ["Hepatitis B: HBsAg nonreactive, anti-HBc nonreactive, anti-HBs reactive (vaccine immunity), so no antiviral prophylaxis and no HBV DNA needed."], "supported": true, "parts": [], "related": []}, {"id": "work_echo_reviewed", "label": "Notes baseline LVEF 63% permits anthracycline", "why": "Normal heart function confirms doxorubicin in R-CHOP is safe to give.", "domain": "pretreatment_workup", "kind": "should", "severity": "minor", "points": 1, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response notes the baseline LVEF of 63% permits anthracycline.", "quotes": ["Long-term risks to plan for: anthracycline cardiotoxicity (low baseline risk: LVEF 63%, GLS -21%, and only 4 cycles planned);"], "supported": true, "parts": [], "related": []}, {"id": "sup_stop_coc_switch", "label": "Stops combined estrogen pill; switches to non-estrogen contraception (IUD, implant, progestin-only)", "why": "Estrogen is unsafe for her, yet she still needs reliable contraception throughout chemotherapy.", "domain": "supportive_care", "kind": "must", "severity": "important", "points": 12, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response stops the combined estrogen-containing oral contraceptive and switches to effective non-estrogen contraception (e.g. copper or levonorgestrel IUD, implant, progestin-only method) for the duration of treatment.", "quotes": ["switch from combined oral contraceptive to a non-estrogen method;"], "supported": true, "parts": [], "related": []}, {"id": "sup_coc_reason", "label": "Explains estrogen contraindicated in migraine with aura; adds VTE risk", "why": "Migraine with aura raises ischemic stroke risk on estrogen; active lymphoma and chemotherapy add clot risk.", "domain": "supportive_care", "kind": "should", "severity": "important", "points": 4, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response gives the reason: estrogen-containing contraception is contraindicated in migraine with aura (ischemic stroke risk) and adds venous thromboembolism risk during chemotherapy/active cancer.", "quotes": ["She has migraine with aura (US MEC category 4, contraindicated) and her lymphoma and chemotherapy add VTE risk.", "Her usual migraine aura is not a neurologic concern for lymphoma unless the pattern changes."], "supported": true, "parts": [], "related": []}, {"id": "sup_fertility_counselling", "label": "Offers fertility counselling and reproductive medicine referral", "why": "She is undecided about another pregnancy; abbreviated R-CHOP has low gonadotoxicity but she deserves informed choice.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response offers fertility / ovarian-function counselling (abbreviated R-CHOP has low gonadotoxicity; referral to reproductive medicine offered since she is undecided about further pregnancy).", "quotes": ["therapy-related ovarian insufficiency and infertility (high at age 45);", "Options are oocyte cryopreservation (estrogen-sparing stimulation protocol given her aura and lymphoma;"], "supported": true, "parts": [], "related": []}, {"id": "fit_goals", "label": "Judges her fit (ECOG 0) for curative therapy; addresses work and no-neck-radiation goals", "why": "High cure chance; plan should let her keep teaching and avoid neck radiation as she requested.", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges her fit (ECOG 0, no limiting comorbidity) for curative-intent therapy with a high cure probability, and addresses her goals of continuing to work and avoiding neck radiation.", "quotes": ["IPI 0: age 45, ECOG 0, LDH 190 U/L (no reference range was supplied;", "Expect cure in the large majority with full-dose R-CHOP;", "chemotherapy teaching."], "supported": true, "parts": [], "related": []}], "answer": {"diagnosis": "Diffuse large B-cell lymphoma, not otherwise specified, germinal-center B-cell (Hans GCB) type, right cervical nodal presentation (ICD-10-CM C83.31). MYC, BCL2 and BCL6 FISH are all negative, so this is not double-hit or triple-hit lymphoma. Basis: excisional biopsy of right level III node (2026-09-04, reported 2026-09-09) with FISH addendum (2026-09-15).", "stage": "Ann Arbor stage IA. Disease is confined to one contiguous nodal region (right cervical levels II-III). There are no B symptoms. Pathology shows capsular involvement only, with no extranodal soft-tissue extension, so no E designation. PET-CT (2026-09-03) shows no spleen, liver, bone or marrow involvement and no contralateral, supraclavicular, mediastinal or abdominopelvic nodes. Decision-field stage: I.", "biology": "GCB phenotype by Hans algorithm: CD20+, CD10+, BCL6+, MUM1/IRF4 negative (<10%), CD5-, CD30-, cyclin D1-, EBER-; flow shows kappa-restricted CD19+/CD20+/CD10+ large B cells. Ki-67 about 55%. IHC MYC 15% and BCL2 30% are below double-expressor thresholds (MYC 40%, BCL2 50%). FISH break-apart is negative for MYC, BCL2 and BCL6. Not double-hit, not double-expressor, not high-grade B-cell lymphoma. Biology is favorable and does not change the choice of R-CHOP. No further genomic testing is needed to start treatment.", "prognosis": "Favorable. IPI 0: age 45, ECOG 0, LDH 190 U/L (no reference range was supplied; treated as normal), stage I. NCCN-IPI low. Expect cure in the large majority with full-dose R-CHOP; my estimate of 5-year PFS is roughly 80-90%, which is an estimate and not a trial figure for this exact patient. Long-term risks to plan for: anthracycline cardiotoxicity (low baseline risk: LVEF 63%, GLS -21%, and only 4 cycles planned); therapy-related ovarian insufficiency and infertility (high at age 45); peripheral neuropathy from vincristine; second malignancy; hypothyroidism if neck RT is given. Her sister's Hodgkin lymphoma is not a reason for germline testing here.", "first_line_treatment": "R-CHOP-21 for 4 cycles at full dose (100%), one cycle every 21 days: rituximab 375 mg/m2 IV day 1, cyclophosphamide 750 mg/m2 IV day 1, doxorubicin 50 mg/m2 IV day 1, vincristine 1.4 mg/m2 IV day 1 capped at 2 mg, prednisone 100 mg PO days 1-5. Calculated on BSA 1.72 m2 (64 kg, 166 cm): rituximab 645 mg, cyclophosphamide 1290 mg, doxorubicin 86 mg, vincristine 2 mg. No up-front radiotherapy; PET-guided decision at end of treatment (see response_assessment). Reasons: (1) limited-stage, low-IPI GCB DLBCL is best treated with full-dose R-CHOP, and she has normal renal, hepatic and cardiac function, so no dose reduction is needed; (2) the 21-day schedule is the one used in the PET-directed trial evidence for omitting radiotherapy (IELSG-37, which randomized PET-negative patients after 3-4 cycles of R-CHOP-21 to ISRT or no RT); (3) she has clearly and reasonably asked to avoid neck radiation. Deliberate departure from the default: the traditional NCCN-listed approach for stage I non-bulky DLBCL is R-CHOP x3-4 followed by ISRT 30-36 Gy. I am not giving ISRT up front because PET-negative omission is supported by randomized data for her scenario. Uncertainty: the evidence for omitting RT after 4 cycles is trial-based rather than a firm guideline recommendation for this exact scenario, and the room for error is small if PET is misread. If the tumor board is not comfortable with the omission strategy, the fallback is R-CHOP x4 with ISRT 30 Gy up front. R-CHOP-14 was not chosen because it requires routine pegfilgrastim, which is unnecessary here, and its RT-omission data are weaker.", "cns_risk": "Low. CNS-IPI score 0 (age 45, stage I, normal LDH, ECOG 0, no kidney or adrenal involvement, no marrow involvement). Breasts are clinically and radiographically uninvolved. Testes are not relevant. CNS relapse risk is well under 1-2%, so no CNS-directed prophylaxis is indicated (no intrathecal methotrexate, no high-dose methotrexate). No baseline brain MRI or lumbar puncture unless new neurologic symptoms appear. Her usual migraine aura is not a neurologic concern for lymphoma unless the pattern changes.", "response_assessment": "Clinical exam and CBC, CMP and LDH before each cycle. Interval PET-CT about 2-3 weeks after cycle 2 (before cycle 3), scored by Deauville 5-point scale per Lugano 2014, compared with baseline (right level IIA node 3.1 cm, SUVmax 14.2; right level III node 2.1 cm, SUVmax 11.8; liver SUVmax 2.6). The interim scan is informational: it does not stop treatment unless it is Deauville 4-5 (see conditional orders). End-of-treatment PET-CT about 3-4 weeks after cycle 4 is the decision point for radiotherapy. Deauville 1-3 = complete metabolic response, no RT. Deauville 4-5 = residual uptake, ISRT as below, or biopsy if uptake is equivocal or at a new site. Surveillance after completion: clinical exam and labs every 3-6 months for 2 years, then less often; no routine surveillance PET or CT in responders. Late-effects follow-up: echo if cumulative anthracycline symptoms, TSH if neck RT is given, fertility follow-up as discussed.", "pretreatment_workup": "Already done: CBC with differential (WBC 5.9, ANC 3.6, ALC 1.7, Hb 13.2, platelets 240), CMP normal (creatinine 0.7, eGFR 108, bilirubin 0.5, AST/ALT normal, albumin 4.4), LDH 190 U/L, beta-2 microglobulin 1.6 mg/L, urate 4.6 mg/dL, phosphate 3.5 mg/dL. Hepatitis B: HBsAg nonreactive, anti-HBc nonreactive, anti-HBs reactive (vaccine immunity), so no antiviral prophylaxis and no HBV DNA needed. Hepatitis C antibody and HIV Ag/Ab nonreactive. PET-CT 2026-09-03. Transthoracic echo 2026-09-08 (LVEF 63%, GLS -21%, normal valves). Excisional biopsy with FISH addendum complete. No bone marrow biopsy: PET shows no marrow uptake and the CBC is normal, which is consistent with the plan in the consult note. Still needed before cycle 1: serum beta-hCG (must be negative within 72 h before cycle 1; the record has no pregnancy test); 12-lead ECG (none in record); quantitative IgG/IgA/IgM; TSH with free T4; fertility-preservation consultation with AMH; switch from combined oral contraceptive to a non-estrogen method; inactivated vaccines if due; chemotherapy teaching. Dental evaluation only if neck RT becomes part of the plan.", "supportive_care": "Stop the combined oral contraceptive today. She has migraine with aura (US MEC category 4, contraindicated) and her lymphoma and chemotherapy add VTE risk. Use condoms or abstinence until a non-estrogen method is in place. Preferred method: levonorgestrel IUD, which is progestin-only and acceptable with migraine with aura; copper IUD if she prefers a non-hormonal option. Antiemetics: palonosetron 0.25 mg IV and fosaprepitant 150 mg IV on day 1; prednisone covers the steroid component; take-home ondansetron and prochlorperazine PRN. Premedication before rituximab: acetaminophen and diphenhydramine. Tumor lysis risk low: hydrate, no routine allopurinol. Febrile neutropenia risk for R-CHOP-21 is intermediate and she has no patient-specific risk factors, so no primary G-CSF; use secondary G-CSF if she has febrile neutropenia. PJP prophylaxis with trimethoprim-sulfamethoxazole single-strength daily through about 2 weeks after cycle 4, given cumulative high-dose steroid exposure. Vaccines: inactivated influenza and COVID-19 if due; no live vaccines. Peripheral IV is acceptable for 4 cycles of doxorubicin with careful monitoring; port only if veins are inadequate. Pain: acetaminophen; avoid codeine (documented severe intolerance) and avoid NSAIDs during thrombocytopenia. Migraine: continue sumatriptan PRN; no change. Neuropathy and constipation monitoring with each vincristine dose. Scalp cooling offered as an option for alopecia; efficacy with doxorubicin is modest. Hand hygiene and infection-precaution counseling for her classroom work.", "fitness_and_goals": "Fit for full-dose curative treatment: ECOG 0, normal organ function, normal weight, no cardiac history, LVEF 63%. Goal is cure while continuing to teach: the plan is 4 cycles over about 12 weeks, with infusions on day 1 of each cycle and steroids at home on days 1-5. Expect fatigue and neutrophil nadir around days 7-14 of each cycle, when she should avoid crowded settings where possible and take fever seriously. She can expect to work most days with a reduced load in the week of each infusion; I will write a letter for the school with the infusion dates and neutropenia precautions. Fertility: R-CHOP at age 45 carries a high risk of ovarian insufficiency and infertility. She and her husband should decide with fertility specialists before cycle 1. Options are oocyte cryopreservation (estrogen-sparing stimulation protocol given her aura and lymphoma; a delay of no more than about 2 weeks is acceptable) or ovarian protection with a GnRH agonist. This is not contraception, and she must still use one. Neck radiation: avoided up front; will be used only if end-of-treatment PET is positive. If it is needed, it is ISRT 30 Gy with dental and thyroid planning, and it is the main thyroid risk, so TSH should be checked every 6-12 months afterward. Her worry about her thyroid, dry mouth and taste is legitimate; this should be explained to her and her husband, with the plan that avoids neck RT in the expected case.", "missing_information": ["Serum or urine beta-hCG: no pregnancy test in the record, and she is premenopausal with a last menstrual period of 2026-08-28. This must be negative before cycle 1.", "Contraceptive and menstrual history: she takes the combined oral contraceptive continuously without breaks, yet the 2026-09-17 note says 'day 21 of her cycle'. Continuous use usually suppresses withdrawal bleeding, so the bleeding pattern and adherence need clarifying. Her pregnancy risk has to be assessed on actual use, not on cycle day.", "Fertility wishes and ovarian reserve: she is undecided about another child; AMH is not measured. This decision drives whether oocyte cryopreservation or GnRH-agonist protection is used.", "Laboratory reference ranges: none are supplied in the record. I assumed the flagged 'N' interpretations are correct, including LDH 190 U/L.", "12-lead ECG, quantitative immunoglobulins (IgG/IgA/IgM) and TSH with free T4: none in the record.", "Bone marrow biopsy: not performed. Acceptable because PET shows no marrow uptake and the CBC is normal, but it is a deviation from a fuller workup that the tumor board should accept or reject.", "The 3.1 cm right level IIA node was not excised. Diagnosis is established on the level III node, and the level IIA node is in the same region, so resampling is not needed. The tumor board should confirm this.", "Interim PET after cycle 2 and end-of-treatment PET are not yet done; the radiotherapy decision depends on them.", "Varicella-zoster IgG and vaccination history: not documented. Optional for zoster risk planning.", "Incidental 2.0 cm right ovarian follicular cyst on PET-CT: not treatment-altering. Gynecology follow-up ultrasound at their discretion, particularly given the oral contraceptive history.", "Tumor board date: the record states 2026-09-18, and I have assumed that date for the timing of cycle 1."], "decisions": {"stage": "I", "diagnosis": "DLBCL NOS, GCB type, not double-hit (MYC/BCL2/BCL6 FISH negative), right cervical nodes", "intent": "curative", "regimen": "R-CHOP-21: rituximab 375 mg/m2 IV D1, cyclophosphamide 750 mg/m2 IV D1, doxorubicin 50 mg/m2 IV D1, vincristine 1.4 mg/m2 (max 2 mg) IV D1, prednisone 100 mg PO D1-5, every 21 days", "cycles": 4, "cycle1_dose_percent": 100, "radiotherapy": "none planned up front; ISRT 30 Gy to right neck only if end-of-treatment PET Deauville 4-5", "orders_now": ["Stop combined oral contraceptive (ethinyl estradiol 0.03 mg / levonorgestrel 0.15 mg) today; no estrogen-containing products during or after treatment", "Serum quantitative beta-hCG today; repeat within 72 h before cycle 1", "Interim contraception: condoms or abstinence until a non-estrogen method is in place", "Gynecology referral for levonorgestrel IUD placement before cycle 1 once hCG is negative (copper IUD if she prefers non-hormonal)", "Referral to reproductive endocrinology / fertility preservation this week: AMH, counseling on oocyte cryopreservation (estrogen-sparing protocol) and GnRH-agonist ovarian protection", "Pre-treatment labs: CBC with d ed in migraine with aura (ischemic stroke risk) and adds venous thromboembolism risk during chemotherapy/active cancer.", "quotes": ["The main risks are treatment-related (febrile neutropenia, vincristine neuropathy, infertility, VTE, and a small risk of cardiac toxicity at a cumulative doxorubicin dose of 200 mg/m2) rather than lymphoma-related.", "Her stable migraine with aura is not an indication for lumbar puncture or brain MRI."], "supported": true, "parts": [], "related": []}, {"id": "sup_fertility_counselling", "label": "Offers fertility counselling and reproductive medicine referral", "why": "She is undecided about another pregnancy; abbreviated R-CHOP has low gonadotoxicity but she deserves informed choice.", "domain": "supportive_care", "kind": "should", "severity": "minor", "points": 3, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response offers fertility / ovarian-function counselling (abbreviated R-CHOP has low gonadotoxicity; referral to reproductive medicine offered since she is undecided about further pregnancy).", "quotes": ["The main risks are treatment-related (febrile neutropenia, vincristine neuropathy, infertility, VTE, and a small risk of cardiac toxicity at a cumulative doxorubicin dose of 200 mg/m2) rather than lymphoma-related.", "\"The patient's fertility-preservation decision, ovarian reserve testing (AMH/FSH/estradiol), and reproductive endocrinology assessment."], "supported": true, "parts": [], "related": []}, {"id": "fit_goals", "label": "Judges her fit (ECOG 0) for curative therapy; addresses work and no-neck-radiation goals", "why": "High cure chance; plan should let her keep teaching and avoid neck radiation as she requested.", "domain": "fitness_and_goals", "kind": "must", "severity": "important", "points": 5, "met": true, "error": false, "missed": false, "review": false, "regex": true, "judge": null, "text": "The response judges her fit (ECOG 0, no limiting comorbidity
