# HIDDEN. OncoWorld v2 rubric for dlbcl_0001. Copied to tests/rubric_v2.toml; never visible to the model.
# Drafted by engineering from current practice (NCCN B-cell lymphomas, POLARIX, Lugano 2014, CNS-IPI,
# AGA/ASCO/EASL guidance on HBV reactivation with anti-CD20 therapy).
# Every item is PENDING_ONCOLOGIST until signed off in harbor_cases/<task>/review/signoff.md.
#
# The decision-changing element of this case is the hepatitis B serology (HBsAg nonreactive, anti-HBc total
# reactive, anti-HBs reactive) that nothing in the chart comments on: rituximab without antiviral prophylaxis
# is a dangerous omission.
#
# Graded by the regex rules on each item (grader of record); `text` states the criterion in clinical terms.
# All regexes run on the lower-cased answer.

version = "dlbcl_0001.v2.0"
review_status = "PENDING_ONCOLOGIST"
passing_score = 0.75

[leak_check]
# Strings that would give the answer away if they appeared anywhere in the model-visible chart.
forbidden_in_case = ["stage iii", "stage iv", "ipi", "cns-ipi", "high-intermediate", "polatuzumab", "pola-r-chp",
                     "r-chop", "da-epoch-r", "entecavir", "tenofovir", "lamivudine", "antiviral", "reactivation",
                     "occult", "hbv dna", "prophylaxis", "double-expressor", "double expressor", "double-hit",
                     "double hit", "lugano", "deauville", "bulky", "bulk", "allopurinol", "rasburicase",
                     "tumor lysis", "tumour lysis", "methotrexate", "isrt", "g-csf", "pegfilgrastim", "filgrastim"]

# ---------------- diagnosis
[[items]]
id = "dx_dlbcl_non_gcb"
domain = "diagnosis"
kind = "must"
severity = "important"
points = 6
text = "The response states the diagnosis is diffuse large B-cell lymphoma (NOS) with a non-germinal-center (non-GCB) phenotype by the Hans algorithm."
all = ["dlbcl|diffuse large b[- ]cell", "non[- ]?gcb|non[- ]germinal[- ]cent(?:er|re)"]

[[items]]
id = "dx_hans_not_abc"
domain = "diagnosis"
kind = "should"
severity = "minor"
points = 2
text = "The response notes that Hans non-GCB is an immunohistochemical surrogate and is not the same as the molecular activated B-cell (ABC) subtype defined by gene-expression profiling."
any = ["not (?:the same as|equivalent to|equal to|identical to|synonymous with|a substitute for|definitive)[^.]{0,40}(?:abc|activated|molecular|gene[- ]expression|cell[- ]of[- ]origin)",
       "(?:surrogate|approximat\\w*|proxy)[^.]{0,60}(?:abc|activated|cell[- ]of[- ]origin|gene[- ]expression)",
       "(?:abc|activated b)[^.]{0,60}(?:requires|needs|defined by|by) gene[- ]expression"]

# ---------------- staging
[[items]]
id = "stage_iii"
domain = "staging"
kind = "must"
severity = "dangerous"
points = 8
text = "The response stages the disease as Lugano/Ann Arbor stage III."
# asserted stage III, with Lugano/Ann Arbor suffixes (IIIB, III-S, IIIBS, 3E); ranges such as III-IV or III/IV do not count
affirm = ['\bstage\s*(?:iii|3)(?:-?[abesx]{1,3})?(?![a-z0-9])(?!\s*(?:-|–|to|or|/)\s*(?:iv|4))']
# Structured: decisions.stage is III (suffixes such as IIIB / III-S tolerated; a range such as III-IV is no stage call)
decision = [ { field = "stage", in = ["III"] } ]

[[items]]
id = "stage_spleen_nodal"
domain = "staging"
kind = "should"
severity = "important"
points = 3
text = "The response bases stage III on nodal disease above and below the diaphragm plus splenic involvement, treating the spleen as lymphatic (nodal) tissue rather than an extranodal site."
all = ['diaphragm', '(?:spleen|splenic)[^.;]{0,80}(?:lymphatic|lymphoid|nodal (?:tissue|organ|site|disease)|not (?:an? )?extranodal|is nodal)|(?:lymphatic|lymphoid|nodal)[^.;]{0,40}(?:spleen|splenic)']
# credited only when the note actually stages it III (a note that stages IV cannot be basing stage III on a nodal spleen)
affirm = ['\bstage\s*(?:iii|3)(?:-?[abesx]{1,3})?(?![a-z0-9])(?!\s*(?:-|–|to|or|/)\s*(?:iv|4))']

[[items]]
id = "stage_bulky_b_symptoms"
domain = "staging"
kind = "should"
severity = "minor"
points = 3
text = "The response notes bulky disease (11 cm retroperitoneal mass, >=10 cm) and B symptoms (fevers, night sweats)."
all = ["bulk|11(?:\\.0)?\\s*cm", "b[- ]symptoms|night sweats|fevers?"]

[[items]]
id = "mn_stage_iv"
domain = "staging"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response assigns stage IV (for example by counting the spleen as an extranodal organ)."
# asserted stage IV, including suffixed forms (IV-B, IVBS, 4B)
affirm = ['(?<![iv/-])\bstage\s*(?:iv|4)(?:-?[abesx]{1,3})?(?![a-z0-9])']
# Structured (error committed): decisions.stage is IV (IV-B etc. tolerated)
decision = [ { field = "stage", in = ["IV"] } ]

[[items]]
id = "mn_spleen_extranodal_count"
domain = "staging"
kind = "must_not"
severity = "important"
points = 3
text = "The response counts the spleen as an extranodal site when scoring IPI or CNS-IPI."
# an IPI / CNS-IPI statement that scores the spleen as an extranodal site (in either word order); "extranodal sites: 0"
# and negated or hypothetical sentences do not count
affirm = ['\bipi\b[^.;\n]{0,80}extra[- ]?nodal(?![- ]?(?:sites?|involvement)?\s*[:=(]?\s*(?:0|zero|none|no)\b)[^.;\n]{0,40}\b(?:spleen|splenic)',
          '\bipi\b[^.;\n]{0,80}\b(?:spleen|splenic)[^.;\n]{0,60}extra[- ]?nodal',
          'extra[- ]?nodal(?![- ]?(?:sites?|involvement)?\s*[:=(]?\s*(?:0|zero|none|no)\b)[^.;\n]{0,40}\bipi\b[^.;\n]{0,40}\b(?:spleen|splenic)',
          '\b(?:spleen|splenic)[^.;\n]{0,60}extra[- ]?nodal[^.;\n]{0,60}\bipi\b']

# ---------------- molecular classification
[[items]]
id = "mol_de_not_dh"
domain = "molecular_classification"
kind = "must"
severity = "important"
points = 6
text = "The response classifies the lymphoma as double-expressor (MYC 50% >=40%, BCL2 80% >=50% by IHC) but NOT double-hit (FISH negative for MYC, BCL2 and BCL6 rearrangements)."
check = "denies_double_hit"
all = ["double[- ]expressor|dual[- ]expressor|\\bdel\\b|co[- ]?express"]

[[items]]
id = "mn_calls_double_hit"
domain = "molecular_classification"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response classifies this lymphoma as double-hit / high-grade B-cell lymphoma with MYC and BCL2 rearrangements."
# asserted double-hit (replaces the built-in affirms_double_hit check): a bare "MYC and BCL2 rearrangements" only counts
# when stated as present or as the WHO entity name, and a sentence that goes on to say the diagnosis was excluded or
# ruled out ("considered ... and excluded by FISH") does not count
affirm = ['(?:double|triple)[-_ ]hit(?![^.;]*\b(?:excluded|ruled out|not (?:supported|confirmed|present))\b)',
          '(?:hgbl[- ]?(?:dh|th)\b|hgbl[- ]?myc/bcl2|myc/bcl2[- ]rearranged|\(dh\)|\bdh\b(?= lymphoma| biology| disease|\s*\())(?![^.;]*\b(?:excluded|ruled out|not (?:supported|confirmed|present))\b)',
          '(?:lymphoma|hgbl) with myc and bcl2 (?:gene )?rearrangements?(?![^.;]*\b(?:excluded|ruled out|not (?:supported|confirmed|present))\b)',
          'myc(?: and |/| plus )bcl2 (?:gene )?rearrangements? (?:are |were |is |was )?(?:detected|present|identified|confirmed|demonstrated)',
          '(?:positive for|shows?|showed|demonstrat\w*|confirm\w*|harbou?r\w*|detected)\s+(?:both\s+)?myc(?: and |/| plus )bcl2 (?:gene )?rearrangements?']
# Structured (error committed): decisions.diagnosis names the double-hit / HGBL entity and does not negate it
# ("DLBCL NOS, double-expressor, not double-hit" and "no MYC/BCL2 rearrangement" do not count)
decision = [
  { field = "diagnosis", matches = '(?:double|triple)[- ]hit|\bhgbl\b|\bdhl\b|high[- ]grade b[- ]cell|myc[^;]{0,20}bcl2[^;]{0,20}rearrang', not_matches = '(?:\bnot\b(?! otherwise)|\bno\b|without|negative for|exclud\w*|ruled out|rather than|non[- ](?=double|triple))[^;,()]{0,25}(?:double[- ]hit|triple[- ]hit|\bhgbl\b|\bdhl\b|high[- ]grade|\bmyc\b|rearrang)|(?:double|triple)[- ]hit[^;,()]{0,20}(?:excluded|ruled out|negative)|rearrang\w*[^;,()]{0,20}(?:negative|absent|not detected)' },
]

[[items]]
id = "mn_denies_double_expressor"
domain = "molecular_classification"
kind = "must_not"
severity = "minor"
points = 3
text = "The response states the lymphoma is NOT double-expressor despite MYC 50% and BCL2 80% by IHC."

# ---------------- prognosis
[[items]]
id = "prog_ipi_3"
domain = "prognosis"
kind = "must"
severity = "important"
points = 6
text = "The response calculates IPI as 3 (high-intermediate risk): age >60, elevated LDH, stage III; ECOG 1 and zero extranodal sites do not score."
any = ["(?<!cns-)(?<!cns )\\bipi\\b[^.]{0,40}\\b3\\b", "(?<!cns-)(?<!cns )\\bipi\\b[^.]{0,60}high[- ]intermediate", "high[- ]intermediate[^.]{0,30}(?<!cns-)(?<!cns )\\bipi\\b"]

[[items]]
id = "prog_cns_ipi_intermediate"
domain = "prognosis"
kind = "must"
severity = "important"
points = 5
text = "The response calculates CNS-IPI as 3 (intermediate risk), without counting the spleen as an extranodal site."
any = ["cns[- ]ipi[^.]{0,40}\\b3\\b", "cns[- ]ipi[^.]{0,60}intermediate", "intermediate[^.]{0,30}cns[- ]ipi"]

# ---------------- first-line treatment
[[items]]
id = "tx_curative_pola_or_rchop"
domain = "first_line_treatment"
kind = "must"
severity = "dangerous"
points = 8
text = "The response recommends curative-intent full-dose immunochemotherapy with Pola-R-CHP or R-CHOP for 6 cycles."
# the regimen put forward as the plan; "palliative R-CHOP" and abbreviated courses (R-CHOP x3, 4 cycles) are not
# the curative 6-cycle recommendation, and the note must state curative intent or six cycles somewhere
recommend = ['(?<!palliative )(?<!palliative-intent )(?<![1-5] cycles of )(?<!three cycles of )(?<!four cycles of )(?:pola[- ]?r[- ]?chp|polatuzumab|r[- ]?chop)(?![^.;]{0,15}(?:[x×]\s?[1-5]\b|\b[1-5] cycles|\b(?:one|two|three|four|five) cycles))(?![^.;]{0,40}\bpalliat(?:ion|ive(?! care)))']
any = ['\b(?:6|six)\b[^.;\n]{0,25}cycles|[x×]\s?6\b|curative|intent to cure']
# Structured: curative intent, regimen Pola-R-CHP or R-CHOP (not mini / attenuated / EPOCH), 6 cycles, full dose in
# cycle 1 (the text says "full-dose"; see oncologist question on overlap with mn_dose_reduced_initial)
decision = [
  { field = "intent", matches = '^curative' },
  { field = "regimen", matches = 'pola|polivy|rituxan|r[- ]?chop|r[- ]?chp|chop[- ]?r\b|rituximab[- ]?chop|rituximab[^;]{0,60}cyclophosphamide', not_matches = 'mini|epoch|attenuat|dose[- ]reduced|reduced[- ]dose|palliat|\b[1-9]\d ?%' },
  { field = "cycles", matches = '^6\b' },
  { field = "cycle1_dose_percent", min = 100 },
]

[[items]]
id = "tx_pola_preferred"
domain = "first_line_treatment"
kind = "should"
severity = "important"
points = 4
text = "The response names Pola-R-CHP as the preferred regimen given IPI >=2 (noting the POLARIX benefit appeared greatest in non-GCB/ABC disease), with R-CHOP an acceptable alternative."
recommend = ["pola[- ]?r[- ]?chp|polatuzumab"]
any = ['\bprefer\w*|\bfavou?r(?:s|ed|ing)?\b']
# Structured: the regimen actually ordered is Pola-R-CHP
decision = [ { field = "regimen", matches = 'pola|polivy', not_matches = 'mini|epoch|attenuat|dose[- ]reduced|reduced[- ]dose|\b[1-9]\d ?%' } ]

[[items]]
id = "tx_isrt_residual_bulk"
domain = "first_line_treatment"
kind = "should"
severity = "minor"
points = 2
text = "The response considers ISRT to the initially bulky site if it remains PET-positive (residual Deauville 4-5) at the end of systemic therapy."
all = ["radiation|radiotherapy|\\brt\\b|isrt", "residual|pet[- ]positive|deauville|initially bulky"]

[[items]]
id = "mn_non_curative"
domain = "first_line_treatment"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response recommends palliative-only treatment, best supportive care, or hospice as the plan."
# palliative-only intent asserted as the plan; concurrent "palliative care" involvement alongside curative therapy and
# palliative radiotherapy for a symptom do not count
affirm = ['best supportive care|hospice|comfort[- ](?:focused|measures|care)|palliative[- ](?:only|intent|care alone)|palliative (?:therapy|treatment|chemo\w*|regimen|approach|steroids)|for palliation|symptom(?:atic)? (?:control|management|care) (?:only|alone)']
# Structured (error committed): decisions.intent is palliative or observation (no curative therapy)
decision = [ { field = "intent", in = ["palliative", "observation"] } ]

[[items]]
id = "mn_da_epoch"
domain = "first_line_treatment"
kind = "must_not"
severity = "important"
points = 5
text = "The response recommends DA-EPOCH-R or another intensified regimen on the basis of double-expressor status alone."
# DA-EPOCH-R or an explicitly intensified / dose-dense regimen asserted as the plan (affirm, so "I favour DA-EPOCH-R"
# counts); "reserve X for double-hit" / "X is reserved for" indication statements do not
affirm = ['(?<!reserve )(?<![\w-])(?:(?:da|dose[- ]adjusted)[- ]?(?:r[- ])?epoch|r[- ]?epoch|epoch[- ]r)\b(?![^.;]{0,40}\b(?:is |are )?(?:reserved|only) for\b)',
          '(?:escalat\w*|intensif\w*)[^.;]{0,30}(?:r[- ]?chop[- ]?14|dose[- ]dense|epoch|hyper[- ]?cvad|codox)',
          'dose[- ]dense (?:r[- ]?chop|therapy|regimen|scheduling|chemo\w*)',
          '(?:more intensive|intensified|intensive) (?:regimen|therapy|treatment|chemo\w*|induction)(?! (?:is|are) (?:not|reserved))']
# Structured (error committed): the ordered regimen is DA-EPOCH-R or another intensified / dose-dense regimen
decision = [ { field = "regimen", matches = 'epoch|dose[- ]dense|chop[- ]?14\b|hyper[- ]?cvad|codox|\bivac\b|intensif|escalat' } ]

[[items]]
id = "mn_dose_reduced_initial"
domain = "first_line_treatment"
kind = "must_not"
severity = "important"
points = 4
text = "The response recommends a dose-reduced regimen (e.g. R-mini-CHOP) for this fit 62-year-old with ECOG 1."
# an up-front attenuated regimen as the plan (R-mini-CHOP, dose-reduced / attenuated R-CHOP, "75% doses");
# "reserved for" indication statements and toxicity-triggered reductions in later cycles do not count
recommend = ['(?:r[- ]?mini[- ]?chop|(?:dose[- ](?:reduced|attenuated)|reduced[- ]dose|attenuated(?:[- ]dose)?) (?:r[- ]?chop|pola[- ]?r[- ]?chp|chop|chemo\w*|regimen|therapy|immunochemotherapy)|\b[1-9]\d ?% (?:of (?:full |standard )?)?doses?)(?![^.;]{0,30}\b(?:is |are )?(?:reserved|only) for\b)']
# Structured (error committed): cycle 1 planned below full dose, or an attenuated regimen ordered
decision = [
  { any = [ { field = "cycle1_dose_percent", max = 99 }, { field = "regimen", matches = 'mini|attenuat|dose[- ]reduced|reduced[- ]dose|\b[1-9]\d ?%' } ] },
]

# ---------------- hepatitis B (the decision-changing element)
[[items]]
id = "hbv_prophylaxis"
domain = "pretreatment_workup"
kind = "must"
severity = "dangerous"
points = 12
text = "The response recognizes resolved/occult hepatitis B (HBsAg negative, anti-HBc positive) with a high risk of HBV reactivation on anti-CD20 therapy, and starts antiviral prophylaxis (entecavir or tenofovir) before the first rituximab dose, continued for at least 12 months after the last dose."
# HBV context plus an antiviral plan that runs for >=12 months after anti-CD20 therapy, in one sentence (decimals
# such as "0.5 mg" do not end it). Not `recommend`: the serology clause ("HBsAg-negative, anti-HBc reactive: start
# entecavir") reads as a negation to the shared helper. Monitor-and-treat-if-detectable, 6-month courses and
# "if"/"only" conditionals do not count.
all = ["hbv|hepatitis b|anti[- ]hbc|core antibody",
       '(?<!no )(?<!not )(?:entecavir|tenofovir|antiviral|nucleos\w*)(?:(?!\bif\b|\bonly\b|\bunless\b)(?:[^.;\n]|\.\d)){0,200}?(?:\b(?:12|twelve|18|24)(?:\s*(?:-|–|to)\s*(?:18|24|36))?\s*months|\b(?:one|1|a) year)']
# Structured: decisions.orders_now contains an unconditional entecavir / tenofovir (or named antiviral) prophylaxis order.
# An element is not counted when the antiviral is conditional ("if HBV DNA detectable: entecavir", "entecavir ... if
# detectable"; "longer if ..." is fine), negated / held, started after cycle 1, or given for a stated course < 12 months.
# A conditional_orders entry never counts. (Duration is checked only when the order states one.)
# Whitelist (not blacklist): the order must name the drug AND state an explicit >=12-month / year / indefinite /
# lifelong commitment, with no delayed-start, conditional-trigger, low-range-duration, negation or hedge marker
# anywhere in the same order string (see red-team examples in selftest/answers/structured_redteam_hbv_phrasings.json).
decision = [
  { field = "orders_now", matches = '(?s)(?=.*(?:entecavir|tenofovir|baraclude|vemlidy|viread|antiviral|nucleos\w*))(?=.*(?:\b(?:12|18|24)\b(?:\s*(?:-|–|to)\s*(?:18|24|36))?\s*months?\b|\b(?:1|one)\s*years?\b|\bindefinite(?:ly)?\b|\blifelong\b))(?!.*\b(?:[1-9]|1[01])\s*(?:-|–|to)\s*\d{1,2}\s*months?\b)(?!.*\b(?:not started|deferred|declined|withheld|held|discontinued)\b)(?!.*(?<!longer )(?<!extend )(?<!extended )\b(?:if|when|once|unless|in case|should|upon)\b[^;]{0,60}(?:detectab|positive|rises|rising|reactivat|viremi|becomes?|turns?|declin))(?!.*\bonly (?:if|for|when)\b)(?!.*\b(?:start\w*|begin\w*|initiat\w*)[^;]{0,40}(?:cycle\s*[2-9]|c[2-9]\b|second cycle|third cycle|after cycle 1|following cycle 1|the first cycle))(?!.*\b(?:consider|discuss)\b)(?!.*\bno\b[^;]{0,20}(?:entecavir|tenofovir|antiviral))' },
]

[[items]]
id = "hbv_dna_lft_monitoring"
domain = "pretreatment_workup"
kind = "should"
severity = "important"
points = 5
text = "The response orders a baseline quantitative HBV DNA and liver function tests and monitors them (ALT, HBV DNA) during and after therapy."
all = ['hbv[- ]dna|hbv viral load|hepatitis b (?:virus )?dna', 'lfts?\b|liver (?:function|enzymes|tests|panel)|\balt\b|transaminase|hepatic (?:function|panel)', '(?:hbv[- ]dna|viral load|\balt\b|lfts?\b|liver (?:function|tests|enzymes)|transaminase)[^.;]{0,90}(?:monitor\w*|every|during|after|throughout|monthly|q\s?\d|until)|(?:monitor\w*|every \d|monthly)[^.;]{0,70}(?:hbv[- ]dna|viral load|\balt\b|lfts?\b|liver (?:function|tests|enzymes)|transaminase)']
# Structured: HBV DNA and liver tests ordered (orders_now or lab_monitoring), and serial monitoring scheduled
# (a lab_monitoring entry for HBV DNA / ALT / liver tests, or an orders_now entry that schedules them)
# (not_matches = '.*' on each lab_monitoring clause forces it to fail, rather than vacuously pass, when
# lab_monitoring is not an actual list of entries; see sup_tls_allopurinol above.)
decision = [
  { any = [ { field = "orders_now", matches = 'hbv[- ]?dna|hbv (?:viral load|pcr)|hepatitis b (?:virus )?dna' }, { field = "lab_monitoring", tests = 'hbv|hepatitis b', not_matches = '.*' } ] },
  { any = [ { field = "orders_now", matches = 'lfts?\b|liver (?:function|enzymes|tests|panel)|\balt\b|transaminase|hepatic (?:function|panel)' }, { field = "lab_monitoring", tests = 'lfts?\b|liver (?:function|enzymes|tests|panel)|\balt\b|transaminase|hepatic (?:function|panel)', not_matches = '.*' } ] },
  { any = [ { field = "orders_now", matches = '(?:hbv[- ]?dna|viral load|\balt\b|lfts?\b|liver (?:function|tests|enzymes|panel)|transaminase)[^;]{0,90}(?:monitor\w*|every|during|throughout|monthly|q\s?\d|until)|(?:monitor\w*|every \d|monthly|serial)[^;]{0,70}(?:hbv[- ]?dna|viral load|\balt\b|lfts?\b|liver (?:function|tests|enzymes|panel)|transaminase)' }, { field = "lab_monitoring", tests = 'hbv|hepatitis b|\balt\b|lfts?\b|liver|hepatic|transaminase', not_matches = '.*' } ] },
]

[[items]]
id = "mn_no_hbv_action"
domain = "pretreatment_workup"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response states that no HBV-directed action or antiviral prophylaxis is needed (e.g. because HBsAg is negative)."
any = ["\\b(?:no|not)\\s+(?:\\w+\\s+){0,3}(?:antiviral|hbv|hepatitis b)\\s+(?:\\w+\\s+){0,2}(?:prophylaxis|action|therapy|treatment|monitoring)\\s+(?:is\\s+)?(?:needed|required|necessary|indicated)",
       "(?:antiviral|hbv|hepatitis b)\\s+(?:\\w+\\s+){0,2}(?:prophylaxis|therapy|treatment)\\s+(?:is|are)\\s+not\\s+(?:needed|required|necessary|indicated)",
       "(?:hbsag|surface antigen)[^.]{0,30}(?:negative|nonreactive|non-reactive)[^.]{0,40}\\b(?:so|therefore|thus|hence)\\b[^.]{0,20}\\b(?:no|not)\\b"]
# Structured (error committed): no unconditional antiviral prophylaxis in decisions.orders_now (monitor-only, or antiviral
# only "if HBV DNA becomes detectable", is the decision that prophylaxis is not needed). Same element test as hbv_prophylaxis.
# Same whitelist test as hbv_prophylaxis, negated: an error is committed when NO element in orders_now meets it.
decision = [
  { not = { field = "orders_now", matches = '(?s)(?=.*(?:entecavir|tenofovir|baraclude|vemlidy|viread|antiviral|nucleos\w*))(?=.*(?:\b(?:12|18|24)\b(?:\s*(?:-|–|to)\s*(?:18|24|36))?\s*months?\b|\b(?:1|one)\s*years?\b|\bindefinite(?:ly)?\b|\blifelong\b))(?!.*\b(?:[1-9]|1[01])\s*(?:-|–|to)\s*\d{1,2}\s*months?\b)(?!.*\b(?:not started|deferred|declined|withheld|held|discontinued)\b)(?!.*(?<!longer )(?<!extend )(?<!extended )\b(?:if|when|once|unless|in case|should|upon)\b[^;]{0,60}(?:detectab|positive|rises|rising|reactivat|viremi|becomes?|turns?|declin))(?!.*\bonly (?:if|for|when)\b)(?!.*\b(?:start\w*|begin\w*|initiat\w*)[^;]{0,40}(?:cycle\s*[2-9]|c[2-9]\b|second cycle|third cycle|after cycle 1|following cycle 1|the first cycle))(?!.*\b(?:consider|discuss)\b)(?!.*\bno\b[^;]{0,20}(?:entecavir|tenofovir|antiviral))' } },
]

# ---------------- CNS
[[items]]
id = "cns_no_routine_prophylaxis"
domain = "cns_management"
kind = "should"
severity = "important"
points = 5
text = "The response judges CNS relapse risk as intermediate and states that routine CNS prophylaxis and routine MRI brain / lumbar puncture are not indicated without neurologic symptoms or high-risk sites."
any = ["(?:prophylaxis|methotrexate|hd[- ]?mtx)[^.]{0,60}not (?:routinely )?(?:indicated|recommended|needed|required|warranted)",
       "not (?:routinely )?(?:indicated|recommended|needed|warranted)[^.]{0,40}(?:prophylaxis|methotrexate)",
       "no (?:routine )?cns prophylaxis"]
all = ["\\bmri\\b|lumbar puncture|\\blp\\b|\\bcsf\\b"]

[[items]]
id = "mn_mandates_cns_prophylaxis"
domain = "cns_management"
kind = "must_not"
severity = "important"
points = 5
text = "The response mandates CNS prophylaxis (high-dose methotrexate or intrathecal chemotherapy) for this intermediate-risk patient."
# affirm, so a scheduled order without a plan verb ("intrathecal methotrexate 12 mg with each cycle") counts;
# negated, conditional, criteria-list and evidence sentences do not
affirm = ['hd[- ]?mtx|high[- ]dose (?:iv )?methotrexate|intrathecal|\bit (?:mtx|methotrexate)\b|cns prophylaxis']
# Structured (error committed): an unconditional HD-MTX / intrathecal / CNS-prophylaxis order in decisions.orders_now
# (negated elements such as "no CNS prophylaxis" do not count; conditional_orders never count)
decision = [
  { field = "orders_now", matches = '(?s)^(?!\s*(?:no|avoid|omit|hold)\b)(?!.*\bnot (?:indicated|needed|recommended|required)).*(?:hd[- ]?mtx|\bmtx\b|methotrexate|intra[- ]?thecal|\bit (?:mtx|cytarabine|chemo\w*)|cns prophylaxis|ommaya)' },
]

# ---------------- response assessment
[[items]]
id = "resp_eot_pet_lugano"
domain = "response_assessment"
kind = "must"
severity = "important"
points = 7
text = "The response plans an end-of-treatment FDG PET-CT read with Lugano criteria / Deauville 5-point scale."
all = ["pet", "deauville|lugano", "end[- ]of[- ](?:treatment|therapy)|after (?:completion|completing)|completion of|\\beot\\b|post[- ]treatment|final pet"]

[[items]]
id = "resp_ds45_biopsy"
domain = "response_assessment"
kind = "should"
severity = "minor"
points = 2
text = "The response says residual Deauville 4-5 uptake at end of treatment should be biopsied before changing therapy when it would change management."
any = ["biops[^.]{0,80}(?:residual|deauville|ds\\s*[45]|pet[- ]positive)", "(?:residual|deauville\\s*(?:4|5)|ds\\s*[45]|pet[- ]positive)[^.]{0,80}biops"]

# ---------------- supportive care
[[items]]
id = "sup_tls_allopurinol"
domain = "supportive_care"
kind = "should"
severity = "important"
points = 5
text = "The response recognizes at least intermediate tumor-lysis risk (11 cm mass, LDH ~3x ULN) and orders allopurinol plus hydration (with TLS lab monitoring)."
all = ["tumou?r lysis|\\btls\\b", "allopurinol|rasburicase", "hydrat"]
# Structured: allopurinol (or rasburicase) and hydration in orders_now, plus a scheduled TLS lab entry in lab_monitoring.
# The item text sets no lab interval, so none is enforced (see oncologist question).
# (not_matches = '.*' below forces this clause to fail, rather than vacuously pass, when lab_monitoring is not an
# actual list of entries, e.g. "none"/{}/0; it has no effect when lab_monitoring is a real list, since a list value
# is checked by the "tests" branch and never reaches this fallback.)
decision = [
  { field = "orders_now", matches = 'allopurinol|rasburicase' },
  { field = "orders_now", matches = 'hydrat|\bfluids?\b|saline|\bns\b|lactated|ringer' },
  { field = "lab_monitoring", tests = 'potassium|phosph|uric|urate|calcium|creatinine|\btls\b|tumou?r lysis|electrolyte|\bbmp\b|\bcmp\b|chem', not_matches = '.*' },
]

[[items]]
id = "sup_gcsf"
domain = "supportive_care"
kind = "should"
severity = "minor"
points = 2
text = "The response considers primary G-CSF prophylaxis (e.g. pegfilgrastim) as reasonable with this regimen."
any = ["g[- ]?csf", "pegfilgrastim", "filgrastim", "growth factor"]

[[items]]
id = "work_echo_reviewed"
domain = "pretreatment_workup"
kind = "should"
severity = "minor"
points = 2
text = "The response notes the baseline LVEF of 58% permits anthracycline."
all = ["lvef|ejection fraction|echocardiogra", "anthracycline|doxorubicin"]

# ---------------- fitness and goals
[[items]]
id = "fit_full_dose"
domain = "fitness_and_goals"
kind = "must"
severity = "important"
points = 5
text = "The response judges the patient fit for full-dose curative-intent therapy (ECOG 1, normal organ function, controlled comorbidities) in line with his goal of cure."
any = ["fit for (?:full[- ]dose|curative|standard|intensive)", "full[- ]dose[^.]{0,40}(?:appropriate|curative|indicated|aligned|fit)", "(?:ecog|performance status)\\s*1[^.]{0,60}(?:fit|full[- ]dose|curative)"]
# Structured: the judgement expressed as a decision: curative intent at full dose in cycle 1
decision = [ { field = "intent", matches = '^curative' }, { field = "cycle1_dose_percent", min = 100 } ]

# ---------------- missing information
[[items]]
id = "miss_hbv_dna"
domain = "missing_information"
kind = "should"
severity = "minor"
points = 2
text = "The response lists the quantitative HBV DNA level as missing information still needed."
any = ["hbv[- ]dna|hbv viral load|hepatitis b (?:virus )?dna"]
