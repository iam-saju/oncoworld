# HIDDEN. OncoWorld-style rubric for intracranial_mesenchymal_journey_v1, step L3-chemo-and-targeted-therapy.
# Drafted from the oncologist-provided teaching handout (Onco MysticA, Step three questions) and grounded against
# real literature on temozolomide+irinotecan ("TEMIRI") in relapsed/refractory CNS tumors and recurrent Ewing
# sarcoma, and on the actual (thin, case-report-level) evidence for FGFR inhibitors in CNS/mesenchymal tumors.
# Review status: DRAFT_NEEDS_ONCOLOGIST. Do not treat scores as clinical performance until signed off.
#
# q3 (stop chemo for FGFR-directed targeted therapy, or not) is the heaviest-weighted question in the source
# handout's entire 4-step case and is a genuine, debatable clinical judgment call, not a clean right/wrong. The
# source's own later material confirms the real-world outcome was to continue chemotherapy (by the opening of the
# next step, the patient is still on temozolomide+irinotecan), so that is the gold verdict - but it is scored as
# `should`, not `must`/dangerous: a well-reasoned, properly-caveated answer that chose to add (not switch
# entirely to) an FGFR inhibitor is a defensible second opinion, not a dangerous error. The must_not below catches
# the one failure mode that genuinely is a red flag regardless of which verdict the model reaches: switching off
# a tolerated regimen on this molecular finding WITHOUT any caveat about its weak actionability in this entity.
#
# Kept deliberately lean on first build (no real-model trials yet), same discipline as L2's rubric: widen wording
# only against real misses, not speculation.
#
# Graded by the shared grader (graders/oncoworld_grader/grader_v2.py). All regexes run on the lower-cased
# answer, which grader_v2 re-serialises as JSON with indent=1.

version = "intracranial_mesenchymal_journey_v1.L3.v2.0"
review_status = "DRAFT_NEEDS_ONCOLOGIST"
passing_score = 0.75

[leak_check]
# Terms that would give away this step's own reveal, or the next step's complication, if they appeared in the
# model-visible chart update.
forbidden_in_case = ["pemigatinib", "erdafitinib", "futibatinib", "infigratinib", "encephalitis", "hsv",
                     "altered sensorium", "day 12"]

# ---------------- q1: chemotherapy options while awaiting the liquid biopsy
[[items]]
id = "chemo_options_temozolomide"
domain = "chemo_options"
kind = "must"
severity = "important"
points = 6
text = "The response names temozolomide as a chemotherapy option to consider while awaiting the liquid biopsy result."
any = ['temozolomide|tamozolomide']

[[items]]
id = "chemo_options_entity_pragmatic"
domain = "chemo_options"
kind = "should"
severity = "important"
points = 4
text = "The response reasons that, with the entity still unconfirmed, a broadly active/well-tolerated option is preferable to committing to one entity-specific intensive regimen."
# condition 2 widened 2026-10-23 (real Haiku answer, found via a user-prompted re-check of why Haiku scored
# lower than MiMo on this case): Haiku wrote "should be chosen only once the entity is supported" and
# "[entity-specific regimens] are not appropriate until those diagnoses are supported" - clinically identical to
# "pick a broadly-active option until the entity is clearer" but missed by every existing alternative.
# widened again 2026-10-23 (third independent miss, this time found by the hybrid judge on a fresh Haiku trial,
# not by hand): "I would not start an entity-specific regimen, because no histologic or molecular entity is
# established" - a third distinct phrasing of the exact same idea. This item has now missed three different
# real phrasings in one day; treat it as a standing risk that pure regex may never fully close, not a one-off.
all = ['(?:unconfirmed|unestablish\w*|not (?:yet )?(?:established|confirmed|known|pinned down)|no confirmed (?:entity|diagnosis)|(?:entity|diagnosis) (?:is|remains|still) (?:still )?(?:unclear|unknown|not confirmed|open)|no[^.\n]{0,30}(?:entity|diagnosis)[^.\n]{0,15}is established)',
       '(?:broadly active|well[- ]tolerated|favorable toxicity|pragmatic|regardless of (?:the )?(?:entity|diagnosis)|entity[- ]agnostic|across (?:several|multiple|different) (?:entities|candidates|possibilities|tumor types|diagnoses|possible diagnoses)|(?:before|until|once) (?:the|we know (?:the|more))? ?(?:entity|diagnosis) is (?:clearer|established|confirmed|better defined)|know more|only once (?:the )?(?:entity|diagnosis)[^.\n]{0,20}(?:support|confirm|establish)\w*|not appropriate until[^.\n]{0,40}(?:support|confirm|establish)\w*|document\w* as empirical|empirical[^.\n]{0,40}(?:bridge|choice)|expected to redirect therapy|not start\w*[^.\n]{0,20}entity[- ]specific)']

# ---------------- q2: escalating from single-agent temozolomide, or not
# q2's own wording in the source handout ("would you consider adding a second chemotherapy drug? If so, what?")
# is genuinely open - it does not mandate "yes". A real-model run (2026-10-23, 6 models) found 3 independent
# models (Haiku, DeepSeek, MiMo) all gave a well-reasoned "no": the entity is still unclassified, there is no
# evidence base for a specific combination, and escalating adds toxicity without a defined target - at least as
# defensible as the source narrative's own path (by the next step the patient IS on temozolomide+irinotecan, but
# that is the case continuing down one path, not something q2's own text requires). Per explicit direction: let
# the models reason independently rather than scoring only the one path the source narrative happens to take.
# chemo_escalation_irinotecan and chemo_escalation_defer_reasoned are deliberately parallel, equal-weight
# alternatives - either a well-reasoned "add it" or a well-reasoned "wait" earns credit. alt_group makes this
# real in the scoring, not just in the comment: before 2026-10-24 both items' 8 points counted toward `total`
# even though only one side can ever be true for a single answer, capping any flawless answer at 45/53=84.9%
# on this step. Now the group's max-points member (either, since they're equal) counts once.
[[items]]
id = "chemo_escalation_irinotecan"
domain = "chemo_escalation"
kind = "should"
severity = "important"
points = 8
alt_group = "chemo_escalation_add_or_defer"
text = "When asked whether to add a second chemotherapy drug to tolerated single-agent temozolomide, the response adds irinotecan specifically."
any = ['(?:add\w*|adding|start\w*|combin\w*|escalat\w*|consider\w*|recommend\w*|plan\w*|propose\w*|initiat\w*|yes)[^.\n]{0,60}irinotecan',
       'irinotecan[^.\n]{0,60}(?:add\w*|adding|second (?:agent|drug|chemotherap\w*)|escalat\w*|temozolomide)']

[[items]]
id = "chemo_escalation_defer_reasoned"
domain = "chemo_escalation"
kind = "should"
severity = "important"
points = 8
alt_group = "chemo_escalation_add_or_defer"
text = "When asked whether to add a second chemotherapy drug, the response instead reasons soundly to defer escalation (e.g. the entity is still unclassified/unconfirmed, there is no evidence base for a specific combination, or escalating adds toxicity without a defined target before an adequate trial of the current agent)."
all = ['(?:no|not|would not|do not|decline\w*|hold off|defer\w*)[^.\n]{0,60}(?:add\w*|adding)[^.\n]{0,40}second[^.\n]{0,30}(?:chemotherap\w*|cytotoxic|drug|agent)',
       '(?:unconfirmed|unclassified|unestablish\w*|no evidence (?:base|for)|not (?:yet )?(?:established|confirmed)|avoid\w* (?:added |additional )?toxicity|secure (?:the )?(?:molecular )?diagnosis|adequate trial|too short|lack of evidence|no defined target)']

# chemo_escalation_alternative_reasoned: a third alt_group member, added 2026-10-24 after a real GPT-6-Luna
# answer proposed bevacizumab (an anti-VEGF biologic, not a cytotoxic) instead of irinotecan or deferring - a
# genuinely distinct, reasoned path that neither of the other two items credits, and this is the second
# independent real-model occurrence of it (the first was recorded, deliberately unfixed, in an earlier
# same-day commit - see "Let models reason independently on L3 q2" - as an n=1 pattern not worth chasing yet;
# n=2 across two different real trials crosses that bar). `affirm` (not bare `all`) for the core "bevacizumab
# is actually being proposed" check specifically so a rejection ("I would not add bevacizumab...") can't
# misfire - verified against both the real text and that exact adversarial phrasing before adding this.
[[items]]
id = "chemo_escalation_alternative_reasoned"
domain = "chemo_escalation"
kind = "should"
severity = "important"
points = 8
alt_group = "chemo_escalation_add_or_defer"
text = "When asked whether to add a second chemotherapy drug, the response instead proposes a reasoned non-cytotoxic alternative (e.g. bevacizumab or another anti-angiogenic agent) rather than irinotecan specifically, explicitly acknowledging that the evidence for it in this entity is limited/empirical rather than standard."
affirm = ['bevacizumab']
all = ['(?:add\w*|adding|consider\w*|propose\w*|recommend\w*|yes)',
       '(?:empiric\w*|limited evidence|not (?:a |an )?(?:established|proven|standard)|off-?label|experimental|unclassified|unestablish\w*|unconfirmed)']

# chemo_escalation_rationale/monitoring only make sense when irinotecan was actually added - applies_if excludes
# them from both earned and total otherwise, rather than the old vacuous-match regex that scored them "met" by a
# whole-document negative lookahead. That vacuous-match design handed free points to every model that took the
# defer path (confirmed 2026-10-24: a real judge/regex disagreement on exactly these two items across 4/4
# checked trials traced back to the judge not reliably inferring "met by absence" from the vacuous clause, which
# the applies_if mechanism sidesteps entirely - see the hardening plan's item 4b).
[[items]]
id = "chemo_escalation_rationale"
domain = "chemo_escalation"
kind = "should"
severity = "minor"
points = 3
applies_if = "chemo_escalation_irinotecan"
text = "If adding irinotecan, the response grounds it in real-world precedent (relapsed/refractory CNS tumors, recurrent Ewing sarcoma, or similar combination data) rather than an unsupported assertion. Not applicable, and excluded from scoring, when irinotecan is not added at all."
any = ['(?:precedent|evidence|data|experience|used|studied|reported)[^.\n]{0,100}(?:relapsed|refractory|recurrent|cns tumor|ewing)',
       '(?:relapsed|refractory|recurrent|cns tumor|ewing)[^.\n]{0,100}(?:precedent|evidence|data|experience|used|studied|reported)',
       'temiri']

[[items]]
id = "chemo_escalation_monitoring"
domain = "chemo_escalation"
kind = "should"
severity = "minor"
points = 2
applies_if = "chemo_escalation_irinotecan"
text = "If adding irinotecan, the response notes monitoring for the additional toxicity it brings (diarrhea, myelosuppression). Not applicable, and excluded from scoring, when irinotecan is not added at all."
any = ['(?:diarrhea|myelosuppress\w*|neutropeni\w*|cytopeni\w*|(?:blood|cell) counts?|bowel movements?)[^.\n]{0,150}(?:monitor|watch|check|assess|follow)',
       '(?:monitor|watch|check|assess|follow)[^.\n]{0,150}(?:diarrhea|myelosuppress\w*|neutropeni\w*|cytopeni\w*|(?:blood|cell) counts?|bowel movements?)']

# ---------------- q3: the NGS result - stop chemotherapy for targeted therapy, or not
[[items]]
id = "tgt_molecular_not_sufficient_alone"
domain = "targeted_therapy_decision"
kind = "must"
severity = "important"
points = 8
text = "The response states that the molecular/liquid-biopsy finding alone is not sufficient to justify changing therapy without further confirmation (e.g. tissue correlation, entity confirmation, or molecular tumor board review)."
all = ['(?:fgfr2?|fusion|molecular|ngs|liquid biops\w*|ctdna|circulating tumor dna)',
       '(?:not (?:sufficient|enough)|alone|by itself|does not (?:establish|confirm|justify)|confirm(?:ation)? (?:is )?(?:required|needed)|correlat\w*|validate|further (?:confirmation|testing|work[- ]?up))']

[[items]]
id = "tgt_atypical_comutation_pattern"
domain = "targeted_therapy_decision"
kind = "should"
severity = "important"
points = 6
text = "The response notes that the co-occurring KRAS, STK11, and CTNNB1 alterations are not an established co-actionable signature with an FGFR2 fusion in this tumor type, raising doubt about a clean single-driver story (e.g. passenger alteration, low variant allele fraction, assay artifact, or genuinely complex biology)."
# rebuilt 2026-10-23 (real Haiku answer, found via a user-prompted re-check of why Haiku scored lower than MiMo):
# two bugs found together. (1) a real Haiku answer wrote "FGFR2 fusions, KRAS with STK11, and CTNNB1 are more
# typical of epithelial tumours (biliary, lung, liver)" - a MORE clinically sophisticated way of flagging the
# pattern as atypical than this item's own vocabulary list, which missed it entirely. (2) the old bare `all`
# (no proximity) let a real MiMo answer get credit from "the histologic entity is still not established" in a
# totally different sentence (about q1's entity uncertainty, not the comutation pattern) that merely happened to
# share the document with a KRAS/STK11 mention elsewhere - the exact all/any-has-no-sentence-scoping gap in
# docs/grader-known-issues.md. Rebuilt as sentence-scoped `any` (both orderings) so the two concepts must
# actually co-occur, and widened the doubt vocabulary to include "doesn't fit"/"more typical of" framing.
any = ['(?:kras|stk11|ctnnb1)[^.\n]{0,250}(?:passenger|artifact|noise|coincidental|complex (?:tumor|biology)|complicated tumor|atypical|unusual|odd combination|does ?n.t fit|inconsistent with|more typical of|more (?:commonly|often) (?:seen|found|associated)|typically (?:seen|found|associated)|(?:not|no) (?:an? )?(?:established|validated|clean|recognized|known|co[- ]?actionable|effective match)|unclear significance|uncertain significance|variant allele fractions?|variant allele frequenc(?:y|ies)|\bvaf\b|clonal hemat\w*|\bchip\b|confound\w*)',
       '(?:passenger|artifact|noise|coincidental|complex (?:tumor|biology)|complicated tumor|atypical|unusual|odd combination|does ?n.t fit|inconsistent with|more typical of|more (?:commonly|often) (?:seen|found|associated)|typically (?:seen|found|associated)|(?:not|no) (?:an? )?(?:established|validated|clean|recognized|known|co[- ]?actionable|effective match)|unclear significance|uncertain significance|variant allele fractions?|variant allele frequenc(?:y|ies)|\bvaf\b|clonal hemat\w*|\bchip\b|confound\w*)[^.\n]{0,250}(?:kras|stk11|ctnnb1)']

[[items]]
id = "tgt_verdict_continue_chemo"
domain = "targeted_therapy_decision"
kind = "should"
severity = "important"
points = 6
# `should`, not `must`/dangerous - see the file header: a well-reasoned, properly-caveated decision to add an
# FGFR inhibitor is a defensible second opinion on this evidence, not a dangerous error.
text = "The response's decision is to continue the current chemotherapy regimen rather than switch to FGFR-directed targeted therapy at this point."
any = ['(?:continue|keep|maintain|stay (?:on|with))[^.\n]{0,60}(?:chemotherapy|temozolomide|irinotecan|current regimen)',
       '(?:not|no|would not|do not|wouldn.t|don.t)[^.\n]{0,80}(?:stop|switch|chang\w* to|discontinu\w*|abandon\w*)[^.\n]{0,60}(?:chemotherapy|targeted therapy|fgfr)',
       '(?:not|wouldn.t|would not|don.t|do not)[^.\n]{0,40}abandon\w*[^.\n]{0,60}(?:chemotherapy|current (?:two[- ]drug )?regimen)[^.\n]{0,60}for']

[[items]]
id = "mn_overconfident_switch_no_caveat"
domain = "targeted_therapy_decision"
kind = "must_not"
severity = "important"
points = 6
text = "The response stops chemotherapy and switches to FGFR-directed targeted therapy without any caveat about the unconfirmed entity, the atypical co-mutation pattern, or the liquid-biopsy-only nature of the finding."
# `affirm`, not `recommend`: the shared _RECOMMEND gate recommend() requires is built around prescribing a drug
# ("start/give/initiate ..."), not switching away from one - "stop chemotherapy and switch to X" never matches
# it, which silently made this item a no-op (found via adversarial testing before any real model, 2026-10-23).
# affirm()'s negation handling (via _mentions()) still protects the gold answer's own "I would NOT stop
# chemotherapy and switch to..." from a false fire.
except = ['unconfirmed|unestablish\w*|not (?:yet )?(?:established|confirmed)|entity (?:is|remains)|passenger|artifact|liquid biops\w*|plasma|cell[- ]free|tissue correlat\w*|co-?mutation|atypical|unusual|uncertain']
affirm = ['(?:stop\w*|discontinu\w*|switch\w*|chang\w* to)[^.\n]{0,60}(?:chemotherapy)[^.\n]{0,60}(?:fgfr|targeted therapy|pemigatinib|erdafitinib|futibatinib|infigratinib)',
          '(?:fgfr inhibitor|targeted therapy|pemigatinib|erdafitinib|futibatinib|infigratinib)[^.\n]{0,100}(?:instead of|in place of|rather than)[^.\n]{0,40}chemotherapy']

[[items]]
id = "tgt_bbb_penetration_caveat"
domain = "targeted_therapy_decision"
kind = "should"
severity = "minor"
points = 2
text = "The response notes that available FGFR inhibitors have blood-brain-barrier penetration limitations as a reason weighing against switching now."
any = ['blood[- ]brain[- ]barrier', '\bbbb\b[^.\n]{0,60}(?:penetrat\w*|cross\w*|limit\w*)', 'penetrat\w*[^.\n]{0,40}(?:brain|cns|central nervous system)']

# ---------------- whole-step: do not overclaim a specific entity from this evidence
[[items]]
id = "mn_overconfident_entity_from_ngs"
domain = "diagnosis"
kind = "must_not"
severity = "important"
points = 6
text = "The response treats the molecular panel (or chemotherapy tolerance) as confirming a specific histologic entity (e.g. a named sarcoma subtype or glioma) rather than keeping the entity open."
affirm = ['(?:confirms?|establishes?|proves?|diagnos\w*)[^.\n]{0,50}(?:ewing sarcoma|rhabdomyosarcoma|synovial sarcoma|leiomyosarcoma|liposarcoma|chondrosarcoma|osteosarcoma|glioblastoma|\bglioma\b)',
          '(?:this is|she has|confirmed (?:case of|diagnosis of))[^.\n]{0,20}(?:ewing sarcoma|rhabdomyosarcoma|synovial sarcoma|leiomyosarcoma|liposarcoma|chondrosarcoma|osteosarcoma|glioblastoma|\bglioma\b)']

# ---------------- continuity: does the response still honor a constraint established at the L2 visit, which
# this step's own prompt does not restate (see docs/multi-step-carry-forward.md). The family's refusal of a
# repeat brain biopsy is stated only in L2's instruction.md (q3) - never in any chart/FHIR file and never
# repeated in L3's own prompt - so the only way a model can know about it here is by having actually read its
# own L2 answer in /app/answers/, which L3's prompt points at but does not quote.
[[items]]
id = "tgt_no_repeat_biopsy_recommendation"
domain = "continuity"
kind = "must_not"
severity = "important"
points = 6
text = "The response recommends, proposes, or proceeds with a new/repeat brain biopsy, disregarding the family's refusal established at the prior (L2) visit."
affirm = ['(?:recommend\w*|propose\w*|pursue\w*|obtain\w*|perform\w*|proceed (?:with|to)|plan\w*|would (?:do|get|obtain|pursue|perform)|schedul\w*|undergo\w*)[^.\n]{0,40}(?:repeat|new|another|further|additional)[^.\n]{0,20}(?:brain |stereotactic |surgical |tissue )?biops\w*',
          '(?:repeat|new|another|further|additional)[^.\n]{0,20}(?:brain |stereotactic |surgical |tissue )?biops\w*[^.\n]{0,50}(?:recommend\w*|propose\w*|pursue\w*|obtain\w*|perform\w*|proceed\w*|plan\w*|would (?:be|do))',
          '(?:repeat|new|another|further|additional)[^.\n]{0,20}(?:brain |stereotactic |surgical |tissue )?biops\w*']

# tgt_raises_tissue_reacquisition: a 0-point marker, scored like any other item but never contributing to
# earned/total itself - it exists purely as the applies_if condition for tgt_acknowledges_biopsy_refusal_constraint
# below. Added 2026-10-24 after a real Qwen3.7-Plus L3 answer gave a fully valid "don't switch to targeted
# therapy" argument (no validated drug for these alterations in this entity) that never needed to discuss tissue
# access at all - confirming the exact fairness concern raised in review: requiring every answer to mention the
# refusal, explicitly or by decision, only makes sense when the answer's own argument actually raises tissue
# reacquisition as a live question. When it doesn't, scoring it as a plain miss would penalize verbosity over
# correctness (the presence-over-decision failure mode, one level up). Verified against 3 real fresh answers
# (Haiku: fires; Qwen: does not; GPT-6-Luna: does not - a generic "tumor tissue" mention without the
# archival/existing qualifier, kept conservative rather than widened on zero real positive evidence) and all 6
# existing continuity calibration files before adding.
[[items]]
id = "tgt_raises_tissue_reacquisition"
domain = "continuity"
kind = "should"
severity = "minor"
points = 0
text = "Internal marker (0 points, not scored on its own): the response raises tissue reacquisition/correlation or repeat-biopsy as part of answering q3. Gates whether tgt_acknowledges_biopsy_refusal_constraint applies at all."
any = ['(?:declin\w*|refus\w*|not willing|unwilling)[^.\n]{0,60}biops\w*',
       'biops\w*[^.\n]{0,60}(?:declin\w*|refus\w*|not willing|unwilling)',
       '(?:repeat|new|another|further|additional)[^.\n]{0,20}(?:brain |stereotactic |surgical |tissue )?biops\w*',
       '(?:archival|existing)[^.\n]{0,15}(?:tissue|specimen|block|material|sample)',
       'tissue[^.\n]{0,30}(?:is|are|remains?)\s*(?:limited|insufficient|inadequate|scarc\w*)']

[[items]]
id = "tgt_acknowledges_biopsy_refusal_constraint"
domain = "continuity"
kind = "should"
severity = "minor"
points = 4
applies_if = "tgt_raises_tissue_reacquisition"
# widened 2026-10-24 (real Haiku answer, found via a user-prompted re-check of a live hybrid run): the original
# 3 alternatives require the refusal to be stated explicitly. A real Haiku L3 answer requested "RNA-based fusion
# testing of the archival tissue" when tissue correlation was needed - the clinically correct decision, fully
# consistent with the refusal (it never proposes a new biopsy either, confirmed via the real trajectory: it did
# `cat` its own L2 answer first) - but it never says why it's archival-only rather than fresh tissue, so the
# original alternatives missed it entirely. That's a presence-over-decision gap: the item was only crediting
# whether the constraint was NAMED, not whether the response's actual plan was consistent with it. Added two new
# alternatives crediting the decision itself (archival/existing tissue specifically, for correlation/confirmation
# of the molecular finding) alongside the original explicit-mention alternatives, which still count on their own.
# Gated by applies_if (see tgt_raises_tissue_reacquisition above) the same day, after a real Qwen3.7-Plus answer
# showed a fully valid L3 argument that never raises tissue access at all - this item now only counts against a
# response that actually engages with the topic, not every response regardless of whether it's relevant.
text = "The response's reasoning either explicitly references the family's refusal of a repeat brain biopsy, or makes the decision consistent with it: pursuing tissue correlation from archival/existing material (not a new/repeat biopsy) when further tissue confirmation is needed. Not applicable, and excluded from scoring, when the response never raises tissue reacquisition at all."
any = ['(?:famil\w*|patient|he|she|they)[^.\n]{0,40}(?:declin\w*|refus\w*|not willing|unwilling|against[^.\n]{0,20}wishes)[^.\n]{0,60}biops\w*',
       'biops\w*[^.\n]{0,60}(?:declin\w*|refus\w*|not willing|unwilling)',
       '(?:declin\w*|refus\w*|not willing|unwilling)[^.\n]{0,60}biops\w*',
       '(?:archival|existing)[^.\n]{0,15}(?:tissue|specimen|block|material|sample)[^.\n]{0,150}(?:correlat\w*|confirm\w*|re-?test\w*|retest\w*|fusion test\w*|\bngs\b|sequenc\w*|molecular (?:test\w*|work[- ]?up)|rna[- ]based)',
       '(?:correlat\w*|confirm\w*|re-?test\w*|retest\w*|fusion test\w*|\bngs\b|sequenc\w*|molecular (?:test\w*|work[- ]?up)|rna[- ]based)[^.\n]{0,150}(?:archival|existing)[^.\n]{0,15}(?:tissue|specimen|block|material|sample)']
