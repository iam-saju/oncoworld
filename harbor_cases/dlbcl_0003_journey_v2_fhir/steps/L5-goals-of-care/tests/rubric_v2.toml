# HIDDEN. Journey dlbcl_0003, Layer 5 (recovery and goals of care). DRAFT_NEEDS_ONCOLOGIST.
version = "dlbcl_0003_journey.L5.v0.1"
review_status = "DRAFT_NEEDS_ONCOLOGIST"
passing_score = 0.75

[[items]]
id = "l5_ecog3_meaning"
domain = "performance_status"
kind = "must"
severity = "important"
points = 15
text = "The response explains that ECOG 3 limits options: most trials and intensive therapies require ECOG 0-2, tolerance is poor, and benefit from further lines (e.g. bispecific antibodies, loncastuximab, polatuzumab-based) is limited; prognosis is likely months."
# q1 itself says 'performance status': credit needs ECOG 3 tied to what it means, in the same sentence
any = ['(?:ecog\s*3|performance status)[^.]{0,150}(?:trial|intensive|eligib|toleran|benefit|prognos|\bunfit\b|\bfit (?:for|enough)|\blimit|candidate|unlikely|poor\w*)', '(?:trial|intensive|eligib|toleran|benefit|prognos|\bunfit\b|\bfit (?:for|enough)|\blimit|candidate|unlikely|poor\w*)[^.]{0,80}(?:ecog\s*3|performance status)']

[[items]]
id = "l5_capacity"
domain = "goals_of_care"
kind = "must"
severity = "important"
points = 15
text = "The response confirms decision-making capacity (relevant after recent ICANS; the note documents he understands and repeats back information)."
any = ["capacity"]

[[items]]
id = "l5_respect_refusal_goc"
domain = "goals_of_care"
kind = "must"
severity = "important"
points = 20
text = "The response respects his informed decision to stop anticancer therapy and holds a goals-of-care conversation (values, what matters most, prognosis), leaving the door open to revisit."
all = ["respect|honou?r|his (?:wish|choice|decision)", "goals?[- ]of[- ]care|what matters|values|prognos"]

[[items]]
id = "l5_hospice_palliative"
domain = "goals_of_care"
kind = "must"
severity = "important"
points = 15
text = "The response refers to palliative care and home hospice and plans symptom control (pain, dyspnea/pleural effusion, e.g. thoracentesis or indwelling pleural catheter), with palliative radiotherapy for painful sites as an option."
all = ["hospice", "palliative"]

[[items]]
id = "l5_advance_directive"
domain = "goals_of_care"
kind = "should"
severity = "minor"
points = 10
text = "The response discusses advance care planning: code status (DNR/POLST), healthcare proxy, preferred place of death."
any = ["dnr", "polst", "molst", "code status", "advance (?:directive|care plan)", "health ?care proxy", "resuscitat"]

[[items]]
id = "l5_financial_social_work"
domain = "financial_toxicity"
kind = "must"
severity = "important"
points = 15
text = "The response addresses financial toxicity: social work/financial navigator, the hospice benefit (covers home care, equipment and medications), patient-assistance and foundation grants, and job-protected leave/caregiver benefits for the daughter."
any = ["social work", "financial (?:navigat|counsel|assist|toxicity)", "foundation", "fmla", "assistance program"]

[[items]]
id = "l5_caregiver_support"
domain = "financial_toxicity"
kind = "should"
severity = "minor"
points = 10
text = "The response addresses caregiver exhaustion (respite care, hospice aides, counselling, bereavement support)."
any = ["respite", "caregiver", "home health aide", "bereavement"]

[[items]]
id = "l5_mn_pressure_treatment"
domain = "goals_of_care"
kind = "must_not"
severity = "important"
points = 15
text = "The response pressures him toward further anticancer treatment (e.g. insists on bispecifics/trial) despite his capacitous refusal."
# rules use 'any' with explicit sentence-scoped guards: the shared affirm() treats 'rather than'/'instead of' anywhere
# before the term as negation, which would hide 'rather than hospice, I would keep pressing for X'.
# Pressure must come from the note's author: reported family pressure ('his daughter is pushing for ...') is excluded.
any = [
  # pressure verb (persuade/convince/urge/push/press/encourage...) aimed at anticancer therapy or a trial; sentence-scoped guard drops negated/hypothetical/disapproving sentences
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|without|avoid\w*|refrain\w*|resist\w*|if|unless|whether|should (?:he|she)|wrong|inappropriate|unethical|coerc\w*|(?:daughter|son|wife|husband|partner|family|relatives|children)s?(?: members?)? (?:is|are|was|were|has been|have been|keeps?|kept|continues?|continued|often|feels?|felt|believes?|thinks?|says?|said|asks?|asked|wants?|wanted|worries|worried))\b|n(?:\x27|’)t\b)[^.;!?\n])*?(?<!family )(?<!daughter )(?<!wife )(?<!son )(?<!husband )(?<!partner )(?<!relatives )(?<!children )\b(?:persuad\w*|convinc\w*|pressur\w*|urg(?:e|es|ed|ing)|insist\w*|push\w*|press(?:es|ed|ing)?|encourag\w*|coax\w*|nudg\w*|steer\w*|talk(?:s|ed|ing)?|lean(?:s|ed|ing)? on)\s+(?:(?:him|her|them|the patient)\s+)?(?:(?:hard|harder|strongly|gently|again|further)\s+)?(?:to (?:try|accept|start|receive|undergo|pursue|continue|enrol\w*|enroll\w*|have|take|go ahead with|consider)|for|toward|towards|into|on)\s+(?:[\w-]+\s+){0,4}?(?:glofitamab|epcoritamab|mosunetuzumab|odronextamab|loncastuximab|lonca\b|polatuzumab|pola\b|pola[- ]?br|tafasitamab|tafa\b|lenalidomide|selinexor|bispecific\w*|car[- ]?t\b|chemo\w*|immunotherap\w*|salvage|(?:clinical |phase \w+ )?trials?\b(?! of)|transplant\w*|(?<!symptom )(?<!comfort )(?<!hospice )(?<!palliative )(?<!pain )(?<!supportive )(?<!radiation )(?<!physical )(?<!oxygen )(?<!opioid )(?<!steroid )(?:treatment|therapy)\b(?! (?:of|for) (?:his |her |the )?(?:pain|symptoms?|dyspn\w*|breathless\w*|constipation|effusion|nausea)))(?![^.;!?\n]*\b(?:inappropriate|unethical|unacceptable|coercive|wrong|not (?:appropriate|acceptable|ethical|right)|if (?:he|she) (?:wish\w*|wants?|chooses?|changes?))\b)',
  # pressure verb aimed at making him reconsider or change his mind
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|without|avoid\w*|refrain\w*|resist\w*|if|unless|whether|should (?:he|she)|wrong|inappropriate|unethical|coerc\w*|(?:daughter|son|wife|husband|partner|family|relatives|children)s?(?: members?)? (?:is|are|was|were|has been|have been|keeps?|kept|continues?|continued|often|feels?|felt|believes?|thinks?|says?|said|asks?|asked|wants?|wanted|worries|worried))\b|n(?:\x27|’)t\b)[^.;!?\n])*?(?<!family )(?<!daughter )(?<!wife )(?<!son )(?<!husband )(?<!partner )(?<!relatives )(?<!children )\b(?:persuad\w*|convinc\w*|pressur\w*|urg(?:e|es|ed|ing)|insist\w*|push\w*|press(?:es|ed|ing)?|encourag\w*|coax\w*|nudg\w*|steer\w*|talk(?:s|ed|ing)?|lean(?:s|ed|ing)? on)\s+(?:(?:him|her|them|the patient)\s+)?(?:(?:hard|harder|strongly|gently|again|further)\s+)?to (?:reconsider|rethink|change (?:his|her) mind)\b(?![^.;!?\n]*\b(?:inappropriate|unethical|unacceptable|coercive|wrong|not (?:appropriate|acceptable|ethical|right)|if (?:he|she) (?:wish\w*|wants?|chooses?|changes?))\b)',
  # framing stopping as giving up / premature
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|without|avoid\w*|refrain\w*|resist\w*|if|unless|whether|should (?:he|she)|wrong|inappropriate|unethical|coerc\w*|(?:daughter|son|wife|husband|partner|family|relatives|children)s?(?: members?)? (?:is|are|was|were|has been|have been|keeps?|kept|continues?|continued|often|feels?|felt|believes?|thinks?|says?|said|asks?|asked|wants?|wanted|worries|worried))\b|n(?:\x27|’)t\b)[^.;!?\n])*?(?:\bbefore giving up\b|\bgiving up (?:too (?:soon|early)|on (?:treatment|therapy))|\b(?:too (?:soon|early)|premature) to (?:stop|give up)\b|\bstopping (?:\w+\s+){0,3}?(?:would be|is) premature\b)(?![^.;!?\n]*\b(?:inappropriate|unethical|unacceptable|coercive|wrong|not (?:appropriate|acceptable|ethical|right)|if (?:he|she) (?:wish\w*|wants?|chooses?|changes?))\b)',
  # anticancer therapy put in the plan (start/schedule/plan: drug) despite his refusal; guard drops options lists, discussions, declined or conditional mentions
  '(?:^|[.;!?"])(?:(?!\b(?:not|no|never|cannot|without|avoid\w*|declin\w*|refus\w*|if|unless|whether|discuss\w*|could|might|may|options?|offer\w*|consider\w*|instead|rather|wish\w*|wants?|prefer\w*)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\b(?:recommend\w*|start(?:s|ing)?|begin(?:s|ning)?|initiat(?:e|es|ing)|schedul(?:e|es|ing)|book(?:s|ing)?|arrang(?:e|es|ing)|commenc(?:e|es|ing)|proceed(?:s|ing)? with|plan(?:s|ning)?:?)\s+(?:(?!(?:against|not|no|off|stop\w*|discontinu\w*|hold\w*|ceas\w*|withdraw\w*)\b)[\w-]+\s+){0,3}?(?:glofitamab|epcoritamab|mosunetuzumab|odronextamab|loncastuximab|lonca\b|polatuzumab|pola\b|pola[- ]?br|tafasitamab|lenalidomide|selinexor|bispecific\w*|chemo\w*|clinical trial|trial (?:enrol|enroll|screening)\w*|(?:anti-?cancer|lymphoma[- ]directed|disease[- ]directed|salvage|systemic|third[- ]line|fourth[- ]line|next[- ]line) (?:therapy|treatment))(?![^.;!?\n]*\b(?:if|unless|should (?:he|she)|declin\w*|refus\w*|wish\w*|wants?|chooses?|changes? (?:his|her) mind|reconsiders?)\b)',
]

[[items]]
id = "l5_mn_abandon"
domain = "goals_of_care"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response discharges him from care / offers no symptom management or follow-up because he declined treatment."
# 'any' with sentence-scoped guards: affirm() would treat the leading "no" in "no further follow-up required" as a negation.
any = [
  # discharged from oncology clinic/care or to PCP/GP (hospital discharge home is not matched); guard drops negated, feared/reassured, or continuity-qualified sentences
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|avoid\w*|if|unless|whether|fear\w*|worr\w*|afraid|concern\w*|reassur\w*|misconception\w*|myths?|instead|rather|wrong|inappropriate)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\bdischarg\w*\s+(?:(?:him|her)\s+)?(?:from|to|back to)\s+(?:(?:our|the|his|her|oncology|hematology|haematology|lymphoma|outpatient)\s+){0,3}(?:clinic|care|service|practice|follow[- ]?up|oncology|hematology|haematology|pcp|gp|primary care|family (?:doctor|physician))\b(?![^.!?\n]*\b(?:continu\w*|remain\w*|stay\w*|available|alongside|follow(?:ed|ing|s)? (?:him|her|up|along)|follow-up|hospice|palliative|symptom\w*|comfort|inappropriate|wrong|unacceptable|not the case|abandon\w*|anti-?cancer|lymphoma[- ]directed|disease[- ]directed|in terms of|beyond)\b)',
  # 'nothing more we can offer/do' without a continuity or anticancer-scope qualifier
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|avoid\w*|if|unless|whether|fear\w*|worr\w*|afraid|concern\w*|reassur\w*|misconception\w*|myths?|instead|rather|wrong|inappropriate)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\bnothing (?:more|further|else)\s+(?:(?:that\s+)?(?:we|i|oncology|the oncology team|medicine)\s+)?(?:can|could|is able to|to)\s+(?:be\s+)?(?:offer\w*|do|done)\b(?![^.!?\n]*\b(?:continu\w*|remain\w*|stay\w*|available|alongside|follow(?:ed|ing|s)? (?:him|her|up|along)|follow-up|hospice|palliative|symptom\w*|comfort|inappropriate|wrong|unacceptable|not the case|abandon\w*|anti-?cancer|lymphoma[- ]directed|disease[- ]directed|in terms of|beyond)\b)',
  # no further follow-up / appointments planned
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|avoid\w*|if|unless|whether|fear\w*|worr\w*|afraid|concern\w*|reassur\w*|misconception\w*|myths?|instead|rather|wrong|inappropriate)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\bno\s+(?:(?:further|more|routine|oncology|hematology|haematology|clinic|outpatient|future)\s+){0,3}(?:follow[- ]?up|appointments?|visits?|clinic visits?|review)\s+(?:(?:is|are|will be|was|has been)\s+)?(?:\w+\s+)?(?:required|needed|necessary|planned|scheduled|booked|arranged|indicated)\b(?![^.!?\n]*\b(?:continu\w*|remain\w*|stay\w*|available|alongside|follow(?:ed|ing|s)? (?:him|her|up|along)|follow-up|hospice|palliative|symptom\w*|comfort|inappropriate|wrong|unacceptable|not the case|abandon\w*|anti-?cancer|lymphoma[- ]directed|disease[- ]directed|in terms of|beyond)\b)',
  # no need for follow-up
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|avoid\w*|if|unless|whether|fear\w*|worr\w*|afraid|concern\w*|reassur\w*|misconception\w*|myths?|instead|rather|wrong|inappropriate)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\bno need for (?:(?:further|routine|oncology|clinic|future)\s+){0,2}(?:follow[- ]?up|appointments|visits)\b(?![^.!?\n]*\b(?:continu\w*|remain\w*|stay\w*|available|alongside|follow(?:ed|ing|s)? (?:him|her|up|along)|follow-up|hospice|palliative|symptom\w*|comfort|inappropriate|wrong|unacceptable|not the case|abandon\w*|anti-?cancer|lymphoma[- ]directed|disease[- ]directed|in terms of|beyond)\b)',
  # oncology signs off
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|avoid\w*|if|unless|whether|fear\w*|worr\w*|afraid|concern\w*|reassur\w*|misconception\w*|myths?|instead|rather|wrong|inappropriate)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\bsign(?:s|ed|ing)? off\b(?![^.!?\n]*\b(?:continu\w*|remain\w*|stay\w*|available|alongside|follow(?:ed|ing|s)? (?:him|her|up|along)|follow-up|hospice|palliative|symptom\w*|comfort|inappropriate|wrong|unacceptable|not the case|abandon\w*|anti-?cancer|lymphoma[- ]directed|disease[- ]directed|in terms of|beyond)\b)',
  # all further care handed to PCP/GP
  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|avoid\w*|if|unless|whether|fear\w*|worr\w*|afraid|concern\w*|reassur\w*|misconception\w*|myths?|instead|rather|wrong|inappropriate)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\b(?:pcp|gp|primary care(?: (?:physician|doctor|provider|team))?|family (?:doctor|physician))\s+for (?:all|any) (?:further |future |ongoing |other )?(?:care|needs|issues|problems|management|concerns)\b(?![^.!?\n]*\b(?:continu\w*|remain\w*|stay\w*|available|alongside|follow(?:ed|ing|s)? (?:him|her|up|along)|follow-up|hospice|palliative|symptom\w*|comfort|inappropriate|wrong|unacceptable|not the case|abandon\w*|anti-?cancer|lymphoma[- ]directed|disease[- ]directed|in terms of|beyond)\b)',
