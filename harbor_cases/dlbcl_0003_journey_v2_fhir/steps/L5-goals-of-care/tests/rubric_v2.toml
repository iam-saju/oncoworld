  '(?:^|[.;!?"])(?:(?!\b(?:not|never|cannot|avoid\w*|if|unless|whether|fear\w*|worr\w*|afraid|concern\w*|reassur\w*|misconception\w*|myths?|instead|rather|wrong|inappropriate)\b|n(?:\x27|’)t\b)[^.;!?\n])*?\bclos(?:e|es|ed|ing)\s+(?:(?:the|his|her|our)\s+)?(?:oncology\s+)?(?:chart|file|case)\b(?![^.!?\n]*\b(?:continu\w*|remain\w*|stay\w*|available|alongside|follow(?:ed|ing|s)? (?:him|her|up|along)|follow-up|hospice|palliative|symptom\w*|comfort|inappropriate|wrong|unacceptable|not the case|abandon\w*|anti-?cancer|lymphoma[- ]directed|disease[- ]directed|in terms of|beyond)\b)',
]

