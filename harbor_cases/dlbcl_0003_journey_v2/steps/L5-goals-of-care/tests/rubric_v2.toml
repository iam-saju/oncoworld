# HIDDEN. Journey dlbcl_0003, Layer 5 (recovery and goals of care). DRAFT_NEEDS_ONCOLOGIST.
version = "dlbcl_0003_journey.L5.v0.1"
review_status = "DRAFT_NEEDS_ONCOLOGIST"
passing_score = 0.75

[[items]]
id = "l5_ecog3_meaning"
domain = "performance_status"
kind = "must"
severity = "important"
points = 15
text = "The response explains that ECOG 3 limits options: most trials and intensive therapies require ECOG 0-2, tolerance is poor, and benefit from further lines (e.g. bispecific antibodies, loncastuximab, polatuzumab-based) is limited; prognosis is likely months."
any = ["ecog\\s*3", "performance status"]

[[items]]
id = "l5_capacity"
domain = "goals_of_care"
kind = "must"
severity = "important"
points = 15
text = "The response confirms decision-making capacity (relevant after recent ICANS; the note documents he understands and repeats back information)."
any = ["capacity"]

[[items]]
id = "l5_respect_refusal_goc"
domain = "goals_of_care"
kind = "must"
severity = "important"
points = 20
text = "The response respects his informed decision to stop anticancer therapy and holds a goals-of-care conversation (values, what matters most, prognosis), leaving the door open to revisit."
all = ["respect|honou?r|his (?:wish|choice|decision)", "goals?[- ]of[- ]care|what matters|values|prognos"]

[[items]]
id = "l5_hospice_palliative"
domain = "goals_of_care"
kind = "must"
severity = "important"
points = 15
text = "The response refers to palliative care and home hospice and plans symptom control (pain, dyspnea/pleural effusion, e.g. thoracentesis or indwelling pleural catheter), with palliative radiotherapy for painful sites as an option."
all = ["hospice", "palliative"]

[[items]]
id = "l5_advance_directive"
domain = "goals_of_care"
kind = "should"
severity = "minor"
points = 10
text = "The response discusses advance care planning: code status (DNR/POLST), healthcare proxy, preferred place of death."
any = ["dnr", "polst", "molst", "code status", "advance (?:directive|care plan)", "health ?care proxy", "resuscitat"]

[[items]]
id = "l5_financial_social_work"
domain = "financial_toxicity"
kind = "must"
severity = "important"
points = 15
text = "The response addresses financial toxicity: social work/financial navigator, the hospice benefit (covers home care, equipment and medications), patient-assistance and foundation grants, and job-protected leave/caregiver benefits for the daughter."
any = ["social work", "financial (?:navigat|counsel|assist|toxicity)", "foundation", "fmla", "assistance program"]

[[items]]
id = "l5_caregiver_support"
domain = "financial_toxicity"
kind = "should"
severity = "minor"
points = 10
text = "The response addresses caregiver exhaustion (respite care, hospice aides, counselling, bereavement support)."
any = ["respite", "caregiver", "home health aide", "bereavement"]

[[items]]
id = "l5_mn_pressure_treatment"
domain = "goals_of_care"
kind = "must_not"
severity = "important"
points = 15
text = "The response pressures him toward further anticancer treatment (e.g. insists on bispecifics/trial) despite his capacitous refusal."

[[items]]
id = "l5_mn_abandon"
domain = "goals_of_care"
kind = "must_not"
severity = "dangerous"
points = 0
text = "The response discharges him from care / offers no symptom management or follow-up because he declined treatment."
